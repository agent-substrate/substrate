# Installs the charts on kind and runs the e2e suites against the install: a
# smoke subset on the older supported Kubernetes versions, and every suite on
# the newest. Each job installs the kind scenario of its data plane, with the
# e2e values in hack/e2e-chart-values on top. As in the e2e job of
# pr-workflow, the full suites run with the preview gates off and on, on
# gVisor and on microVM, here with both data planes.
name: helm-e2e
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
  - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  helm-e2e:
    name: helm-e2e (${{ matrix.kubernetes }}, ${{ matrix.dataplane }}, ${{ matrix.sandbox }}, ${{ matrix.suites }}${{ matrix.preview == 'on' && ', preview' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ['1.36', '1.37']
        dataplane: [envoy, agentgateway]
        preview: ['off', 'on']
        sandbox: [gvisor, microvm]
        exclude:
        # The smoke tests use no preview features, and run on gVisor.
        - kubernetes: '1.36'
          preview: 'on'
        - kubernetes: '1.36'
          sandbox: microvm
        include:
        - kubernetes: '1.36'
          node-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          suites: smoke
        - kubernetes: '1.37'
          node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          suites: all
        - dataplane: envoy
          scenario: kind-envoy
        - dataplane: agentgateway
          scenario: kind-agentgateway
        # The settings of the microvm scenario, on top of either data plane.
        - sandbox: microvm
          substrate-flags: >-
            --set sandboxConfigs.microvm.enabled=true
            --set sandboxConfigs.microvm.assetBucket=s3://ate-snapshots
          demo-suffix: -microvm
    env:
      KIND_NODE_IMAGE: ${{ matrix.node-image }}
      IMAGE_TAG: ci
      VALUES_OVERLAY: hack/e2e-chart-values
      E2E_ATENET_DATAPLANE: ${{ matrix.dataplane }}
      # install-charts-kind.sh sets these preview gates in both releases, and
      # the test steps pass them to the suites, so tests of a disabled gate
      # skip themselves.
      ATE_PREVIEW: ${{ matrix.preview == 'on' && 'ALL' || '' }}
      ARTIFACTS: ${{ github.workspace }}/_artifacts
      # Read the envoy-dataplane build cache that pr-workflow writes on main.
      DOCKER_BUILD_FLAGS: --cache-from type=gha,scope=envoy-dataplane
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: false
    - name: Restore Go build cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: e2e-go-${{ runner.os }}-${{ github.sha }}
        restore-keys: e2e-go-${{ runner.os }}-
    - name: Set up Docker Buildx
      # Host networking and plain HTTP let buildx push to the kind registry.
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: network=host
        buildkitd-config-inline: |
          [registry."localhost:5001"]
            http = true
    - name: Expose GitHub runtime to buildx
      # buildx's gha cache backend reads these from the environment.
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const [key, value] of Object.entries(process.env)) {
            if (key.startsWith('ACTIONS_')) core.exportVariable(key, value);
          }
    - name: Restore microVM assets
      if: matrix.sandbox == 'microvm'
      # pr-workflow saves this cache on main. ate-setup skips assembling the
      # assets when they are present.
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: bin/microvm-assets
        key: microvm-assets-${{ hashFiles('manifests/ate-install/sandboxconfig-microvm.yaml.tmpl') }}
    - name: Enable KVM
      if: matrix.sandbox == 'microvm'
      run: .github/scripts/upgrade-e2e/enable-kvm.sh
    - name: Create cluster (Kubernetes ${{ matrix.kubernetes }})
      run: hack/create-kind-cluster.sh
    - name: Deploy the OpenTelemetry collector
      # The metrics suite reads it. hack/e2e-chart-values points the charts at it.
      run: kubectl --context kind-kind apply -f manifests/ate-install/kind/otel-collector.yaml
    - name: Install the charts (${{ matrix.scenario }}, ${{ matrix.sandbox }})
      env:
        SCENARIO: ${{ matrix.scenario }}
        SUBSTRATE_FLAGS: ${{ matrix.substrate-flags }}
      run: hack/install-charts-kind.sh "${SCENARIO}" ${SUBSTRATE_FLAGS}
    - name: Upload the microVM assets
      # As "microVM sandboxes" in the substrate chart README describes.
      if: matrix.sandbox == 'microvm'
      run: go run ./cmd/ate-setup --kind deploy sandboxconfig --sandbox-classes=microvm
    - name: Enable NFS
      if: matrix.suites == 'all'
      run: |
        sudo modprobe nfs || true
        sudo modprobe nfsd || true
    - name: Install CSI NFS driver
      if: matrix.suites == 'all'
      run: go run ./cmd/ate-setup --kind setup csi nfs
    - name: Deploy the demos (${{ matrix.sandbox }})
      # The suites build actors from the demo ActorTemplates of the sandbox
      # class under test.
      env:
        DEMO_SUFFIX: ${{ matrix.demo-suffix }}
      run: |
        go run ./cmd/ate-setup --kind deploy demo "counter${DEMO_SUFFIX}"
        go run ./cmd/ate-setup --kind deploy demo "egress${DEMO_SUFFIX}"
    - name: Trust local TLS origins in egress gateway
      run: hack/setup-e2e-egress-tls-kind.sh
    - name: Run the smoke tests
      # Suspend and resume with state, ingress through the router, and egress
      # through the egress gateway.
      if: matrix.suites == 'smoke'
      env:
        E2E_PARALLELISM: 8
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/helm-smoke.xml
      run: >-
        hack/run-e2e-kind.sh
        -run '^(TestActorSnapshotLifecycle|TestActorDirectAccess|TestIngressAuthentication|TestActorEgress|TestActorEgressHTTPS)$'
        -args --no-color --preview="${ATE_PREVIEW}"
    - name: Run the e2e suites
      if: matrix.suites == 'all'
      env:
        # Points every fixture at its microVM variant. Empty selects gVisor.
        E2E_SANDBOX_CLASS: ${{ matrix.sandbox == 'microvm' && 'microvm' || '' }}
        E2E_PARALLELISM: 8
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/helm-e2e.xml
      run: hack/run-e2e-kind.sh -args --no-color --preview="${ATE_PREVIEW}"
    - name: Require every run to have run tests
      if: always()
      run: go -C tools/junittool run . verify -manifest "${ARTIFACTS}/expected-junit.txt"
    - name: Summarize test failures
      if: always()
      run: go -C tools/junittool run . report "${ARTIFACTS}"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-helm-${{ matrix.kubernetes }}-${{ matrix.dataplane }}-${{ matrix.sandbox }}${{ matrix.preview == 'on' && '-preview' || '' }}
        path: ${{ env.ARTIFACTS }}
        if-no-files-found: error
    - name: Dump diagnostics on failure
      if: failure()
      run: |
        hack/run-tool.sh helm --kube-context kind-kind list -A || true
        kubectl --context kind-kind get workerpool,pods -A -o wide || true
        for p in $(kubectl --context kind-kind get pods -n ate-system -o name 2>/dev/null); do
          echo "=== logs: ${p} ==="
          kubectl --context kind-kind logs -n ate-system "${p}" --all-containers --tail=300 || true
        done
  # The check to require, so the branch rules don't list each job. Passes only
  # when every job passed.
  helm-e2e-test:
    needs: helm-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every helm-e2e job to pass
      run: test "${{ needs.helm-e2e.result }}" = success
