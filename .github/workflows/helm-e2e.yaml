name: helm-e2e
on:
  pull_request:
  push:
    branches: [main, release-1.0]
permissions:
  contents: read
jobs:
  e2e-test:
    runs-on: ubuntu-latest
    env:
      VERSION: helm-e2e
      E2E_ATENET_DATAPLANE: agentgateway
      E2E_CREDENTIAL_PROVIDER: "1"
      # Retain external-volume coverage after the preview gate is introduced.
      ATE_PREVIEW: ALL
      ARTIFACTS: ${{ github.workspace }}/_artifacts
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Setup Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
    - name: Cache micro-VM assets
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: bin/microvm-assets/amd64
        key: microvm-assets-amd64-${{ hashFiles('hack/microvm-assets/assemble.sh') }}
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Create cluster
      run: hack/create-kind-cluster.sh
    - name: Label nodes with the installed version
      run: kubectl label nodes --all ate.dev/substrate-version=${VERSION}
    - name: Create install namespace
      run: kubectl create namespace ate-system
    - name: Install observability fixtures
      run: |
        kubectl apply -f manifests/ate-install/kind/otel-collector.yaml
        kubectl apply -f manifests/ate-install/kind/prometheus.yaml
    - name: Build chart images
      run: |
        # Pushed under the image's real path (kagent-dev/substrate/<component>):
        # the chart composes {registry}/{repository}/{component}, so the local
        # registry serves each image where the default repository expects it --
        # the same path-preserving rule a production mirror follows.
        for component in ateapi ate-idp-server atecontroller atelet podcertcontroller atenet objectstore-plugin credential-provider/kubernetes-secrets; do
          KO_DOCKER_REPO="localhost:5001/kagent-dev/substrate/${component##*/}" \
            ./hack/run-tool.sh ko build --bare --tags helm-e2e \
              --platform linux/amd64 "./cmd/${component}"
        done
    - name: Install Substrate CRDs
      run: helm upgrade --install substrate-crds charts/substrate-crds
    - name: Bootstrap mTLS authorities
      run: |
        go run ./cmd/ate-setup --kind create podcertificate-controller-cas
        go run ./cmd/ate-setup --kind create jwt-authority-pool
        go run ./cmd/ate-setup --kind create actor-id-ca-pool
        go run ./cmd/ate-setup --kind create actor-id-ca-certs
        go run ./cmd/ate-setup --kind create api-authentication-config
        go run ./cmd/ate-setup --kind create egress-mitm-ca-pool
    - name: Install certificate controller
      run: |
        helm upgrade --install substrate-podcert charts/substrate-podcert \
          --namespace podcertificate-controller-system \
          --create-namespace \
          --set image.registry=localhost:5001 \
          --set image.tag=helm-e2e \
          --wait --timeout=5m
    - name: Provision PostgreSQL and connection Secrets
      run: hack/install-postgres.sh --kind
    - name: Install Agent Substrate with Helm
      run: |
        helm upgrade --install substrate charts/substrate \
          --namespace ate-system \
          --create-namespace \
          -f internal/e2e/suites/credentials/values.yaml \
          --set postgres.clientCertificates.enabled=true \
          --set image.registry=localhost:5001 \
          --set image.tag=helm-e2e \
          --set 'preview[0]=ALL' \
          --set 'atenetRouter.ingressAllowedSPIFFEIDs[0]=spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client' \
          --set atelet.enabled=false \
          --set otel.endpoint=http://opentelemetry-collector.otel-system.svc:4317 \
          --wait --timeout=10m
    - name: Install atelet as a separate release
      # TestHelmAteletChartMatchesSubstrateChart checks that this release
      # renders the same atelet as the substrate chart.
      run: |
        helm upgrade --install substrate-atelet charts/substrate-atelet \
          --namespace ate-system \
          --set image.registry=localhost:5001 \
          --set image.tag=helm-e2e \
          --set 'preview[0]=ALL' \
          --set 'atelet.extraArgs[0]=--localhost-registry-replacement=kind-registry:5000' \
          --set 'atelet.extraArgs[1]=--snapshot-upload-delay=2s' \
          --set 'atelet.extraArgs[2]=--snapshot-detach-delay=30s' \
          --set otel.endpoint=http://opentelemetry-collector.otel-system.svc:4317 \
          --wait --timeout=10m
    - name: Enable NFS
      run: |
        sudo modprobe nfs || true
        sudo modprobe nfsd || true
    - name: Install CSI NFS driver
      run: go run ./cmd/ate-setup --kind setup csi nfs
    - name: Deploy micro-VM counter demo
      # The deploy creates the substrate ActorTemplate and waits for its golden
      # snapshot internally; the ActorTemplate CRD (and its Ready condition)
      # no longer exists to wait on.
      run: hack/run-microvm-demo-kind.sh --skip-control-plane
    - name: Deploy gVisor counter demo
      run: go run ./cmd/ate-setup --kind deploy demo counter
    - name: Deploy egress demo
      run: go run ./cmd/ate-setup --kind deploy demo egress
    - name: Trust local E2E TLS origins
      run: hack/setup-e2e-egress-tls-kind.sh
    - name: Run E2E tests (gVisor)
      # The egress credential suite replaces the shared provider policy.
      # Run it separately after the Helm suite has checked the chart's grants.
      # Identity rotates the cluster-wide egress CA. Run it last so HTTPS
      # tests keep a stable trust bundle and gateway signing certificate.
      env:
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/helm-gvisor.xml
      run: hack/run-e2e-kind.sh -v -skip '^(TestActorIdentity_|TestActorEgressCredentialInjection$)' -args --no-color --preview="${ATE_PREVIEW}"
    - name: Run E2E tests (micro-VM)
      env:
        E2E_SANDBOX_CLASS: microvm
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/helm-microvm.xml
      run: hack/run-e2e-kind.sh ./internal/e2e/suites/demo -v -args --no-color --preview="${ATE_PREVIEW}"
    - name: Run E2E tests (egress credential injection)
      env:
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/helm-egress-credentials.xml
      run: hack/run-e2e-kind.sh ./internal/e2e/suites/egresscredinject -v -args --no-color --preview="${ATE_PREVIEW}"
    - name: Run E2E tests (identity and trust rotation)
      env:
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/helm-identity.xml
      run: hack/run-e2e-kind.sh ./internal/e2e/suites/identity -v -args --no-color --preview="${ATE_PREVIEW}"
    - name: Require every lane to have run tests
      if: always()
      run: |
        go -C tools/junittool run . verify -manifest "${ARTIFACTS}/expected-junit.txt"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-helm-e2e
        path: ${{ env.ARTIFACTS }}
        if-no-files-found: error
    - name: Dump diagnostics on failure
      if: failure()
      run: |
        kubectl --context kind-kind get workerpool,pods -A -o wide || true
        for p in $(kubectl --context kind-kind get pods -n ate-system -o name 2>/dev/null); do
          echo "=== logs: ate-system/${p} ==="
          kubectl --context kind-kind logs -n ate-system "$p" --all-containers --tail=300 || true
        done
