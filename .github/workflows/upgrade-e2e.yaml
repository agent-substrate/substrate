# Upgrades a cluster running a release to this checkout, with actors on it,
# following docs/guides/upgrade.md, and checks that every actor survives (see
# internal/e2e/upgrade). Two installs on one kind cluster take too long for
# every PR, so this runs for every push to a release branch, before a patch
# release is tagged from it, plus on demand for any branch.
name: upgrade-e2e
on:
  push:
    branches: ['release-[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      from:
        description: 'Tag or commit to upgrade from. Required except on a release branch, which defaults to its newest earlier release'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  upgrade:
    name: Upgrade e2e (${{ matrix.sandbox }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sandbox: [gvisor, microvm]
    env:
      # Points the suite at the counter-microvm fixture. Empty means gVisor.
      E2E_SANDBOX_CLASS: ${{ matrix.sandbox == 'microvm' && 'microvm' || '' }}
      # Where the previous release's ate-setup writes its install record.
      ATE_RECORD_DIR: ${{ github.workspace }}/ate-records
      # deploy ate-system requires a credential provider selection. The
      # record keeps it for the upgrade.
      ATE_CREDENTIAL_PROVIDER: '{"name":"k8s.io"}'
      # deploy ate-system also requires an ingress allowlist. This is the
      # suite's router client (internal/e2e/ingressauth.go).
      ATE_INGRESS_ALLOWED_SPIFFE_IDS: spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client
      ARTIFACTS: ${{ github.workspace }}/_artifacts
    steps:
    - name: Checkout the release under test
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        path: new
        # Full history brings the release tags the next step picks from.
        fetch-depth: 0
    - name: Pick the release to upgrade from
      id: from
      working-directory: new
      env:
        FROM: ${{ inputs.from }}
        TO: ${{ github.ref_name }}
        EVENT: ${{ github.event_name }}
      run: .github/scripts/upgrade-e2e/pick-from.sh
    - name: Checkout ${{ steps.from.outputs.tag }}
      if: steps.from.outputs.tag != ''
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ steps.from.outputs.tag }}
        path: old
    - name: Setup Go
      if: steps.from.outputs.tag != ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: new/go.mod
        cache-dependency-path: |
          new/go.sum
          old/go.sum
    - name: Enable KVM
      if: steps.from.outputs.tag != '' && matrix.sandbox == 'microvm'
      run: new/.github/scripts/upgrade-e2e/enable-kvm.sh
    - name: Create cluster
      if: steps.from.outputs.tag != ''
      working-directory: new
      run: hack/create-kind-cluster.sh
    - name: Install ${{ steps.from.outputs.tag }}
      if: steps.from.outputs.tag != ''
      working-directory: old
      run: ../new/.github/scripts/upgrade-e2e/install-old.sh ${{ matrix.sandbox }}
    - name: Upgrade to ${{ github.ref_name }}
      if: steps.from.outputs.tag != ''
      # The suite performs the upgrade with this checkout's ate-setup, in the
      # runbook's order and from a copy of the install record, and checks the
      # actors after every step.
      working-directory: new
      env:
        E2E_ATE_SETUP_CONFIG: ${{ github.workspace }}/new.yaml
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/e2e-upgrade-${{ matrix.sandbox }}.xml
      run: .github/scripts/upgrade-e2e/run-suite.sh
    # A suite that stops matching would otherwise leave the run green and empty.
    - name: Require the suite to have run tests
      if: always() && steps.from.outputs.tag != ''
      working-directory: new
      run: go -C tools/junittool run . verify -manifest "${ARTIFACTS}/expected-junit.txt"
    - name: Upload test results
      if: always() && steps.from.outputs.tag != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-upgrade-e2e-${{ matrix.sandbox }}
        # The install records carry no secrets.
        path: |
          ${{ env.ARTIFACTS }}
          ${{ env.ATE_RECORD_DIR }}
        if-no-files-found: error
    - name: Dump diagnostics on failure
      if: failure() && steps.from.outputs.tag != ''
      run: new/.github/scripts/upgrade-e2e/dump-diagnostics.sh
