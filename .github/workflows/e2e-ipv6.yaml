name: e2e-ipv6
# Separate from pr-workflow.yaml so this can be gated independently -- and so a
# 40-minute IPv6 run never delays that workflow's merge-gating jobs.
#
# Both sandbox classes run, gVisor then micro-VM, off the one cluster and the one
# E2E_SANDBOX_CLASS knob. The class is where address-family support diverges:
# gVisor's guest adopts the interior netns and picks the actor's IPv6 up for free,
# while a micro-VM's is cross-connected to a tap at L2 and has to be told over the
# kata-agent channel. A lane that ran only gVisor could not tell a working micro-VM
# guest from one that never got an address.
#
# TODO(246): gate this before merging. It runs on every PR today so the IPv6-only
# results are visible without a maintainer having to act first; the intended
# steady state is a `ci/ipv6` label, which needs the label created upstream:
#
#     on: {pull_request: {types: [labeled, opened, synchronize, reopened]}}
#     if: contains(github.event.pull_request.labels.*.name, 'ci/ipv6')
#
# Either way this job stays out of the `e2e-test` gate, so it never blocks a PR.
on:
  pull_request:
permissions:
  contents: read
jobs:
  e2e-test-ipv6:
    runs-on: ubuntu-latest
    # Nothing else in this workflow sets a timeout, so jobs inherit GitHub's
    # 6-hour default. A broken IPv6 cluster does not crash, it misses
    # 10-minute ActorTemplate deadlines, so an uncapped job burns hours.
    # Raised from 40 for the second sandbox class: a micro-VM golden snapshot
    # alone is allowed 600s, and both suites now run twice.
    timeout-minutes: 75
    env:
      # Non-default name so these steps can be replayed locally without
      # touching an existing cluster. install-ate-kind.sh does not derive
      # KUBECTL_CONTEXT from the cluster name the way run-e2e-kind.sh does,
      # so both have to be set here.
      KIND_CLUSTER_NAME: ate-ipv6
      KUBECTL_CONTEXT: kind-ate-ipv6
      # 8.8.8.8 reached through the well-known NAT64 prefix. CoreDNS is a
      # v6-only pod on a runner with no IPv6 egress of its own, so this is the
      # only shape of upstream resolver it can reach. See "Set up NAT64".
      IPV6_DNS_UPSTREAM: 64:ff9b::808:808
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
    - name: Free disk space
      # kind node image + control-plane images + snapshots are tight on the ~14GB
      # runner disk, and the micro-VM assets (a 1GB kata-static tarball unpacked to
      # a 256MB rootfs plus a kernel) are on top of that.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Cache micro-VM assets
      # restore, not the composite cache action: pr-workflow.yaml's e2e-test writes
      # this key on every push to main, and a second saver would race it for no
      # gain -- the assets are identical and assemble.sh fully pins them. A miss
      # just means run-microvm-demo-kind.sh assembles them itself.
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: bin/microvm-assets/amd64
        key: microvm-assets-amd64-${{ hashFiles('hack/microvm-assets/assemble.sh') }}
    - name: Enable IPv6 in the Docker daemon
      # ubuntu-latest ships dockerd with IPv6 off, so kind would create its
      # network v4-only and create-kind-cluster.sh would reject the cluster.
      # Merge the two keys into whatever daemon.json the runner image ships
      # rather than replacing the file.
      run: |
        sudo mkdir -p /etc/docker
        [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo cat /etc/docker/daemon.json \
          | jq '. + {"ipv6": true, "ip6tables": true}' \
          | sudo tee /etc/docker/daemon.json.new >/dev/null
        sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
        sudo systemctl restart docker
        docker network inspect bridge --format 'bridge EnableIPv6={{.EnableIPv6}}'
    - name: Set up NAT64 on the runner
      # ubuntu-latest has no IPv6 egress whatsoever -- measured, not assumed:
      # every curl -6 fails in ~2ms. A v6-only cluster still has to reach real
      # v4 destinations (atelet fetches the gVisor tarball from GCS,
      # TestActorEgress fetches example.com), so the runner translates for it.
      # Ordered after the dockerd restart, which rebuilds the iptables chains
      # these rules live in.
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq tayga dnsutils
        # tayga answers to .1/::1; the tun holds .2/::2 so host-originated
        # traffic is not sourced from tayga's own address, which is
        # self-addressed rather than translatable. The pool avoids both.
        sudo tee /etc/tayga.conf >/dev/null <<'EOF'
        tun-device nat64
        ipv4-addr 192.168.255.1
        # tayga refuses the well-known prefix with an RFC1918 pool unless it
        # also holds a v6 address of its own, outside that prefix.
        ipv6-addr 2001:db8:64::1
        prefix 64:ff9b::/96
        dynamic-pool 192.168.255.128/25
        data-dir /var/spool/tayga
        EOF
        sudo mkdir -p /var/spool/tayga
        sudo tayga --mktun
        sudo ip link set nat64 up
        sudo ip addr add 192.168.255.2/24 dev nat64
        sudo ip -6 addr add 2001:db8:64::2/128 dev nat64
        sudo ip -6 route add 64:ff9b::/96 dev nat64 src 2001:db8:64::2
        sudo sysctl -qw net.ipv4.ip_forward=1
        sudo sysctl -qw net.ipv6.conf.all.forwarding=1
        sudo iptables -t nat -A POSTROUTING -s 192.168.255.0/24 -j MASQUERADE
        # Insert, not append: docker sets the FORWARD policy to DROP.
        sudo iptables -I FORWARD 1 -i nat64 -j ACCEPT
        sudo iptables -I FORWARD 1 -o nat64 -j ACCEPT
        sudo ip6tables -I FORWARD 1 -i nat64 -j ACCEPT
        sudo ip6tables -I FORWARD 1 -o nat64 -j ACCEPT
        # -d keeps tayga in the foreground and logs every dropped packet with a
        # reason; detaching hides exactly the failures worth diagnosing.
        sudo sh -c 'nohup tayga -d --config /etc/tayga.conf >/tmp/tayga.log 2>&1 &'
        sleep 3
        pgrep -a tayga || {
          echo "::error::tayga is not running"; sudo cat /tmp/tayga.log; exit 1;
        }
    - name: Verify NAT64 before building anything on it
      # Hard gate. The cluster takes ~4 minutes and every step after it depends
      # on translation working, so a broken translator should fail here with
      # one clear message rather than as a rollout timeout ten minutes later.
      run: |
        # Map a live A record rather than hardcoding one: example.com's old
        # 93.184.216.34 is retired and would fail for the wrong reason.
        v4=$(getent ahostsv4 storage.googleapis.com | awk 'NR==1{print $1}')
        # shellcheck disable=SC2086
        set -- ${v4//./ }
        v6=$(printf '64:ff9b::%02x%02x:%02x%02x' "$1" "$2" "$3" "$4")
        echo "NAT64 maps ${v4} -> ${v6}"
        dig +timeout=5 +tries=1 @"${IPV6_DNS_UPSTREAM}" storage.googleapis.com A +short
        code=$(curl -6 -sS -m 15 -o /dev/null -w '%{http_code}' \
          --resolve "storage.googleapis.com:443:[${v6}]" \
          https://storage.googleapis.com/ || echo 000)
        echo "NAT64 HTTPS probe returned ${code}"
        case "${code}" in
          # Any HTTP status proves the translator carried a TCP stream; GCS
          # answers a bare / with 400. ICMP is separately blocked, so a ping
          # test here would report a failure that does not matter.
          2*|3*|4*) ;;
          *) echo "::error::NAT64 is not translating; the cluster cannot egress"
             sudo cat /tmp/tayga.log || true
             exit 1 ;;
        esac
    - name: Enable KVM
      # Grant the runner access to /dev/kvm so create-kind-cluster.sh mounts it into
      # the node and labels it for the micro-VM sandbox class. After the dockerd
      # restart above, which is what the script's probe container runs under.
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Create cluster
      env:
        IP_FAMILY: ipv6
      run: hack/create-kind-cluster.sh
    - name: Assert the node has /dev/kvm
      # create-kind-cluster.sh degrades silently to gVisor-only when its KVM probe
      # fails, so without this a "micro-VM lane" could pass by never having been
      # one. The label is the stronger signal of the two: only the KVM branch sets
      # it, and the scheduler needs it to place a micro-VM worker at all.
      run: |
        for node in $(hack/kind.sh get nodes --name "${KIND_CLUSTER_NAME}"); do
          docker exec "${node}" test -c /dev/kvm \
            || { echo "::error::${node} has no /dev/kvm -- the micro-VM lane would be gVisor in disguise"; exit 1; }
          kubectl --context="$KUBECTL_CONTEXT" get node "${node}" \
            -o jsonpath='{.metadata.labels.ate\.dev/sandboxClass}' | grep -qx microvm \
            || { echo "::error::${node} is not labelled ate.dev/sandboxClass=microvm"; exit 1; }
          echo "  ${node}: /dev/kvm present, labelled for micro-VM"
        done
    - name: Assert the cluster is single-stack IPv6
      # This job is worthless if the cluster is not actually v6-only, and a
      # green run leaves no evidence either way -- the diagnostics dump below
      # only runs on failure. A kind default change or an IP_FAMILY regression
      # would otherwise turn this into a second IPv4 run that reports success.
      # Checked here rather than later so it fails as itself.
      #
      # PreferDualStack Services resolving to a single clusterIP is the
      # positive signal: on a dual-stack cluster they would get two.
      run: |
        k() { kubectl --context="$KUBECTL_CONTEXT" "$@"; }
        pod_cidrs=$(k get nodes -o jsonpath='{.items[*].spec.podCIDRs[*]}')
        svc_ips=$(k -n default get svc kubernetes -o jsonpath='{.spec.clusterIPs[*]}')
        node_ips=$(k get nodes -o jsonpath='{.items[*].status.addresses[?(@.type=="InternalIP")].address}')
        for pair in "podCIDRs=${pod_cidrs}" "kubernetes.clusterIPs=${svc_ips}" "node.InternalIP=${node_ips}"; do
          case "${pair#*=}" in
            *.*) echo "::error::not single-stack IPv6 -- ${pair}"; exit 1 ;;
            "")  echo "::error::empty, cannot confirm IP family -- ${pair}"; exit 1 ;;
          esac
          echo "  ${pair}"
        done
        echo "single-stack IPv6 confirmed"
    - name: Apply DNS64 to external names only
      # create-kind-cluster.sh already points CoreDNS at IPV6_DNS_UPSTREAM, so
      # names resolve -- but the answers are unusable. Plain DNS64 synthesizes
      # only for names with no AAAA, and the external names this job needs
      # (storage.googleapis.com, example.com) do have AAAA records, pointing at
      # real IPv6 addresses the runner cannot reach. Only translate_all forces
      # them through the prefix.
      #
      # translate_all cannot go in the same server block as the cluster zones.
      # dns64 wraps the whole plugin chain below it, and it answers a AAAA query
      # by synthesizing from A -- so for an AAAA-only name it synthesizes from
      # nothing and returns an empty answer. Every ClusterIP on a v6-only
      # cluster is AAAA-only, so a single-block Corefile takes out all
      # in-cluster service discovery: ate-api-server cannot find
      # valkey-cluster.ate-system.svc and the install times out.
      #
      # So: cluster zones keep the chain kind shipped, the registry keeps the
      # block create-kind-cluster.sh gave it, and dns64 sits in the catch-all
      # with the forwarder.
      run: |
        kubectl --context="$KUBECTL_CONTEXT" -n kube-system get cm coredns \
          -o jsonpath='{.data.Corefile}' > /tmp/Corefile
        # Re-zone the block kind shipped and lift out its forwarder, which moves
        # to the catch-all below; health/ready/kubernetes/cache stay as-is. The
        # rules are gated on "first" so they stop at that block's closing brace
        # and leave the registry's own block untouched.
        awk '
          NR == 1 && /^\.:53[[:space:]]*\{/ {
            print "cluster.local:53 in-addr.arpa:53 ip6.arpa:53 {"; first = 1; next
          }
          first && /^    forward([[:space:]].*)?\{$/ { skip = 1; next }
          first && skip && /^    \}$/                { skip = 0; next }
          first && skip                              { next }
          first && /^\}$/                            { first = 0 }
          { print }
        ' /tmp/Corefile > /tmp/Corefile.new
        if ! grep -q '^cluster.local:53' /tmp/Corefile.new; then
          echo "::error::Corefile did not start with the .:53 block kind ships"
          cat /tmp/Corefile; exit 1
        fi
        # create-kind-cluster.sh owns this block. If it ever goes back to a
        # hosts entry inside .:53, the split above silently drops the registry.
        if ! grep -q '^kind-registry:53' /tmp/Corefile.new; then
          echo "::error::no kind-registry server block in the Corefile"
          cat /tmp/Corefile; exit 1
        fi
        if grep -q 'forward' /tmp/Corefile.new; then
          echo "::error::the forward block survived the split"
          cat /tmp/Corefile.new; exit 1
        fi
        cat >>/tmp/Corefile.new <<EOF
        .:53 {
            errors
            dns64 {
              translate_all
            }
            forward . ${IPV6_DNS_UPSTREAM} {
              max_concurrent 1000
            }
            cache 30
            loop
            reload
        }
        EOF
        { printf 'data:\n  Corefile: |\n'; sed 's/^/    /' /tmp/Corefile.new; } > /tmp/coredns-dns64.yaml
        kubectl --context="$KUBECTL_CONTEXT" -n kube-system patch cm coredns \
          --type=merge --patch-file /tmp/coredns-dns64.yaml
        kubectl --context="$KUBECTL_CONTEXT" -n kube-system rollout restart deploy/coredns
        kubectl --context="$KUBECTL_CONTEXT" -n kube-system rollout status deploy/coredns --timeout=120s
        cat /tmp/Corefile.new
    - name: Verify cluster DNS answers both internal and external names
      # The install is the next step and it takes ten minutes to fail. A DNS
      # regression is the failure this Corefile is most likely to cause, so
      # assert all three cases here where the message is unambiguous.
      run: |
        set -o pipefail
        kubectl --context="$KUBECTL_CONTEXT" run dnscheck --rm --attach --quiet \
          --restart=Never --image=busybox:1.36 --command -- \
          sh -c '
            nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1 \
              || { echo "FAIL: an in-cluster Service does not resolve"; exit 1; }
            nslookup storage.googleapis.com 2>/dev/null | grep -q "64:ff9b" \
              || { echo "FAIL: external names are not synthesized through NAT64"; exit 1; }
            # Informational. Nothing downstream resolves this from a pod --
            # containerd pulls images on the node, and create-kind-cluster.sh
            # runs its own registry probe before DNS64 is applied -- so a miss
            # here is not a reason to fail the job. Printed because a change
            # here would still be worth seeing.
            echo "--- kind-registry, informational"
            nslookup kind-registry 2>&1 | tail -4
            echo "DNS-OK"
          ' | tee /tmp/dnscheck.log
        grep -q DNS-OK /tmp/dnscheck.log
    - name: Install Agent Substrate
      run: hack/install-ate-kind.sh --deploy-ate-system
    - name: Assert the control plane is up
      # install-ate.sh runs under pipefail, so a failed apply does propagate.
      # What it would not catch is a Deployment that rolls out and then
      # crash-loops. Re-check everything deploy_ate_system waits on --
      # atenet-egress included, since a non-dual-stack Envoy listener fails
      # there first, by way of a readiness probe the kubelet cannot reach.
      run: |
        for r in deployment/ate-api-server deployment/ate-controller \
                 deployment/atenet-router deployment/atenet-egress \
                 statefulset/valkey-cluster daemonset/atelet; do
          kubectl --context="$KUBECTL_CONTEXT" -n ate-system rollout status "$r" --timeout=120s
        done
        kubectl --context="$KUBECTL_CONTEXT" -n podcertificate-controller-system \
          rollout status deployment/podcertificate-controller --timeout=120s
        if kubectl --context="$KUBECTL_CONTEXT" -n ate-system get pods \
             -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' \
             | grep -q CrashLoopBackOff; then
          echo "::error::a pod in ate-system is in CrashLoopBackOff"
          exit 1
        fi
    - name: Deploy micro-VM counter demo
      # Stages the (cached) assets into the cluster's rustfs and applies the
      # counter-microvm demo onto the control plane installed above. First of the
      # demos because it is the step a v6-only cluster breaks: the staging endpoint
      # is built from the rustfs ClusterIP, which here is a bare IPv6 literal.
      run: |
        hack/run-microvm-demo-kind.sh
        df -h /
    - name: Deploy gVisor counter demo
      run: hack/install-ate-kind.sh --deploy-demo-counter
    - name: Deploy egress demos
      # TestActorEgress builds its Actor from the egress ActorTemplate for the class
      # under test, so both fixtures have to exist before their respective lane runs.
      run: |
        hack/install-ate-kind.sh --deploy-demo-egress
        hack/install-ate-kind.sh --deploy-demo-egress-microvm
    - name: Assert the demo fixtures exist
      # A failed demo deploy exits 0: install-ate.sh dispatches demos through
      # `if "${demo}_cmdline" "$1"`, which suspends errexit, and _cmdline ends
      # in an unconditional `return 0`. Without this the suites fail later with
      # "ActorTemplate not found", pointing at the tests instead of the install.
      run: |
        for ns_tmpl in ate-demo-counter/counter ate-demo-egress/egress \
                       ate-demo-counter-microvm/counter-microvm \
                       ate-demo-egress-microvm/egress-microvm; do
          ns=${ns_tmpl%/*}; tmpl=${ns_tmpl#*/}
          kubectl --context="$KUBECTL_CONTEXT" -n "${ns}" get actortemplate "${tmpl}" \
            || { echo "::error::${ns_tmpl} was not created -- the demo deploy failed silently"; exit 1; }
        done
    - name: Wait for micro-VM golden snapshot
      # Its own step so a guest that never boots fails as itself, rather than as
      # "ActorTemplate not Ready" inside whichever micro-VM test ran first.
      id: microvm-golden
      run: |
        kubectl --context="$KUBECTL_CONTEXT" wait --for=condition=Ready \
          actortemplate/counter-microvm -n ate-demo-counter-microvm --timeout=600s
    # One suite per step: run-e2e.sh takes exactly one target path, and this
    # way a failure names the suite that produced it.
    - name: Run E2E tests (demo)
      id: e2e-demo
      run: |
        set -o pipefail
        hack/run-e2e-kind.sh ./internal/e2e/suites/demo -v -args --no-color 2>&1 \
          | tee /tmp/e2e-demo.log
    - name: Run E2E tests (networking)
      # Runs even when demo failed -- networking is the half most likely to
      # expose a single-family bug -- but stays skipped when an earlier step
      # left no cluster to test against. always() is required, not decorative:
      # an if: without a status function is implicitly ANDed with success(),
      # which skips this step on exactly the failure it is meant to survive.
      if: always() && steps.e2e-demo.outcome != 'skipped'
      run: |
        set -o pipefail
        hack/run-e2e-kind.sh ./internal/e2e/suites/networking -v -args --no-color 2>&1 \
          | tee /tmp/e2e-networking.log
    # The same two suites again, with every fixture repointed at its micro-VM
    # variant by the single E2E_SANDBOX_CLASS knob (see internal/e2e/sandbox.go).
    # Sequential with the gVisor lane above, not concurrent: a suite releases its
    # namespace -- and with it its worker pods -- as each test passes, so the two
    # runs do not contend for the one kind node.
    - name: Run E2E tests (demo, micro-VM)
      id: e2e-demo-microvm
      if: always() && steps.microvm-golden.outcome == 'success'
      env:
        E2E_SANDBOX_CLASS: microvm
      run: |
        set -o pipefail
        hack/run-e2e-kind.sh ./internal/e2e/suites/demo -v -args --no-color 2>&1 \
          | tee /tmp/e2e-demo-microvm.log
    - name: Run E2E tests (networking, micro-VM)
      if: always() && steps.e2e-demo-microvm.outcome != 'skipped'
      env:
        E2E_SANDBOX_CLASS: microvm
      run: |
        set -o pipefail
        hack/run-e2e-kind.sh ./internal/e2e/suites/networking -v -args --no-color 2>&1 \
          | tee /tmp/e2e-networking-microvm.log
    - name: Guard against a vacuously green run
      # A suite that gates on a dual-stack Service and skips itself on v6-only
      # exits 0, so a suite that only skipped would otherwise read as a pass.
      # The bar is one real PASS per suite, not zero skips: demo legitimately
      # skips the micro-VM-only Golden resume and the CSI volume tests on any
      # family. Skips are printed so a growing list gets noticed.
      # Skipped when the suites never ran: with no logs to count, this step
      # would otherwise report a reassuring zero on a job that failed earlier.
      #
      # Deliberately not a per-test assertion like the dual-stack job's: on a
      # single-stack cluster TestActorIngressPerFamily skips itself by design
      # ("atenet-router is single-stack ...; nothing to compare"), so naming it
      # here would fail every run.
      if: always() && steps.e2e-demo.outcome != 'skipped'
      env:
        MICROVM_RAN: ${{ steps.e2e-demo-microvm.outcome != 'skipped' }}
      run: |
        logs="/tmp/e2e-demo.log /tmp/e2e-networking.log"
        if [ "${MICROVM_RAN}" = "true" ]; then
          logs="${logs} /tmp/e2e-demo-microvm.log /tmp/e2e-networking-microvm.log"
        else
          echo "::warning::the micro-VM lane did not run; only gVisor was checked"
        fi
        for f in ${logs}; do
          [ -s "$f" ] || { echo "::error::${f} is missing or empty"; exit 1; }
          passed=$(grep -c -- '--- PASS' "$f" || true)
          echo "${f}: ${passed} passed, $(grep -c -- '--- SKIP' "$f" || true) skipped"
          grep -h -- '--- SKIP' "$f" || true
          if [ "${passed}" -eq 0 ]; then
            echo "::error::${f} has no passing tests -- a suite that only skips proves nothing"
            exit 1
          fi
        done
    - name: Dump diagnostics on failure
      if: failure()
      run: |
        kubectl --context="$KUBECTL_CONTEXT" get actortemplate,workerpool,pods -A -o wide || true
        dump() {
          echo "=== logs: $1/$2 ==="
          kubectl --context="$KUBECTL_CONTEXT" logs -n "$1" "$2" --all-containers --tail=300 2>/dev/null || true
        }
        for p in $(kubectl --context="$KUBECTL_CONTEXT" get pods -n ate-system -o name 2>/dev/null); do
          dump ate-system "$p"
        done
        # Every worker pod in any namespace: the demo pools plus the e2e suites'
        # randomly-named per-test namespaces, which the suites keep on failure.
        # The failing actor runs in one of these, so this is where its ateom logs
        # (and, for a micro-VM worker, the guest console tail) live.
        kubectl --context="$KUBECTL_CONTEXT" get pods -A -l ate.dev/worker-pool \
          -o 'custom-columns=:.metadata.namespace,:.metadata.name' --no-headers 2>/dev/null \
          | while read -r ns name; do dump "$ns" "$name"; done
        # IPv6-specific: the rewritten Corefile, and what each Service actually
        # got assigned, are the two things that differ from the IPv4 job.
        kubectl --context="$KUBECTL_CONTEXT" -n kube-system logs -l k8s-app=kube-dns --tail=100 || true
        kubectl --context="$KUBECTL_CONTEXT" -n kube-system get cm coredns -o jsonpath='{.data.Corefile}' || true
        kubectl --context="$KUBECTL_CONTEXT" get svc -A \
          -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,POLICY:.spec.ipFamilyPolicy,IPS:.spec.clusterIPs || true
        # tayga logs a reason for every packet it declines to translate, which
        # is the only view of an egress failure that is not a bare timeout.
        echo "=== tayga ==="
        sudo tail -100 /tmp/tayga.log || true
