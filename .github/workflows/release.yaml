# Pushing a vX.Y.Z[-PRERELEASE] tag publishes the release images and then
# creates a DRAFT release with generated notes (.github/release.yml), with the
# kubectl-ate binaries attached. A maintainer edits and publishes it; see
# docs/dev/releasing.md.
#
# Images are published only from agent-substrate/substrate, to
# ghcr.io/agent-substrate/substrate. In any other repository (a fork) the
# images job is skipped, because GitHub bills package storage to the fork's
# owner, and the draft is created as before.
#
# Run manually to publish images or draft a release for an existing tag.
# Images that already exist and an existing release are left unchanged.
name: release
on:
  push:
    # vMAJOR.MINOR.PATCH, optionally followed by -PRERELEASE. ate-setup rejects
    # anything else before building; this keeps other v* tags from starting
    # the workflow at all.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to draft a release for (e.g. v0.3.0)'
        required: true
      overwrite:
        description: 'Rebuild and replace images that already exist for the tag'
        type: boolean
        default: false
      dry_run_images:
        description: 'Build the images into a registry inside the job and discard them; no images published, no draft'
        type: boolean
        default: false
# Each job requests the permissions it needs.
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
jobs:
  # The only job that writes to a registry.
  images:
    if: github.repository == 'agent-substrate/substrate' && !inputs.dry_run_images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Read by ate-setup publish release-images.
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      KO_DOCKER_REPO: ghcr.io/agent-substrate/substrate
      KO_DEFAULTPLATFORMS: linux/amd64,linux/arm64
      # inputs.overwrite is empty on a tag push, and ate-setup rejects an empty bool.
      ATE_PUBLISH_OVERWRITE: ${{ inputs.overwrite == true }}
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: refs/tags/${{ inputs.tag || github.ref_name }}
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
    # Every release image is built with ko, which cross-compiles Go for arm64
    # without emulation, so the job needs neither QEMU nor buildx. ko and
    # ate-setup's registry checks read the credentials docker login stores.
    - name: Log in to ghcr.io
      env:
        TOKEN: ${{ github.token }}
      run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${TOKEN}"
    # Overwriting replaces the digests that operators of a published release
    # install by tag, so it is refused once the release is published. A draft
    # is not returned by tag, so a 404 means there is no published release; any
    # other failure stops the job rather than being read as "none".
    - name: Refuse to overwrite a published release
      if: inputs.overwrite
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq .draft 2>&1)"; then
          if [[ "${out}" == false ]]; then
            echo "::error::${VERSION} has a published release; its images cannot be overwritten"
            exit 1
          fi
        elif [[ "${out}" != *"HTTP 404"* ]]; then
          echo "::error::checking for a published ${VERSION} release: ${out}"
          exit 1
        fi
    # Builds nothing if every image already exists for the tag, unless overwrite
    # is set, and after pushing checks that every tag names the pushed image on
    # every platform.
    - name: Publish images
      run: go run ./cmd/ate-setup publish release-images
  # The same build and checks against a registry that exists only for the
  # duration of this job. Runs only when started manually with dry_run_images.
  images-dry-run:
    if: inputs.dry_run_images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      registry:
        # The index registry:3 named on 2026-10-19, pinned like the actions above.
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports: ['5000:5000']
    env:
      VERSION: ${{ inputs.tag }}
      KO_DOCKER_REPO: localhost:5000/substrate
      KO_DEFAULTPLATFORMS: linux/amd64,linux/arm64
      ATE_PUBLISH_OVERWRITE: ${{ inputs.overwrite == true }}
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: refs/tags/${{ inputs.tag }}
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
    - name: Publish images
      run: go run ./cmd/ate-setup publish release-images
  draft:
    needs: images
    # Runs after images succeeded, or when images was skipped (any repository
    # other than agent-substrate/substrate). If images failed, no draft is
    # created, so a release cannot be published without its images. Skipped
    # in a dry run.
    if: ${{ !cancelled() && !inputs.dry_run_images && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Creating a release needs contents: write.
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        # The script runs from the tag being released, as the images job does,
        # not from the branch a manual run was started on.
        ref: refs/tags/${{ inputs.tag || github.ref_name }}
        # The committer list is read from local history back to the
        # previous release tag.
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
    # Built before the draft exists, so a build failure leaves no draft, as an
    # images failure does.
    - name: Build kubectl-ate
      env:
        VERSION: ${{ inputs.tag || github.ref_name }}
      run: go run ./cmd/ate-setup publish release-binaries --out dist
    - name: Draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: hack/release/draft-release.sh "${TAG}"
    # Only agent-substrate/substrate attaches binaries; a fork's draft gets
    # none. Assets are replaced only while the release is a draft, so a rerun
    # never changes the files of a published release.
    - name: Attach kubectl-ate
      if: github.repository == 'agent-substrate/substrate'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        if [[ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" != true ]]; then
          echo "${TAG} is published; its binaries are left unchanged."
          exit 0
        fi
        gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
