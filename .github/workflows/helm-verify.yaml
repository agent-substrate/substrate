name: helm-verify
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  helm-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint the charts
        run: helm lint charts/substrate charts/substrate-crds charts/substrate-podcert charts/substrate-atelet
      - name: Install helm-unittest
        run: .github/scripts/helm-verify/install-helm-unittest.sh
      - name: Run the chart unit tests
        run: helm unittest charts/substrate charts/substrate-atelet
