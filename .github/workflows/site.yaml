# Builds the website in site/ on every pull request that could change it, and
# publishes it to GitHub Pages from main.
name: site
on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/site.yaml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/site.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Keep in sync with module.hugoVersion.min in site/hugo.yaml.
  HUGO_VERSION: 0.163.3
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'site/go.mod'
        cache: false
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: site/package-lock.json
    - name: Install Hugo
      run: |
        base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
        tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        cd "${RUNNER_TEMP}"
        curl -sSfLO "${base}/${tarball}"
        curl -sSfLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
        grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
        mkdir -p hugo && tar -xzf "${tarball}" -C hugo hugo
        echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
    - name: Install PostCSS
      working-directory: site
      run: npm ci
    - name: Configure Pages
      id: pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: Build
      working-directory: site
      env:
        BASE_URL: ${{ steps.pages.outputs.base_url }}
      run: hugo build --environment production --minify ${BASE_URL:+--baseURL "${BASE_URL}/"}
    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site/public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
