# Adapted from
# https://github.com/cncf/prow-github-actions/blob/main/templates/workflow-templates/prow.yml

# Note, prow-github-actions upstream suggests using pull_request_target so that
# comments like /lgtm work on pull requests from forks (which is the primary
# mode of contribution for Substrate).
#
# Zizmor flags pull_request_target as very dangerous [1], but it seems pretty
# critical to how prow-github-actions works --- the workflow must have write
# permissions to make comments.  The danger is that, if an attacker can cause
# the workflow to execute their own code from a pull request they opened, then
# they can use the repository write access.  The Zizmor docs that it's not
# enough to not directly execute code from the attacker-controlled PR, since the
# attacker could set environment values or indirectly attack
# prow-github-actions. 
#
# Until we are confident that prow-github-actions is not vulnerable in this way,
# we'll use a schedule trigger as the primary driver.  This won't be as snappy,
# but seems more secure.
#
# [1] https://docs.zizmor.sh/audits/#dangerous-triggers

# Prow for this repository: /commands on issues and pull requests, needs-* labels, reviewers
# from OWNERS files, automatic merging on lgtm, and labels created from prow.yaml.
# Docs: https://github.com/cncf/prow-github-actions/blob/main/docs/installing.md
name: Prow
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  # pull_request_target is DISABLED --- see discussion at the top of the file.
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  # Replacement for pull_request_target --- drive the prow logic on a timer.
  schedule:
    - cron: '0/5 * * * *' # Run every 5 minutes
  # label-sync: run once after installing, then whenever .github/prow.yaml changes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/prow.yaml]

# One run per comment (commands are never collapsed); per event+action for everything else,
# so a pending `synchronize` run can only be superseded by a newer `synchronize` run.
# Never cancel a run that may be merging.
concurrency:
  group: prow-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.comment.id || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prow:
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'push'
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@5cbe53deaf5e765c4a816183fa6d6df401752461
    with:
      prow-commands: /lgtm /approve /hold /kind /area /priority
      merge-method: squash
    permissions:
      contents: write
      issues: write
      pull-requests: write

  label-sync:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@5cbe53deaf5e765c4a816183fa6d6df401752461
    with:
      jobs: label-sync
    permissions:
      contents: write
      issues: write
      pull-requests: write