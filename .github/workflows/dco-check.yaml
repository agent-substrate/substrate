name: PR DCO labels
# PR metadata only; the write job executes code from the default branch.
on:
  schedule:
    - cron: '23 * * * *'
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply label changes (otherwise only report them)
        type: boolean
        default: false

permissions: {}
concurrency:
  group: dco-labels
  cancel-in-progress: false

jobs:
  label:
    if: github.repository_id == '1238047523'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
    # Always load trusted code, including on fork PRs and manual runs.
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
        sparse-checkout: .github/scripts/dco
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const {run} = require('./.github/scripts/dco/label.cjs');
          const dryRun = context.eventName === 'workflow_dispatch' && context.payload.inputs.apply !== 'true';
          await run({github, context, core}, dryRun);
