# The sample credential the policy injects. The URI in the sample policy,
#   substrate-secret://kubernetes.io/team-secrets/ns1/example-api
# resolves to namespace "ns1", Secret "example-api". The URI omits a key, and the
# Secret has exactly one ("token"), so that sole key is returned.
apiVersion: v1
kind: Namespace
metadata:
  name: ns1
---
apiVersion: v1
kind: Secret
metadata:
  name: example-api
  namespace: ns1
type: Opaque
stringData:
  token: "poc-example-api-token"
