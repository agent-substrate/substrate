# The egress credential injector: the ext_proc server the egress gateway's MITM
# leg dials (cluster additional_egress_ext_proc). It fetches the requesting
# actor's egress policy from ateapi and, on a matching rule that carries a
# credential injection, fetches the credential from credprovider and injects it
# as a request header.
#
# Wire the gateway to this service by installing MITM egress with:
#   hack/install-ate.sh --experimental-use-sdsmint \
#     --experimental-additional-egress-extproc-service ate-system/atenet-egress-inject:50051
#
# Like atenet-egress, this ServiceAccount is bound to no RBAC on purpose: the
# injector has no Kubernetes access. It reads egress policy from ateapi over
# mTLS; only credprovider reads Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-egress-inject
  namespace: ate-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-egress-inject
  namespace: ate-system
  labels:
    app: atenet-egress-inject
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-egress-inject
  template:
    metadata:
      labels:
        app: atenet-egress-inject
    spec:
      serviceAccountName: atenet-egress-inject
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: egress-inject
        image: ko://github.com/agent-substrate/substrate/cmd/atenet
        args:
        - "egress-inject"
        - "--port-extproc=50051"
        - "--metrics-address=:9090"
        # Serve mTLS to the gateway: present the pod's servicedns identity (SAN
        # atenet-egress-inject.ate-system.svc, which the gateway pins) and verify
        # the gateway's podidentity client cert.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        # Dial credprovider over mTLS: present podidentity, validate its servicedns
        # serving cert against the servicedns CA, pin its SAN. --credential-provider-name
        # is the provider class this injector serves; a policy URI of another class is refused.
        - "--credential-provider-name=substrate-secret://kubernetes.io"
        - "--credential-provider-address=credprovider.ate-system.svc:50051"
        - "--provider-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        - "--provider-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem"
        - "--provider-server-name=credprovider.ate-system.svc"
        # Fetch each actor's egress policy from ateapi over mTLS: present
        # podidentity, validate ateapi's servicedns serving cert against the
        # servicedns CA. Dialed by DNS (not the k8s:/// resolver) because the
        # injector has no Kubernetes access to read endpoints.
        - "--ateapi-address=dns:///api.ate-system.svc:443"
        - "--ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-egress-inject
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: atenet-egress-inject
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
