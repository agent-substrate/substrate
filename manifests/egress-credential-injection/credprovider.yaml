# The credential provider: a gRPC service that resolves substrate-secret:// URIs
# of the kubernetes.io class to Kubernetes Secret values. It is the ONLY
# component in the egress credential-injection path with Kubernetes access; the
# egress gateway and the injector never read Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: credprovider
  namespace: ate-system
---
# POC scope note: this grants read on Secrets cluster-wide so a policy can name a
# Secret in any namespace. A production deployment would scope this to the
# namespaces a provider instance is allowed to serve.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: credprovider-secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: credprovider-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: credprovider-secret-reader
subjects:
- kind: ServiceAccount
  name: credprovider
  namespace: ate-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credprovider
  namespace: ate-system
  labels:
    app: credprovider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credprovider
  template:
    metadata:
      labels:
        app: credprovider
    spec:
      serviceAccountName: credprovider
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: credprovider
        image: ko://github.com/agent-substrate/substrate/cmd/credprovider
        args:
        - "--listen-address=:50051"
        - "--metrics-address=:9090"
        # Serve with the pod's servicedns identity (SAN credprovider.ate-system.svc)
        # and require the injector to present a podidentity client cert.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        # Enforce the atespace→namespace authorization policy (default-deny).
        - "--namespace-policy-file=/etc/credprovider/namespace-policy.yaml"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: namespace-policy
          mountPath: /etc/credprovider
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: namespace-policy
        configMap:
          name: credprovider-namespace-policy
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: credprovider
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: credprovider
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
