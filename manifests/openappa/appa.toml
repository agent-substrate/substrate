# The policy --openappa installs when the cluster has none. Includes the
# GitHub battery: a repository read labels the session with who may read that
# repository, and a write may carry only what the target's readers may
# already see.
include = ["batteries/github/appa.toml"]

[policy]
version = 2

[externals]
timeout_ms = 10000
max_body_bytes = 1048576
