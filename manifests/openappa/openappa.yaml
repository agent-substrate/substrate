# OpenAPPA, the egress gateway's additional ext_proc filter. ate-setup applies
# this under --openappa: it sets both images and appends one --mcp-server flag
# per --openappa-mcp-servers entry. The appa.toml policy is the
# openappa-policy ConfigMap, which ate-setup applies on its own. See
# docs/guides/openappa.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openappa
  namespace: ate-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openappa
  namespace: ate-system
  labels:
    app: openappa
spec:
  replicas: 1
  # The runtime keeps its session state in an emptyDir, so two pods would
  # each see half of an actor's reads.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openappa
  template:
    metadata:
      labels:
        app: openappa
    spec:
      serviceAccountName: openappa
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: extproc
        image: ${OPENAPPA_EXTPROC_IMAGE}
        args:
        - --listen=:9443
        - --admin-listen=127.0.0.1:8081
        - --runtime-url=http://127.0.0.1:8787
        # Serve with the pod's servicedns identity (SAN openappa.ate-system.svc)
        # and accept only the egress gateway's podidentity client certificate.
        - --tls-credential-bundle=/run/servicedns/credential-bundle.pem
        - --tls-client-ca=/run/podidentity-ca/trust-bundle.pem
        - --tls-client-id=spiffe://cluster.local/ns/ate-system/sa/atenet-egress
        ports:
        - name: grpc
          containerPort: 9443
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns
          readOnly: true
        - name: podidentity-ca
          mountPath: /run/podidentity-ca
          readOnly: true
      - name: runtime
        image: ${OPENAPPA_RUNTIME_IMAGE}
        command: ["appa"]
        args:
        - runtime
        - --adapter=kagent
        - --listen=127.0.0.1:8787
        - --config=/etc/appa/appa.toml
        - --db=/var/lib/appa/appa.db
        env:
        - name: APPA_BATTERY_TARGET
          value: single-user
        # Provider tokens, such as APPA_PROVIDER_GITHUB_TOKEN. The operator
        # creates the Secret; the runtime starts without it.
        envFrom:
        - secretRef:
            name: openappa-provider-credentials
            optional: true
        readinessProbe:
          exec:
            command: ["curl", "-fsS", "http://127.0.0.1:8787/health"]
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: policy
          mountPath: /etc/appa
          readOnly: true
        - name: state
          mountPath: /var/lib/appa
      volumes:
      - name: policy
        configMap:
          name: openappa-policy
      - name: state
        emptyDir: {}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: podidentity-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: openappa
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: openappa
  ports:
  - name: grpc
    port: 9443
    targetPort: grpc
    protocol: TCP
---
# Only the egress gateway may reach the ext_proc port, and the processor also
# pins the client certificate to the gateway's identity. The runtime and the
# admin listener are on loopback. Takes effect only on a cluster whose network
# plugin enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openappa
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: openappa
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 9443
