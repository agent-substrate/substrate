apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: ate-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: ate-system
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: RUSTFS_ADDRESS
          value: ":9000"
        - name: RUSTFS_CONSOLE_ADDRESS
          value: ":9001"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "true"
        - name: RUSTFS_VOLUMES
          value: "/data"
        - name: RUSTFS_ACCESS_KEY
          value: "rustfsadmin"
        - name: RUSTFS_SECRET_KEY
          value: "rustfsadmin"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rustfs-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: ate-system
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-bucket
        image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
        env:
        - name: AWS_ACCESS_KEY_ID
          value: rustfsadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: rustfsadmin
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: http://rustfs.ate-system.svc:9000
        command:
        - /bin/sh
        - -c
        - |
          set -e
          for i in $(seq 1 60); do
            if aws s3api head-bucket --bucket ate-snapshots 2>/dev/null; then
              echo "bucket ate-snapshots already exists"
              exit 0
            fi
            if aws s3api create-bucket --bucket ate-snapshots 2>/dev/null; then
              echo "bucket ate-snapshots created"
              exit 0
            fi
            echo "waiting for rustfs to become available... ($i/60)"
            sleep 2
          done
          echo "timed out waiting for rustfs"
          exit 1
---
# ../ate-system-networkpolicies.yaml denies ingress to every ate-system pod by
# default. rustfs's S3 API is reached by the snapshot-plugin sidecars of
# ate-api-server and atelet and by the bucket-init Job; its console is not
# admitted (use a port-forward).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ate-api-server
          - atelet
    - podSelector:
        matchLabels:
          batch.kubernetes.io/job-name: rustfs-bucket-init
    ports:
    - protocol: TCP
      port: api
