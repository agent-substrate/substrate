apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../postgres.yaml

# The base reserves a full CPU for a single-replica database. On a kind node --
# 4 vCPU on a GitHub runner -- that is a quarter of the node held for a test
# database. Only the request (what the scheduler subtracts) is lowered; the
# 2-CPU limit is untouched, so PostgreSQL can still burst as far as it did.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: postgres
              resources:
                requests:
                  cpu: 250m
