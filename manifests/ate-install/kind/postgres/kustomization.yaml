apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../postgres/postgres.yaml

# Shrink the data volume to fit a kind node's small disk. components/sizing-kind
# shrinks the container resources.
patches:
  - target:
      kind: StatefulSet
      name: postgres
      namespace: ate-system
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
