apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ate-otel-config.yaml is not here, and neither is the copy of any other mode:
# hack/install-ate.sh applies the file of the selected --observability mode on
# its own, ahead of this bundle. A kind install selects mode kind, thus each
# component's `envFrom` resolves to the collector below.
resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ./atelet
  - ../atenet-dns.yaml
  - ../atenet-router.yaml
  - ./postgres
  - ../pod-certificate-controller.yaml
  - rustfs.yaml
  - ./otel-collector.yaml
  - ./prometheus.yaml

# OTEL_TRACES_SAMPLER pins ate-api-server to parentbased_always_on so every API
# call it roots is traced; the other components keep their binary defaults and
# follow its sampled flag via their ParentBased samplers. It stays an inline
# patch rather than a key in ate-otel-config.yaml because that ConfigMap is
# shared by every component via envFrom -- putting always_on there would pin the
# router and the control plane to 100% too, undoing their per-component ratios.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: ate-api-server
              env:
              - name: OTEL_TRACES_SAMPLER
                value: parentbased_always_on

