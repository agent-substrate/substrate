# Kind replacement for manifests/ate-install/ate-storage-config.yaml: same name,
# so the overlay lists this file instead of the base one. Points both
# objectstore-plugin sidecars at the in-cluster rustfs from rustfs.yaml, with
# its static keys in the ate-storage-credentials Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-storage-config
  namespace: ate-system
data:
  ATE_STORAGE_BACKEND: s3
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://rustfs.ate-system.svc:9000
  AWS_S3_USE_PATH_STYLE: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-storage-credentials
  namespace: ate-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: rustfsadmin
  AWS_SECRET_ACCESS_KEY: rustfsadmin
