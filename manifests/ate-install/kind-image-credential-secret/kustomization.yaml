# kind's atelet with the image-credential-secret component: the atelet overlay ../kind/atelet (which drops the
# GKE credential-provider flags and host mounts) plus private-registry pulls from the Secret
# ate-system/atelet-registry-auth. Applied after the kind install (ko resolve -f <(kubectl kustomize …)) by the
# private-registry e2e (internal/e2e/suites/imagepullsecret).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../kind/atelet

components:
  - ../components/image-credential-secret
