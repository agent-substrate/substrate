apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The ate-otel-config ConfigMap, which each component below reads with envFrom,
# is not here. hack/install-ate.sh applies it on its own, because the file that
# supplies it changes with --observability; see manifests/ate-install/otel/.
# A copy here would replace the selected mode each time this bundle is applied.
resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ../atelet.yaml
  - ../atenet-dns.yaml
  - ../atenet-router.yaml
  - ../postgres.yaml
  - ../pod-certificate-controller.yaml
