# The CRD schema cannot compare spec.source.identity with metadata.namespace,
# so this policy does. Without it a binding in one namespace could allow
# egress for another namespace's agents.
#
# TODO: Substrate actor identities (spiffe://<td>/worker-for-actor/<atespace>/
# <name>) carry no Kubernetes namespace and pass this policy unchecked. Agree
# with the Substrate and Prism owners how to tie an actor to a namespace and
# add that rule here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: authbinding-identity-namespace
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["agentplatform.io"]
      apiVersions: ["v1alpha1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["authbindings"]
  validations:
  # The schema restricts the Kubernetes form to spiffe://<td>/ns/<ns>/sa/<name>
  # with no "/" inside a segment, so "/ns/<namespace>/sa/" occurs exactly when
  # the namespace segment equals the binding's namespace. Other forms are not
  # checked (see the TODO above).
  - expression: >-
      !object.spec.source.identity.matches('^spiffe://[^/]+/ns/') ||
      object.spec.source.identity.contains('/ns/' + object.metadata.namespace + '/sa/')
    message: "spec.source.identity must name this binding's namespace in its /ns/<namespace>/ segment"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: authbinding-identity-namespace
spec:
  policyName: authbinding-identity-namespace
  validationActions: ["Deny"]
