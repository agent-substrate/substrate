apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-router
  namespace: ate-system
  labels:
    app: atenet-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atenet-router
rules:
- apiGroups:
  - "ate.dev"
  resources:
  - actortemplates
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atenet-router
subjects:
- kind: ServiceAccount
  name: atenet-router
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: atenet-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atenet-router-endpointslices
  namespace: ate-system
rules:
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atenet-router-endpointslices
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: atenet-router
  namespace: ate-system
roleRef:
  kind: Role
  name: atenet-router-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atenet-router-envoy-config
  namespace: ate-system
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    node:
      id: substrate-envoy-node
      cluster: substrate-router-cluster

    dynamic_resources:
      lds_config:
        resource_api_version: V3
        ads: {}
      cds_config:
        resource_api_version: V3
        ads: {}
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
        - envoy_grpc:
            cluster_name: xds_cluster

    static_resources:
      clusters:
      - name: xds_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: xds_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 18000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-router
  namespace: ate-system
  labels:
    app: atenet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: atenet-router
      # Budget for the full shutdown sequence: --drain-delay (13s, readiness
      # propagation) + the Envoy drain window (~15s) + the derived
      # --drain-timeout (park budget + route timeout + margin, ~20s at
      # defaults) + slack for the force stop and the tracer/meter flush. The
      # sum must fit within terminationGracePeriodSeconds, or the kubelet
      # SIGKILLs mid-drain.
      terminationGracePeriodSeconds: 60
      containers:
      - name: atenet-router
        image: ko://github.com/agent-substrate/substrate/cmd/atenet
        args:
        - "router"
        - "--standalone"
        - "--namespace=ate-system"
        - "--port-http=8080"
        - "--port-xds=18000"
        - "--port-extproc=50051"
        - "--extproc-address=127.0.0.1"
        - "--status-port=4040"
        - "--port-https=8443"
        - "--envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        # Client auth to ateapi (mtls): verify the serving cert against the
        # servicedns trust bundle and present the podidentity client cert.
        - "--ateapi-address=k8s:///api.ate-system.svc:443"
        - "--ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        # Graceful shutdown knobs. --drain-timeout is left at its derived
        # default (park budget + the default route timeout + margin). The sum
        # of the sequence must fit within terminationGracePeriodSeconds above.
        - "--drain-delay=13s"
        # Envoy's end-to-end timeout on the workload route. Raise it for actors
        # whose turns legitimately run long — a harness relaying an LLM
        # completion holds the request open for the whole generation, and at the
        # 10s default the client gets a 504 mid-turn. NOTE: the drain sequence
        # deliberately does NOT scale with this; if you raise it and want long
        # turns to survive a shutdown, raise --drain-timeout and
        # terminationGracePeriodSeconds alongside it.
        # - "--route-timeout=5m"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        # OTLP exporter settings are shared by every control plane component;
        # see manifests/ate-install/ate-otel-config.yaml. This also covers
        # Envoy's own spans: --otlp-collector-address defaults to
        # $OTEL_EXPORTER_OTLP_ENDPOINT, so the flag stays out of the args above.
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: xds
          containerPort: 18000
        - name: extproc
          containerPort: 50051
        - name: status
          containerPort: 4040
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        # /healthz stays 200 while a terminating pod drains; /readyz turns
        # 503, so liveness and readiness diverge correctly during shutdown.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        # Router's own client identity presented to ateapi.
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        # Trust bundle used to verify ateapi's servicedns serving cert.
        - name: "servicedns-ca"
          mountPath: "/run/servicedns-ca"
        # Shared with the Envoy container: the router writes the
        # drain-complete marker here at the end of its shutdown sequence,
        # releasing Envoy's preStop poll.
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
      - name: envoy
        image: envoyproxy/envoy:v1.30-latest
        command:
        - "/usr/local/bin/envoy"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--component-log-level"
        - "upstream:debug,router:debug,ext_proc:debug"
        # Prevents Envoy from fast-exiting on SIGTERM before atenet-router finishes
        # its drain sequence. Polls for the drain-complete marker written by the
        # router on the shared emptyDir, terminating Envoy as soon as the drain
        # completes (or at terminationGracePeriodSeconds if the router crashes).
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done"]
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: admin
          containerPort: 9901
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        # podidentity credential + trust bundles for actor-facing (upstream)
        # mTLS. Envoy's ORIGINAL_DST actor cluster presents this credential
        # bundle as its client cert when dialing the actor's atunnel ingress
        # server on :443, and validates that server against the trust bundle.
        # The issued SPIFFE identity is
        # spiffe://cluster.local/ns/ate-system/sa/atenet-router, which atunnel's
        # --atunnel-client-identity allows.
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        # The preStop hook polls this path for the router's drain-complete
        # marker; read-only, the router is the only writer.
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: atenet-router-envoy-config
      # Pod-shared scratch space for the shutdown handshake between the router
      # and the Envoy preStop hook.
      - name: "drain-signal"
        emptyDir: {}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "servicedns-ca"
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: atenet-router
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: status
    port: 4040
    targetPort: status
    protocol: TCP
