apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-router
  namespace: ate-system
  labels:
    app: atenet-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atenet-router-endpointslices
  namespace: ate-system
rules:
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atenet-router-endpointslices
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: atenet-router
  namespace: ate-system
roleRef:
  kind: Role
  name: atenet-router-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atenet-router-envoy-config
  namespace: ate-system
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          # Loopback only. The admin API is unauthenticated and includes
          # /quitquitquit, /drain_listeners, /runtime_modify and /config_dump,
          # so it must not be reachable on the pod IP. In-pod callers (the
          # router's drain sequence and dataplane health check) dial localhost,
          # and `kubectl port-forward` dials loopback inside the pod's network
          # namespace, so both keep working. Prometheus scrapes the
          # envoy_metrics listener below instead.
          address: 127.0.0.1
          port_value: 9901

    node:
      id: substrate-envoy-node
      cluster: substrate-router-cluster

    # Required for main_internal (see xds.go's buildMainInternalListener):
    # Envoy rejects any Listener.internal_listener without this registered,
    # with "InternalListener bootstrap extension is mandatory".
    bootstrap_extensions:
    - name: envoy.bootstrap.internal_listener
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener

    dynamic_resources:
      lds_config:
        resource_api_version: V3
        ads: {}
      cds_config:
        resource_api_version: V3
        ads: {}
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
        - envoy_grpc:
            cluster_name: xds_cluster

    static_resources:
      # envoy_metrics is the only pod-IP-reachable view of the admin API: it
      # proxies GET /stats/prometheus (the PodMonitoring in
      # atenet-router-monitoring.yaml) and GET /ready (the envoy container's
      # readiness probe) to the loopback-only admin listener and 404s
      # everything else. The stat prefixes contain "admin" so
      # envoyDrainer.activeConnections excludes probes and scrapes from the
      # downstream connection count it waits on to reach zero.
      listeners:
      - name: envoy_metrics
        stat_prefix: admin_metrics
        address:
          socket_address:
            address: "::"
            ipv4_compat: true
            port_value: 9902
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: admin_metrics
              route_config:
                name: envoy_metrics
                virtual_hosts:
                - name: envoy_metrics
                  domains: ["*"]
                  routes:
                  - match:
                      path: /stats/prometheus
                      headers:
                      - name: ":method"
                        string_match: { exact: GET }
                    route: { cluster: envoy_admin }
                  - match:
                      path: /ready
                      headers:
                      - name: ":method"
                        string_match: { exact: GET }
                    route: { cluster: envoy_admin }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: envoy_admin
        connect_timeout: 0.25s
        type: STATIC
        load_assignment:
          cluster_name: envoy_admin
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 9901
      - name: xds_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: xds_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 18000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-router
  namespace: ate-system
  labels:
    app: atenet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: atenet-router
      # Budget for the full shutdown sequence: --drain-delay (13s, readiness
      # propagation) + the Envoy drain window (~15s) + the derived
      # --drain-timeout (park budget + the drain route budget + margin, ~20s at
      # defaults) + slack for the force stop and the tracer/meter flush. The
      # sum must fit within terminationGracePeriodSeconds, or the kubelet
      # SIGKILLs mid-drain. None of it scales with --route-timeout, by design.
      terminationGracePeriodSeconds: 60
      containers:
      - name: atenet-router
        image: ko://github.com/agent-substrate/substrate/cmd/atenet
        args:
        - "router"
        # Serve the ingress direction only: the ingress ext_proc handler, plus
        # the xDS server that configures the dataplane in this pod when it is
        # Envoy (the agentgateway overlay is statically configured and does
        # not start it).
        # Egress runs the same binary with --mode=egress in its own
        # Deployment (manifests/ate-install/atenet-egress.yaml), because the two
        # directions scale independently.
        - "--mode=ingress"
        - "--namespace=ate-system"
        - "--port-http=8080"
        - "--port-xds=18000"
        - "--port-extproc=50051"
        - "--extproc-address=127.0.0.1"
        - "--status-port=4040"
        - "--port-https=8443"
        - "--envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        # CONNECT-tunneled ingress (arbitrary-port support).
        - "--port-connect=8081"
        - "--port-connect-tls=8444"
        # Client auth on the TLS listeners (--port-https, --port-connect-tls).
        # A client certificate must chain to the podidentity
        # ClusterTrustBundle, which the envoy container mounts too, and carry
        # one of the SPIFFE IDs below. The default --ingress-auth-mode,
        # deprecated-insecure, only checks a certificate a client chooses to
        # present, and keeps the plaintext listeners open;
        # components/router-static-mtls makes the certificate mandatory.
        #
        # Allowed SPIFFE IDs (exact match), one per client workload:
        #
        #   spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client
        #       The e2e suites' router client (see internal/e2e/ingressauth.go).
        #
        # Add an ID for every in-cluster workload that sends traffic to actors
        # through the router. The podidentity signer issues
        # spiffe://cluster.local/ns/<namespace>/sa/<service-account>.
        - "--ingress-client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--ingress-allowed-spiffe-ids=spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client"
        # Client auth to ateapi (mtls): verify the serving cert against the
        # servicedns trust bundle and present the podidentity client cert.
        - "--ateapi-address=k8s:///api.ate-system.svc:443"
        - "--ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        # Graceful shutdown knobs. --drain-timeout is left at its derived
        # default (park budget + the drain route budget + margin). The sum
        # of the sequence must fit within terminationGracePeriodSeconds above.
        - "--drain-delay=13s"
        # Envoy's end-to-end timeout on the workload route is left at its
        # default of 5m, which suits an agent relaying a model completion: the
        # request stays open for the whole generation. Set --route-timeout
        # lower to cap how long one turn may hold a request open.
        #
        # A turn still running after the drain route budget (10s) does not
        # survive a shutdown, and raising --route-timeout does not change that:
        # the drain sequence deliberately does not scale with it, so that a
        # generous route ceiling cannot stretch every rollout to the worst case.
        # If long turns must survive a shutdown, raise --drain-timeout and
        # terminationGracePeriodSeconds above together.
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        # OTLP exporter settings are shared by every control plane component;
        # see manifests/ate-install/ate-otel-config.yaml. This also covers
        # Envoy's own spans: --otlp-collector-address defaults to
        # $OTEL_EXPORTER_OTLP_ENDPOINT, so the flag stays out of the args above.
        envFrom:
        - configMapRef:
            name: ate-otel-config
        # The xDS server (--port-xds) binds 127.0.0.1 and serves only the Envoy
        # in this pod, so it is deliberately not declared as a container port.
        ports:
        - name: extproc
          containerPort: 50051
        - name: status
          containerPort: 4040
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        # /healthz stays 200 while a terminating pod drains; /readyz turns
        # 503, so liveness and readiness diverge correctly during shutdown.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        # Router's own client identity presented to ateapi.
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        # Trust bundle used to verify ateapi's servicedns serving cert.
        - name: "servicedns-ca"
          mountPath: "/run/servicedns-ca"
        # Shared with the Envoy container: the router writes the
        # drain-complete marker here at the end of its shutdown sequence,
        # releasing Envoy's preStop poll.
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
      - name: envoy
        image: envoyproxy/envoy:v1.39-latest@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
        command:
        - "/usr/local/bin/envoy"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        # Prevents Envoy from fast-exiting on SIGTERM before atenet-router finishes
        # its drain sequence. Polls for the drain-complete marker written by the
        # router on the shared emptyDir, terminating Envoy as soon as the drain
        # completes (or at terminationGracePeriodSeconds if the router crashes).
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done"]
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: connect
          containerPort: 8081
        - name: connect-tls
          containerPort: 8444
        # Filtered admin view (GET /stats/prometheus and /ready only). The
        # admin API itself (9901) is loopback-only and deliberately not listed.
        - name: envoy-metrics
          containerPort: 9902
        # Keeps the pod out of the Service until Envoy is ready.
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 2
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        # podidentity credential + trust bundles for actor-facing (upstream)
        # mTLS. Envoy's ORIGINAL_DST actor cluster presents this credential
        # bundle as its client cert when dialing the actor's atunnel ingress
        # server on :443, and validates that server against the trust bundle.
        # The issued SPIFFE identity is
        # spiffe://cluster.local/ns/ate-system/sa/atenet-router, which atunnel's
        # --atunnel-client-identity allows.
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        # The preStop hook polls this path for the router's drain-complete
        # marker; read-only, the router is the only writer.
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: atenet-router-envoy-config
      # Pod-shared scratch space for the shutdown handshake between the router
      # and the Envoy preStop hook.
      - name: "drain-signal"
        emptyDir: {}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "servicedns-ca"
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-router
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: connect
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: connect-tls
    port: 8444
    targetPort: 8444
    protocol: TCP
  - name: status
    port: 4040
    targetPort: status
    protocol: TCP
