# Cluster-wide SandboxConfig for the gVisor (runsc) sandbox class, shipped with
# the platform so gVisor ActorTemplates have a config to name via
# sandboxConfig.configName. atelet fetches the gVisor release tarball
# (gvisor.tar.zstd: runsc plus the gvisor-bin/ helpers runsc requires next to
# it) matching the worker node's architecture and extracts it locally. To pin a
# different release, add a version below and point defaultVersion at it, or
# create another SandboxConfig and name it from the ActorTemplate.
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
  annotations:
    sandboxconfig.ate.dev/is-class-default: "true"
spec:
  sandboxClass: gvisor
  defaultVersion: v3
  versions:
  # gVisor nightly 2026-10-10, for the split filesystem checkpoint
  # (runsc fscheckpoint, -fs-checkpoint-paths and -fs-restore-image-path) that
  # ateom-gvisor uses to save and restore durable-dir volumes.
  - name: v3
    state: Enabled
    assets:
      amd64:
        gvisor:
          url: "gs://snapshot-substrate-test-nybidari-cgroups/gvisor-pr15551/gvisor.tar.zstd"
          sha256: "9a92f6c36c4bfc4c45d52ac344d7bf115b74b0886329efeeed9ae580e42057a9"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/nightly/2026-10-10/aarch64/gvisor.tar.zstd"
          sha256: "aaf414f06eea7960238e43165c691f0a36cefc0593fb141e011e96211c7b6f57"
