# Cluster-wide default SandboxConfig for the gVisor (runsc) sandbox class. A
# WorkerPool with sandboxClass gvisor (the default) and no explicit
# sandboxConfigName resolves to this. atelet fetches the gVisor release tarball
# (gvisor.tar.bz2: runsc plus the gvisor-bin/ helpers runsc requires next to
# it) matching the worker node's architecture and extracts it locally. To pin a
# different release, edit the assets below or create another SandboxConfig and
# name it from the WorkerPool.
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
spec:
  sandboxClass: gvisor
  default: true
  # The root sandbox container's image. On GCP, prefer the in-project mirror
  # gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da.
  pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
  assets:
    amd64:
      gvisor:
        url: "gs://gvisor/releases/release/20260803/x86_64/gvisor.tar.bz2"
        sha256: "9e7a5fcc2cbd28c9cd4af910a9327abcf07a8efcce242c285b860d79010c2db5"
    arm64:
      gvisor:
        url: "gs://gvisor/releases/release/20260803/aarch64/gvisor.tar.bz2"
        sha256: "294d54dea2a18bcd2614a4b5072d6f32f0e8938f9e6e71c9e86b843c4a7b707b"
