# Cluster-wide SandboxConfig for the gVisor (runsc) sandbox class, shipped with
# the platform as the class default so gVisor WorkerPools resolve it unless
# they pin a specific configRef. atelet fetches the gVisor release tarball
# (gvisor.tar.zstd: runsc plus the gvisor-bin/ helpers runsc requires next to
# it) matching the worker node's architecture and extracts it locally. To pin a
# different release, add a version below and point defaultVersion at it, or
# create another SandboxConfig and reference it from the WorkerPool.
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
  annotations:
    sandboxconfig.ate.dev/is-class-default: "true"
spec:
  sandboxClass: gvisor
  defaultVersion: v4
  versions:
  # gVisor nightly 2026-10-17, the first to include google/gvisor@b79256080dec
  # (save and restore multiple filesystem checkpoint bundles). ateworker-gvisor
  # uses it to save container rootfs overlays (rootfs/) and durable-dir volumes
  # (fs/) as separate bundles.
  - name: v4
    state: Enabled
    # The root sandbox container's image. On GCP, prefer the in-project mirror
    # gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da.
    pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
    assets:
      amd64:
        gvisor:
          url: "gs://gvisor/releases/nightly/2026-10-17/x86_64/gvisor.tar.zstd"
          sha256: "fa72f0d45756c69a30beec21222c78241b0d330c36f4f2185648617cc23415c8"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/nightly/2026-10-17/aarch64/gvisor.tar.zstd"
          sha256: "238634978d99f0dd3e631c4f88eae7b19fb36937065428467f0b6d6b10697689"
