# Cluster-wide SandboxConfig for the gVisor (runsc) sandbox class, shipped with
# the platform so gVisor ActorTemplates have a config to name via
# sandboxConfig.configName. atelet fetches the gVisor release tarball
# (gvisor.tar.zstd: runsc plus the gvisor-bin/ helpers runsc requires next to
# it) matching the worker node's architecture and extracts it locally. To pin a
# different release, add a version below and point defaultVersion at it, or
# create another SandboxConfig and name it from the ActorTemplate.
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
  annotations:
    sandboxconfig.ate.dev/is-class-default: "true"
spec:
  sandboxClass: gvisor
  defaultVersion: v2
  versions:
  # gVisor release 20260907.0, the first tagged release with commit
  # 80bb741691be, which closes a systrap race that killed sandboxes under CPU
  # contention.
  - name: v2
    state: Enabled
    # The root sandbox container's image. On GCP, prefer the in-project mirror
    # gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da.
    pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
    assets:
      amd64:
        gvisor:
          url: "gs://gvisor/releases/release/20260907.0/x86_64/gvisor.tar.zstd"
          sha256: "e32ed48a2ddc7c0ef5e922ff5d52e33b6fccc75b61fd4c40a0bd9bdfe90032e6"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/release/20260907.0/aarch64/gvisor.tar.zstd"
          sha256: "f3ba93a1a83dd4b6a322237030cdf81a278d9ef4e01ae6218ba69fbc479fdfb2"
