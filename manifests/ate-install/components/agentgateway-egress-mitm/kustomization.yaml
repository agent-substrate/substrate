apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: atenet-egress-agentgateway-substrate-config
      namespace: ate-system
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: atenet-egress-agentgateway-substrate-config
        namespace: ate-system
      data:
        config.yaml: |
          frontendPolicies:
            connect:
              mode: tunnel
            accessLog:
              add:
                substrate.connect.authority: source.connectHeaders["host"]
            substrateEgressActorResolution:
              host: api.ate-system.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns-ca/trust-bundle.pem

          # Keep the outer egress gateway on 8443, but bind it to this pod's
          # address. Numeric CONNECT re-entry must select the wildcard
          # internal bind instead of selecting this front door again.
          gateways:
            egress:
              port: 8443
              bindAddress: $POD_IP
              protocol: HTTPS
              tls:
                cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
                key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
                root: /run/actor-id-ca-certs/ca.crt

          binds:
          - mode: internal
            protocol: AUTO
            listeners:
            - protocol: HTTPS
              tls:
                mode: dynamicCa
                cert: /run/egress-mitm/tls.crt
                key: /run/egress-mitm/tls.key
              routes:
              - backends:
                - dynamic: {}
                  policies:
                    backendTLS:
                      root: /etc/ssl/certs/ca-certificates.crt
                policies:
                  substrateEgress:
                    host: api.ate-system.svc:443
                    policies:
                      backendTLS:
                        cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                        key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                        root: /run/servicedns-ca/trust-bundle.pem
            - protocol: HTTP
              routes:
              - backends:
                - dynamic:
                    target: source.connectHeaders["host"]
                policies:
                  substrateEgress:
                    host: api.ate-system.svc:443
                    policies:
                      backendTLS:
                        cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                        key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                        root: /run/servicedns-ca/trust-bundle.pem
            - protocol: TCP
              tcpRoutes:
              - backends:
                - dynamic:
                    target: source.connectHeaders["host"]
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: atenet-egress
      namespace: ate-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: egress-mitm
          mountPath: /run/egress-mitm
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: egress-mitm
          secret:
            secretName: egress-mitm-ca-pool
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
