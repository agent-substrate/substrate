# Keeps the control plane off the worker nodes. Selected by
# hack/install-ate.sh and cmd/ate-setup under --cordon-control-plane; both
# wrap every control plane apply in a kustomization that includes this
# component.
#
# Assumes two node pools, each carrying its label as a matching NoSchedule
# taint:
#
#   ate.dev/workloadType=ate-control-plane  A small pool shared by every
#       control plane workload except postgres. Each workload's replicas are
#       spread across its nodes on a best-effort basis, so the pool may be
#       smaller than the pod count and rollout surges never wait on a free
#       node.
#   ate.dev/workloadType=ate-postgres  One node, postgres alone. The
#       StatefulSet replaces its pod in place, so no spare is needed.
#
# A pool that is missing leaves its pods Pending rather than failing loudly.
#
# Name-regex targets rather than one patch per workload: the install applies
# these workloads through several different streams (the base bundle, a lone
# ate-api-server redeploy, the podcert overlay, the postgres file, and the
# egress variants), and kustomize leaves a stream alone when nothing in it
# matches, so the same component fits every path.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: ate-api-server|ate-controller|atenet-router|atenet-egress|podcertificate-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: overridden-by-target
      spec:
        template:
          metadata:
            labels:
              ate.dev/workloadType: ate-control-plane
          spec:
            nodeSelector:
              ate.dev/workloadType: ate-control-plane
            tolerations:
            - key: ate.dev/workloadType
              operator: Equal
              value: ate-control-plane
              effect: NoSchedule
            topologySpreadConstraints:
            # matchLabelKeys narrows the selector to pods sharing this pod's
            # app label, so each workload spreads its own replicas.
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  ate.dev/workloadType: ate-control-plane
              matchLabelKeys:
              - app
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: overridden-by-target
      spec:
        template:
          spec:
            nodeSelector:
              ate.dev/workloadType: ate-postgres
            tolerations:
            - key: ate.dev/workloadType
              operator: Equal
              value: ate-postgres
              effect: NoSchedule
