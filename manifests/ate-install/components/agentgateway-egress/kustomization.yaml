apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # The base is the envoy gateway. AgentGateway mints its own leaves through
  # the static egress config's tls.mode: dynamicCa, so drop Envoy's minting
  # sidecar and its volumes, and the non-root pod identity only that pod is
  # set up for.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: atenet-egress
      namespace: ate-system
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: atenet-egress
        namespace: ate-system
      spec:
        template:
          spec:
            securityContext:
              runAsUser: null
              runAsGroup: null
              runAsNonRoot: null
              fsGroup: null
            initContainers: null
            volumes:
            - name: sdsmint-sock
              $patch: delete
            - name: ca-state
              $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: atenet-egress
      namespace: ate-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: egress-mitm
          mountPath: /run/egress-mitm
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: egress-mitm
          secret:
            secretName: egress-mitm-ca-pool
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
