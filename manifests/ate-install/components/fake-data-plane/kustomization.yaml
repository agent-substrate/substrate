# The fake data plane for control-plane benchmarks, layered by ate-setup
# --fake-data-plane over the atelet and ate-controller applies. fake-atelet
# takes atelet's place in its own DaemonSet, and fake-workersync honors every
# WorkerPool with fake Workers on the fake-atelet nodes instead of worker
# pods. Actors placed on them do not exist. Never install this on a cluster
# that serves real actors.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - fake-workersync.yaml

patches:
  # fake-atelet runs in atelet's DaemonSet, so it keeps atelet's name, labels,
  # service account (whose pod certificate carries atelet's SPIFFE ID), and
  # node selector. It writes snapshot placeholders itself, in place of the
  # objectstore-plugin sidecar, so it takes that sidecar's env, the storage
  # settings each overlay gives it, and the placeholders land where atelet's
  # snapshots would. Everything atelet needs from the host goes, and so do its
  # scrape annotations, since fake-atelet serves no metrics.
  # ate.dev/fake-atelet is how fake-workersync finds the pods.
  - target:
      kind: DaemonSet
      labelSelector: app=atelet
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/ate.dev~1fake-atelet
        value: "true"
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1port
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      # objectstore-plugin is atelet's only init container.
      - op: copy
        from: /spec/template/spec/initContainers/0/env
        path: /spec/template/spec/containers/0/env
      - op: remove
        path: /spec/template/spec/initContainers
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ko://go.ate.dev/substrate/cmd/benchmarking/isolate/fake-atelet
      # fake-atelet runs with its defaults. A benchmark tunes it through the
      # fake-atelet-tuning ConfigMap, which no install creates or resets.
      - op: remove
        path: /spec/template/spec/containers/0/args
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: fake-atelet-tuning
            optional: true
      - op: replace
        path: /spec/template/spec/containers/0/ports
        value:
        - name: grpc
          containerPort: 21998
        # fake-workersync's capacity reports, relayed to ate-api-server under
        # this pod's atelet identity; only fake-workersync's is admitted.
        - name: relay
          containerPort: 8086
        # atelet's probes, kept from its container, target this port.
        - name: health
          containerPort: 9091
      - op: replace
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value:
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: servicedns-ca
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
      - op: replace
        path: /spec/template/spec/volumes
        value:
        - name: podidentity
          projected:
            sources:
            - podCertificate:
                signerName: podidentity.podcert.ate.dev/identity
                keyType: ECDSAP256
                credentialBundlePath: credential-bundle.pem
            - clusterTrustBundle:
                signerName: podidentity.podcert.ate.dev/identity
                labelSelector:
                  matchLabels:
                    podcert.ate.dev/canarying: live
                path: trust-bundle.pem
        - name: servicedns-ca
          projected:
            sources:
            - clusterTrustBundle:
                signerName: servicedns.podcert.ate.dev/identity
                labelSelector:
                  matchLabels:
                    podcert.ate.dev/canarying: live
                path: trust-bundle.pem
  # fake-workersync calls ate-api-server in ate-controller's place.
  - target:
      kind: NetworkPolicy
      name: ate-api-server
    patch: |-
      - op: add
        path: /spec/ingress/0/from/0/podSelector/matchExpressions/0/values/-
        value: fake-workersync
  # Grant fake-workersync the controller authz role so it can manage Workers.
  - target:
      kind: Deployment
      name: ate-api-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --controller-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/fake-workersync
  # fake-workersync stands in for ate-controller, which must not run beside
  # it: its WorkerPool controller would make real worker pods for the same
  # pools, and its worker syncer deletes every Worker with no live pod. Its
  # NetworkPolicy and egress MITM trust controllers stop too; fake actors
  # need neither.
  - target:
      kind: Deployment
      name: ate-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
