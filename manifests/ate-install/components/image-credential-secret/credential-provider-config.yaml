# The CredentialProviderConfig atelet loads (kubelet.config.k8s.io/v1). One provider: the docker-config plugin
# reading the Secret mounted at /run/image-credential-provider/registry. It returns credentials only for the
# registries the Secret has an entry for (an empty answer otherwise, so the pull falls through to the next
# provider or goes anonymous). Narrow matchImages to those registries to avoid exec-ing it for every pull.
apiVersion: v1
kind: ConfigMap
metadata:
  name: atelet-image-credential-provider
  namespace: ate-system
data:
  config.yaml: |
    apiVersion: kubelet.config.k8s.io/v1
    kind: CredentialProviderConfig
    providers:
    - name: dockerconfig-credential-provider
      apiVersion: credentialprovider.kubelet.k8s.io/v1
      matchImages:
      - "*"
      - "*.*"
      - "*.*.*"
      - "*.*.*.*"
      defaultCacheDuration: 5m
      env:
      - name: DOCKER_CONFIG
        value: /run/image-credential-provider/registry
