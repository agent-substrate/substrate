apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - configmap.yaml

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: atenet-router-envoy-config
      namespace: ate-system
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: atenet-router-envoy-config
        namespace: ate-system
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: atenet-router
      namespace: ate-system
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0
        value:
          name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.5.0
          args:
          - -f
          - /etc/agentgateway/config.yaml
          env:
          - name: AGENTGATEWAY_OTLP_ADDRESS
            value: opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
          ports:
          - name: http
            containerPort: 8080
          - name: https
            containerPort: 8443
          - name: connect
            containerPort: 8081
          - name: connect-tls
            containerPort: 8444
          - name: readiness
            containerPort: 15021
          - name: stats
            containerPort: 15020
          volumeMounts:
          - name: envoy-config
            mountPath: /etc/agentgateway
          - name: servicedns
            mountPath: /run/servicedns.podcert.ate.dev
          - name: podidentity
            mountPath: /run/podidentity.podcert.ate.dev
          - name: servicedns-ca
            mountPath: /run/servicedns-ca
      - op: remove
        path: /spec/template/spec/containers/1
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: servicedns-ca
          projected:
            sources:
            - clusterTrustBundle:
                signerName: servicedns.podcert.ate.dev/identity
                labelSelector:
                  matchLabels:
                    podcert.ate.dev/canarying: live
                path: trust-bundle.pem
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: atenet-router
      namespace: ate-system
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: atenet-router
        namespace: ate-system
      spec:
        template:
          spec:
            volumes:
            - name: envoy-config
              configMap:
                name: atenet-router-agentgateway-config
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: atenet-egress
      namespace: ate-system
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0
        value:
          name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.5.0
          args:
          - -f
          - /etc/agentgateway/config.yaml
          ports:
          - name: https
            containerPort: 8443
          - name: readiness
            containerPort: 15021
          - name: stats
            containerPort: 15020
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: readiness
            periodSeconds: 10
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /healthz/ready
              port: readiness
            periodSeconds: 1
          volumeMounts:
          - name: config
            mountPath: /etc/agentgateway
            readOnly: true
          - name: servicedns
            mountPath: /run/servicedns.podcert.ate.dev
            readOnly: true
          - name: actor-id-ca-certs
            mountPath: /run/actor-id-ca-certs
            readOnly: true
          - name: podidentity
            mountPath: /run/podidentity.podcert.ate.dev
            readOnly: true
          - name: servicedns-ca
            mountPath: /run/servicedns-ca
            readOnly: true
      - op: replace
        path: /spec/template/spec/volumes/0/configMap/name
        value: atenet-egress-agentgateway-substrate-config
      - op: remove
        path: /spec/template/spec/containers/1
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: servicedns-ca
          projected:
            sources:
            - clusterTrustBundle:
                signerName: servicedns.podcert.ate.dev/identity
                labelSelector:
                  matchLabels:
                    podcert.ate.dev/canarying: live
                path: trust-bundle.pem
