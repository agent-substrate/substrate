apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - configmap.yaml

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: atenet-router-envoy-config
        namespace: ate-system
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: atenet-router
      namespace: ate-system
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/4
        value: --port-xds=18000
      - op: remove
        path: /spec/template/spec/containers/0/args/4
      - op: test
        path: /spec/template/spec/containers/0/args/8
        value: --envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem
      - op: remove
        path: /spec/template/spec/containers/0/args/8
      - op: test
        path: /spec/template/spec/containers/0/ports/0/name
        value: xds
      - op: remove
        path: /spec/template/spec/containers/0/ports/0
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --atenet-router=agentgateway
      - op: replace
        path: /spec/template/spec/containers/1
        value:
          name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.4.1
          args:
          - -f
          - /etc/agentgateway/config.yaml
          ports:
          - name: http
            containerPort: 8080
          - name: https
            containerPort: 8443
          - name: readiness
            containerPort: 15021
          - name: stats
            containerPort: 15020
          volumeMounts:
          - name: envoy-config
            mountPath: /etc/agentgateway
          - name: servicedns
            mountPath: /run/servicedns.podcert.ate.dev
          - name: podidentity
            mountPath: /run/podidentity.podcert.ate.dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: atenet-router
        namespace: ate-system
      spec:
        template:
          spec:
            volumes:
            - name: envoy-config
              configMap:
                name: atenet-router-agentgateway-config
