# The kind sizing, selected by --kind and composed after sizing-default.
# sizing-default sizes the database for a real install under activation load.
# On a kind node -- 4 vCPU and a small disk on a GitHub runner -- that would
# crowd out everything else, so restore the small test-database footprint.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: postgres
              resources:
                requests:
                  cpu: 250m
                limits:
                  cpu: "2"
