# The settings of the in-tree GCS and S3 backends. The kind overlay sets the
# AWS_* variables; deleting one a manifest lacks is a no-op.
apiVersion: apps/v1
kind: Workload
metadata:
  name: objectstore-plugin-env
spec:
  template:
    spec:
      initContainers:
        - name: objectstore-plugin
          env:
            - name: ATE_STORAGE_BACKEND
              $patch: delete
            - name: AWS_REGION
              $patch: delete
            - name: AWS_ENDPOINT_URL
              $patch: delete
            - name: AWS_S3_USE_PATH_STYLE
              $patch: delete
            - name: AWS_ACCESS_KEY_ID
              $patch: delete
            - name: AWS_SECRET_ACCESS_KEY
              $patch: delete
