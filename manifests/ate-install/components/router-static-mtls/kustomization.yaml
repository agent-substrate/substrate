# Switches the ingress router to --ingress-auth-mode=static-mtls: every client
# must present a podidentity.podcert.ate.dev certificate whose SPIFFE ID is on
# the allowlist. Selected by cmd/ate-setup under --ingress-auth-mode=static-mtls
# (or ATE_INGRESS_AUTH_MODE=static-mtls), which wraps every control plane apply
# in a kustomization that includes this component.
#
# The flags are appended to the router container's args; the router parses
# its flags with pflag, where a later occurrence wins, so --port-http=0 and
# --port-connect=0 override the plaintext ports the base manifest sets. Those
# two listeners cannot authenticate a client, and the router refuses to start
# in static-mtls mode while either is enabled.
#
# The client CA bundle and the allowed SPIFFE IDs come from the base manifest
# (atenet-router.yaml), where the TLS listeners already check any certificate a
# client presents.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: atenet-router
    # containers/0 is the atenet-router container; the envoy sidecar follows it.
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --ingress-auth-mode=static-mtls
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --port-http=0
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --port-connect=0
