apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ate-system
data:
  postgresql.conf: |
    listen_addresses = '*'
    ssl = on
    ssl_cert_file = '/run/tls/credential-bundle.pem'
    ssl_key_file = '/run/tls/credential-bundle.pem'
    ssl_ca_file = '/etc/postgres-ca/ca.crt'
    hba_file = '/etc/postgresql/pg_hba.conf'
  pg_hba.conf: |
    # Auth mirrors valkey.yaml's model: any client presenting a certificate
    # signed by the trusted pod-identity CA is accepted, no password and no
    # per-cert CN-to-role mapping. postgres-ca-certs contains both the
    # service-DNS root (server identity) and pod-identity root (clients).
    hostssl all all all trust clientcert=verify-ca
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ate-system
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The official postgres image requires ssl_key_file to contain only a
      # private key with restrictive (0600) permissions. The projected
      # podCertificate source is world-readable, so copy it into a writable
      # emptyDir and fix permissions/ownership before postgres starts --
      # valkey.yaml doesn't need this because Valkey's TLS loading is more
      # lenient about combined cert+key files and file permissions.
      initContainers:
      - name: fix-tls-perms
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        securityContext:
          runAsUser: 70
        command:
        - /bin/sh
        - -c
        - |
          set -e
          cp /run/servicedns.podcert.ate.dev/credential-bundle.pem /run/tls/credential-bundle.pem
          chmod 600 /run/tls/credential-bundle.pem
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
        - name: tls
          mountPath: /run/tls
      containers:
      - name: postgres
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
        - name: POSTGRES_DB
          value: atepg
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - atepg
          initialDelaySeconds: 2
          periodSeconds: 2
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - atepg
          initialDelaySeconds: 10
          periodSeconds: 10
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: tls
          mountPath: /run/tls
        - name: postgres-ca-certs
          mountPath: /etc/postgres-ca
          readOnly: true
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: tls
        emptyDir: {}
      - name: postgres-ca-certs
        projected:
          sources:
          - secret:
              name: postgres-ca-certs
              items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
