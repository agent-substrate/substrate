apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ate-system
data:
  postgresql.conf: |
    listen_addresses = '*'
    ssl = on
    ssl_cert_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_key_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_ca_file = '/run/podidentity.podcert.ate.dev/trust-bundle.pem'
    hba_file = '/etc/postgresql/pg_hba.conf'

    # Everything below is derived from the memory limit declared on the
    # postgres container in this file and from the connection budget in
    # docs/ops/postgres.md. Change them together.
    #
    # shared_buffers, effective_cache_size and max_connections need a restart,
    # and nothing here triggers one: this ConfigMap is mounted into the pod, and
    # the pod template carries no hash of its contents, so re-applying these
    # manifests against a live cluster updates the file and leaves the running
    # server on its old values. An existing install needs an explicit
    # `kubectl rollout restart statefulset/postgres -n ate-system`, which on
    # this single-replica StatefulSet is a control-plane outage -- schedule it.

    # The customary 25% of the 2Gi container limit. The compiled-in default is
    # 128MB, which leaves nearly the whole working set to be copied out of the
    # kernel page cache on every read.
    shared_buffers = 512MB
    # What the planner should believe is cached, counting the page cache that is
    # charged to the same cgroup: the memory limit less shared_buffers and
    # backend headroom. The compiled-in default is 4GB, twice the limit, which
    # makes the planner over-favor index scans.
    effective_cache_size = 1GB
    # max_connections = (ateapi replicas + 1 surge pod)
    #                   x (pool_max_conns + outbox watch pool)
    #                   + operator sessions
    #                 = 6 x (12 + 3) + 10
    #                 = 100
    # pool_max_conns comes from the connection string the installer builds
    # (default_postgres_connection_string in hack/install-ate.sh, mirrored in
    # cmd/ate-setup/internal/config/config.go); the watch pool is
    # watchPoolMaxConns in cmd/ateapi/internal/store/atepg/atepg.go. The replica
    # term leaves room to scale ate-api-server to five replicas mid-rollout
    # without a database restart.
    #
    # There is deliberately no superuser_reserved_connections term: the setting
    # holds slots back from non-superusers only, and pg_hba.conf below trusts
    # every role while ateapi connects as `postgres`, so ateapi's own pools
    # could take the reserved slots and an operator would gain nothing. It
    # becomes real headroom once issue #997 moves ateapi onto a non-superuser
    # role; add the term back then.
    #
    # The total happens to equal the compiled-in default; it is stated so the
    # ceiling is an explicit thing to re-derive whenever the pool size or the
    # replica count changes. Raising it needs a larger memory limit first: each
    # backend costs several MB on top of shared_buffers.
    max_connections = 100
    # A session that leaves a transaction open holds back the xmin horizon, and
    # the WatchWorkers outbox only delivers events below that horizon
    # (cmd/ateapi/internal/store/atepg/outbox.go), so one forgotten BEGIN in a
    # psql session stalls worker events for every ateapi replica. This timeout
    # fires only on sessions idle *between* statements, never on one executing
    # or waiting for a lock, so it cannot cut short any legitimate ateapi work:
    # its transactions are a handful of statements issued back-to-back with no
    # client-side waiting in between, and an outbox maintenance pass is always
    # either running a statement or blocked on a lock.
    # Deliberately not paired with a global statement_timeout, which
    # counts lock-wait time and would kill exactly those legitimate waits; see
    # docs/ops/postgres.md.
    idle_in_transaction_session_timeout = 60s
  pg_hba.conf: |
    # Local socket access is limited to processes in this pod and is used by
    # health checks, the workload's idempotent database bootstrap, and the
    # tls-reloader sidecar's configuration reloads.
    local all all trust
    # PostgreSQL verifies client certificates against the pod-identity CA. It
    # does not need its own serving CA because it never verifies its server certificate.
    hostssl all all all trust clientcert=verify-ca
  reload-tls.sh: |
    # PostgreSQL opens ssl_cert_file, ssl_key_file and ssl_ca_file at startup
    # and on SIGHUP, and nowhere else. The kubelet replaces the projected pod
    # certificate in place about 30 minutes before it expires, so without this
    # loop the server keeps presenting the certificate it booted with until it
    # expires about a day later and every client stops trusting it.
    set -eu

    # As PID 1 this shell only sees SIGTERM if a handler is installed, and only
    # acts on it between commands, so the sleep below runs in the background
    # and is waited on. Without both halves the pod takes the full termination
    # grace period to go away.
    trap 'exit 0' TERM INT

    CERT=/run/servicedns.podcert.ate.dev/credential-bundle.pem
    CA=/run/podidentity.podcert.ate.dev/trust-bundle.pem

    # Comfortably inside the 30m headroom (notAfter - beginRefreshAt) that
    # cmd/podcertcontroller/internal/servicednssigner/servicednssigner.go
    # leaves; hashing two small files costs nothing.
    INTERVAL=60

    reloaded=""
    while true; do
      current="$(sha256sum "${CERT}" "${CA}")"
      # Reloading fails until the server is accepting connections, which is
      # where every pod starts out, so only record a hash once it has worked.
      # Starting empty also means a restart of this container costs one
      # redundant reload rather than a missed one.
      if [ "${current}" != "${reloaded}" ] \
        && psql -U postgres -d postgres -Atc 'SELECT pg_reload_conf()' >/dev/null 2>&1; then
        reloaded="${current}"
        echo "$(date -u +%FT%TZ) reloaded TLS configuration"
      fi
      sleep "${INTERVAL}" &
      wait $!
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ate-system
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # Group ownership of the projected certificate below, and of the data
        # volume so that a freshly provisioned one is writable. OnRootMismatch
        # keeps the kubelet from walking the data directory on every start,
        # which would leave PGDATA group-writable and postgres refusing to run.
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      # PostgreSQL re-reads its TLS files only on SIGHUP, so this sidecar
      # reloads the server whenever the kubelet rotates the projected pod
      # certificate. fsGroup is also what makes that projection readable: the
      # kubelet writes it root-owned for as long as the pod's containers do not
      # all agree on one non-root user, and grants the fsGroup group access,
      # landing the key at root:postgres 0640, the only shared mode PostgreSQL
      # accepts. Pinning runAsUser on the postgres container would make the key
      # postgres-owned and group-readable, which it rejects.
      # See https://www.postgresql.org/docs/current/ssl-tcp.html#SSL-SETUP
      initContainers:
      - name: tls-reloader
        restartPolicy: Always
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        securityContext:
          runAsUser: 70
        command:
        - /bin/sh
        - /etc/postgresql/reload-tls.sh
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity-ca
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      containers:
      - name: postgres
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -ec
              - |
                until psql -U postgres -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
                  sleep 1
                done
                if ! psql -U postgres -d postgres -Atc \
                  "SELECT 1 FROM pg_database WHERE datname = 'atepg'" | grep -qx 1; then
                  createdb -U postgres atepg
                fi
        env:
        - name: POSTGRES_DB
          value: atepg
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - psql -U postgres -d atepg -Atc 'SELECT 1' >/dev/null
          initialDelaySeconds: 2
          periodSeconds: 2
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - postgres
          initialDelaySeconds: 10
          periodSeconds: 10
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity-ca
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        - name: data
          mountPath: /var/lib/postgresql/data
        # The whole control plane shares this one database; under activation
        # load it sustains several cores. The kind overlay shrinks the CPU back
        # down to fit a CI runner.
        #
        # The memory request equals the limit on purpose, unlike CPU: with
        # shared_buffers at 512MB the steady-state footprint sits above a
        # smaller request, and a container over its memory request is the first
        # thing the kubelet evicts under node pressure -- which the PDB below
        # does not prevent, because node-pressure eviction is involuntary.
        # Requesting the whole limit means usage can never exceed the request.
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
          limits:
            cpu: "16"
            memory: "2Gi"
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: servicedns
        projected:
          # 0600 plus the group read that fsGroup adds is the 0640 above.
          defaultMode: 0600
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # The unix socket directory, shared so the sidecar can ask the running
      # server to reload. The image defaults both the server and its clients to
      # this path, so nothing else has to know about it.
      - name: socket
        emptyDir: {}
      - name: podidentity-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          # Headroom so WAL churn cannot fill the volume: a full pg_wal is a
          # PANIC that drops every connection. Size also scales provisioned
          # IOPS/throughput on PD-backed storage classes. The kind overlay
          # shrinks this claim back down.
          storage: 500Gi

---
# The store is a single replica and the system of record for the whole control
# plane, so evicting it is an outage. minAvailable: 1 against replicas: 1 blocks
# voluntary eviction outright, which is the intent: a node drain stops and waits
# for an operator decision instead of taking the database down as a side effect
# of routine maintenance. The operator has to take the outage explicitly -- see
# "Node maintenance" in docs/ops/postgres.md, because a stalled node drain is
# the visible consequence. It does not protect against involuntary disruption
# (node loss, node-pressure eviction) and it is not a substitute for the managed
# Postgres posture described in the same document.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  namespace: ate-system
spec:
  minAvailable: 1
  # An already-unhealthy postgres pod is already an outage, so holding it in
  # place protects nothing while leaving a drain unable to make progress toward
  # replacing it. The default IfHealthyBudget would do exactly that here,
  # because minAvailable equals the replica count.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: postgres
