# Define Permissions (Read-Only for Pods)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-api-server
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["ate.dev"]
  resources: ["actortemplates", "workerpools", "sandboxconfigs"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["ate.dev"]
  resources: ["workerpools"]
  verbs: ["get", "watch", "list"]
# Secret reads for env source resolution are intentionally NOT granted
# cluster-wide here. Each demo / tenant is responsible for granting
# ate-api-server read access only to the specific Secrets referenced by its
# ActorTemplates (e.g. via a namespace-scoped Role + RoleBinding using
# resourceNames).
---
# Create Service Account for Workload Identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-api-server
  namespace: ate-system
---
# 4. Bind Identity to Permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-api-server
subjects:
- kind: ServiceAccount
  name: ate-api-server
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: ate-api-server
  apiGroup: rbac.authorization.k8s.io
---
# 5. Deploy the API Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: 2
  strategy:
    # Update replicas one at a time, create a new one first, then delete the old one.
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ate-api-server
  template:
    metadata:
      labels:
        app: ate-api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # TODO: Add topologySpreadConstraints to spread replicas across nodes and zones.
      serviceAccountName: ate-api-server
      # Budget for the full shutdown sequence: --drain-delay (sized to cover
      # the readinessProbe below reaching NotReady, plus propagation) +
      # --drain-timeout.
      terminationGracePeriodSeconds: 40
      containers:
      - name: ate-api-server
        image: ko://github.com/agent-substrate/substrate/cmd/ateapi
        args:
          - "--grpc-listen-addr=0.0.0.0:443"
          - "--grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
          - --redis-cluster-address=@env
          - --redis-ca-certs=/etc/valkey-ca/ca.crt
          - --redis-use-iam-auth=@env
          - --redis-tls-server-name=@env
          - --redis-client-cert=@env
          - --client-jwt-issuer=@env
          - --client-jwt-audience=api.ate-system.svc
          - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
          - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
          - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
          - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
          # Graceful shutdown knobs. The sum must fit within terminationGracePeriodSeconds.
          - --drain-delay=13s
          - --drain-timeout=15s
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
        # Inject env vars from a ConfigMap created by each developer.  This lets
        # each developer customize their own redis address, etc, without having
        # to edit this manifest, which can remain constant across all
        # developers.
        envFrom:
        - configMapRef:
            name: ate-api-server-envvars
            optional: true
        volumeMounts:
        # servicedns: the apiserver's own gRPC serving cert (DNS SAN api.ate-system.svc).
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        # podidentity: the apiserver's client identity (SPIFFE) when it dials
        # valkey and atelet, plus the trust bundle for verifying atelet's
        # serving certificate.
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "actor-id-jwt-pool"
          mountPath: "/run/actor-id-jwt-pool"
        # Note: See README.md for how to generate this secret.
        - name: "valkey-ca-certs"
          mountPath: "/etc/valkey-ca"
          readOnly: true
        - name: "actor-id-ca-pool"
          mountPath: "/run/actor-id-ca-pool"
          readOnly: true
        ports:
        - containerPort: 443
        - name: prometheus
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        # /healthz stays 200 while a terminating pod drains; /readyz
        # turns 503, so liveness and readiness diverge correctly during
        # shutdown.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "actor-id-jwt-pool"
        projected:
          sources:
          - secret:
              name: "actor-id-jwt-pool"
              items:
              - key: "pool"
                path: "pool.json"
      - name: "valkey-ca-certs"
        projected:
          sources:
          - secret:
              name: "valkey-ca-certs"
              items:
              - key: "ca.crt"
                path: "ca.crt"
      - name: "actor-id-ca-pool"
        projected:
          sources:
          - secret:
              name: "actor-id-ca-pool"
              items:
              - key: "pool"
                path: "pool.json"
---
# Allow voluntary disruptions (node drains, cluster upgrades) to take
# at most one API server pod at a time, at any replica count.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ate-api-server
---
# 6. Expose the Actor Assigner
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ate-system
spec:
  # Headless (i.e. `clusterIP: None`) services make DNS return one A record per
  # ready pod so gRPC clients can load balance client-side.
  clusterIP: None
  selector:
    app: ate-api-server
  ports:
  - name: grpc
    protocol: TCP
    port: 443
    targetPort: 443
