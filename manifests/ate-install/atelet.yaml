# 1. Create Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atelet
  namespace: ate-system
---
# 2. Define Permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atelet
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["ate.dev"]
  resources: ["csidriverconfigs"]
  verbs: ["get", "list", "watch"]
# SandboxConfigs are watched to pre-download sandbox assets into the node's
# cache before the first actor needs them (see cmd/atelet/sandbox_prewarm.go).
- apiGroups: ["ate.dev"]
  resources: ["sandboxconfigs"]
  verbs: ["get", "list", "watch"]
# ClusterTrustBundles referenced by SystemInfo trustBundle data sources are
# resolved on the node: atelet reads them through an informer and projects
# the sanitized PEM into actors (see cmd/atelet/trustbundle.go).
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "watch", "list"]
---
# 3. Bind Identity to Permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atelet
subjects:
- kind: ServiceAccount
  name: atelet
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: atelet
  apiGroup: rbac.authorization.k8s.io
---
# 4. Namespaced Role for EndpointSlices
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atelet-endpointslices
  namespace: ate-system
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atelet-endpointslices
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: atelet
  namespace: ate-system
roleRef:
  kind: Role
  name: atelet-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
# 5. Create PriorityClass
# Prioritize atelet over workers, which need it for actor activation.
# Use the highest user-defined priority; system-node-critical requires kube-system.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ate-node-critical
value: 1000000000
globalDefault: false
description: "Node-local ate components that every actor activation depends on."

---
# 6. Create DaemonSet
#
# ${SUBSTRATE_VERSION} and ${SUBSTRATE_VERSION_SUFFIX} are placeholders that
# hack/install-ate.sh fills in after kustomize/ko.
#
# During a rolling upgrade both old/new version DaemonSets coexist, each pinned 
# to nodes carrying a version label while the operator flip nodes from old version
# label to new versio label one at a time.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet-${SUBSTRATE_VERSION_SUFFIX}
  namespace: ate-system
  labels:
    app: atelet
    ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
spec:
  selector:
    matchLabels:
      app: atelet
      ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
  template:
    metadata:
      labels:
        app: atelet
        ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: atelet
      priorityClassName: ate-node-critical
      # Pin to nodes labelled with this substrate version. install-ate.sh labels unlabeled
      # nodes at install time; the operator owns the label afterwards.
      nodeSelector:
        ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
      # Budget for the full shutdown sequence: --drain-delay (0 for atelet) +
      # --drain-timeout (5m). Sized long because Checkpoint/Restore stream
      # multi-GiB snapshots and must not be force-cancelled mid-upload. The sum
      # must fit within terminationGracePeriodSeconds, plus slack for the force
      # Stop() and the tracer/meter flush on exit.
      terminationGracePeriodSeconds: 330
      # atelet must run on every node a WorkerPool actor may schedule to.
      # Node pools reserved for one sandbox class are tainted
      # ate.dev/sandboxClass=<class>:NoSchedule per the convention in
      # cmd/atecontroller/internal/controllers/workerpool_apply.go, which adds
      # the matching toleration to every pool's worker pods. Tolerating the key
      # with operator: Exists covers any current or future sandbox class value
      # without needing another manifest edit.
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      # The node snapshot plugin moves external snapshots between this node and
      # object storage for atelet, over a Unix socket in a pod-local emptyDir.
      # A native sidecar (restartPolicy: Always) starts before atelet and stops
      # after it, so uploads still in flight during atelet's drain finish.
      # atelet starts only once the startup probe sees the plugin serving.
      initContainers:
      - name: snapshot-plugin
        image: ko://github.com/agent-substrate/substrate/cmd/snapshot-plugin
        restartPolicy: Always
        args:
        - node
        - --socket=/run/snapshot-plugin/node.sock
        - --root=/var/lib/ate
        # The plugin listens on a Unix socket, which a gRPC probe cannot
        # reach, and the image has no shell, so the binary checks itself.
        startupProbe:
          exec:
            command:
            - /ko-app/snapshot-plugin
            - healthcheck
            - --socket=/run/snapshot-plugin/node.sock
          periodSeconds: 2
          failureThreshold: 30
        # Reads and writes snapshot files under the /var/lib/ate hostPath as
        # root, like atelet; needs no capabilities.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        # Same reservation as atelet and no limits: the plugin now does the
        # zstd work atelet used to, and must not get less CPU for it.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        env:
        # Object storage settings for snapshot transfers. Unset or "gcs"
        # selects GCS with ambient credentials; "s3" with the AWS_* variables
        # selects S3 (see the kind overlay). atelet keeps its own copy below
        # for sandbox asset downloads, which do not go through the plugin.
        - name: ATE_STORAGE_BACKEND
          value: "gcs"
        envFrom:
        - configMapRef:
            name: ate-otel-config
        volumeMounts:
        - name: run-ateom
          mountPath: /var/lib/ate
        - name: snapshot-plugin
          mountPath: /run/snapshot-plugin
      containers:
      - name: atelet
        image: ko://github.com/agent-substrate/substrate/cmd/atelet
        args:
        # Pull credentials come from the node's own kubelet credential provider
        # plugin (mounted read-only below) rather than a cloud SDK compiled into
        # atelet, so the same atelet authenticates to Artifact Registry on GKE
        # and to ECR on EKS.
        - --image-credential-provider-config=/run/image-credential-provider/config.yaml
        - --image-credential-provider-bin-dir=/run/image-credential-provider/bin
        - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        # Graceful shutdown knobs. The sum must fit within
        # terminationGracePeriodSeconds above.
        - --drain-delay=0s
        - --drain-timeout=5m
        - --snapshot-plugin-socket=/run/snapshot-plugin/node.sock
        # atelet does no mounts, netlink, device, or namespace operations (those
        # live in the ateom worker pod) — it only reads/writes the
        # /var/lib/ate hostPath as root. CAP_DAC_OVERRIDE is for one thing:
        # emptying a directory a non-root actor created in its 0777 durable dir.
        # It is owned by the actor's uid, typically 0755, so root has no write
        # access to it and resetActorDirs fails after every checkpoint.
        # runAsUser is pinned explicitly rather than relying on the base image's
        # default user.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
            add:
            - DAC_OVERRIDE
        # Keep per-node reservations small; omit limits to allow usage to grow
        # with the number of hosted actors.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        - name: ATE_STORAGE_BACKEND
          value: "gcs"
        # OTLP exporter settings are shared by every control plane component;
        # see manifests/ate-install/ate-otel-config.yaml.
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: grpc
          containerPort: 8085
          hostPort: 8085
        - name: prometheus
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 9091
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        # /healthz stays 200 while a terminating pod drains; /readyz turns 503,
        # so liveness and readiness diverge correctly during shutdown.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: run-ateom
          mountPath: /var/lib/ate
        - name: snapshot-plugin
          mountPath: /run/snapshot-plugin
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
        - name: servicedns-ca
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: kubelet-plugins
          mountPath: /var/lib/kubelet/plugins
        - name: device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: host-dev
          mountPath: /host/dev
          readOnly: true
        - name: image-credential-provider-bin
          mountPath: /run/image-credential-provider/bin
          readOnly: true
        - name: image-credential-provider-config
          mountPath: /run/image-credential-provider/config.yaml
          readOnly: true
      volumes:
      - name: snapshot-plugin
        emptyDir: {}
      - name: run-ateom
        hostPath:
          path: /var/lib/ate
          type: DirectoryOrCreate
      # Mount Kubelet plugins directory to access CSI driver Unix domain sockets.
      - name: kubelet-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      # atelet advertises host devices (e.g. /dev/kvm) to kubelet as extended
      # resources so worker pods can be granted just those devices instead of
      # running privileged. Registering requires talking to kubelet's socket in
      # this directory and creating a plugin socket beside it.
      - name: device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
      # Read-only view of the node's device nodes, used only to detect which
      # ones exist (atelet's own /dev is the container's, and does not show
      # /dev/kvm). Detection is all this grants: atelet drops every capability
      # and its own cgroup device filter still denies opening these.
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      # The kubelet's own credential provider bin dir and config; these paths
      # are GKE's, other node distributions differ. The bin dir also holds the
      # node's other kubelet-installed binaries -- the plugin contract is
      # directory-scoped, so a narrower mount would have to hard-code the
      # provider name and give up being cloud-agnostic.
      - name: image-credential-provider-bin
        hostPath:
          path: /home/kubernetes/bin
          type: DirectoryOrCreate
      - name: image-credential-provider-config
        hostPath:
          path: /etc/srv/kubernetes/cri_auth_config.yaml
          type: FileOrCreate
      # Identity for mutual TLS with the ate-apiserver. atelet is not behind a
      # Service, so it uses a podidentity (SPIFFE) cert rather than a servicedns
      # serving cert (which requires DNS SANs it would not have); the
      # clusterTrustBundle verifies the apiserver's client certificate.
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
