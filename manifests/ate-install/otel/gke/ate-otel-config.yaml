# The ate-otel-config ConfigMap for --observability=gke: it sends the control
# plane to the collector of the GKE managed OTel addon. The ConfigMap has the
# same name as the one in ../none/ate-otel-config.yaml, thus it replaces it. For
# the keys and for the components that read them, read that file.
#
# The endpoint below is specific to GKE. The addon must be enabled on the
# cluster, because the addon makes the gke-managed-otel namespace and the
# Service in it. hack/install-ate.sh tests for both before it applies this file:
# without the addon, each component fails to find the collector one time each
# minute, and the telemetry stops with no message.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system
  annotations:
    # The mode that applied this ConfigMap; read ../none/ate-otel-config.yaml.
    ate.dev/observability-mode: gke
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
