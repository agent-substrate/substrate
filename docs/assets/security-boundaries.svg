<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>Substrate security boundaries</title>
  <!-- Edit coordinates directly. Arrows point from the caller to the callee. -->
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212121"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a8a8"/></marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00838f"/></marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00838f"/></marker>
  </defs>
  <rect width="1120" height="560" fill="#ffffff"/>
  <!-- Trust boundaries -->
  <rect x="220" y="20" width="670" height="520" rx="10" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <text x="230" y="38" font-size="13.5" font-weight="bold" fill="#424242">Substrate</text>
  <rect x="360" y="52" width="380" height="112" rx="10" fill="#f7fbff" stroke="#1565c0" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="370" y="70" font-size="13.5" font-weight="bold" fill="#1565c0">Control plane</text>
  <rect x="410" y="200" width="290" height="320" rx="10" fill="#fbfefb" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="420" y="218" font-size="13.5" font-weight="bold" fill="#2e7d32">Worker node</text>
  <rect x="428" y="232" width="254" height="84" rx="10" fill="#fff7f7" stroke="#c62828" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="438" y="250" font-size="13.5" font-weight="bold" fill="#c62828">Sandbox</text>
  <rect x="428" y="326" width="254" height="84" rx="10" fill="#fff7f7" stroke="#c62828" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="438" y="344" font-size="13.5" font-weight="bold" fill="#c62828">Sandbox</text>
  <!-- Flows -->
  <polyline points="105,298 105,116 440,116" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <polyline points="190,330 240,330" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <polyline points="390,318 455,284" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <polyline points="390,342 455,372" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <polyline points="655,284 715,318" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <polyline points="655,372 715,342" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <polyline points="875,330 930,330" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <polyline points="655,470 930,470" fill="none" stroke="#212121" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <!-- Components -->
  <!-- Your application -->
  <rect x="20" y="298" width="170" height="64" rx="8" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
  <text x="105.0" y="326.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Your application</text>
  <text x="105.0" y="343.5" font-size="12.5" text-anchor="middle" fill="#212121">authenticates end users</text>
  <!-- Substrate API -->
  <rect x="440" y="86" width="220" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="550.0" y="112.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Substrate API</text>
  <text x="550.0" y="129.5" font-size="12.5" text-anchor="middle" fill="#212121">authorization per atespace</text>
  <!-- Ingress gateway -->
  <rect x="240" y="298" width="150" height="64" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="315.0" y="326.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Ingress gateway</text>
  <text x="315.0" y="343.5" font-size="12.5" text-anchor="middle" fill="#212121">authenticated callers</text>
  <!-- Egress gateway -->
  <rect x="715" y="298" width="160" height="64" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="795.0" y="318.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Egress gateway</text>
  <text x="795.0" y="335.0" font-size="12.5" text-anchor="middle" fill="#212121">destination policy,</text>
  <text x="795.0" y="352.0" font-size="12.5" text-anchor="middle" fill="#212121">credential injection</text>
  <!-- Actor A -->
  <rect x="455" y="256" width="200" height="50" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="555.0" y="277.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Actor A</text>
  <text x="555.0" y="294.5" font-size="12.5" text-anchor="middle" fill="#212121">no credentials</text>
  <!-- Actor B -->
  <rect x="455" y="350" width="200" height="50" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="555.0" y="371.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Actor B</text>
  <text x="555.0" y="388.5" font-size="12.5" text-anchor="middle" fill="#212121">no credentials</text>
  <!-- Node supervisor -->
  <rect x="455" y="445" width="200" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="555.0" y="475.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Node supervisor</text>
  <!-- External services -->
  <rect x="930" y="298" width="170" height="64" rx="8" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
  <text x="1015.0" y="326.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">External services</text>
  <text x="1015.0" y="343.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">and tools</text>
  <!-- Snapshot storage -->
  <path d="M930 445 v50 a85.0 7 0 0 0 170 0 v-50" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
  <ellipse cx="1015.0" cy="445" rx="85.0" ry="7" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
  <text x="1015.0" y="478.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Snapshot storage</text>
  <!-- Flow numbers and boundary tags -->
  <text x="272" y="108" font-size="12" font-weight="bold" text-anchor="middle" fill="#212121" stroke="#ffffff" stroke-width="4" paint-order="stroke">manage actors</text>
  <text x="790" y="462" font-size="12" font-weight="bold" text-anchor="middle" fill="#212121" stroke="#ffffff" stroke-width="4" paint-order="stroke">per-actor credentials (GCS)</text>
  <circle cx="428" cy="232" r="11" fill="#c62828"/>
  <text x="428" y="236.5" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
  <circle cx="428" cy="326" r="11" fill="#c62828"/>
  <text x="428" y="330.5" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
  <circle cx="240" cy="298" r="11" fill="#c62828"/>
  <text x="240" y="302.5" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
  <circle cx="875" cy="298" r="11" fill="#c62828"/>
  <text x="875" y="302.5" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
  <circle cx="360" cy="52" r="11" fill="#c62828"/>
  <text x="360" y="56.5" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
  <circle cx="930" cy="438" r="11" fill="#c62828"/>
  <text x="930" y="442.5" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
  <text x="214" y="321" font-size="12" font-style="italic" text-anchor="middle" fill="#424242">invoke</text>
</svg>
