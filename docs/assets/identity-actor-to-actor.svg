<svg xmlns="http://www.w3.org/2000/svg" viewBox="260 134 1061 509" width="1061" height="509" role="img" aria-labelledby="title" font-family="Ubuntu, Geist, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">Actor to actor: Actor A calls through the egress gateway, which injects A's JWT; the frontend verifies it and routes to Actor B via ingress</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64d86b"/></marker></defs>
<rect x="260" y="134" width="1061" height="509" rx="12" fill="#0a0e0b"/>
<!-- Edit coordinates directly. Arrows point from the caller to the callee. -->
<rect x="552" y="236" width="741" height="379" fill="none" stroke="#64d86b" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="1279" y="601" font-size="22" font-weight="700" fill="#64d86b" text-anchor="end">Substrate</text>
<rect x="288" y="266" width="224" height="112" rx="4" fill="#111612" stroke="#9aa89f" stroke-width="2.5"/>
<text x="400" y="314" font-size="21" font-weight="700" fill="#e4ebe6" text-anchor="middle">App frontend</text>
<text x="400" y="340" font-size="17" font-weight="400" fill="#9aa89f" text-anchor="middle">your app</text>
<rect x="582" y="266" width="161" height="112" rx="4" fill="#111612" stroke="#9aa89f" stroke-width="2.5"/>
<text x="662.5" y="304" font-size="21" font-weight="700" fill="#e4ebe6" text-anchor="middle">Ingress</text>
<text x="662.5" y="330" font-size="17" font-weight="400" fill="#9aa89f" text-anchor="middle">trusted</text>
<text x="662.5" y="351" font-size="17" font-weight="400" fill="#9aa89f" text-anchor="middle">frontends</text>
<rect x="782" y="266" width="192" height="112" rx="4" fill="#111612" stroke="#64d86b" stroke-width="2.5"/>
<text x="878" y="314" font-size="21" font-weight="700" fill="#e4ebe6" text-anchor="middle">Actor A</text>
<text x="878" y="340" font-size="17" font-weight="400" fill="#64d86b" text-anchor="middle">sandbox • no creds</text>
<rect x="1017" y="266" width="246" height="112" rx="4" fill="#111612" stroke="#64d86b" stroke-width="2.5"/>
<text x="1140" y="314" font-size="21" font-weight="700" fill="#e4ebe6" text-anchor="middle">Egress gateway</text>
<text x="1140" y="340" font-size="17" font-weight="400" fill="#9aa89f" text-anchor="middle">policy + injection</text>
<rect x="782" y="433" width="192" height="112" rx="4" fill="#111612" stroke="#64d86b" stroke-width="2.5"/>
<text x="878" y="481" font-size="21" font-weight="700" fill="#e4ebe6" text-anchor="middle">Actor B</text>
<text x="878" y="507" font-size="17" font-weight="400" fill="#64d86b" text-anchor="middle">sandbox • no creds</text>
<path d="M974 322 L1013 322" fill="none" stroke="#64d86b" stroke-width="3.5" marker-end="url(#head)" stroke-linejoin="round"/>
<circle cx="997" cy="294" r="16" fill="#0a0e0b" stroke="#64d86b" stroke-width="2.5"/>
<text x="997" y="300.5" font-size="18" font-weight="700" fill="#64d86b" text-anchor="middle">1</text>
