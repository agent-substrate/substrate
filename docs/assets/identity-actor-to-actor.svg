<text x="800" y="206.5" font-size="18" font-weight="700" fill="#64d86b" text-anchor="middle">2</text>
<g transform="translate(850 164) rotate(-35 12 12)" fill="none" stroke="#f0f175" stroke-width="3" stroke-linecap="round"><circle cx="6" cy="12" r="5"/><path d="M11 12 H24 M19 12 V16 M23 12 V15"/></g>
<text x="880" y="183" font-size="19" font-weight="400" fill="#64d86b" text-anchor="start">A's JWT</text>
