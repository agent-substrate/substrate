# The log events that Substrate emits over OTLP. Weaver reads this file with
# metrics.yaml, which holds every attribute the groups below refer to.
#
# An event name promises a set of attributes: a required one is on every
# record, and a conditionally required one is present exactly when its
# condition holds. The lists in each group are the reviewable form of the Keys
# and Conditional fields on the matching internal/actorevent Event.
# TestEventsMatchTheRegistry in that package holds the two in step both ways,
# so an event has to be declared here before it can ship.
#
# Metrics cannot answer what state an actor is in: the cardinality rule
# no-actor-identity bars actor identity from metric labels. The lifecycle events
# carry the identity, thus they are the only per-actor state answer.

groups:
  - id: event.ate.actor.state_changed
    type: event
    name: ate.actor.state_changed
    stability: development
    brief: An actor reached a new state.
    note: >
      ateapi writes one record for each committed transition, including the
      first, when the actor is made, and the last, when the record is deleted.
      The most recent record for an ate.actor.uid gives the state the actor is
      in now, and its timestamp gives when that state began.

      A crash is the event ate.actor.crashed instead, because it carries the
      failure keys and a higher severity. Both events set ate.actor.state, thus
      a consumer that reads the state off the attribute sees every transition
      and needs no map from a name to a state.

      Never sample or filter this stream. A consumer takes the last record for
      an actor, thus one dropped record reports a stale state with no sign that
      anything is missing.
    annotations:
      substrate:
        emitted_by: [ateapi]
        code_anchor: cmd/ateapi/internal/controlapi/workflow.go
        cuj: What state is this actor in, and since when?
    attributes:
      - ref: ate.atespace
        requirement_level: required
      - ref: ate.actor.name
        requirement_level: required
      - ref: ate.actor.uid
        requirement_level: required
      - ref: ate.template.atespace
        requirement_level: required
      - ref: ate.template.name
        requirement_level: required
      - ref: ate.actor.operation.name
        requirement_level: required
      - ref: ate.actor.state
        requirement_level: required

  - id: event.ate.actor.crashed
    type: event
    name: ate.actor.crashed
    stability: development
    brief: An actor was lost.
    note: >
      ateapi writes this beside the ate.actor.crashes counter, under the same
      guard, thus the event and the counter cannot disagree. The counter gives
      the rate; this event names which actor, which no metric label may.

      ate.actor.state is always crashed. It is set so a consumer reading the
      state off one attribute reaches crashed without special-casing the name.
    annotations:
      substrate:
        emitted_by: [ateapi]
        code_anchor: cmd/ateapi/internal/controlapi/crash.go
        cuj: Which actor was lost?
    attributes:
      - ref: ate.atespace
        requirement_level: required
      - ref: ate.actor.name
        requirement_level: required
      - ref: ate.actor.uid
        requirement_level: required
      - ref: ate.template.atespace
        requirement_level: required
      - ref: ate.template.name
        requirement_level: required
      - ref: ate.actor.operation.name
        requirement_level: required
      - ref: ate.actor.state
        requirement_level: required

  - id: event.ate.actor.usage_sampled
    type: event
    name: ate.actor.usage_sampled
    stability: development
    brief: A measurement of the CPU and the memory of one actor.
    note: >
      The ateom that runs the actor writes one record per actor on a timer,
      plus an initial and a final record per activation. ate.stats.kind tells
      them apart.

      The timestamp is when the measurement was read. The measurements are
      absent, not zero, while the actor is not measurable: the source is
      unspecified, and the record says only that the actor is pending and,
      through ate.actor.epoch, since when.

      Group by ate.stats.source before you add values: the two sources do not
      measure the same thing. ate.stats.cpu.time restarts at zero with each
      ate.actor.epoch. ate.stats.memory.usage and ate.stats.memory.working_set
      are absolute; ate.stats.memory.peak is as the source reports it.

      This stream may be sampled or dropped. Select it by event name; thus a
      consumer can sample or drop it without touching the lifecycle events.
    annotations:
      substrate:
        emitted_by: [ateom-gvisor, ateom-microvm]
        code_anchor: internal/actorevent/actorevent.go
        cuj: How much CPU and memory does this actor use, and since when?
    attributes:
      - ref: ate.atespace
        requirement_level: required
      - ref: ate.actor.name
        requirement_level: required
      - ref: ate.actor.uid
        requirement_level: required
      - ref: ate.template.atespace
        requirement_level: required
      - ref: ate.template.name
        requirement_level: required
      - ref: ate.workerpool.namespace
        requirement_level: required
      - ref: ate.workerpool.name
        requirement_level: required
      - ref: ate.sandbox.class
        requirement_level: required
      - ref: ate.stats.source
        requirement_level: required
      - ref: ate.stats.kind
        requirement_level: required
      - ref: ate.actor.epoch
        requirement_level: required
      - ref: ate.stats.memory.usage
        requirement_level:
          conditionally_required: ate.stats.source is not unspecified.
      - ref: ate.stats.memory.peak
        requirement_level:
          conditionally_required: ate.stats.source is not unspecified and the source reports a peak.
      - ref: ate.stats.memory.working_set
        requirement_level:
          conditionally_required: ate.stats.source is not unspecified.
      - ref: ate.stats.cpu.time
        requirement_level:
          conditionally_required: ate.stats.source is not unspecified.
