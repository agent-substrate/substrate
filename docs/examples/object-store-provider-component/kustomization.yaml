# An example component that replaces both objectstore-plugin sidecars with a
# provider's own plugin. Upload the microVM guest assets to the asset location,
# then install it with
#
#   go run ./cmd/ate-setup deploy ate-system --storage-backend=external \
#     --component=docs/examples/object-store-provider-component \
#     --snapshot-location=SCHEME://BUCKET/PREFIX/ \
#     --microvm-asset-location=SCHEME://BUCKET/ASSET_PREFIX
#
# docs/reference/object-store-plugin-sidecar.md describes what the sidecars
# must keep. cmd/ate-setup's render tests compose this component, so a change
# to that contract fails them.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: node-sidecar.yaml
    target:
      group: apps
      version: v1
      kind: DaemonSet
      name: atelet
      namespace: ate-system
  - path: control-sidecar.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: ate-api-server
      namespace: ate-system
