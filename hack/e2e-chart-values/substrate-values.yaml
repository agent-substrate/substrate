# substrate values for the e2e suites in internal/e2e. Apply them after the
# values of the kind or kind-agentgateway scenario in charts/scenarios, as
# hack/install-charts-kind.sh does with VALUES_OVERLAY.

# The e2e suites reach actors through the router as this client.
atenetRouter:
  ingressAllowedSPIFFEIDs:
  - spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client

# TestActorEgressMultiplexing reads the debug log of the agentgateway egress
# gateway. The envoy data plane does not use this value.
atenetEgress:
  agentgateway:
    logLevel: debug
