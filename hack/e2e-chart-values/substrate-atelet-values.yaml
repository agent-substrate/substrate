# substrate-atelet values for the e2e suites in internal/e2e. Apply them after
# the values of the kind or kind-agentgateway scenario in charts/scenarios, as
# hack/install-charts-kind.sh does with VALUES_OVERLAY.

atelet:
  # Helm replaces lists, so these repeat the extraArgs of the kind scenarios.
  extraArgs:
  - --localhost-registry-replacement=kind-registry:5000
  - --log-level=debug
  # Upload asynchronous snapshots 2s after a suspend and detach suspended
  # actors 30s after it, so the e2e suites see both within a run.
  - --snapshot-upload-delay=2s
  - --snapshot-detach-delay=30s
