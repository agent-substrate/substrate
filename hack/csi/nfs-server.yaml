# The NFS server backing the csi-nfs-sc StorageClass on Kind. Development only.
---
kind: Service
apiVersion: v1
metadata:
  name: nfs-server
  namespace: default
  labels:
    app: nfs-server
spec:
  type: ClusterIP
  selector:
    app: nfs-server
  ports:
    - name: tcp-2049
      port: 2049
      protocol: TCP
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nfs-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      name: nfs-server
      labels:
        app: nfs-server
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
        - name: nfs-server
          image: registry.k8s.io/e2e-test-images/volume/nfs:1.6.0@sha256:fd050af01687ef04d87bcef58b9e27f8e74cde52293113cfb35e63a0253e29c2
          args:
            - /exports
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /exports
              name: nfs-vol
          ports:
            - name: tcp-2049
              containerPort: 2049
              protocol: TCP
      volumes:
        # Use emptyDir for demos/testing, which do need to be persisted.
        - name: nfs-vol
          emptyDir: {}
