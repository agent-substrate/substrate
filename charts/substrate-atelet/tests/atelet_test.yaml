suite: atelet
templates:
- atelet.yaml
release:
  name: custom-atelet
  namespace: custom-system
set:
  substrateReleaseName: custom
tests:
- it: lets atelet watch the configs and pools of its workers
  template: atelet.yaml
  documentSelector:
    path: kind
    value: ClusterRole
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ate.dev]
        resources: [sandboxconfigs]
        verbs: [get, list, watch]
  - contains:
      path: rules
      content:
        apiGroups: [ate.dev]
        resources: [workerpools]
        verbs: [get, list, watch]
  - contains:
      path: rules
      content:
        apiGroups: [events.k8s.io]
        resources: [events]
        verbs: [create, patch]
- it: probes atelet health without exposing host ports
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: grpc
        containerPort: 21998
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: prometheus
        containerPort: 9090
        protocol: TCP
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: health
        containerPort: 9091
        protocol: TCP
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.port
      value: health
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.port
      value: health
  - notExists:
      path: spec.template.spec.containers[0].ports[0].hostPort
  - contains:
      path: spec.template.spec.containers[0].args
      content: --herder-allowed-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-ate-api-server
  - contains:
      path: spec.template.spec.tolerations
      content:
        key: cloud.google.com/compute-class
        operator: Exists
        effect: NoSchedule
- it: schedules atelet on every node by default
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notExists:
      path: spec.template.spec.nodeSelector
- it: keeps atelet running under node pressure
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.spec.priorityClassName
      value: system-cluster-critical
- it: admits critical atelet pods in the release namespace
  template: atelet.yaml
  documentSelector:
    path: kind
    value: ResourceQuota
  asserts:
  - equal:
      path: metadata.namespace
      value: custom-system
  - equal:
      path: metadata.name
      value: custom-atelet-critical-pods
  - equal:
      path: spec
      value:
        hard:
          pods: 1G
        scopeSelector:
          matchExpressions:
          - scopeName: PriorityClass
            operator: In
            values: [system-node-critical, system-cluster-critical]
- it: restricts atelet to nodes matching atelet.nodeSelector
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      nodeSelector:
        pool: agents
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value:
        pool: agents
- it: lets atelet preserve image ownership and permissions
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.spec.containers[0].securityContext
      value:
        allowPrivilegeEscalation: false
        runAsUser: 0
        runAsGroup: 0
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID]
- it: passes the object store settings to the plugin
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    objectStorePlugin.credentialsSecret: store-credentials
    objectStorePlugin.extraEnv:
    - name: ATE_STORAGE_BACKEND
      value: s3
  asserts:
  - contains:
      path: spec.template.spec.initContainers[0].env
      content:
        name: ATE_STORAGE_BACKEND
        value: s3
  - equal:
      path: spec.template.spec.initContainers[0].envFrom
      value:
      - secretRef:
          name: store-credentials
- it: annotates the ServiceAccount for workload identity
  template: atelet.yaml
  documentSelector:
    path: kind
    value: ServiceAccount
  set:
    atelet.serviceAccount.annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/atelet
  asserts:
  - equal:
      path: metadata.annotations
      value:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/atelet
- it: runs another object-store plugin
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    objectStorePlugin.image: example.com/azure-blob-plugin:v1
    objectStorePlugin.node.args:
    - --socket=/run/objectstore-plugin/node.sock
    objectStorePlugin.node.startupProbe:
      exec:
        command: [/plugin, healthcheck]
    objectStorePlugin.extraVolumes:
    - name: plugin-config
      configMap:
        name: plugin-config
    objectStorePlugin.extraVolumeMounts:
    - name: plugin-config
      mountPath: /etc/plugin
    atelet.podLabels:
      azure.workload.identity/use: "true"
  asserts:
  - equal:
      path: spec.template.spec.initContainers[0].image
      value: example.com/azure-blob-plugin:v1
  - equal:
      path: spec.template.spec.initContainers[0].args
      value:
      - --socket=/run/objectstore-plugin/node.sock
  - equal:
      path: spec.template.spec.initContainers[0].startupProbe
      value:
        exec:
          command: [/plugin, healthcheck]
  - contains:
      path: spec.template.spec.initContainers[0].volumeMounts
      content:
        name: plugin-config
        mountPath: /etc/plugin
  - contains:
      path: spec.template.spec.volumes
      content:
        name: plugin-config
        configMap:
          name: plugin-config
  - equal:
      path: spec.template.metadata.labels
      value:
        app: atelet
        azure.workload.identity/use: "true"
