suite: PostgreSQL configuration
templates:
- ate-api-server-envvars.yaml
- ate-api-server.yaml
tests:
- it: uses the managed schema by default
  template: ate-api-server-envvars.yaml
  asserts:
  - equal:
      path: data.ATE_API_POSTGRES_SCHEMA
      value: substrate

- it: reads separate owner and read-write connections from Secrets
  template: ate-api-server.yaml
  documentIndex: 3
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-read-write-connection-string=@env
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-owner-connection-string=@env
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-read-write-role=substrate_readwrite
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-owner-role=substrate_owner
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING")].valueFrom.secretKeyRef.name
      value: substrate-postgres-readwrite
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING")].valueFrom.secretKeyRef.key
      value: readWriteConnectionString
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_OWNER_CONNECTION_STRING")].valueFrom.secretKeyRef.name
      value: substrate-postgres-owner
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_OWNER_CONNECTION_STRING")].valueFrom.secretKeyRef.key
      value: ownerConnectionString

- it: supports prepared database identities
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      readWriteConnectionStringSecretRef:
        name: tenant-readwrite
        key: connectionString
      ownerConnectionStringSecretRef:
        name: tenant-owner
        key: connectionString
      readWriteRole: tenant_readwrite
      ownerRole: tenant_owner
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-read-write-role=tenant_readwrite
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-owner-role=tenant_owner
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING")].valueFrom.secretKeyRef.name
      value: tenant-readwrite
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING")].valueFrom.secretKeyRef.key
      value: connectionString
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_OWNER_CONNECTION_STRING")].valueFrom.secretKeyRef.name
      value: tenant-owner
  - equal:
      path: spec.template.spec.containers[0].env[?(@.name == "ATE_API_POSTGRES_OWNER_CONNECTION_STRING")].valueFrom.secretKeyRef.key
      value: connectionString

- it: requires a read-write Secret
  template: ate-api-server.yaml
  set:
    postgres.readWriteConnectionStringSecretRef.name: ""
  asserts:
  - failedTemplate:
      errorMessage: postgres.readWriteConnectionStringSecretRef.name is required

- it: requires an owner Secret
  template: ate-api-server.yaml
  set:
    postgres.ownerConnectionStringSecretRef.name: ""
  asserts:
  - failedTemplate:
      errorMessage: postgres.ownerConnectionStringSecretRef.name is required
