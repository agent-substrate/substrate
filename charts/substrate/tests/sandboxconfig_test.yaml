suite: SandboxConfigs
templates:
- sandboxconfig-gvisor.yaml
- sandboxconfig-microvm.yaml
tests:
- it: installs only the gVisor SandboxConfig by default
  asserts:
  - hasDocuments:
      count: 1
    template: sandboxconfig-gvisor.yaml
  - hasDocuments:
      count: 0
    template: sandboxconfig-microvm.yaml
- it: leaves out the gVisor SandboxConfig when it is off
  template: sandboxconfig-gvisor.yaml
  set:
    sandboxConfigs.gvisor.enabled: false
  asserts:
  - hasDocuments:
      count: 0
- it: points the microVM assets at the asset bucket
  template: sandboxconfig-microvm.yaml
  set:
    sandboxConfigs.microvm.enabled: true
    sandboxConfigs.microvm.assetBucket: gs://example-assets
  asserts:
  - equal:
      path: metadata.name
      value: microvm
  - equal:
      path: spec.sandboxClass
      value: microvm
  - matchRegex:
      path: spec.versions[0].assets.amd64.cloud-hypervisor.url
      pattern: ^gs://example-assets/microvm-assets/amd64/[0-9a-f]{64}$
  - equal:
      path: metadata.annotations["sandboxconfig.ate.dev/is-class-default"]
      value: "true"
- it: requires the asset bucket for microVM
  template: sandboxconfig-microvm.yaml
  set:
    sandboxConfigs.microvm.enabled: true
    sandboxConfigs.microvm.assetBucket: example-assets
  asserts:
  - failedTemplate:
      errorMessage: sandboxConfigs.microvm.assetBucket must be s3://<bucket> or gs://<bucket> when sandboxConfigs.microvm.enabled
