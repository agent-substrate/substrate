suite: Preview gates
templates:
- ate-api-server.yaml
- ate-api-server-envvars.yaml
- ate-controller.yaml
- ate-idp-server.yaml
- atenet-egress-envoy.yaml
- atenet-router-envoy.yaml
- k8s-credential-provider.yaml
set:
  atenetDataPlane: envoy
  ateApi.snapshotLocation: gs://snapshots/
  preview: [IngressCache, ExternalVolumes]
tests:
- it: passes the preview gates to the substrate containers
  templates:
  - ate-api-server.yaml
  - ate-controller.yaml
  - ate-idp-server.yaml
  - atenet-router-envoy.yaml
  - k8s-credential-provider.yaml
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --preview=IngressCache,ExternalVolumes
- it: passes the preview gates to the object-store plugin
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.initContainers[0].args
      content: --preview=IngressCache,ExternalVolumes
- it: passes the preview gates to the egress gateway's substrate containers
  template: atenet-egress-envoy.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.initContainers[0].args
      content: --preview=IngressCache,ExternalVolumes
  - contains:
      path: spec.template.spec.containers[1].args
      content: --preview=IngressCache,ExternalVolumes
