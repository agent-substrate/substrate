# Default values for the substrate chart.
#
# The chart requires ClusterTrustBundle, ClusterTrustBundleProjection,
# PodCertificateRequest, and the certificates.k8s.io/v1beta1 API.

# Set to true to have the chart create the release namespace.
# Off by default — most helm workflows expect the namespace to already exist
# (helm install -n <ns> --create-namespace). Enable for the generated
# manifests/ate-install/ install path (kubectl apply).
createNamespace: false

# Preview gates for the API server, controller (including its workers), and atelet.
# ExternalVolumes is required for external volume APIs and mounts.
preview: []

postgres:
  # Project database login certificates only when the connection strings use them.
  clientCertificates:
    enabled: false
  # Read the read/write connection string from a pre-created Secret.
  readWriteConnectionStringSecretRef:
    name: substrate-postgres-readwrite
    key: readWriteConnectionString
  # Read the owner connection string from a pre-created Secret.
  ownerConnectionStringSecretRef:
    name: substrate-postgres-owner
    key: ownerConnectionString
  # Roles assumed on each connection. Use distinct roles for installs sharing a database.
  readWriteRole: substrate_readwrite
  ownerRole: substrate_owner
  schema: substrate

rustfs:
  enabled: true
  storageSize: 1Gi
  bucket: ate-snapshots
  accessKey: rustfsadmin
  secretKey: rustfsadmin
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # The Job that creates the snapshot bucket.
  bucketInit:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# atelet daemonset overrides. Defaults use the in-cluster RustFS deployment for
# snapshots. Set rustfs.enabled=false and override these fields when using
# external storage.
# extraArgs / extraEnv are appended verbatim for installer-specific knobs
# (e.g. registry replacement for kind).
atelet:
  # Set to false to install atelet with the substrate-atelet chart instead, so
  # it upgrades separately. See charts/substrate-atelet/README.md.
  enabled: true
  # Host paths for the node's kubelet credential provider. Set both to enable
  # private registry authentication (GKE: /etc/srv/kubernetes/cri_auth_config.yaml
  # and /home/kubernetes/bin). Leave empty on nodes without a provider, like Kind.
  imageCredentialProviderConfig: ""
  # The config itself, rendered into a ConfigMap, for nodes whose image owns
  # the kubelet's copy (EKS) and for a provider environment that has to differ
  # from the kubelet's. Set this or imageCredentialProviderConfig, not both;
  # either one still needs the bin directory.
  imageCredentialProviderConfigYAML: ""
  imageCredentialProviderBinDir: ""
  storageBackend: s3
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

# Object storage credentials/settings for snapshot transfers and private sandbox assets.
objectStorePlugin:
  # Required for GCS: the Google service account the exchange impersonates
  # for actor-scoped snapshot transfers. Unused by S3/RustFS.
  transferServiceAccount: ""
  extraEnv: []
  control:
    resources: {}
  node:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# Additional arguments appended to the ateapi defaults.
ateApi:
  # Cluster-wide snapshot URI. Empty uses gs://<rustfs.bucket>/ when RustFS is
  # enabled (the S3 backend also uses gs:// URIs). Required for external storage
  # unless the PerTemplateSnapshotLocation preview gate is enabled.
  snapshotLocation: ""
  logLevel: info
  authorization:
    # Empty defaults to the release's shared ate-client principal. Use explicit
    # operator principals for shared installs; see docs/guides/authorization.md.
    bootstrapOwners: []
  # Defaults to the in-cluster IdP URL; set a stable issuer for external consumers.
  actorJWTIssuer: ""
  extraArgs: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

ateIdpServer:
  resources: {}

ateController:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

atenetRouter:
  # mTLS client identities allowed to reach actors. Empty denies all ingress.
  ingressAllowedSPIFFEIDs: []
  agentgateway:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 1Gi

atenetEgress:
  agentgateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 1Gi

# Kubernetes Secret provider and AGW HTTP/HTTPS credential injection.
# Includes get-only Secret RBAC. HTTPS requires egress-mitm-ca-pool and actor trust.
credentialProvider:
  namespacePolicies: []
  # - atespace: team-a
  #   allowedNamespaces: [team-a-secrets]
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Name of a ConfigMap in the release namespace that supplies per-environment
# overrides for ate-api-server (ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING, ...).
# Mounted via envFrom with optional=true. Created by the chart from these values.
ateApiServerEnvVarsConfigMap: ate-api-server-envvars

# OTLP export, following the OpenTelemetry SDK environment variable spec.
# endpoint applies to every signal; a signal's own endpoint overrides it.
# A signal exports only when it is enabled and resolves to an endpoint.
#
# metrics.enabled disables OTLP metrics push from the Go components and router.
# traces.enabled takes effect on the router; Go components do not read it yet.
# logs.enabled gates OTLP actor events from ateapi and the ateworkers, plus the
# router's access log. Actor events go to stdout when OTLP logs are disabled
# or no endpoint resolves.
otel:
  endpoint: ""
  traces:
    enabled: true
    endpoint: ""
    samplingRatio: 0.01
  metrics:
    enabled: true
    endpoint: ""
  logs:
    enabled: true
    endpoint: ""

# Values under `global` are visible to this chart and to every subchart. A parent
# chart or an operator sets one value here instead of one value per chart.
global:
  # -- Mirror registry that overrides where every image is pulled from. This is
  # the air-gap knob. It wins over image.registry for component images. Each
  # `images.*` reference has its registry segment replaced. Repository paths are
  # preserved, so a mirror only has to copy images under their existing paths.
  # For control without the override, leave this unset and set image.registry.
  imageRegistry: ""
  # -- Pull secrets merged (union) into each pod's own imagePullSecrets list.
  imagePullSecrets: []
  # -- Fallback imagePullPolicy where a container does not set one.
  imagePullPolicy: ""

# Pull secrets for every pod this chart renders. Merged with global.imagePullSecrets.
imagePullSecrets: []

image:
  # Registry host for the component images, and nothing else. To change
  # environments, change only this value or global.imageRegistry, which overrides
  # it. A path inside `registry` fails the render, and the error names this
  # split.
  registry: ghcr.io
  # Image path prefix under the registry, ahead of each component name. The path
  # is identical on every registry that serves the images. A mirror copies the
  # images under this same path.
  repository: kagent-dev/substrate
  tag: ""

images:
  rustfs: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
  awsCli: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
  agentgateway: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
  busybox: busybox:1.36
