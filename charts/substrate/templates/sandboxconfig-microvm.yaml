{{- if .Values.sandboxConfigs.microvm.enabled }}
{{- $bucket := .Values.sandboxConfigs.microvm.assetBucket }}
{{- if not (regexMatch "^(s3|gs)://[^/]+$" $bucket) }}
{{- fail "sandboxConfigs.microvm.assetBucket must be s3://<bucket> or gs://<bucket> when sandboxConfigs.microvm.enabled" }}
{{- end }}
{{- $url := splitList "://" $bucket }}
{{- /* files/sandboxconfig-microvm.yaml.tmpl is manifests/ate-install/sandboxconfig-microvm.yaml.tmpl, copied by hack/update/chart-files.sh. */}}
{{ .Files.Get "files/sandboxconfig-microvm.yaml.tmpl" | replace "${BUCKET_SCHEME}" (index $url 0) | replace "${ASSET_BUCKET_NAME}" (index $url 1) }}
{{- end }}
