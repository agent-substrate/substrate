{{- if eq .Values.atenetDataPlane "envoy" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
  namespace: {{ .Release.Namespace }}
# files/atenet-egress-envoy-config.yaml is generated from
# manifests/ate-install/atenet-egress.yaml by hack/update/chart-files.sh.
data:
{{ .Files.Get "files/atenet-egress-envoy-config.yaml" | indent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-egress
  template:
    metadata:
      labels:
        app: atenet-egress
      annotations:
        checksum/envoy-config: {{ .Files.Get "files/atenet-egress-envoy-config.yaml" | sha256sum }}
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "atenet-egress" .) }}
      {{- with include "substrate.imagePullSecrets" . }}{{- . | nindent 6 }}{{- end }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        # Lets the non-root Envoy listen on 443.
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      terminationGracePeriodSeconds: 60
      initContainers:
      # Mints the certificates for HTTPS interception from the egress MITM CA
      # and serves them to Envoy over SDS. A native sidecar, so it starts first.
      - name: sdsmint
        image: {{ include "substrate.componentImage" (list "atenet" .) }}
        restartPolicy: Always
        args:
        - "sdsmint"
        - {{ printf "--preview=%s" (join "," .Values.preview) | quote }}
        - "--uds-path=/var/run/sdsmint/sdsmint.sock"
        - "--ca-pool-path=/run/ca-state/mitm-pool.json"
        - "--leaf-cert-ttl=15m"
        - "--log-level=info"
        env:
        - name: GOMEMLIMIT
          value: "640MiB"
        resources:
{{ toYaml .Values.atenetEgress.sdsmint.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: sdsmint-sock
          mountPath: /var/run/sdsmint
        - name: ca-state
          mountPath: /run/ca-state
          readOnly: true
      containers:
      - name: envoy
        image: {{ include "substrate.componentImage" (list "envoy-dataplane" .) }}
        resources:
{{ toYaml .Values.atenetEgress.envoy.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --service-node
        - atenet-egress
        - --service-cluster
        - atenet-egress
        # Keeps Envoy serving until ext-proc finishes its drain sequence.
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done"]
        ports:
        - name: https
          containerPort: 443
        - name: envoy-metrics
          containerPort: 15090
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 10
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 1
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: actor-id-ca-certs
          mountPath: /run/actor-id-ca-certs
          readOnly: true
        - name: drain-signal
          mountPath: /var/run/atenet
          readOnly: true
        - name: sdsmint-sock
          mountPath: /var/run/sdsmint
      - name: ext-proc
        image: {{ include "substrate.componentImage" (list "atenet" .) }}
        resources:
{{ toYaml .Values.atenetEgress.extProc.resources | indent 10 }}
        args:
        - router
        - --mode=egress
        - {{ printf "--preview=%s" (join "," .Values.preview) | quote }}
        - "--namespace={{ .Release.Namespace }}"
        - --port-extproc=50051
        - --extproc-address=127.0.0.1
        - "--ateapi-address=dns:///{{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443"
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --actor-identity-ca-file=/run/actor-id-ca-certs/ca.crt
        - --otlp-collector-address=
        - --envoy-admin-address=127.0.0.1:15000
        {{- $providers := include "substrate.credentialProviderList" . | fromJsonArray }}
        {{- range $providers }}
        - {{ printf "--credential-provider-name=%s" .name | quote }}
        - {{ printf "--credential-provider-address=%s" .address | quote }}
        - {{ printf "--credential-provider-server-name=%s" (regexReplaceAll ":[0-9]+$" .address "") | quote }}
        {{- end }}
        {{- if $providers }}
        - --credential-provider-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --credential-provider-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        {{- include "substrate.otel.resourceEnv" . | nindent 8 }}
{{- with include "substrate.otel.env" . }}
{{- . | trim | nindent 8 }}
{{- end }}
        ports:
        - name: extproc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: actor-id-ca-certs
          mountPath: /run/actor-id-ca-certs
          readOnly: true
        - name: drain-signal
          mountPath: /var/run/atenet
      volumes:
      - name: config
        configMap:
          name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
      - name: drain-signal
        emptyDir: {}
      - name: sdsmint-sock
        emptyDir: {}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: actor-id-ca-certs
        secret:
          secretName: actor-id-ca-certs
      - name: ca-state
        projected:
          sources:
          - secret:
              name: egress-mitm-ca-pool
              items:
              - key: pool
                path: mitm-pool.json
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-egress
  ports:
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
{{- end }}
