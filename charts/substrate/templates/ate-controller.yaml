apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    apps: ate-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
subjects:
- kind: ServiceAccount
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  apiGroup: rbac.authorization.k8s.io
---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: ate-controller
spec:
  selector:
    app: ate-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "ate-controller" .) }}
      containers:
      - name: ate-controller
        image: {{ include "substrate.componentImage" (list "atecontroller" .) }}
        args:
        # The atecontroller binary defaults --ateapi-conn-spec to
        # dns:///api.ate-system.svc:443, which is correct only for the
        # canonical render (release name "substrate" in namespace
        # "ate-system"). Pass the chart-resolved Service so the controller
        # dials the right backend when substrate is installed as a subchart.
        - "--ateapi-conn-spec=dns:///{{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443"
        - "--ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
{{- if .Values.otel.endpoint }}
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
{{- end }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - { name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true }
        - { name: podidentity,   mountPath: /run/podidentity.podcert.ate.dev, readOnly: true }
      volumes:
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
