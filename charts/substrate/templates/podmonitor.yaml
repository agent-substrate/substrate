{{/*
One PodMonitor per component that serves /metrics: ate-api-server, atelet and
the atenet router each start the metrics server (serverboot's
StartMetricsServer) on the port their pod names below, and carry the
prometheus.io/* annotations already.

Those annotations are read only by a Prometheus configured for pod-annotation
discovery. A Prometheus Operator installation discovers PodMonitors instead and
ignores the annotations, so without these objects the metrics are served and
never collected.

The port NAME differs per component — ate-api-server and atelet name theirs
`prometheus`, the router names its `metrics` — so each entry carries its own.
A PodMonitor addresses a named container port, so one name for all three would
match two pods and silently miss the third.

One object per component rather than one selecting all three: a component's
interval and relabelings are its own, and the atelet is a DaemonSet whose
series are per node.
*/}}
{{- if .Values.metrics.podMonitor.enabled }}
{{- $components := list
  (dict "app" "ate-api-server" "port" "prometheus")
  (dict "app" "atelet" "port" "prometheus")
  (dict "app" "atenet-router" "port" "metrics")
}}
{{- range $components }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "substrate.fullname" (list .app $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ .app }}
    {{- with $.Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ .app }}
  namespaceSelector:
    matchNames:
    - {{ $.Release.Namespace }}
  podMetricsEndpoints:
  - port: {{ .port }}
    path: /metrics
    {{- with $.Values.metrics.podMonitor.interval }}
    interval: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
