{{- if .Values.credentialProvider.enabled }}

# The credential provider: a gRPC service that resolves ate-secret:// URIs
# of the k8s.io class to Kubernetes Secret values. It is the ONLY
# component in the egress credential-injection path with Kubernetes access; the
# egress gateway and the injector never read Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  namespace: {{ .Release.Namespace }}
---
# The provider checks the actor's atespace-to-namespace grant before reading.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "substrate.fullname" (list "k8s-credential-provider-secret-reader" .) }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "substrate.fullname" (list "k8s-credential-provider-secret-reader" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "substrate.fullname" (list "k8s-credential-provider-secret-reader" .) }}
subjects:
- kind: ServiceAccount
  name: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  template:
    metadata:
      annotations:
        checksum/namespace-policy: {{ toJson .Values.credentialProvider.namespacePolicies | sha256sum }}
      labels:
        app: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
      {{- with include "substrate.imagePullSecrets" . }}{{- . | nindent 6 }}{{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
      - name: k8s-credential-provider
        image: {{ include "substrate.componentImage" (list "kubernetes-secrets" .) }}
        resources:
{{ toYaml .Values.credentialProvider.resources | indent 10 }}
        imagePullPolicy: {{ include "substrate.imagePullPolicy" . }}
        args:
        - "--listen-address=:50051"
        - "--metrics-address=:9090"
        - "--health-address=:9091"
        # The /statusz page binds 127.0.0.1 for port-forward access.
        - "--status-address=127.0.0.1:4040"
        # Use this Service's DNS certificate; only the egress injector may call.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        # Enforce the atespace→namespace authorization policy (default-deny).
        - "--namespace-policy-file=/etc/k8s-credential-provider/namespace-policy.yaml"
        - "--injector-identity=spiffe://cluster.local/ns/{{ .Release.Namespace }}/sa/{{ include "substrate.fullname" (list "atenet-egress" .) }}"
        - "--log-level=info"
        env:
        {{- include "substrate.otel.resourceEnv" . | nindent 8 }}
{{- with include "substrate.otel.env" . }}
{{- . | trim | nindent 8 }}
{{- end }}
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: namespace-policy
          mountPath: /etc/k8s-credential-provider
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: namespace-policy
        configMap:
          name: {{ include "substrate.fullname" (list "k8s-credential-provider-namespace-policy" .) }}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substrate.fullname" (list "k8s-credential-provider-namespace-policy" .) }}
  namespace: {{ .Release.Namespace }}
data:
  namespace-policy.yaml: |
    policies: {{ toJson .Values.credentialProvider.namespacePolicies }}
---
# Only the egress gateway may reach the provider's gRPC port; every other
# connection to the provider pods is dropped. The provider also pins the
# client certificate to the gateway's identity (see the Deployment), so this
# keeps other pods from reaching it at all. Takes effect only on a cluster
# whose network plugin enforces NetworkPolicy, such as GKE Dataplane V2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ include "substrate.fullname" (list "atenet-egress" .) }}
    ports:
    - protocol: TCP
      port: 50051
{{- end }}
