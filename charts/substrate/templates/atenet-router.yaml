apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-router
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router-agentgateway-config" .) }}
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      statsAddr: 0.0.0.0:15020
      # Actor sandboxes behind a worker IP are replaced between requests. Do
      # not retain an idle connection that may belong to the previous actor.
      backend:
        poolMaxSize: 0
        # Actor CONNECT authorities resolve through the worker atunnel.
        allowDynamicLoopback: true

{{- $traces := include "substrate.otel.signalEndpoint" (list "traces" .) }}
{{- $logs := include "substrate.otel.signalEndpoint" (list "logs" .) }}
    frontendPolicies:
      networkAuthorization:
        rules:
        - allow: >-
            source.spiffeId in {{ .Values.atenetRouter.ingressAllowedSPIFFEIDs | toJson }}
{{- if $traces }}
      tracing:
        host: $AGENTGATEWAY_OTLP_TRACES_ADDRESS
        protocol: grpc
        randomSampling: {{ .Values.otel.traces.samplingRatio }}
{{- end }}
{{- if $logs }}
      # Unsampled per-request access log. It carries the ate.* actor
      # attribution, which the sampled traces cannot be aggregated on.
      # `fields` stays unset so the OTLP sink inherits the full field set.
      accessLog:
        otlp:
          host: $AGENTGATEWAY_OTLP_LOGS_ADDRESS
          protocol: grpc
{{- end }}

    backends:
    - name: dynamic
      dynamic: {}
      policies:
        http:
          version: HTTP/1.1
        backendTunnel:
          proxy:
            backend: /dynamic
          mode: connect
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
              insecureHost: true

    gateways:
      https:
        port: 8443
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/podidentity.podcert.ate.dev/trust-bundle.pem

    routes:
    - name: substrate-actors
      gateways:
      - https
      matches:
      - path:
          pathPrefix: /
      policies: &substrate-ingress
        # Reject duplicates in both CONNECT and inner request headers, even
        # when actor selection uses only one of those header maps.
        directResponse:
          conditional:
          - condition: >-
              ('ate-target-actor' in source.connectHeaders &&
               size(source.connectHeaders.raw()['ate-target-actor']) != 1) ||
              ('ate-target-actor' in request.headers &&
               size(request.headers.raw()['ate-target-actor']) != 1)
            status: 404
            body: Invalid ate-target-actor header
        substrateIngress:
          host: {{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443
          requestParking:
            budget: {{ .Values.atenetRouter.requestParking.budget | quote }}
          # AgentGateway only uses atunnel's CONNECT listener.
          connectTargetPort: 8443
          policies:
            http:
              requestTimeout: {{ .Values.atenetRouter.requestTimeout | quote }}
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/servicedns-ca/trust-bundle.pem
      backends:
      - backend: /dynamic
    - name: substrate-actors-grpc
      gateways:
      - https
      matches: &grpc-matches
      - method: POST
        headers:
        - name: content-type
          value:
            regex: '(?i)^application/grpc([+;].*)?$'
      policies: *substrate-ingress
      backends: &grpc-backends
      - backend: /dynamic
        policies:
          http:
            version: HTTP/2.0

    # Terminate client CONNECT before internal HTTP routing.
    binds:
    - port: 8444
      tunnelProtocol: connect
      listeners:
      - protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
        routes: []
    - mode: internal
      listeners:
      - protocol: HTTP
        routes:
        - name: substrate-actors-tunneled
          matches:
          - path:
              pathPrefix: /
          policies: *substrate-ingress
          backends:
          - backend: /dynamic
        - name: substrate-actors-tunneled-grpc
          matches: *grpc-matches
          policies: *substrate-ingress
          backends: *grpc-backends
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "atenet-router" .) }}
      {{- with include "substrate.imagePullSecrets" . }}{{- . | nindent 6 }}{{- end }}
      containers:
      - name: agentgateway
        image: {{ include "substrate.thirdPartyImage" (list .Values.images.agentgateway .) }}
        resources:
{{ toYaml .Values.atenetRouter.agentgateway.resources | indent 10 }}
        args:
        - "-f"
        - "/etc/agentgateway/config.yaml"
{{- $traces := include "substrate.otel.signalEndpoint" (list "traces" .) }}
{{- $logs := include "substrate.otel.signalEndpoint" (list "logs" .) }}
{{- if or $traces $logs }}
        # agentgateway takes host:port, not a URL, so the scheme is trimmed.
        env:
{{- if $traces }}
        - name: AGENTGATEWAY_OTLP_TRACES_ADDRESS
          value: {{ trimPrefix "http://" $traces | quote }}
{{- end }}
{{- if $logs }}
        - name: AGENTGATEWAY_OTLP_LOGS_ADDRESS
          value: {{ trimPrefix "http://" $logs | quote }}
{{- end }}
{{- end }}
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: connect
          containerPort: 8081
        - name: connect-tls
          containerPort: 8444
        - name: readiness
          containerPort: 15021
        - name: gw-metrics
          containerPort: 15020
        volumeMounts:
        - name: agentgateway-config
          mountPath: /etc/agentgateway
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: servicedns-ca
          mountPath: /run/servicedns-ca
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: readiness
          periodSeconds: 10
      volumes:
      - name: agentgateway-config
        configMap:
          name: {{ include "substrate.fullname" (list "atenet-router-agentgateway-config" .) }}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
              certificateChainPath: cert.pem
              keyPath: key.pem
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
              certificateChainPath: cert.pem
              keyPath: key.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-router
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: connect
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: connect-tls
    port: 8444
    targetPort: 8444
    protocol: TCP
  - name: stats
    port: 15020
    targetPort: gw-metrics
    protocol: TCP
