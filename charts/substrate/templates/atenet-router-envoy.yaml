{{- if eq .Values.atenetDataPlane "envoy" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router-endpointslices" .) }}
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router-endpointslices" .) }}
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "substrate.fullname" (list "atenet-router-endpointslices" .) }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router-envoy-config" .) }}
  namespace: {{ .Release.Namespace }}
# files/atenet-router-envoy-config.yaml is generated from
# manifests/ate-install/atenet-router.yaml by hack/update/chart-envoy-config.sh.
data:
{{ .Files.Get "files/atenet-router-envoy-config.yaml" | indent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        checksum/envoy-config: {{ .Files.Get "files/atenet-router-envoy-config.yaml" | sha256sum }}
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "atenet-router" .) }}
      {{- with include "substrate.imagePullSecrets" . }}{{- . | nindent 6 }}{{- end }}
      # Covers --drain-delay (13s), the Envoy drain window (~15s), the derived
      # --drain-timeout (~20s at defaults), and slack for the forced stop and
      # the telemetry flush.
      terminationGracePeriodSeconds: 60
      containers:
      - name: atenet-router
        image: {{ include "substrate.componentImage" (list "atenet" .) }}
        resources:
{{ toYaml .Values.atenetRouter.router.resources | indent 10 }}
        args:
        - "router"
        - "--mode=ingress"
        - "--namespace={{ .Release.Namespace }}"
        - "--port-xds=18000"
        - "--port-extproc=50051"
        - "--extproc-address=127.0.0.1"
        - "--status-port=4040"
        - "--port-https=8443"
        - "--envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--port-connect-tls=8444"
        - "--ingress-client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        {{- with .Values.atenetRouter.ingressAllowedSPIFFEIDs }}
        - {{ printf "--ingress-allowed-spiffe-ids=%s" (join "," .) | quote }}
        {{- end }}
        - "--ateapi-address=k8s:///{{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443"
        - "--ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        # Envoy reports spans to the traces endpoint. Empty disables Envoy-side
        # tracing and leaves the router's own spans to the OTEL_* settings.
        - {{ printf "--otlp-collector-address=%s" (include "substrate.otel.signalEndpoint" (list "traces" .)) | quote }}
        - "--drain-delay=13s"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        env:
        {{- include "substrate.otel.resourceEnv" . | nindent 8 }}
{{- with include "substrate.otel.env" . }}
{{- . | trim | nindent 8 }}
{{- end }}
        ports:
        - name: extproc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "servicedns-ca"
          mountPath: "/run/servicedns-ca"
        # The router writes the drain-complete marker here at the end of its
        # shutdown sequence, which releases Envoy's preStop hook.
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
      - name: envoy
        image: {{ include "substrate.componentImage" (list "envoy-dataplane" .) }}
        resources:
{{ toYaml .Values.atenetRouter.envoy.resources | indent 10 }}
        command:
        - "/usr/local/bin/envoy"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        # The Envoy image sets no USER, so runAsNonRoot needs a numeric UID.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
        # Keeps Envoy serving until atenet-router finishes its drain sequence.
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done"]
        ports:
        - name: https
          containerPort: 8443
        - name: connect-tls
          containerPort: 8444
        - name: envoy-metrics
          containerPort: 9902
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 2
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "drain-signal"
          mountPath: "/var/run/atenet"
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: {{ include "substrate.fullname" (list "atenet-router-envoy-config" .) }}
      - name: "drain-signal"
        emptyDir: {}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "servicedns-ca"
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-router
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: connect-tls
    port: 8444
    targetPort: 8444
    protocol: TCP
{{- end }}
