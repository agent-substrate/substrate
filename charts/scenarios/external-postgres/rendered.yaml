# Source: substrate/templates/ate-system-networkpolicies.yaml
# The Substrate API. Admits control plane components and pods in namespaces
# labeled ate.dev/api-access=true (e.g. benchmarks, dashboards). Worker pods
# (ate.dev/worker-pool) are excluded. Requests are still authenticated and
# authorized by ate-api-server; this restricts network-level ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: ate-api-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ate-controller
          - atelet
          - atenet-egress
          - atenet-router
    - namespaceSelector:
        matchLabels:
          ate.dev/api-access: "true"
      podSelector:
        matchExpressions:
        - key: ate.dev/worker-pool
          operator: DoesNotExist
    ports:
    - protocol: TCP
      port: 443
  - from:
    - podSelector:
        matchLabels:
          app: atelet
    ports:
    - protocol: TCP
      port: exchange

