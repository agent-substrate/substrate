      labels:
        app: ate-idp-server
    spec:
      serviceAccountName: ate-idp-server
      automountServiceAccountToken: false
      containers:
      - name: ate-idp-server
        image: ghcr.io/agent-substrate/substrate/ate-idp-server:0.1.0
        resources:
          {}
        args:
        - "--preview="
        - "--issuer=https://idp.ate-system.svc"
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        ports:
        - name: https
          containerPort: 8443
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # The serving certificate, with a DNS SAN for each Service that
        # selects the pod.
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
        - name: actor-id-jwt-pool
          mountPath: /run/actor-id-jwt-pool
      volumes:
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # The pool ate-api-server signs with.
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              name: actor-id-jwt-pool
              items:
              - key: pool
                path: pool.json

