apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-credential-provider
  namespace: ate-system
  labels:
    app: k8s-credential-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-credential-provider
  template:
    metadata:
      annotations:
        checksum/namespace-policy: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
      labels:
        app: k8s-credential-provider
    spec:
      serviceAccountName: k8s-credential-provider
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: k8s-credential-provider
        image: ghcr.io/agent-substrate/substrate/kubernetes-secrets:0.1.0
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        imagePullPolicy: IfNotPresent
        args:
        - "--preview="
        - "--listen-address=:50051"
        - "--metrics-address=:9090"
        - "--health-address=:9091"
        # The /statusz page binds 127.0.0.1 for port-forward access.
        - "--status-address=127.0.0.1:4040"
        # Use this Service's DNS certificate; only the egress injector may call.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        # Enforce the atespace→namespace authorization policy (default-deny).
        - "--namespace-policy-file=/etc/k8s-credential-provider/namespace-policy.yaml"
        - "--injector-identity=spiffe://cluster.local/ns/ate-system/sa/atenet-egress"
        - "--log-level=info"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        - name: OTEL_TRACES_EXPORTER
          value: none
        - name: OTEL_METRICS_EXPORTER
          value: prometheus
        - name: OTEL_LOGS_EXPORTER
          value: none
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9090
        - name: health
          containerPort: 9091
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: namespace-policy
          mountPath: /etc/k8s-credential-provider
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: namespace-policy
        configMap:
          name: k8s-credential-provider-namespace-policy
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem

