# Source: substrate/templates/ate-system-networkpolicies.yaml
# The bundled postgres is reached only by ate-api-server. The installer runs
# psql through `kubectl exec`, and the probes are exec probes, so neither needs
# network access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ate-api-server
    ports:
    - protocol: TCP
      port: postgres

