# Source: substrate/templates/ate-system-networkpolicies.yaml
# atelet's gRPC port is called only by ate-api-server, which dials the atelet
# pod IP. Worker pods talk to atelet over its node-local Unix socket, not this
# port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atelet
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: atelet
  policyTypes:
  - Ingress
  ingress:
  - from:
