# substrate values for an external PostgreSQL that accepts the login
# certificates of substrate-podcert. The other settings match the kind-envoy
# scenario.
#
# Before the install, run hack/install-rustfs.sh, prepare the database as
# "PostgreSQL setup" in the substrate chart README describes, and create these
# Secrets in the release namespace:
#
# - db-readwrite and db-owner, each with a connectionString key. The login
#   users are substrate_readwrite_user and substrate_owner_user, and each
#   connection string names the certificate of its user, for example:
#   postgresql://substrate_readwrite_user@db.example.com:5432/substrate?sslmode=verify-ca&sslrootcert=/run/postgres-server-ca/server-ca.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem
# - postgres-server-ca, with the CA of the database server in server-ca.pem.

atenetDataPlane: envoy

# Connect with the projected login certificates, to a schema and roles of
# this install.
postgres:
  clientCertificates:
    enabled: true
  readWriteConnectionStringSecretRef:
    name: db-readwrite
    key: connectionString
  ownerConnectionStringSecretRef:
    name: db-owner
    key: connectionString
  readWriteRole: agents_readwrite
  ownerRole: agents_owner
  schema: agents

# Use the bundled RustFS. The S3 backend also takes gs:// URIs.
ateApi:
  snapshotLocation: gs://ate-snapshots/
objectStorePlugin:
  credentialsSecret: rustfs-credentials
  extraEnv:
  - name: ATE_STORAGE_BACKEND
    value: s3
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_ENDPOINT_URL
    value: http://rustfs.ate-system.svc:9000
  - name: AWS_S3_USE_PATH_STYLE
    value: "true"
