# The differences between the ate-setup install and the chart install of this
# scenario, by object and field path, with the value from each install.
# cmd/ate-setup/internal/chartcompare fails when the installs differ in any
# other way. Run it with -update-differences to rewrite this file.
ClusterRole//ate-api-server: only ate-setup
ClusterRole//ate-api-server-role: only charts
ClusterRole//atelet: only ate-setup
ClusterRole//atelet-role: only charts
ClusterRoleBinding//ate-api-server: only ate-setup
ClusterRoleBinding//ate-api-server-binding: only charts
ClusterRoleBinding//atelet: only ate-setup
ClusterRoleBinding//atelet-binding: only charts
ConfigMap/ate-system/ate-otel-config: only ate-setup
ConfigMap/ate-system/atenet-egress: only ate-setup
ConfigMap/ate-system/atenet-egress-agentgateway-config: only charts
ConfigMap/ate-system/atenet-egress-agentgateway-substrate-config: only ate-setup
ConfigMap/ate-system/atenet-router-agentgateway-config:
  data.config.yaml:
    ate-setup: |
      # yaml-language-server: $schema=https://agentgateway.dev/schema/config
      config:
        statsAddr: 0.0.0.0:15020
        backend:
          # See the ingress-only loopback rationale in ../agentgateway/configmap.yaml.
          allowDynamicLoopback: true

      frontendPolicies:
        networkAuthorization:
          rules:
          - allow: >-
              source.spiffeId in []
        tracing:
          host: $AGENTGATEWAY_OTLP_ADDRESS
          protocol: grpc
          randomSampling: 0.01

      gateways:
        https:
          port: 8443
          protocol: HTTPS
          tls: &ingress-tls
            cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
            key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
            root: /run/podidentity.podcert.ate.dev/trust-bundle.pem

      backends:
      - name: dynamic
        dynamic: {}
        policies:
          http:
            version: HTTP/1.1
          backendTunnel:
            proxy:
              backend: /dynamic
            mode: connect
            policies:
              backendTLS:
                cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
                insecureHost: true

      routes:
      - name: substrate-actors
        gateways:
        - https
        matches:
        - path:
            pathPrefix: /
        policies: &substrate-ingress
          substrateIngress:
            host: api.ate-system.svc:443
            connectTargetPort: 8443
            policies:
              backendTLS:
                cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                root: /run/servicedns-ca/trust-bundle.pem
        backends:
        - backend: /dynamic
      - name: substrate-actors-grpc
        gateways:
        - https
        matches: &grpc-matches
        - method: POST
          headers:
          - name: content-type
            value:
              regex: '(?i)^application/grpc([+;].*)?$'
        policies: *substrate-ingress
        backends: &grpc-backends
        - backend: /dynamic
          policies:
            http:
              version: HTTP/2.0

      binds:
      - port: 8444
        tunnelProtocol: connect
        listeners:
        - protocol: HTTPS
          tls: *ingress-tls
          routes: []
      - mode: internal
        listeners:
        - protocol: HTTP
          routes:
          - name: substrate-actors-tunneled
            matches:
            - path:
                pathPrefix: /
            policies: *substrate-ingress
            backends:
            - backend: /dynamic
          - name: substrate-actors-tunneled-grpc
            matches: *grpc-matches
            policies: *substrate-ingress
            backends: *grpc-backends
    charts: |
      # yaml-language-server: $schema=https://agentgateway.dev/schema/config
      config:
        statsAddr: 0.0.0.0:15020
        # Actor sandboxes behind a worker IP are replaced between requests. Do
        # not retain an idle connection that may belong to the previous actor.
        backend:
          poolMaxSize: 0
          # Actor CONNECT authorities resolve through the worker atunnel.
          allowDynamicLoopback: true
      frontendPolicies:
        networkAuthorization:
          rules:
          - allow: >-
              source.spiffeId in []

      backends:
      - name: dynamic
        dynamic: {}
        policies:
          http:
            version: HTTP/1.1
          backendTunnel:
            proxy:
              backend: /dynamic
            mode: connect
            policies:
              backendTLS:
                cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
                insecureHost: true

      gateways:
        https:
          port: 8443
          protocol: HTTPS
          tls:
            cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
            key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
            root: /run/podidentity.podcert.ate.dev/trust-bundle.pem

      routes:
      - name: substrate-actors
        gateways:
        - https
        matches:
        - path:
            pathPrefix: /
        policies: &substrate-ingress
          # Reject duplicates in both CONNECT and inner request headers, even
          # when actor selection uses only one of those header maps.
          directResponse:
            conditional:
            - condition: >-
                ('ate-target-actor' in source.connectHeaders &&
                 size(source.connectHeaders.raw()['ate-target-actor']) != 1) ||
                ('ate-target-actor' in request.headers &&
                 size(request.headers.raw()['ate-target-actor']) != 1)
              status: 404
              body: Invalid ate-target-actor header
          substrateIngress:
            host: api.ate-system.svc:443
            requestParking:
              budget: "60s"
            # AgentGateway only uses atunnel's CONNECT listener.
            connectTargetPort: 8443
            policies:
              http:
                requestTimeout: "60s"
              backendTLS:
                cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                root: /run/servicedns-ca/trust-bundle.pem
        backends:
        - backend: /dynamic
      - name: substrate-actors-grpc
        gateways:
        - https
        matches: &grpc-matches
        - method: POST
          headers:
          - name: content-type
            value:
              regex: '(?i)^application/grpc([+;].*)?$'
        policies: *substrate-ingress
        backends: &grpc-backends
        - backend: /dynamic
          policies:
            http:
              version: HTTP/2.0

      # Terminate client CONNECT before internal HTTP routing.
      binds:
      - port: 8444
        tunnelProtocol: connect
        listeners:
        - protocol: HTTPS
          tls:
            cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
            key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
            root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
          routes: []
      - mode: internal
        listeners:
        - protocol: HTTP
          routes:
          - name: substrate-actors-tunneled
            matches:
            - path:
                pathPrefix: /
            policies: *substrate-ingress
            backends:
            - backend: /dynamic
          - name: substrate-actors-tunneled-grpc
            matches: *grpc-matches
            policies: *substrate-ingress
            backends: *grpc-backends
