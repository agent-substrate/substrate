    charts: 256Mi
  spec.template.spec.containers[0].volumeMounts[5].readOnly:
    ate-setup: null
    charts: true
  spec.template.spec.initContainers[0].args:
    ate-setup:
    - node
    - --socket=/run/objectstore-plugin/node.sock
    - --root=/var/lib/ate
    - --asset-staging-dir=/var/lib/objectstore-plugin/asset-staging
    - --asset-staging-capacity=8Gi
    - --preview=
    charts:
