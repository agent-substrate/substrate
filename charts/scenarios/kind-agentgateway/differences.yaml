Deployment/ate-system/atenet-egress:
  spec.template.spec.containers[agentgateway].env[RUST_LOG].value:
    ate-setup: debug
    charts: info
  spec.template.spec.containers[agentgateway].resources.limits:
    ate-setup: null
    charts:
      cpu: "2"
      memory: 1Gi
  spec.template.spec.containers[agentgateway].resources.requests:
    ate-setup: null
    charts:
      cpu: 50m
      memory: 128Mi
  spec.template.spec.containers[agentgateway].volumeMounts[servicedns-ca]:
    ate-setup:
      mountPath: /run/servicedns-ca
      name: servicedns-ca
      readOnly: true
    charts: null
  spec.template.spec.volumes[drain-signal]:
    ate-setup:
      emptyDir: {}
      name: drain-signal
    charts: null
  spec.template.spec.volumes[servicedns-ca]:
    ate-setup:
      name: servicedns-ca
      projected:
        defaultMode: 420
        sources:
        - clusterTrustBundle:
            labelSelector:
              matchLabels:
                podcert.ate.dev/canarying: live
            path: trust-bundle.pem
            signerName: servicedns.podcert.ate.dev/identity
    charts: null
