    - configMapRef:
        name: ate-otel-config
    charts: null
  spec.template.spec.containers[0].resources.limits:
    ate-setup: null
    charts:
      cpu: "2"
      memory: 1Gi
  spec.template.spec.containers[0].resources.requests.memory:
