    charts: null
  data.config.yaml.binds[0].listeners[0].routes[1].policies.substrateEgress.credentialProviders[0].target.policies.backendTLS.root:
    ate-setup: /run/servicedns-ca/trust-bundle.pem
    charts: /run/servicedns.podcert.ate.dev/trust-bundle.pem
  data.config.yaml.binds[0].listeners[0].routes[1].policies.substrateEgress.policies.backendTLS.root:
    ate-setup: /run/servicedns-ca/trust-bundle.pem
    charts: /run/servicedns.podcert.ate.dev/trust-bundle.pem
  ? data.config.yaml.binds[0].listeners[1].routes[1].policies.substrateEgress.credentialProviders[0].target.policies.backendTLS.hostname
  : ate-setup: k8s-credential-provider.ate-system.svc
    charts: null
  data.config.yaml.binds[0].listeners[1].routes[1].policies.substrateEgress.credentialProviders[0].target.policies.backendTLS.root:
    ate-setup: /run/servicedns-ca/trust-bundle.pem
    charts: /run/servicedns.podcert.ate.dev/trust-bundle.pem
  data.config.yaml.binds[0].listeners[1].routes[1].policies.substrateEgress.policies.backendTLS.root:
    ate-setup: /run/servicedns-ca/trust-bundle.pem
    charts: /run/servicedns.podcert.ate.dev/trust-bundle.pem
  data.config.yaml.frontendPolicies.substrateEgressActorResolution.policies.backendTLS.root:
    ate-setup: /run/servicedns-ca/trust-bundle.pem
    charts: /run/servicedns.podcert.ate.dev/trust-bundle.pem
ConfigMap/ate-system/atenet-router-agentgateway-config:
  data.config.yaml.binds[1].listeners[0].routes[substrate-actors-tunneled-grpc].policies.directResponse:
    ate-setup: null
    charts:
      conditional:
      - body: Invalid ate-target-actor header
        condition: |-
          ('ate-target-actor' in source.connectHeaders &&
           size(source.connectHeaders.raw()['ate-target-actor']) != 1) ||
          ('ate-target-actor' in request.headers &&
           size(request.headers.raw()['ate-target-actor']) != 1)
        status: 404
  data.config.yaml.binds[1].listeners[0].routes[substrate-actors-tunneled-grpc].policies.substrateIngress.policies.http:
    ate-setup: null
    charts:
      requestTimeout: 60s
  data.config.yaml.binds[1].listeners[0].routes[substrate-actors-tunneled-grpc].policies.substrateIngress.requestParking:
    ate-setup: null
    charts:
      budget: 60s
  data.config.yaml.binds[1].listeners[0].routes[substrate-actors-tunneled].policies.directResponse:
    ate-setup: null
    charts:
      conditional:
      - body: Invalid ate-target-actor header
        condition: |-
          ('ate-target-actor' in source.connectHeaders &&
           size(source.connectHeaders.raw()['ate-target-actor']) != 1) ||
          ('ate-target-actor' in request.headers &&
           size(request.headers.raw()['ate-target-actor']) != 1)
        status: 404
  data.config.yaml.binds[1].listeners[0].routes[substrate-actors-tunneled].policies.substrateIngress.policies.http:
    ate-setup: null
    charts:
      requestTimeout: 60s
  data.config.yaml.binds[1].listeners[0].routes[substrate-actors-tunneled].policies.substrateIngress.requestParking:
    ate-setup: null
    charts:
      budget: 60s
  data.config.yaml.config.backend.poolMaxSize:
    ate-setup: null
    charts: 0
  data.config.yaml.frontendPolicies.tracing:
    ate-setup:
      host: $AGENTGATEWAY_OTLP_ADDRESS
      protocol: grpc
      randomSampling: 0.01
    charts: null
  data.config.yaml.routes[substrate-actors-grpc].policies.directResponse:
    ate-setup: null
    charts:
      conditional:
      - body: Invalid ate-target-actor header
        condition: |-
          ('ate-target-actor' in source.connectHeaders &&
           size(source.connectHeaders.raw()['ate-target-actor']) != 1) ||
          ('ate-target-actor' in request.headers &&
           size(request.headers.raw()['ate-target-actor']) != 1)
        status: 404
  data.config.yaml.routes[substrate-actors-grpc].policies.substrateIngress.policies.http:
    ate-setup: null
    charts:
      requestTimeout: 60s
  data.config.yaml.routes[substrate-actors-grpc].policies.substrateIngress.requestParking:
    ate-setup: null
    charts:
      budget: 60s
  data.config.yaml.routes[substrate-actors].policies.directResponse:
    ate-setup: null
    charts:
      conditional:
      - body: Invalid ate-target-actor header
        condition: |-
          ('ate-target-actor' in source.connectHeaders &&
           size(source.connectHeaders.raw()['ate-target-actor']) != 1) ||
          ('ate-target-actor' in request.headers &&
           size(request.headers.raw()['ate-target-actor']) != 1)
        status: 404
  data.config.yaml.routes[substrate-actors].policies.substrateIngress.policies.http:
    ate-setup: null
    charts:
      requestTimeout: 60s
  data.config.yaml.routes[substrate-actors].policies.substrateIngress.requestParking:
    ate-setup: null
    charts:
      budget: 60s
