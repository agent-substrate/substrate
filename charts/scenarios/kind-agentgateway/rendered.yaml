kind: Deployment
apiVersion: apps/v1
metadata:
  name: ate-controller
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      serviceAccountName: ate-controller
      containers:
      - name: ate-controller
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
        image: ghcr.io/agent-substrate/substrate/atecontroller:0.1.0
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        args:
        - "--preview="
        # The atecontroller binary defaults --ateapi-conn-spec to
        # dns:///api.ate-system.svc:443, which is correct only for the
        # canonical render (release name "substrate" in namespace
        # "ate-system"). Pass the chart-resolved Service so the controller
        # dials the right backend when substrate is installed as a subchart.
        - "--ateapi-conn-spec=dns:///api.ate-system.svc:443"
        - '--atelet-service-account=atelet'
        - '--router-service-account=atenet-router'
        - "--ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        - "--dns-egress-policy=enforce-in-atunnel"
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ATE_WORKER_OTEL_LOGS_EXPORTER
          value: "none"
        - name: ATE_WORKER_OTEL_TRACES_EXPORTER
          value: "none"
        - name: ATE_WORKER_OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_TRACES_EXPORTER
          value: none
        - name: OTEL_METRICS_EXPORTER
          value: prometheus
        - name: OTEL_LOGS_EXPORTER
          value: none
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - { name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true }
        - { name: podidentity,   mountPath: /run/podidentity.podcert.ate.dev, readOnly: true }
      volumes:
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem

