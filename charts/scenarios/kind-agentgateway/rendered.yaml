  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 50051

