  namespace: ate-system
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      connect:
        mode: tunnel
      accessLog:
        add:
          substrate.connect.authority: 'destination.address + ":" + string(destination.port)'
      # Authorize the actor identity at CONNECT-accept, before any tunnel
      # (HTTP, TLS, or opaque TCP) is terminated. Fails closed when the
      # control plane is unreachable.
      substrateEgressActorResolution:
        host: api.ate-system.svc:443
        policies:
          backendTLS:
            cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            root: /run/servicedns.podcert.ate.dev/trust-bundle.pem

    # Bind the CONNECT front door to the pod IP so tunnel re-entry selects
    # the wildcard internal listener instead of this gateway again.
    gateways:
      egress:
        port: 8443
        bindAddress: $POD_IP
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/actor-id-ca-certs/ca.crt

    binds:
    - mode: internal
      protocol: AUTO
      listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: /run/egress-mitm/tls.crt
          key: /run/egress-mitm/tls.key
        routes:
        - backends:
          - dynamic: {}
            policies:
              backendTLS:
                root: /etc/ssl/certs/ca-certificates.crt
          policies:
            substrateEgress:
              host: api.ate-system.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
              credentialProviders:
              - uriAuthority: "k8s.io"
                target:
                  host: "k8s-credential-provider.ate-system.svc:50051"
                  policies:
                    backendTLS:
                      cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
      - protocol: HTTP
        routes:
        - backends:
          - dynamic:
              target: 'destination.address + ":" + string(destination.port)'
          policies:
            substrateEgress:
              host: api.ate-system.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
              credentialProviders:
              - uriAuthority: "k8s.io"
                target:
                  host: "k8s-credential-provider.ate-system.svc:50051"
                  policies:
                    backendTLS:
                      cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
      - protocol: TLS
        tcpRoutes:
        - backends:
          - dynamic: {}

