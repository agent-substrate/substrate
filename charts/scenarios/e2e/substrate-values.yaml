# substrate values for the e2e suites in internal/e2e on a kind cluster that
# hack/create-kind-cluster.sh creates. The settings match the kind scenario,
# plus the e2e tuning of ate-setup --e2e-tuning.
#
# Before the install, run hack/install-postgres.sh --kind.

atenetDataPlane: envoy

# Connect to the bundled PostgreSQL with the projected login certificates.
postgres:
  clientCertificates:
    enabled: true

# The e2e suites reach actors through the router as this client.
atenetRouter:
  ingressAllowedSPIFFEIDs:
  - spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client
