# substrate values for the e2e suites in internal/e2e on a kind cluster that
# hack/create-kind-cluster.sh creates. The settings match the kind scenario,
# plus the e2e tuning of ate-setup --e2e-tuning.
#
# Before the install, run hack/install-postgres.sh --kind and
# hack/install-rustfs.sh.

atenetDataPlane: envoy

# Connect to the bundled PostgreSQL with the projected login certificates.
postgres:
  clientCertificates:
    enabled: true

# Use the bundled RustFS. The S3 backend also takes gs:// URIs.
ateApi:
  snapshotLocation: gs://ate-snapshots/
objectStorePlugin:
  credentialsSecret: rustfs-credentials
  extraEnv:
  - name: ATE_STORAGE_BACKEND
    value: s3
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_ENDPOINT_URL
    value: http://rustfs.ate-system.svc:9000
  - name: AWS_S3_USE_PATH_STYLE
    value: "true"

# The e2e suites reach actors through the router as this client.
atenetRouter:
  ingressAllowedSPIFFEIDs:
  - spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client
