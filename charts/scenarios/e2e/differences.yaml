# The differences between the ate-setup install and the chart install of this
# scenario, by object and field path, with the value from each install.
# cmd/ate-setup/internal/chartcompare fails when the installs differ in any
# other way. Run it with -update-differences to rewrite this file.
ConfigMap/ate-system/ate-otel-config: only ate-setup
DaemonSet/ate-system/atelet:
  spec.template.spec.containers[atelet].args:
    ate-setup: []
    charts:
    - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
    - --herder-allowed-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/ate-api-server
    - --objectstore-plugin-socket=/run/objectstore-plugin/node.sock
  spec.template.spec.containers[atelet].env[OTEL_LOGS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_LOGS_EXPORTER
      value: none
  spec.template.spec.containers[atelet].env[OTEL_METRICS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_METRICS_EXPORTER
      value: prometheus
  spec.template.spec.containers[atelet].env[OTEL_TRACES_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_TRACES_EXPORTER
      value: none
  spec.template.spec.containers[atelet].envFrom:
    ate-setup:
    - configMapRef:
        name: ate-otel-config
    charts: null
  spec.template.spec.containers[atelet].resources.limits:
    ate-setup: null
    charts:
      cpu: "2"
      memory: 1Gi
  spec.template.spec.containers[atelet].resources.requests.memory:
    ate-setup: 128Mi
    charts: 256Mi
  spec.template.spec.containers[atelet].volumeMounts[podidentity].readOnly:
    ate-setup: null
    charts: true
  spec.template.spec.initContainers[objectstore-plugin].args:
    ate-setup: []
    charts:
    - --exchange-address=api.ate-system.svc:8445
    - --exchange-server-name=api.ate-system.svc
  spec.template.spec.initContainers[objectstore-plugin].env[AWS_ACCESS_KEY_ID]:
    ate-setup:
      name: AWS_ACCESS_KEY_ID
      value: rustfsadmin
    charts: null
  spec.template.spec.initContainers[objectstore-plugin].env[AWS_SECRET_ACCESS_KEY]:
    ate-setup:
      name: AWS_SECRET_ACCESS_KEY
      value: rustfsadmin
    charts: null
  spec.template.spec.initContainers[objectstore-plugin].env[OTEL_LOGS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_LOGS_EXPORTER
      value: none
  spec.template.spec.initContainers[objectstore-plugin].env[OTEL_METRICS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_METRICS_EXPORTER
      value: prometheus
  spec.template.spec.initContainers[objectstore-plugin].env[OTEL_TRACES_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_TRACES_EXPORTER
      value: none
  spec.template.spec.initContainers[objectstore-plugin].envFrom[0].configMapRef:
    ate-setup:
      name: ate-otel-config
    charts: null
  spec.template.spec.initContainers[objectstore-plugin].envFrom[0].secretRef:
    ate-setup: null
    charts:
      name: rustfs-credentials
Deployment/ate-system/ate-api-server:
  spec.template.spec.containers[ate-api-server].args:
    ate-setup:
    - --postgres-owner-role=@env
    - --postgres-read-write-role=@env
    charts:
    - --api-server-sidecar-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/ate-api-server
    - --atelet-service-account=atelet
    - --controller-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/ate-controller
    - --egress-gateway-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/atenet-egress
    - --ingress-router-spiffe-id=spiffe://cluster.local/ns/ate-system/sa/atenet-router
    - --postgres-owner-role=substrate_owner
    - --postgres-read-write-role=substrate_readwrite
  spec.template.spec.containers[ate-api-server].env[ATE_API_POSTGRES_OWNER_CONNECTION_STRING]:
    ate-setup: null
    charts:
      name: ATE_API_POSTGRES_OWNER_CONNECTION_STRING
      valueFrom:
        secretKeyRef:
          key: ownerConnectionString
          name: substrate-postgres-owner
  spec.template.spec.containers[ate-api-server].env[ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING]:
    ate-setup: null
    charts:
      name: ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING
      valueFrom:
        secretKeyRef:
          key: readWriteConnectionString
          name: substrate-postgres-readwrite
  spec.template.spec.containers[ate-api-server].env[OTEL_LOGS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_LOGS_EXPORTER
      value: none
  spec.template.spec.containers[ate-api-server].env[OTEL_METRICS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_METRICS_EXPORTER
      value: prometheus
  spec.template.spec.containers[ate-api-server].env[OTEL_TRACES_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_TRACES_EXPORTER
      value: none
  spec.template.spec.containers[ate-api-server].env[OTEL_TRACES_SAMPLER]:
    ate-setup:
      name: OTEL_TRACES_SAMPLER
      value: parentbased_always_on
    charts: null
  spec.template.spec.containers[ate-api-server].envFrom:
    ate-setup:
    - configMapRef:
        name: ate-otel-config
    - configMapRef:
        name: ate-api-server-envvars
        optional: true
    - secretRef:
        name: ate-api-server-secret-envvars
        optional: true
    charts:
    - configMapRef:
        name: ate-api-server-envvars
        optional: true
  spec.template.spec.containers[ate-api-server].resources.limits:
    ate-setup: null
    charts:
      cpu: "2"
      memory: 1Gi
  spec.template.spec.containers[ate-api-server].resources.requests:
    ate-setup: null
    charts:
      cpu: 100m
      memory: 256Mi
  spec.template.spec.containers[ate-api-server].volumeMounts[podidentity].readOnly:
    ate-setup: null
    charts: true
  spec.template.spec.initContainers[objectstore-plugin].args:
    ate-setup: []
    charts:
    - --ateapi-server-name=api.ate-system.svc
  spec.template.spec.initContainers[objectstore-plugin].env[AWS_ACCESS_KEY_ID]:
    ate-setup:
      name: AWS_ACCESS_KEY_ID
      value: rustfsadmin
    charts: null
  spec.template.spec.initContainers[objectstore-plugin].env[AWS_SECRET_ACCESS_KEY]:
    ate-setup:
      name: AWS_SECRET_ACCESS_KEY
      value: rustfsadmin
    charts: null
  spec.template.spec.initContainers[objectstore-plugin].env[OTEL_LOGS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_LOGS_EXPORTER
      value: none
  spec.template.spec.initContainers[objectstore-plugin].env[OTEL_METRICS_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_METRICS_EXPORTER
      value: prometheus
  spec.template.spec.initContainers[objectstore-plugin].env[OTEL_TRACES_EXPORTER]:
    ate-setup: null
    charts:
      name: OTEL_TRACES_EXPORTER
      value: none
  spec.template.spec.initContainers[objectstore-plugin].envFrom[0].configMapRef:
    ate-setup:
      name: ate-otel-config
    charts: null
  spec.template.spec.initContainers[objectstore-plugin].envFrom[0].secretRef:
    ate-setup: null
    charts:
      name: rustfs-credentials
Deployment/ate-system/ate-controller:
  spec.template.spec.containers[ate-controller].args:
