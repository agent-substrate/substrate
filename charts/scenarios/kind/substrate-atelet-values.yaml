# substrate-atelet values for a kind cluster that hack/create-kind-cluster.sh
# creates. The settings match the kind overlay in manifests/ate-install/kind.
#
# Before the install, create the RustFS credentials Secret, as the substrate
# chart README shows.

# Pull worker images through the kind registry, and log at debug level for
# development and e2e tests.
atelet:
  extraArgs:
  - --localhost-registry-replacement=kind-registry:5000
  - --log-level=debug

# Use the RustFS that the substrate chart bundles.
objectStore:
  backend: s3
  endpoint: http://rustfs.ate-system.svc:9000
  region: us-east-1
  pathStyle: true
  credentialsSecret: rustfs-credentials
