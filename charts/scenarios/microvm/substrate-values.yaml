# substrate values for microVM sandboxes on a kind cluster that
# hack/create-kind-cluster.sh creates on a host with /dev/kvm. The other
# settings match the kind scenario.
#
# Before the install, run hack/install-postgres.sh --kind. The microVM assets
# must be in the RustFS bucket: see "microVM sandboxes" in the substrate chart
# README.

atenetDataPlane: envoy

# Connect to the bundled PostgreSQL with the projected login certificates.
postgres:
  clientCertificates:
    enabled: true

# atelet fetches the microVM assets from the bundled RustFS bucket.
sandboxConfigs:
  microvm:
    enabled: true
    assetBucket: s3://ate-snapshots
