# Custom validation rules for Agent Substrate.
formats:
  # Names of singleton resources
  - name: ate-singleton-name
    docs: This field must be "default"
    # allow optional/required to cover "" for subfields
    pattern: (^$|^default$)
    message: must be "default"

  # HTTP probe paths
  - name: ate-http-probe-path
    docs: This field must be a valid HTTP path with valid escapes and no query or fragment components
    # allow optional/required to cover "" for subfields
    pattern: (^$|^/([A-Za-z0-9\-._~!$&'\(\)*+,;=:@/]|%[0-9A-Fa-f]{2})*$)
    message: must be a valid HTTP path (RFC 3986)

  # Environment variable names
  - name: ate-env-var-name
    docs: This field must be a valid environment variable name
    # allow optional/required to cover "" for subfields
    pattern: (^$|^[ -<>-~]+$)
    message: may contain any printable ASCII character except '='

  # Volume plugin or CSI driver names
  - name: ate-volume-type-name
    docs: This field must be a DNS subdomain, optionally prefixed with "substrate.io/"
    # allow optional/required to cover "" for subfields
    # TODO: this prefix is not a domain we own!
    pattern: (^$|^(substrate\.io/)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$)
    message: must be a DNS subdomain, optionally prefixed with "substrate.io/"

  # External volume storage IDs
  - name: ate-volume-storage-id
    docs: This field must not contain control characters other than tab, newline and carriage return
    pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]*$'
    message: must not contain control characters
