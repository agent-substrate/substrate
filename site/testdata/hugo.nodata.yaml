# Like hugo.test.yaml, but without data/release.json, as in a local build
# that skipped make site-release-data. No page may be marked new. data is
# mounted from an empty directory because Hugo mounts site/data for any
# target left out, and that may hold a generated release.json.
baseURL: 'https://example.org/'
module:
  mounts:
    - source: layouts
      target: layouts
    - source: assets
      target: assets
    - source: static
      target: static
    - source: testdata/content
      target: content
    - source: testdata/data-empty
      target: data
    - source: testdata/repo
      target: assets/repo
