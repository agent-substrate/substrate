# ActorTemplate (protojson-shaped ateapipb.ActorTemplate) for the manual
# multi-volume test. Applied with `kubectl ate create actor-template -f -`
# after `ko resolve` replaces the ko:// image reference; the
# ate-manual-test-multi atespace must exist.
metadata:
  atespace: ate-manual-test-multi
  name: sandbox-template
workerSelector:
  matchLabels:
    workload: sandbox
containers:
- name: sandbox
  image: ko://github.com/agent-substrate/substrate/demos/sandbox
  command: ["/ko-app/sandbox"]
  env:
  - name: PORT
    value: "80"
  volumeMounts:
  - name: vol-hostpath
    mountPath: /hostpath-data
  - name: vol-nfs
    mountPath: /nfs-data
snapshotsConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_FULL
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: gs://ate-snapshots/ate-manual-test-multi/
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
volumes:
- name: vol-hostpath
  externalVolumeTemplate:
    capacity: 1Gi
    storageClassName: csi-hostpath-sc
- name: vol-nfs
  externalVolumeTemplate:
    capacity: 1Gi
    storageClassName: csi-nfs-sc
