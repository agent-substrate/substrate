# Worker pool for the manual multi-volume test. The ActorTemplate lives in
# manual-test-multi-template.yaml and is created through the ate API with
# `kubectl ate create actor-template`.

apiVersion: v1
kind: Namespace
metadata:
  name: ate-manual-test-multi
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: sandbox-pool
  namespace: ate-manual-test-multi
  labels:
    workload: sandbox
spec:
  replicas: 1
  workerImage: ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor
