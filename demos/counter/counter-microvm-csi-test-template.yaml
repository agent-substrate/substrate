# ActorTemplate (protojson-shaped ateapi.ActorTemplate) for the manual
# micro-VM CSI test. Applied with `kubectl ate create actor-template -f -`
# after `ko resolve` replaces the ko:// image reference; the
# ate-demo-counter-microvm-csi atespace must exist.
metadata:
  atespace: ate-demo-counter-microvm-csi
  name: counter-microvm-csi
workerSelector:
  matchLabels:
    workload: counter-microvm-csi
containers:
- name: counter
  image: ko://go.ate.dev/substrate/demos/counter
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
  volumeMounts:
  - name: data
    mountPath: /home/counter
# Sandbox size: vCPUs and guest RAM (see internal/sizing). The pool sets no
# worker limits, so these only need to fit the node.
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912 # 512Mi
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_VOLUMES
  storageLocation: gs://ate-snapshots/ate-demo-counter-microvm-csi/
volumes:
- name: data
  external:
    template:
      capacityBytes: 1073741824 # 1Gi
      storageClassName: csi-hostpath-sc
