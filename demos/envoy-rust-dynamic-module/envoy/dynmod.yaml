# Arm B: the Rust dynamic module does the ingress routing decision in-process.
#
# This mirrors what xds.go builds for the ingress listener, with exactly one
# substitution: the envoy.filters.http.ext_proc filter (which calls out to the
# Go atenet router over gRPC for every request) is replaced by
# envoy.filters.http.dynamic_modules. Everything else -- the set_filter_state
# filter that captures :authority, the ORIGINAL_DST cluster keyed on dynamic
# metadata, the route -- is the same, so the comparison isolates the hop.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

node:
  id: substrate-envoy-node
  cluster: substrate-router-cluster

static_resources:
  listeners:
  - name: ingress_http_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          generate_request_id: true
          route_config:
            name: substrate_routes
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: actor_original_dst
                  timeout: 10s
                # Same declarative port propagation xds.go uses: atunnel cannot
                # read dynamic metadata, so the port travels as a header.
                request_headers_to_add:
                - header:
                    key: x-ate-target-port
                    value: "%DYNAMIC_METADATA(envoy.filters.listener.original_dst:port)%"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
          http_filters:
          # Captures :authority into filter state, exactly as
          # xds.go's authorityFilterStateFilter does. The module reads it back
          # from there, so it behaves identically for CONNECT-tunneled requests
          # whose own :authority is not the actor's.
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              on_request_headers:
              - object_key: dev.ate.authority
                # dev.ate.authority is a custom (non-well-known) key, so the
                # generic string factory has to be named explicitly -- without
                # it Envoy rejects the config with "does not have an object
                # factory". Same as xds.go's authorityFilterStateFilter.
                factory_key: envoy.string
                format_string:
                  text_format_source:
                    inline_string: "%REQ(:AUTHORITY)%"
                shared_with_upstream: ONCE
          # The replacement for ext_proc.
          - name: envoy.filters.http.dynamic_modules
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamic_module_config:
                name: ate_router_module
              filter_name: actor_router
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "ateapi_cluster": "ateapi",
                    "cache_ttl_seconds": 5,
                    "callout_timeout_ms": 5000,
                    "actor_dns_suffix": "actors.resources.substrate.ate.dev",
                    "atunnel_port": 443,
                    "target_port_header": "x-ate-target-port",
                    "cache_enabled": true
                  }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # Arm B2: the same module with the cache switched off, so every request pays
  # a resolve callout. Isolates the saving that comes from deleting the ext_proc
  # hop alone, separately from the saving that comes from caching.
  - name: ingress_http_listener_nocache
    address:
      socket_address: { address: 0.0.0.0, port_value: 8082 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http_nocache
          generate_request_id: true
          route_config:
            name: substrate_routes
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: actor_original_dst
                  timeout: 10s
                # Same declarative port propagation xds.go uses: atunnel cannot
                # read dynamic metadata, so the port travels as a header.
                request_headers_to_add:
                - header:
                    key: x-ate-target-port
                    value: "%DYNAMIC_METADATA(envoy.filters.listener.original_dst:port)%"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
          http_filters:
          # Captures :authority into filter state, exactly as
          # xds.go's authorityFilterStateFilter does. The module reads it back
          # from there, so it behaves identically for CONNECT-tunneled requests
          # whose own :authority is not the actor's.
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              on_request_headers:
              - object_key: dev.ate.authority
                # dev.ate.authority is a custom (non-well-known) key, so the
                # generic string factory has to be named explicitly -- without
                # it Envoy rejects the config with "does not have an object
                # factory". Same as xds.go's authorityFilterStateFilter.
                factory_key: envoy.string
                format_string:
                  text_format_source:
                    inline_string: "%REQ(:AUTHORITY)%"
                shared_with_upstream: ONCE
          # The replacement for ext_proc.
          - name: envoy.filters.http.dynamic_modules
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamic_module_config:
                name: ate_router_module
              filter_name: actor_router
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "ateapi_cluster": "ateapi",
                    "cache_ttl_seconds": 5,
                    "callout_timeout_ms": 5000,
                    "actor_dns_suffix": "actors.resources.substrate.ate.dev",
                    "atunnel_port": 443,
                    "target_port_header": "x-ate-target-port",
                    "cache_enabled": false
                  }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Mirrors buildOriginalDstCluster in xds.go: the upstream host comes from the
  # dynamic metadata the routing decision published, not from :authority.
  - name: actor_original_dst
    connect_timeout: 5s
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
    original_dst_lb_config:
      metadata_key:
        key: envoy.filters.listener.original_dst
        path:
        - key: local

  # The cluster the module calls out to on a cache miss. In production this
  # would be ate-apiserver itself; see the README for what that requires.
  - name: ateapi
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: ateapi
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: fakeate, port_value: 8081 }
