# Arm C: the migration shape -- the Rust module and ext_proc in the SAME chain.
#
# The module runs first as a pure cache. On a hit it publishes the routing
# decision and marks the request so route selection lands on a route where
# ext_proc is disabled. On a miss it does nothing, and the request takes exactly
# today's path through the real Go router; the module then learns the answer
# from the dynamic metadata ext_proc published.
#
# ext_proc's own config is byte-identical to what xds.go generates today. The
# only additions are the module filter and the second route.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

node:
  id: substrate-envoy-node
  cluster: substrate-router-cluster

static_resources:
  listeners:
  - name: ingress_http_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          generate_request_id: true
          route_config:
            name: substrate_routes
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              # Cache hit: the module already resolved this request, so skip the
              # ext_proc call. This route is the entire opt-in.
              - name: resolved_by_module
                match:
                  prefix: "/"
                  headers:
                  - name: x-ate-route-resolved
                    string_match: { exact: "1" }
                route:
                  cluster: actor_original_dst
                  timeout: 10s
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    disabled: true
              # Everything else: today's path, unchanged.
              - name: catch_all
                match: { prefix: "/" }
                route:
                  cluster: actor_original_dst
                  timeout: 10s
                request_headers_to_add:
                - header:
                    key: x-ate-target-port
                    value: "%DYNAMIC_METADATA(envoy.filters.listener.original_dst:port)%"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
          http_filters:
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              on_request_headers:
              - object_key: dev.ate.authority
                factory_key: envoy.string
                format_string:
                  text_format_source:
                    inline_string: "%REQ(:AUTHORITY)%"
                shared_with_upstream: ONCE
          # The new filter. Delete these 16 lines and the chain is today's.
          - name: envoy.filters.http.dynamic_modules
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamic_module_config:
                name: ate_router_module
              filter_name: actor_router_cache
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "ateapi_cluster": "unused-in-coexistence-mode",
                    "cache_ttl_seconds": 5,
                    "actor_dns_suffix": "actors.resources.substrate.ate.dev",
                    "atunnel_port": 443,
                    "target_port_header": "x-ate-target-port",
                    "cache_enabled": true
                  }
          # Unchanged: same config xds.go emits today.
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc: { cluster_name: ate-cluster }
                timeout: 10s
              message_timeout: 10s
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SKIP
                request_trailer_mode: SKIP
                response_trailer_mode: SKIP
              request_attributes:
              - "filter_state['dev.ate.authority']"
              mutation_rules: { allow_all_routing: true }
              metadata_options:
                forwarding_namespaces:
                  untyped: ["envoy.filters.listener.original_dst"]
                receiving_namespaces:
                  untyped: ["envoy.filters.listener.original_dst"]
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: actor_original_dst
    connect_timeout: 5s
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
    original_dst_lb_config:
      metadata_key:
        key: envoy.filters.listener.original_dst
        path:
        - key: local

  # The real atenet router's ext_proc server.
  - name: ate-cluster
    connect_timeout: 0.25s
    type: STATIC
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: ate-cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 172.28.0.20, port_value: 50051 }
