# Autoscale the counter WorkerPool based on how many of its workers are assigned.
# The metric ate_workerpool_workers (emitted by ate-api-server) is served to the
# External Metrics API by prometheus-adapter (demos/autoscaled-workerpool).
# External AverageValue math: desiredReplicas = ceil(assigned / averageValue).
# With averageValue=0.7 the pool targets ~70% assignment / 30% idle headroom.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: counter
  namespace: ate-demo-autoscaled-workerpool
spec:
  scaleTargetRef:
    apiVersion: ate.dev/v1alpha1
    kind: WorkerPool
    name: counter
  minReplicas: 2          # warm floor: keep at least 2 workers ready
  maxReplicas: 25
  metrics:
  - type: External
    external:
      metric:
        name: ate_workerpool_workers
        selector:
          matchLabels:
            # The namespace is required: pool names are unique per namespace, and
            # the counter demo ships a WorkerPool named "counter" too.
            ate_workerpool_namespace: ate-demo-autoscaled-workerpool
            ate_workerpool_name: counter
            ate_worker_state: assigned
      target:
        type: AverageValue
        averageValue: "0.7"   # 70% utilization
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 10
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
