tests:
  - name: 1. Template Instantiation (Wildcard Access)
    check:
      - user: user:eve
        object: actor_template:shared-template
        assertions:
          operator: true
      - user: user:bob
        object: actor_template:shared-template
        assertions:
          can_instantiate: true

  - name: 2. Cross-Tenant Isolation & Actor Creation
    check:
      - user: user:bob
        object: atespace:space-1
        assertions:
          can_create_actor: true
      - user: user:eve
        object: actor:runner-1
        assertions:
          operator: false

  - name: 3. Control-Plane Lifecycle (Get, Resume, Delete, Suspend)
    check:
      - user: user:dave
        object: actor:runner-1
        assertions:
          can_get: true
          can_delete: false
          can_resume: false
      - user: service_account:router
        object: actor:runner-1
        assertions:
          can_resume: true
      - user: actor:runner-1
