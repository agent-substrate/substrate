# Which Google Cloud projects each atespace may read secrets from. An actor can
# resolve a secret only if its URI's project is listed for the actor's atespace;
# an atespace that isn't listed resolves nothing. Write each project the way
# your URIs do, by ID or by number.
#
# Apply this before deploying the provider; the kustomization leaves it out so a
# redeploy doesn't overwrite it. The provider reads it only at startup, so
# restart the Deployment after editing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gsm-credential-provider-project-policy
  namespace: ate-system
data:
  project-policy.yaml: |
    # Actors in atespace "team-a" may use secrets in project "my-project", e.g.
    # ate-secret://secretmanager.googleapis.com/projects/my-project/secrets/example-api-token/versions/1.
    policies:
    - atespace: team-a
      allowedProjects:
      - my-project
