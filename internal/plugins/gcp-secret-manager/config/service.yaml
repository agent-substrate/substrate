# Required for the pod to start: substrate issues the serving certificate only
# for pods a Service selects.
apiVersion: v1
kind: Service
metadata:
  name: gsm-credential-provider
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: gsm-credential-provider
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
