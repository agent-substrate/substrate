# Deploys into substrate's ate-system namespace, which this base neither creates
# nor deletes. The image is a ko:// reference: apply with `make deploy`, or
# render a digest-pinned manifest with `make release-manifest`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
