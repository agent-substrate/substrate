syntax = "proto3";

package glutton;

option go_package = "github.com/agent-substrate/substrate/internal/proto/glutton";

// A glutton is a single small piece of a larger benchmarking suite. It is designed to be instantiated
// multiple times, with each piece configured to do different units of work.
service Glutton {
  // Tells glutton to write to RAM, either overwriting previously-used
  // RAM or allocating additional RAM per request instructions. Data written
  // will be random bytes.
  rpc WriteRAM(WriteRAMRequest) returns (WriteRAMResponse) {}

  // Walks RAM previously allocated by WriteRAM: reads one byte per 4KiB
  // page across the requested size, so every touched page must be resident
  // before the response returns.
  rpc ReadRAM(ReadRAMRequest) returns (ReadRAMResponse) {}

  // Tells glutton to write to disk using the specified mode. Data
  // written will be random bytes.
  rpc WriteDisk(WriteDiskRequest) returns (WriteDiskResponse) {}

  // Tells glutton to read from disk using the specified mode.
  rpc ReadDisk(ReadDiskRequest) returns (ReadDiskResponse) {}

  // Tells glutton to make sure it has the specified number of file
  // descriptors open. It will open or close file descriptors to
  // hit the desired count (note this count is in addition to the other
  // FDs needed to run the process).
  rpc OpenFD(OpenFDRequest) returns (OpenFDResponse) {}

  // Send a request to the glutton, expecting the same response back.
  rpc Ping(PingRequest) returns (PingResponse) {}

  // Tells the glutton to send network traffic to a peer glutton.
  // messages will be sent on regular intervals separated by delay_ms.
  rpc Gossip(GossipRequest) returns (GossipResponse) {}

  // Tells glutton to spin CPU for a wall-clock duration, hashing in a
  // tight loop across the requested number of goroutines. Models
  // compute-bound work such as compiling or running a test suite.
  rpc BurnCPU(BurnCPURequest) returns (BurnCPUResponse) {}

  // Carries caller-supplied bytes over the wire into the glutton, which
  // writes them to a file under its data dir. Unlike WriteDisk, the bytes
  // cross the network, so the request models a download (git clone,
  // dependency fetch) arriving through the actor's ingress path.
  rpc Ingest(IngestRequest) returns (IngestResponse) {}

  // Tells the glutton to consume CPU. The request sets the current CPU
  // load; calling again replaces it, and num_cores=0 stops it. See
  // UseCPURequest for the (goroutines x duty cycle) shape.
  rpc UseCPU(UseCPURequest) returns (UseCPUResponse) {}

  // Runs a script inside the glutton as one request, so a caller can act
  // out a whole on-sandbox activity (a build, a test run, a file churn)
  // without a network round trip per operation. A script is a tree: a
  // Block runs its steps in order and may loop them for a wall-clock
  // budget; an Operation runs its requests at the same time. The request
  // holds the connection open until the script finishes, and the response
  // mirrors the tree with summed stats at every node; the requests' own
  // results are not returned.
  rpc RunScript(RunScriptRequest) returns (RunScriptResponse) {}
}

enum WriteMode {
  // Overwrite the destination entirely
  WRITE_MODE_TRUNCATE = 0;

  // Write on top of the existing data
  WRITE_MODE_OVERWRITE = 1;

  // Write on top of the existing data at a per-key cursor that advances
  // past each write and wraps at the end, so repeated writes walk the
  // whole array instead of re-dirtying the same prefix. RAM only.
  WRITE_MODE_OVERWRITE_ROTATE = 2;
}

// ReadMode selects how much of the file ReadDisk sends back.
enum ReadMode {
  // Return the file's bytes in ReadDiskResponse.data alongside its digest.
  READ_MODE_DATA = 0;

  // Return only size and sha256; ReadDiskResponse.data is empty. The digest
  // is the same one READ_MODE_DATA returns, so either mode can verify.
  READ_MODE_DIGEST_ONLY = 1;
}

message WriteRAMRequest {
  // name of the array to be written to
  string key = 1;

  // size of bytes to be written, with an optional unit suffix (e.g. "2Gi")
  string size = 2;

  WriteMode write_mode = 3;
}

message WriteRAMResponse {
}

message ReadRAMRequest {
  // name of the array to be read
  string key = 1;

  // size of bytes to walk, with an optional unit suffix (e.g. "2Gi");
  // empty walks the whole array
  string size = 2;
}

message ReadRAMResponse {
  // total size of bytes walked
  int64 size = 1;

  // XOR of the sampled bytes, so the reads are observable
  uint32 checksum = 2;
}

message WriteDiskRequest {
  // name of the file to be written to
  string key = 1;

  // size of bytes to be written
  int32 size = 2;

  WriteMode write_mode = 3;
}

message WriteDiskResponse {
  // size of the file after the write
  int64 size = 1;

  // sha256 of the whole file after the write
  bytes sha256 = 2;
}

message ReadDiskRequest {
  // name of the file to be read from
  string key = 1;

  ReadMode read_mode = 2;
}

message ReadDiskResponse {
  // total size of bytes read
  int64 size = 1;

  // sha256 of bytes read
  bytes sha256 = 2;

  // data read from the file. Empty under READ_MODE_DIGEST_ONLY.
  bytes data = 3;
}

message OpenFDRequest {
  // The total number of FDs for the glutton to open
  int32 count = 1;
}

message OpenFDResponse {
}

message PingRequest {
  // The message to be echoed back from the ping
  string message = 1;
}

message PingResponse {
  // The message echoed back
  string message = 1;
}

message GossipRequest {
  repeated Peer peers = 1;
}

message GossipResponse {}

message Peer {
  string host = 1;
  int32 delay_ms = 2;
}

message BurnCPURequest {
  // Wall-clock time to keep burning, in milliseconds.
  int64 duration_ms = 1;

  // Number of goroutines burning concurrently; values < 1 read as 1.
  int32 parallelism = 2;
}

message BurnCPUResponse {
  // Total hash iterations completed across all goroutines, so the burn
  // is observable and cannot be optimized away.
  int64 iterations = 1;
}

message IngestRequest {
  // name of the file the payload is written to
  string key = 1;

  // the bytes to write, carried in the request body over the network
  bytes payload = 2;

  // append to the file instead of truncating it
  bool append = 3;
}

message IngestResponse {
  // size of the file after the write
  int64 size = 1;

  // sha256 of the payload as received, so the caller can verify transport
  bytes sha256 = 2;
}

message UseCPURequest {
  // Number of parallel goroutines to spin, each targeting duty_cycle
  // fraction of one CPU core. Set to 0 to stop all CPU load.
  int32 num_cores = 1;

  // Fraction of CPU time each goroutine should consume, in [0.0, 1.0].
  double duty_cycle = 2;

  // Per-goroutine work/sleep cycle length in milliseconds. Defaults to
  // 100 when 0 or unset. Smaller values give smoother load at the cost
  // of scheduler and timer-wheel overhead.
  int32 cycle_length_ms = 3;

  // Whether num_cores should be capped at GOMAXPROCS. Defaults to true
  // when unset. Uncapped (false) lets the caller force oversubscription
  // to test scheduler pressure, at the cost of goroutines running below
  // their target duty cycle.
  optional bool cap_at_gomaxprocs = 4;
}

message UseCPUResponse {
  // The number of goroutines actually spun. Equals the request's
  // num_cores unless it was capped at GOMAXPROCS.
  int32 num_cores = 1;
}

// A Block is a list of steps run in order. With loop_duration_ms set, the
// block cycles through its steps until the budget elapses. A budget is
// checked between passes: the pass in progress finishes, so a loop
// overruns its budget by at most one pass and no request is cut short.
// A nested block stops cycling once any ancestor's budget has elapsed,
// the same way.
message Block {
  // At least one step is required.
  repeated Step steps = 1;

  // Wall-clock budget to cycle through the steps for, in milliseconds;
  // the pass under way when it elapses finishes. Zero runs the steps once.
  int64 loop_duration_ms = 2;
}

// A Step is either a nested Block or an Operation.
message Step {
  oneof kind {
    Block block = 1;
    Operation operation = 2;
  }
}

// An Operation runs its requests at the same time and waits for all of
// them. The first request to fail cancels the rest. RAM requests take
// turns on the glutton's single RAM lock, so only CPU, disk, and sleep
// requests overlap in practice.
message Operation {
  // At least one request is required.
  repeated Request requests = 1;
}

// A Request is one of the service's work requests. UseCPU and OpenFD are
// left out because they set a background load that outlives the script
// (BurnCPU is the CPU spike), and Gossip because it starts a loop.
message Request {
  oneof kind {
    WriteRAMRequest write_ram = 1;
    ReadRAMRequest read_ram = 2;
    WriteDiskRequest write_disk = 3;
    ReadDiskRequest read_disk = 4;
    BurnCPURequest burn_cpu = 5;
    IngestRequest ingest = 6;
    SleepRequest sleep = 7;
  }
}

message SleepRequest {
  // Wall-clock time to idle, in milliseconds. The glutton stays awake and
  // does nothing, which paces the requests around it.
  int64 duration_ms = 1;
}

message RunScriptRequest {
  Block script = 1;
}

message RunScriptResponse {
  // The script's root block.
  StepResult result = 1;
}

// A StepResult mirrors one node of the script: a block, an operation, or
// a request. Its children are in the request's order: a block's steps or
// an operation's requests; a request has none. A node inside a looped
// block is entered once per pass, and its stats sum over every entry, so
// the response is the size of the script however long it ran.
message StepResult {
  Stats stats = 1;
  repeated StepResult children = 2;
}

// Stats are a node's vital signs. Every field but elapsed_ms is the sum
// over the node's children and entries, so the root carries the totals.
message Stats {
  // Wall clock spent in this node, summed over its entries. A block's is
  // the sum of its steps'; an operation's is its longest request's, since
  // they overlap; so a parent's elapsed is not the sum of its children's.
  int64 elapsed_ms = 1;

  // Times this node was entered: a looped block's pass count, and for
  // every other node the entries its enclosing loops gave it.
  int64 passes = 2;

  // Requests run beneath this node.
  int64 requests_run = 3;

  // Bytes WriteDisk generated and Ingest received, and bytes ReadDisk read.
  int64 disk_bytes_written = 4;
  int64 disk_bytes_read = 5;

  // Bytes WriteRAM was asked to write, and bytes ReadRAM walked.
  int64 ram_bytes_written = 6;
  int64 ram_bytes_read = 7;

  // Hash iterations BurnCPU completed.
  int64 burn_iterations = 8;

  // Milliseconds slept.
  int64 slept_ms = 9;
}
