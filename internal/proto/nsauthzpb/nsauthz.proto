syntax = "proto3";

package nsauthz;

option go_package = "github.com/agent-substrate/substrate/internal/proto/nsauthzpb";

// NamespaceAuthorizationFile is the top-level container the credential provider
// loads from a textproto file at startup. It maps each atespace to the
// Kubernetes namespaces whose Secrets that atespace may resolve. Enforcement is
// default-deny: an atespace absent from this file can resolve nothing. This is a
// POC stand-in for a future authorization API.
message NamespaceAuthorizationFile {
  repeated AtespaceNamespacePolicy policy = 1;
}

// AtespaceNamespacePolicy grants one atespace access to a set of namespaces.
message AtespaceNamespacePolicy {
  // The atespace this grant applies to, as parsed from the actor SPIFFE URI.
  string atespace = 1;
  // The namespaces whose Secrets the atespace may resolve.
  repeated string allowed_namespaces = 2;
}
