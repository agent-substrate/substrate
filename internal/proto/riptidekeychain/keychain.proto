// Package keychain contains proto definitions for gRPC communication with
// Google Riptide's gcfsd keychain service (unix:///run/gcfsd/keychain.sock).
syntax = "proto3";

package cloud.containers.riptide.fuse.keychain;

option go_package = "github.com/agent-substrate/substrate/internal/proto/riptidekeychain";

service Keychain {
  // Update credentials for an image.
  rpc UpdateCreds(UpdateCredsRequest) returns (UpdateCredsResponse) {}

  // Remove credentials for an image.
  rpc RemoveCreds(RemoveCredsRequest) returns (RemoveCredsResponse) {}
}

message UpdateCredsRequest {
  // Container's Image field (e.g. imageID or imageDigest).
  string image = 1;

  // Authentication configuration for pulling the image.
  AuthConfig auth = 2;
}

message UpdateCredsResponse {}

// AuthConfig contains authorization information for connecting to a registry.
message AuthConfig {
  string username = 1;
  string password = 2;
  string auth = 3;
  string server_address = 4;
  // IdentityToken is used to authenticate the user and get
  // an access token for the registry.
  string identity_token = 5;
  // RegistryToken is a bearer token to be sent to a registry.
  string registry_token = 6;
}

message RemoveCredsRequest {
  // Container's Image field (e.g. imageID or imageDigest).
  string image = 1;
}

message RemoveCredsResponse {}
