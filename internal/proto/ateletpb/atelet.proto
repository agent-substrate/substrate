syntax = "proto3";

package atelet;

import "google/protobuf/timestamp.proto";

option go_package = "go.ate.dev/substrate/internal/proto/ateletpb";

// WorkerSupport provides callouts for worker implementations.
//
// Called by individual worker pods over a local connection, authenticated with
// the worker's k8s pod identity mTLS certificate.
service WorkerSupport {
  // Request an atunnel certificate for the given actor.
  //
  // TODO(identity): Rename to MintAtunnelCertificate, as distinct from
  // MintActorCertificate (which would be used for certificates projected into
  // the actor filesystem, when/if we support those).
  rpc MintActorCertificate(MintActorCertificateRequest) returns (MintActorCertificateResponse) {}

  // AcquireWorkerEpoch hands out a new epoch for this worker process, for
  // atelet to forward to the control plane's WorkerService, which this
  // mirrors. A worker process calls it once at startup, before RegisterWorker.
  rpc AcquireWorkerEpoch(AcquireWorkerEpochRequest) returns (AcquireWorkerEpochResponse) {}

  // RegisterWorker activates the epoch this worker process acquired and
  // records its pod IPs and capacity. A worker process registers once, and
  // takes no workloads until it has. FAILED_PRECONDITION means another worker
  // process has registered since; this one must not serve.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse) {}

  // SetWorkerSandboxRuntimes records the sandbox runtimes this worker process
  // can run. Called after RegisterWorker, and again whenever they change.
  rpc SetWorkerSandboxRuntimes(SetWorkerSandboxRuntimesRequest) returns (SetWorkerSandboxRuntimesResponse) {}

  // RequestActorSuspend asks that the actor this worker hosts be suspended,
  // for atelet to forward to the control plane's WorkerService, which this
  // mirrors.
  //
  // Success means the control plane ran the suspend; an error is its refusal,
  // passed through as it was given, so a worker can tell a decision from a
  // failure to ask. Callers must not hold a lock the resulting Checkpoint
  // would need: the control plane answers this by driving a suspend back
  // through atelet into the calling worker.
  rpc RequestActorSuspend(RequestActorSuspendRequest) returns (RequestActorSuspendResponse) {}

  // GetActorEgressPolicy returns the egress policy of the actor this
  // worker hosts, which atelet reads from the control plane's
  // Control.GetActorEgressPolicy. An error is the control plane's, passed
  // through as it was given.
  rpc GetActorEgressPolicy(GetActorEgressPolicyRequest) returns (GetActorEgressPolicyResponse) {}

  // ReportActorCrashed reports that the sandbox of the actor this worker
  // hosts died on its own, for atelet to forward to the control plane's
  // WorkerService, which this mirrors.
  rpc ReportActorCrashed(ReportActorCrashedRequest) returns (ReportActorCrashedResponse) {}
}

message AcquireWorkerEpochRequest {
}

message AcquireWorkerEpochResponse {
  // The epoch handed out, for this worker process to register with.
  int64 epoch = 1;
}

message RegisterWorkerRequest {
  // The epoch this worker process acquired through AcquireWorkerEpoch.
  //
  // +k8s:required
  // +k8s:minimum=1
  int64 epoch = 2;

  // The worker pod's IPs, at most one per IP family, in the order Kubernetes
  // reports them.
  //
  // +k8s:required
  // +k8s:maxItems=2
  // +k8s:listType=atomic
  repeated string ips = 3;

  // What the worker can supply. atelet converts it to the control plane's
  // WorkerResources when forwarding.
  //
  // +k8s:required
  WorkerResources capacity = 1;
}

message SetWorkerSandboxRuntimesRequest {
  // The epoch this worker process registered with.
  //
  // +k8s:required
  // +k8s:minimum=1
  int64 epoch = 1;

  // The sandbox classes this worker runs and the compatibility versions it
  // runs them under. atelet converts it to the control plane's
  // WorkerSandboxClass when forwarding.
  //
  // +k8s:required
  // +k8s:minItems=1
  // +k8s:maxItems=1 # keep in sync with WorkerPoolSpec.sandboxClasses
  // +k8s:listType=map
  // +k8s:listMapKey=sandbox_class
  repeated WorkerSandboxClass sandbox_classes = 2;
}

message SetWorkerSandboxRuntimesResponse {
}

// WorkerSandboxClass is one sandbox class a worker runs, with the runtimes
// it runs it under. It mirrors the control plane's WorkerSandboxClass and is
// validated by the same rules.
message WorkerSandboxClass {
  // e.g. "gvisor", "microvm"
  //
  // +k8s:required
  // +k8s:maxLength=63
  // +k8s:customValidation # gvisor or microvm
  string sandbox_class = 1;

  // Runtime new and cold-booted actors of this class start under. Snapshots
  // matching its version can also warm-boot on this worker.
  //
  // +k8s:required
  WorkerSandboxRuntime default_runtime = 2;

  // Additional runtimes of this class (excluding default_runtime) that this
  // worker can restore snapshots from right now.
  //
  // +k8s:optional
  // +k8s:maxItems=32
  // +k8s:listType=atomic
  repeated WorkerSandboxRuntime restorable_runtimes = 3;
}

// WorkerSandboxRuntime is one runtime a worker runs for the class of its
// WorkerSandboxClass entry. It mirrors the control plane's
// WorkerSandboxRuntime and is validated by the same rules.
message WorkerSandboxRuntime {
  // Compatibility version stamped onto an actor's snapshot when a checkpoint
  // is taken on this runtime. Snapshots matching it can warm-boot on this
  // runtime.
  //
  // +k8s:required
  VersionedSandboxCompat version = 1;
}

// ActorSandboxRuntime is the runtime an actor runs under, as named on Run and
// Restore. It mirrors the control plane's ActorSandboxRuntime and is validated by
// the same rules.
message ActorSandboxRuntime {
  // e.g. "gvisor", "microvm"
  //
  // +k8s:required
  // +k8s:maxLength=63
  // +k8s:customValidation # gvisor or microvm
  string sandbox_class = 1;

  // Compatibility version of the runtime.
  //
  // +k8s:required
  VersionedSandboxCompat version = 2;
}

// VersionedSandboxCompat holds the compatibility schema version and the
// key-value compatibility attributes of a sandbox runtime.
message VersionedSandboxCompat {
  // Compatibility schema version (e.g. "v1") defining which runtime and
  // hardware attributes are recorded and how they are computed.
  //
  // +k8s:required
  // +k8s:maxLength=64
  string schema_version = 1;

  // Key-value compatibility attributes defined by this schema version, covering
  // both runtime assets (e.g. "sandbox_bundle_hash") and effective guest
  // hardware features after masking (e.g. "architecture", "cpu_features").
  // Matched against a snapshot under the same schema_version: every attribute
  // on the snapshot must be present on the worker with an equal value (except
  // "cpu_features", where the snapshot's hexadecimal bitmask must be a bitwise
  // subset of the worker's); keys only the worker has are ignored. Bump
  // schema_version when a key's meaning changes or older snapshots must no
  // longer match.
  // Order as sent does not matter: ate-api-server sorts attributes by key
  // before recording them.
  //
  // +k8s:required
  // +k8s:maxItems=32
  // +k8s:listType=map
  // +k8s:listMapKey=key
  repeated AttributeEntry attributes = 2;
}

// AttributeEntry is a single key-value compatibility attribute.
message AttributeEntry {
  // Attribute name (e.g. "architecture", "cpu_features", "sandbox_bundle_hash").
  //
  // +k8s:required
  // +k8s:maxLength=128
  string key = 1;

  // Attribute value corresponding to key.
  //
  // +k8s:required
  // +k8s:maxLength=256
  string value = 2;
}

// WorkerResources is what a worker can supply. It mirrors the control plane's
// WorkerResources and is validated by the same rules.
message WorkerResources {
  // cpu_millicores is CPU in millicores (1000 = one core). Compared against
  // actors' resource limits for placement.
  //
  // +k8s:optional
  // +k8s:minimum=0
  // +k8s:maximum=999999 # less than 1000 cores
  int64 cpu_millicores = 1;

  // memory_bytes is memory in bytes. Compared against actors' resource
  // limits for placement.
  //
  // +k8s:optional
  // +k8s:minimum=0
  int64 memory_bytes = 2;

  // A count of Actors. Workers can use this to limit the number of Actors
  // that can be placed on them, constraining costs not captured in the
  // resources above.
  //
  // +k8s:optional
  // +k8s:minimum=1
  int32 actors = 3;
}

// ResourceRequirements are the compute resources a workload may use.
message ResourceRequirements {
  // limits is the maximum amount of compute resources allowed.
  //
  // +k8s:optional
  Resources limits = 1;
}

// Resources is an amount of each compute resource.
message Resources {
  // cpu_millicores is CPU in millicores (1000 = one core). 0 means none.
  //
  // +k8s:optional
  // +k8s:minimum=0
  // +k8s:maximum=999999 # less than 1000 cores
  int64 cpu_millicores = 1;

  // memory_bytes is memory in bytes. 0 means none.
  //
  // +k8s:optional
  // +k8s:minimum=0
  int64 memory_bytes = 2;
}

message RegisterWorkerResponse {
}

message RequestActorSuspendRequest {
  // The actor the calling worker is hosting. atelet forwards this to the
  // control plane, which serves it only if the actor is assigned to the worker
  // the caller's certificate names.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_atespace = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;

  // The UID of the actor --- used to guard against deletion and recreation of
  // an actor with the same name, as for MintActorCertificate.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
}

message RequestActorSuspendResponse {
}

message ReportActorCrashedRequest {
  // The actor the calling worker is hosting, as for RequestActorSuspend.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_atespace = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;

  // What the worker saw, e.g. how the sandbox exited.
  //
  // +k8s:required
  // +k8s:maxLength=4096
  string message = 4;
}

message ReportActorCrashedResponse {
}

message GetActorEgressPolicyRequest {
  // The actor the calling worker is hosting. atelet reads its policy from the
  // control plane by name.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_atespace = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;
}

message GetActorEgressPolicyResponse {
  // The actor's policy, copied from the control plane's. Unset if the actor
  // has no policy, which denies all of its egress, DNS included.
  EgressPolicy egress_policy = 1;
}

// EgressPolicy is the part of the control plane's EgressPolicy that a worker
// enforces itself: which destinations each rule allows. The resource metadata
// and the rules' effects are left out; only the egress gateway applies them,
// so the credentials they refer to never reach the worker.
message EgressPolicy {
  // Rules are an unordered set of allows, as in the control plane's policy.
  repeated EgressRule rules = 1;
}

// EgressRule mirrors the control plane's EgressRule: exactly one field is set,
// naming the rule's protocol. A rule with none set has a protocol this copy
// does not carry yet, and allows nothing.
message EgressRule {
  // Cleartext HTTP to the named hosts.
  EgressDestinations http = 1;

  // HTTPS to the named hosts, intercepted by the egress gateway.
  EgressDestinations https = 2;

  // TLS to the named servers, forwarded without decryption.
  EgressDestinations tls_passthrough = 3;
}

// EgressDestinations is the hostnames and ports a rule allows, copied from the
// control plane's HTTPRule, HTTPSRule, or TLSPassthroughRule.
message EgressDestinations {
  // Hostnames as the control plane's rule has them, wildcards included.
  repeated string hostnames = 1;

  // The ports the rule allows, with the control plane's defaults applied.
  EgressPorts ports = 2;
}

// EgressPorts mirrors the control plane's Ports: either all ports, or the
// listed numbers.
message EgressPorts {
  // Set if the rule allows every port.
  EgressAllPorts all = 1;

  // The port numbers the rule allows, when all is unset.
  repeated int32 numbers = 2;
}

// EgressAllPorts marks a rule as allowing every port.
message EgressAllPorts {}

message MintActorCertificateRequest {
  // The actor for which the certificate should be issued.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_atespace = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;

  // The UID of the actor --- used to guard against deletion and recreation of
  // an actor with the same name.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;

  // DER-encoded PKCS #10 certificate signing request. Atunnel retains the
  // corresponding private key.
  //
  // +k8s:required
  // +k8s:maxBytes=16384 # matches the control-plane MintActorCertificateRequest bound this is forwarded to
  bytes certificate_signing_request = 4;
}

message MintActorCertificateResponse {
  // DER-encoded leaf followed by any intermediate certificates.
  repeated bytes actor_certificates = 1;
}

// Atelet allows ate-apiserver to issue control calls to the atelet.
//
// Called by ate-api-server over cluster networking.  ate-api-server
// authenticates with its k8s pod identity mTLS certificate.
//
// atelet runs at most one Run, Restore, Checkpoint, PromoteSnapshot,
// DetachActor, or Terminate of an actor at a time. A call waits for the one in
// progress, up to the call's deadline.
service Atelet {
  // Run tells atelet to create a new containerized workload from scratch on a
  // worker.
  rpc Run(RunRequest) returns (RunResponse) {}

  // Checkpoint saves the workload's state as a new snapshot of the actor and
  // returns the worker to a blank state. upload_config says when the snapshot
  // becomes durable. Once the new snapshot is uploaded or stored locally,
  // atelet deletes the actor's older local snapshots, except one still being
  // uploaded, which it deletes after that upload ends. A Checkpoint that fails
  // before then leaves the actor's previous local snapshot in place.
  //
  // A Checkpoint of a snapshot already committed, as a retry's is, returns the
  // actor's state without checkpointing the workload again; under
  // UPLOAD_MODE_IMMEDIATE it first uploads the snapshot if it is not durable
  // yet.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse) {}

  // Restore restores a workload from a snapshot onto a worker.
  rpc Restore(RestoreRequest) returns (RestoreResponse) {}

  // PromoteSnapshot makes `snapshot` durable in object storage while keeping
  // its local copy on this node. Used when a snapshot needs to be in object
  // storage (e.g. for tagging) without evicting the suspended actor's local
  // snapshot from the node. Waits for an in-flight detach, and fails for an
  // actor running on this node.
  //
  // atelet never uploads a local copy written before the node last rebooted,
  // since its files may be torn: it answers from the manifest at
  // `snapshot.object` instead, and fails with NOT_FOUND if there is none.
  //
  // Idempotent: once the snapshot is durable, atelet answers from the
  // manifest at `snapshot.object`, and fails if there is none.
  //
  // TODO: Temporarily, this does not check whether the actor is running.
  rpc PromoteSnapshot(PromoteSnapshotRequest) returns (PromoteSnapshotResponse) {}

  // DetachActor makes the actor's latest local snapshot durable, then deletes
  // the actor's local snapshots on this node, so it can resume on any node.
  // atelet also detaches a suspended actor on its own after its detach delay.
  // It reports either detach with WorkerService.ReportActorSnapshotState, so
  // the control plane records a DetachActor call's detach even if the caller
  // does not, and once reported, forgets the actor. The detach doesn't end with
  // the call: if the caller's context ends first, DetachActor returns that
  // error and the detach runs on. Waits for an operation already in progress on
  // the actor, such as an upload or a detach. Does nothing when atelet holds no
  // local snapshot for the actor. Returns ABORTED when the actor runs on this
  // node, and FAILED_PRECONDITION when atelet cannot make the latest local
  // snapshot durable, such as when it has no `snapshot.object`.
  rpc DetachActor(DetachActorRequest) returns (DetachActorResponse) {}

  // Terminate tells atelet to terminate/kill any running workload for an actor,
  // unmount its volumes, and clean up actor state on the node.
  rpc Terminate(TerminateRequest) returns (TerminateResponse) {}
}

message TerminateRequest {
  // The UID of the worker pod whose the worker hosts the actor. If unset, atelet
  // only cleans up the actor's node resources; it does not reach a worker.
  //
  // +k8s:optional
  // +k8s:format=k8s-uuid
  string worker_pod_uid = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 2;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 3;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 4;

  // The template identity is carried for metrics attribution.
  //
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 5;

  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 6;

  // A nil spec is tolerated: the delete flow terminates template-less
  // actors with a fallback spec.
  //
  // +k8s:optional
  WorkloadSpec spec = 7;
}

message TerminateResponse {
}

message RunRequest {
  // The UID of the worker pod whose the worker hosts the actor.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string worker_pod_uid = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 2;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 3;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 4;

  // The template identity is carried for metrics attribution.
  //
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 5;

  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 6;

  // +k8s:required
  WorkloadSpec spec = 7;

  // When absent the actor has no egress: its TCP is captured and refused.
  //
  // +k8s:optional
  optional EgressGateway egress_gateway = 9;

  // The actor's declared size, from the ActorTemplate's resource limits. atelet
  // passes these through to the sandbox so it is sized to the actor (not the
  // whole host or worker pod). A zero limit keeps the runtime default.
  //
  // +k8s:optional
  ResourceRequirements resources = 10;

  // The runtime the assigned worker runs this actor under, from
  // WorkerAssignment.sandbox_runtime. atelet resolves the sandbox binaries
  // through its advertised-runtime index and records the runtime for the
  // actor so a later Checkpoint pins the snapshot to it.
  //
  // +k8s:required
  ActorSandboxRuntime sandbox_runtime = 12;
}

// EgressGateway configures tunneled egress for one actor activation.
message EgressGateway {
  // address is required and identifies the remote gateway as an IP address or
  // DNS name followed by its port.
  //
  // +k8s:required
  // +k8s:maxLength=261 # a bracketed or 253-character host, ':' and a 5-digit port
  // +k8s:customValidation # host:port shape
  string address = 1;
}

// WorkloadSpec parallels Pod, but with far fewer configurable fields.
//
// +k8s:customValidation # every volume mount names a declared volume
message WorkloadSpec {
  // +k8s:optional
  // +k8s:maxItems=10 # matches the template's containers bound
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Container containers = 1;

  // +k8s:optional
  // +k8s:maxItems=32 # matches the template's volumes bound
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Volume volumes = 2;
}

message DurableDirVolumeSource {
}

message ExternalVolumeSource {
  // Required, unlike the actor status counterpart: the control plane only
  // sends volumes that finished provisioning.
  //
  // +k8s:required
  // +k8s:maxLength=256 # matches ExternalVolumeStatus.storage_volume_id's bound
  // +k8s:customValidation # no control characters
  string storage_volume_id = 1;

  // +k8s:optional
  // +k8s:maxLength=253 # matches ExternalVolumeStatus.volume_type's bound
  // +k8s:customValidation # optional "substrate.io/" prefix + DNS subdomain
  string volume_type = 2;

  // volume_context is the driver's provisioning metadata. Its entries are the
  // driver's own, so the map is only bounded, not validated.
  //
  // +k8s:optional
  // +k8s:customValidation # at most 40 KiB in total, ten times the CSI limit for map fields
  map<string, string> volume_context = 3;

  // publish_context is the driver's attachment metadata for this node, which
  // the node plugin needs to complete the mount. Bounded like volume_context.
  //
  // +k8s:optional
  // +k8s:customValidation # at most 40 KiB in total, ten times the CSI limit for map fields
  map<string, string> publish_context = 4;
}

message ImageVolumeSource {
  // reference is the OCI image reference, pinned by digest.
  //
  // +k8s:required
  // +k8s:maxLength=512 # matches the template ImageVolumeSource.reference's bound
  // +k8s:customValidation # must be a well-formed image reference, pinned by digest
  string reference = 1;
}

// ActorMetadataField selects one identity field of the actor.
enum ActorMetadataField {
  ACTOR_METADATA_FIELD_UNSPECIFIED = 0;
  ACTOR_METADATA_FIELD_NAME = 1;
  ACTOR_METADATA_FIELD_ATESPACE = 2;
  ACTOR_METADATA_FIELD_UID = 3;
  // Keep this in sync with the maximums on fields of this type.
}

// ActorMetadataItem projects one actor identity field to one file at the
// given path, relative to the root of the enclosing system-info volume.
message ActorMetadataItem {
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3 # keep this in sync with the ActorMetadataField enum
  ActorMetadataField field = 1;

  // path must be a clean relative Unix path; the rule is shared with the
  // control plane through internal/resources.
  //
  // +k8s:required
  // +k8s:minLength=1
  // +k8s:maxLength=255
  // +k8s:customValidation # clean relative path
  string path = 2;
}

// ActorMetadataDataSource projects the actor's identity fields to files, one
// per item. Values are written raw with no trailing newline.
message ActorMetadataDataSource {
  // items must not project the same field twice.
  //
  // +k8s:required
  // +k8s:minItems=1
  // +k8s:maxItems=8 # matches the template's items bound
  // +k8s:listType=atomic
  // +k8s:unique=map
  // +k8s:listMapKey=field
  repeated ActorMetadataItem items = 1;
}

// TrustBundleDataSource corresponds to TrustBundleDataSource in ateapi.proto
message TrustBundleDataSource {
  // path must be a clean relative Unix path; the rule is shared with the
  // control plane through internal/resources.
  //
  // +k8s:required
  // +k8s:minLength=1
  // +k8s:maxLength=255
  // +k8s:customValidation # clean relative path
  string path = 1;
  // +k8s:required
  // +k8s:minItems=1
  // +k8s:maxItems=8 # matches the template's names bound
  // +k8s:listType=set
  // +k8s:eachVal=+k8s:minLength=1
  // +k8s:eachVal=+k8s:maxLength=253 # matches the template's bundle-name bound
  repeated string names = 2;
}

// SystemInfoDataSource selects exactly one projection to place in the
// volume.
message SystemInfoDataSource {
  // Exactly one of actor_metadata / trust_bundle must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  ActorMetadataDataSource actor_metadata = 1;

  // +k8s:optional
  // +k8s:unionMember
  TrustBundleDataSource trust_bundle = 2;
}

// SystemInfoVolumeSource is a read-only volume whose files are generated by
// atelet on every Run/Restore, so they carry the values of the actor actually
// being started, whatever checkpointed state it boots from.
message SystemInfoVolumeSource {
  // +k8s:optional
  // +k8s:maxItems=8 # matches the template's data_sources bound
  // +k8s:listType=atomic
  // +k8s:customValidation # at most one actor_metadata; paths unique across entries
  repeated SystemInfoDataSource data_sources = 1;
}

// Volume names one volume and selects exactly one source for it.
message Volume {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // Exactly one of durable_dir / external / system_info / image must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  DurableDirVolumeSource durable_dir = 2;

  // +k8s:optional
  // +k8s:unionMember
  ExternalVolumeSource external = 3;

  // +k8s:optional
  // +k8s:unionMember
  SystemInfoVolumeSource system_info = 4;

  // +k8s:optional
  // +k8s:unionMember
  ImageVolumeSource image = 5;
}

message VolumeMount {
  // name must match the name of a Volume.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // mount_path within the container. Must be a clean absolute Unix path.
  //
  // +k8s:required
  // +k8s:maxLength=4096
  // +k8s:customValidation # clean-absolute-path shape; no regex/pattern tag exists
  string mount_path = 2;
}

message Container {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // +k8s:required
  // +k8s:maxLength=512 # matches the template Container.image's bound
  // +k8s:customValidation # must be a well-formed image reference, pinned by digest
  string image = 2;

  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=atomic
  // +k8s:eachVal=+k8s:maxLength=4096 # argv strings; guardrail, not a contract
  repeated string command = 3;

  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=atomic
  // +k8s:eachVal=+k8s:maxLength=4096 # argv strings; guardrail, not a contract
  repeated string args = 7;

  // +k8s:optional
  // +k8s:maxItems=32 # matches the template's env bound
  // +k8s:listType=map # each variable is set at most once
  // +k8s:listMapKey=name
  repeated EnvVar env = 4;

  // +k8s:optional
  WakeupProbe wakeup_probe = 5;

  // Keyed by mount_path: each path hosts exactly one mount, while a volume
  // may be mounted at multiple paths.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches the template's volume_mounts bound
  // +k8s:listType=map
  // +k8s:listMapKey=mount_path
  // +k8s:customValidation # mounts must not nest
  repeated VolumeMount volume_mounts = 6;

  // +k8s:optional
  SecurityContext security_context = 8;

  // resources are the cgroup limits for this container, from the
  // ActorTemplate. Unset means no limits.
  //
  // +k8s:optional
  ResourceRequirements resources = 9;
}

// SecurityContext holds security settings for a container's process.
message SecurityContext {
  // +k8s:optional
  Capabilities capabilities = 1;
}

// Capabilities adjusts a container's Linux capabilities relative to the default
// set. Names carry no "CAP_" prefix; drop applies before add.
message Capabilities {
  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=set
  // +k8s:customValidation # capability grammar; "ALL" not accepted
  repeated string add = 1;

  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=set
  // +k8s:customValidation # capability grammar
  repeated string drop = 2;
}

message EnvVar {
  // name may be any printable ASCII character except '='.
  //
  // +k8s:required
  // +k8s:maxLength=256 # guardrail
  // +k8s:customValidation # printable ASCII except '='
  string name = 1;

  // +k8s:optional
  // +k8s:maxLength=32768 # guardrail
  string value = 2 [ debug_redact = true ];
}

// WakeupProbe describes how to check that a container is ready to serve.
// Only HTTP is supported today.
message WakeupProbe {
  // +k8s:required
  HttpGetAction http_get = 1;

  // How long to keep polling before giving up and failing the actor start.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3600 # matches the template wakeup probe's bound
  int32 timeout_seconds = 2;
}

// HttpGetAction performs an HTTP GET against the container.
message HttpGetAction {
  // Path to access on the HTTP server.
  //
  // +k8s:required
  // +k8s:maxLength=1024 # matches the template probe path's bound
  // +k8s:customValidation # RFC 3986 path shape; no regex/pattern tag exists
  string path = 1;

  // TCP port to connect to (1..65535).
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=65535
  int32 port = 2;
}

message RunResponse {
  // The epoch of the worker process that started the workload, as it
  // registered with the control plane.
  int64 worker_epoch = 1;
}

// SnapshotFidelity mirrors the public ateapi enum: the state layers a
// snapshot holds, lowest to highest, each including the ones below it.
enum SnapshotFidelity {
  // Not valid option; should never happen.
  SNAPSHOT_FIDELITY_UNSPECIFIED = 0;
  // Capture only the contents of attached volumes that support snapshots
  // (currently DurableDir-typed volumes). Memory and the rest of rootfs are
  // excluded.
  SNAPSHOT_FIDELITY_VOLUMES = 1;
  // Volumes plus the root filesystem changes made since boot.
  SNAPSHOT_FIDELITY_ROOTFS = 2;
  // Capture process memory plus the full filesystem delta on top of the OCI
  // image (including any attached DurableDir volumes).
  SNAPSHOT_FIDELITY_MEMORY = 3;
  // Keep this in sync with the maximums on fields of this type.
}

message ObjectStorage {
  // The object storage URI of the snapshot. Object names are appended to it,
  // so it addresses the snapshot as a whole rather than any one object.
  //
  // +k8s:required
  // +k8s:maxLength=2048
  // +k8s:customValidation # a parseable snapshot URI
  string snapshot_uri = 1;

  // How the snapshot at snapshot_uri may be consumed, as the control plane
  // knows it. Read on Restore, where it decides whether atelet may serve the
  // snapshot's files from its node-local cache; meaningless where atelet
  // writes to the snapshot.
  //
  // +k8s:optional
  // +k8s:maximum=2 # keep this in sync with the SnapshotSharing enum
  SnapshotSharing sharing = 2;
}

// SnapshotSharing is how a snapshot in object storage may be consumed, as
// known by the control plane. atelet never infers it from the URI.
enum SnapshotSharing {
  // Not stated: treated as PRIVATE.
  SNAPSHOT_SHARING_UNSPECIFIED = 0;
  // Read by one actor and replaced by its next suspend. Never cached.
  SNAPSHOT_SHARING_PRIVATE = 1;
  // Immutable once published and read by many actors, such as a tag's
  // snapshot borrowed at creation. atelet may serve its files from the
  // node-local snapshot cache.
  SNAPSHOT_SHARING_SHARED = 2;
}

// Snapshot identifies one snapshot of an actor, and where its durable copy
// lives.
message Snapshot {
  // ateapi Snapshot.uuid. Names the snapshot's directory under the actor's
  // local-checkpoint directory, so this is a bare name and must not contain
  // a path separator.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string snapshot_uuid = 1;

  // ateapi Snapshot.generation, starting at 1. Orders the actor's snapshots.
  // Checkpoint and PromoteSnapshot fail for a generation below atelet's newest
  // for the actor, or for its newest under another snapshot_uuid: the
  // caller's view is stale.
  //
  // +k8s:required
  // +k8s:minimum=1
  int32 generation = 2;

  // On Checkpoint: the fidelity to capture.
  // On Restore: the fidelity to restore the actor with.
  // On PromoteSnapshot: the lowest fidelity the snapshot may hold. The call
  // fails if its manifest records a lower one.
  // In SnapshotReport: the fidelity the snapshot holds.
  //
  // TODO: Open question: should PromoteSnapshot accept a manifest that records
  // a higher fidelity than this? Until that is decided, atelet requires the
  // two to be equal.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3 # keep this in sync with the SnapshotFidelity enum
  SnapshotFidelity fidelity = 3;

  // The snapshot's durable copy in object storage: atelet uploads there, or
  // reads from there when it holds no usable local copy.
  //
  // +k8s:required
  ObjectStorage object = 4;
}

// SnapshotReport is a snapshot atelet holds or has uploaded, and when.
message SnapshotReport {
  Snapshot snapshot = 1;

  // When the checkpoint that produced the snapshot committed on this node.
  google.protobuf.Timestamp local_commit_time = 2;

  // When the snapshot's manifest, the upload's commit marker, was written to
  // object storage. Set only in ActorSnapshotState.latest_durable, and only
  // when this atelet wrote it.
  google.protobuf.Timestamp durable_complete_time = 3;
}

// ActorSnapshotState is what atelet holds for one actor on this node.
// Returned by Checkpoint, PromoteSnapshot, DetachActor.
message ActorSnapshotState {
  // The snapshot atelet restores the actor from locally. Unset when an
  // UPLOAD_MODE_IMMEDIATE checkpoint could not keep a local copy, and once a
  // detach has made the snapshot durable and begun deleting it. Either way,
  // latest_durable is then the actor's latest snapshot.
  SnapshotReport latest_local = 1;

  // The snapshot a background upload has begun making durable, if any. Once
  // begun, atelet keeps uploading it across checkpoints and restarts until
  // it succeeds, fails and a newer local snapshot replaces it, or a newer
  // snapshot becomes durable. If it is latest_local, its local copy stays
  // after the upload. If it is an older snapshot, atelet deletes its local
  // copy once the upload ends or is replaced.
  SnapshotReport uploading = 2;

  // The newest snapshot atelet knows is durable, whether or not the control
  // plane has recorded it: one atelet uploaded since it started, or one a
  // PromoteSnapshot found already uploaded, while atelet still tracks the
  // actor. Unset if there is none (or once the actor is detached and
  // reported), which says nothing about older durable snapshots.
  SnapshotReport latest_durable = 3;

  // When atelet next plans to trigger a background upload, of `uploading` if
  // it is waiting to resume or retry, or of `latest_local` otherwise. Unset
  // when neither needs an upload. Advisory: a promote or detach can upload
  // it sooner, and an upload or promote in progress can delay it.
  google.protobuf.Timestamp upload_due_time = 4;
}

// UploadConfig is when a checkpoint's snapshot becomes durable.
message UploadConfig {
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=2 # keep this in sync with the UploadMode enum
  UploadMode mode = 1;
}

// UploadMode is when a checkpoint's snapshot is uploaded.
enum UploadMode {
  UPLOAD_MODE_UNSPECIFIED = 0;

  // Keep the snapshot locally and upload it on atelet's schedule: about
  // atelet's upload-delay after the oldest snapshot of the actor that is not
  // yet durable was taken, or later while an upload is in progress or
  // failing. Snapshots superseded before then are never uploaded.
  //
  // Once the actor has stayed suspended on this node for atelet's
  // detach-delay, atelet detaches it: it uploads the latest local snapshot
  // unless that is durable already, then deletes all the local snapshots.
  //
  // atelet reports the actor's state with
  // WorkerService.ReportActorSnapshotState once such an upload makes a newer
  // snapshot durable, and once such a detach has deleted the local snapshots.
  UPLOAD_MODE_DEFERRED = 1;

  // Upload the snapshot synchronously before Checkpoint returns, and keep a
  // local copy if atelet can: failing to store it does not fail the
  // Checkpoint.
  UPLOAD_MODE_IMMEDIATE = 2;
  // Keep this in sync with the maximums on fields of this type.
}

message CheckpointRequest {
  // The UID of the worker pod whose the worker hosts the actor.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string worker_pod_uid = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 2;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 3;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 4;

  // The template identity is carried for metrics attribution.
  //
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 5;

  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 6;

  // Sandbox binary config is not sent on checkpoint: atelet uses the version the
  // actor is currently running (recorded with the actor's on-node state at
  // Run/Restore) and records it into the snapshot manifest.
  //
  // +k8s:required
  WorkloadSpec spec = 7;

  // The snapshot to take, and where it is uploaded. atelet may upload it long
  // after Checkpoint returns, without asking the control plane. A request at
  // atelet's newest generation for the actor, with the same snapshot_uuid,
  // is a retry: atelet returns the actor's current state without
  // checkpointing again.
  //
  // TODO: Temporarily, atelet does not recognize retries. A retry runs the
  // checkpoint again, which fails once an earlier attempt has removed the
  // workload.
  //
  // +k8s:required
  Snapshot snapshot = 8;

  // When the snapshot becomes durable.
  //
  // +k8s:required
  UploadConfig upload_config = 9;
}

message CheckpointResponse {
  // The actor's state once the checkpoint is taken: latest_local is the new
  // snapshot, unless UPLOAD_MODE_IMMEDIATE could not keep a local copy.
  // atelet has deleted any local snapshot not named here, or deletes it once
  // uploading ends.
  //
  // TODO: Add a snapshot garbage collection system for orphaned objects in
  // object storage. atelet reports a background upload only when it records
  // a newer durable snapshot, so an upload that a newer durable snapshot
  // superseded while it ran leaves objects ateapi never learned were durable.
  ActorSnapshotState state = 1;
}

message RestoreRequest {
  // The UID of the worker pod whose the worker hosts the actor.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string worker_pod_uid = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 2;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 3;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 4;

  // The template identity is carried for metrics attribution.
  //
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 5;

  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 6;

  // +k8s:required
  WorkloadSpec spec = 7;

  // Snapshot to restore from. atelet reads its local copy if it holds a
  // usable one, and `snapshot.object` otherwise. A local copy is unusable if
  // its manifest does not parse, lists a missing file, or was written before
  // the node last rebooted. While atelet is detaching the actor, it waits for
  // the detach to finish and then reads `snapshot.object`. Fails if neither
  // copy exists: that generation is lost.
  //
  // `snapshot.object` is required even while the control plane has not
  // recorded the snapshot's upload complete: atelet may have uploaded the
  // snapshot and detached the actor before its report of the upload landed.
  //
  // +k8s:required
  Snapshot snapshot = 8;

  // When absent the actor has no egress: its TCP is captured and refused.
  //
  // +k8s:optional
  optional EgressGateway egress_gateway = 9;

  // The actor's declared size, from the ActorTemplate's resource limits. For
  // gVisor and micro-VM VOLUMES restores the sandbox is (re)sized to these;
  // for a MEMORY micro-VM restore the size baked into the snapshot wins. Zero
  // means "unset": keep the runtime default.
  //
  // +k8s:optional
  ResourceRequirements resources = 10;

  // The runtime the assigned worker restores this actor under, from
  // WorkerAssignment.sandbox_runtime. atelet resolves the sandbox binaries
  // through its advertised-runtime index and records the runtime for the
  // actor so the next Checkpoint pins the snapshot to what ran this
  // activation, not what the restored snapshot was taken under.
  //
  // +k8s:required
  ActorSandboxRuntime sandbox_runtime = 12;
}

message RestoreResponse {
  // The epoch of the worker process that restored the workload, as it
  // registered with the control plane.
  int64 worker_epoch = 1;
}

message PromoteSnapshotRequest {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;

  // For metrics attribution, like on CheckpointRequest.
  //
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 4;

  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 5;

  // The actor's latest snapshot as the control plane records it, and where
  // it is, or will be, uploaded.
  //
  // +k8s:required
  Snapshot snapshot = 6;
}

message PromoteSnapshotResponse {
  // The actor's state once promoted: latest_durable is its latest snapshot,
  // and latest_local remains set if atelet still holds the local copy.
  ActorSnapshotState state = 1;
}

message DetachActorRequest {
  // Golden actors are accepted: an IMMEDIATE checkpoint keeps a local copy.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;

  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
}

message DetachActorResponse {
  // The actor's state from the detach: latest_local is unset, and
  // latest_durable is its latest snapshot. Once detached and reported, atelet
  // forgets the actor, so calling DetachActor again returns an empty state.
  ActorSnapshotState state = 1;
}
