syntax = "proto3";

package atelet;

option go_package = "github.com/agent-substrate/substrate/internal/proto/ateletpb";

import "pkg/proto/ateapipb/ateapi.proto";

// AteomSupport provides callouts for ateom.
//
// Called by individual ateom pods over a local connection, authenticated with
// ateom's k8s pod identity mTLS certificate.
service AteomSupport {
  // Request an atunnel certificate for the given actor.
  //
  // TODO(identity): Rename to MintAtunnelCertificate, as distinct from
  // MintActorCertificate (which would be used for certificates projected into
  // the actor filesystem, when/if we support those).
  rpc MintActorCertificate(MintActorCertificateRequest) returns (MintActorCertificateResponse) {}

  // Report capacity and supply for this worker back to atelet.
  rpc SetWorkerCapacity(SetWorkerCapacityRequest) returns (SetWorkerCapacityResponse) {}

  // RequestActorSuspend asks that the actor this worker hosts be suspended,
  // for atelet to forward to the control plane's WorkerService, which this
  // mirrors.
  //
  // Success means the control plane ran the suspend; an error is its refusal,
  // passed through as it was given, so a worker can tell a decision from a
  // failure to ask. Callers must not hold a lock the resulting Checkpoint
  // would need: the control plane answers this by driving a suspend back
  // through atelet into the calling ateom.
  rpc RequestActorSuspend(RequestActorSuspendRequest) returns (RequestActorSuspendResponse) {}
}

message SetWorkerCapacityRequest {
  // What the worker can supply, in the same vocabulary the control plane
  // records and an ActorTemplate asks in.
  //
  // +k8s:required
  // +k8s:opaqueType # cross-package type; descending into ateapipb is not wired up yet
  ateapi.WorkerResources capacity = 1;
}

message SetWorkerCapacityResponse {
}

message RequestActorSuspendRequest {
  // The actor the calling worker is hosting. atelet forwards this to the
  // control plane, which serves it only if the actor is assigned to the worker
  // the caller's certificate names.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_atespace = 1;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;

  // The UID of the actor --- used to guard against deletion and recreation of
  // an actor with the same name, as for MintActorCertificate.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
}

message RequestActorSuspendResponse {
}

message MintActorCertificateRequest {
  // The actor for which the certificate should be issued.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_atespace = 3;

  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 4;

  // The UID of the actor --- used to guard against deletion and recreation of
  // an actor with the same name.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 5;

  // DER-encoded PKCS #10 certificate signing request. Atunnel retains the
  // corresponding private key.
  //
  // +k8s:required
  // +k8s:maxBytes=16384 # matches the control-plane MintActorCertificateRequest bound this is forwarded to
  bytes certificate_signing_request = 1;
}

message MintActorCertificateResponse {
  // DER-encoded leaf followed by any intermediate certificates.
  repeated bytes actor_certificates = 1;
}

// AteomHerder allows ate-apiserver to issue control calls to the atelet.
//
// Called by ate-api-server over cluster networking.  ate-api-server
// authenticates with its k8s pod identity mTLS certificate.
service AteomHerder {
  // Run tells atelet to create a new containerized workload from scratch on an
  // ateom.
  rpc Run(RunRequest) returns (RunResponse) {}

  // Checkpoint tells atelet to save the current state of the workload on an
  // ateom to object storage, and then completely the ateom to a blank state
  // (back to "available" state.)
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse) {}

  // Restore restores a workload from checkpoint onto an ateom.
  rpc Restore(RestoreRequest) returns (RestoreResponse) {}

  // UploadPausedCheckpoint copies a local (pause) checkpoint from this node's
  // disk to object storage. Unlike Checkpoint it drives no ateom: the actor is
  // paused, its sandbox is gone; the checkpoint files plus their manifest
  // already sit under the actor's local-checkpoints directory.
  rpc UploadPausedCheckpoint(UploadPausedCheckpointRequest) returns (UploadPausedCheckpointResponse) {}

  // Terminate tells atelet to terminate/kill any running workload for an actor,
  // unmount its volumes, and clean up actor state on the node.
  rpc Terminate(TerminateRequest) returns (TerminateResponse) {}
}

message TerminateRequest {
  // +k8s:required
  string target_ateom_uid = 1;

  // +k8s:required
  string atespace = 2;

  // +k8s:required
  string actor_name = 3;

  // +k8s:required
  string actor_uid = 4;

  // The template identity is carried for metrics attribution and is not
  // validated today.
  //
  // +k8s:optional
  string actor_template_atespace = 5;

  // +k8s:optional
  string actor_template_name = 6;

  // A nil spec is tolerated today; parity with the hand-written validation.
  //
  // +k8s:optional
  // +k8s:opaqueType # the WorkloadSpec tree gets its tags in a follow-up
  WorkloadSpec spec = 7;
}

message TerminateResponse {
}

message RunRequest {
  // +k8s:required
  string target_ateom_uid = 1;

  // +k8s:required
  string atespace = 2;

  // +k8s:required
  string actor_name = 3;

  // +k8s:required
  string actor_uid = 4;

  // The template identity is carried for metrics attribution and is not
  // validated today.
  //
  // +k8s:optional
  string actor_template_atespace = 5;

  // +k8s:optional
  string actor_template_name = 6;

  // A nil spec is tolerated today; parity with the hand-written validation.
  //
  // +k8s:optional
  // +k8s:opaqueType # the WorkloadSpec tree gets its tags in a follow-up
  WorkloadSpec spec = 7;

  // The sandbox binaries to use for booting this actor from scratch. atelet
  // fetches the relevant assets and records them with the actor's on-node state
  // so a later Checkpoint can pin the same version into the snapshot manifest.
  //
  // +k8s:optional
  // +k8s:opaqueType # tagged in a follow-up
  SandboxAssets sandbox_assets = 8;

  // When absent the actor has no egress: its TCP is captured and refused.
  //
  // +k8s:optional
  // +k8s:opaqueType # tagged in a follow-up
  optional EgressGateway egress_gateway = 9;

  // The actor's declared size, from the ActorTemplate's resource limits. atelet
  // passes these through to the sandbox so it is sized to the actor (not the
  // whole host or worker pod). Zero means "unset": keep the runtime default.
  //
  // +k8s:optional
  int64 cpu_milli = 10; // CPU limit in millicores (1000 = one core).

  // +k8s:optional
  int64 memory_bytes = 11; // Memory limit in bytes.
}

// EgressGateway configures tunneled egress for one actor activation.
message EgressGateway {
  // address is required and identifies the remote gateway as an IP address or
  // DNS name followed by its port.
  string address = 1;
}

// AssetFile is one content-addressed file atelet fetches for a sandbox runtime
// (e.g. the gVisor release tarball).
message AssetFile {
  // gs:// URL to download the asset from.
  string url = 1;
  // Lower-case hex SHA256; names the cached file and verifies its integrity.
  string sha256 = 2;
}

// ArchAssets is the set of assets for a single architecture, keyed by asset
// name (a wrapper message because proto map values cannot themselves be maps).
message ArchAssets {
  map<string, AssetFile> files = 1; // asset name -> file
}

// SandboxAssets is the generic, backend-agnostic description of the sandbox
// an actor runs in: a sandbox class, the pause image holding its namespaces,
// and binaries keyed first by architecture (GOARCH) and then by asset name.
// atelet's backend code interprets the asset names (gVisor expects "gvisor",
// the release tarball; legacy "runsc", a bare binary, is still accepted).
message SandboxAssets {
  string sandbox_class = 1;           // e.g. "gvisor"
  map<string, ArchAssets> assets = 2; // arch -> {name -> file}

  // pause_image is the image for the sandbox's root container. Like the
  // binaries above it is sandbox configuration, not workload configuration,
  // and atelet pins it into the snapshot manifest so a restore rebuilds the
  // sandbox from the same image.
  string pause_image = 3;
}

// WorkloadSpec parallels Pod, but with far fewer configurable fields.
message WorkloadSpec {
  // Tagged ahead of the rest of WorkloadSpec, like volumes below: the
  // containers' type now carries validations.
  //
  // +k8s:optional
  // +k8s:maxItems=10 # matches the template's containers bound
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Container containers = 1;

  // Tagged ahead of the rest of WorkloadSpec: volumes' type carries
  // validations, so the generator requires a presence tag here.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches the template's volumes bound
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Volume volumes = 2;
}

message DurableDirVolume {
}

message ExternalVolumeSource {
  // Required, unlike the actor status counterpart: the control plane only
  // sends volumes that finished provisioning.
  //
  // +k8s:required
  // +k8s:maxLength=256 # matches ExternalVolume.storage_volume_id's bound
  // +k8s:customValidation # no control characters
  string storage_volume_id = 1;

  // +k8s:optional
  // +k8s:maxLength=253 # matches ExternalVolume.volume_type's bound
  // +k8s:customValidation # optional "substrate.io/" prefix + DNS subdomain
  string volume_type = 2;

  // +k8s:optional
  // +k8s:maxProperties=32
  // +k8s:eachKey=+k8s:maxLength=128
  // +k8s:eachVal=+k8s:maxLength=256
  map<string, string> volume_context = 3;
}

message ImageVolumeSource {
  // reference is the OCI image reference, pinned by digest.
  //
  // +k8s:required
  // +k8s:maxLength=512 # matches the template ImageVolumeSource.reference's bound
  // +k8s:customValidation # must be a well-formed image reference, pinned by digest
  string reference = 1;
}

// ActorMetadataField selects one identity field of the actor.
enum ActorMetadataField {
  ACTOR_METADATA_FIELD_UNSPECIFIED = 0;
  ACTOR_METADATA_FIELD_NAME = 1;
  ACTOR_METADATA_FIELD_ATESPACE = 2;
  ACTOR_METADATA_FIELD_UID = 3;
}

// ActorMetadataItem projects one actor identity field to one file at the
// given path, relative to the root of the enclosing system-info volume.
message ActorMetadataItem {
  ActorMetadataField field = 1;
  string path = 2;
}

// ActorMetadataDataSource projects the actor's identity fields to files, one
// per item. Values are written raw with no trailing newline.
message ActorMetadataDataSource {
  repeated ActorMetadataItem items = 1;
}

// TrustBundleDataSource projects the trust anchors of a named trust bundle
// to a file at the given path, relative to the root of the enclosing
// system-info volume. atelet resolves the name against its supported-bundle
// allowlist and reads the backing ClusterTrustBundle through its informer at
// write time, sanitizing kubelet-style; an unsupported name or missing
// bundle fails the actor start.
message TrustBundleDataSource {
  string path = 1;
  string name = 2;
}

// SystemInfoDataSource selects exactly one projection to place in the
// volume.
message SystemInfoDataSource {
  // Exactly one of actor_metadata / trust_bundle must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  // +k8s:opaqueType # tagged in a follow-up
  ActorMetadataDataSource actor_metadata = 1;

  // +k8s:optional
  // +k8s:unionMember
  // +k8s:opaqueType # tagged in a follow-up
  TrustBundleDataSource trust_bundle = 2;
}

// SystemInfoVolume is a read-only volume whose files are generated by atelet
// on every Run/Restore, so they carry the values of the actor actually being
// started, whatever checkpointed state it boots from.
message SystemInfoVolume {
  // +k8s:optional
  // +k8s:maxItems=8 # matches the template's data_sources bound
  // +k8s:listType=atomic
  // +k8s:customValidation # paths unique across entries
  repeated SystemInfoDataSource data_sources = 1;
}

// Volume names one volume and selects exactly one source for it.
// +k8s:validation-gen=true
message Volume {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // Exactly one of durable_dir / external / system_info / image must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  DurableDirVolume durable_dir = 2;

  // +k8s:optional
  // +k8s:unionMember
  ExternalVolumeSource external = 3;

  // +k8s:optional
  // +k8s:unionMember
  SystemInfoVolume system_info = 4;

  // +k8s:optional
  // +k8s:unionMember
  ImageVolumeSource image = 5;
}

message VolumeMount {
  // name must match the name of a Volume.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;

  // mount_path within the container. Must be a clean absolute Unix path.
  //
  // +k8s:required
  // +k8s:maxLength=4096
  // +k8s:customValidation # clean-absolute-path shape; no regex/pattern tag exists
  string mount_path = 2;
}

message Container {
  // +k8s:required
  // +k8s:format=k8s-short-name
  // +k8s:customValidation # "pause" is reserved for sandbox infrastructure
  string name = 1;

  // +k8s:required
  // +k8s:maxLength=512 # matches the template Container.image's bound
  // +k8s:customValidation # must be a well-formed image reference, pinned by digest
  string image = 2;

  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=atomic
  // +k8s:eachVal=+k8s:maxLength=4096 # argv strings; guardrail, not a contract
  repeated string command = 3;

  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=atomic
  // +k8s:eachVal=+k8s:maxLength=4096 # argv strings; guardrail, not a contract
  repeated string args = 7;

  // +k8s:optional
  // +k8s:maxItems=32 # matches the template's env bound
  // +k8s:listType=map # each variable is set at most once
  // +k8s:listMapKey=name
  repeated EnvEntry env = 4;

  // +k8s:optional
  WakeupProbe wakeup_probe = 5;

  // Keyed by mount_path: each path hosts exactly one mount, while a volume
  // may be mounted at multiple paths.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches the template's volume_mounts bound
  // +k8s:listType=map
  // +k8s:listMapKey=mount_path
  // +k8s:customValidation # mounts must not nest
  repeated VolumeMount volume_mounts = 6;

  // +k8s:optional
  SecurityContext security_context = 8;

  // resources are the cgroup limits for this container, resolved by
  // ate-api-server from the ActorTemplate. Unset means no limits.
  //
  // +k8s:optional
  ResourceLimits resources = 9;
}

// SecurityContext holds security settings for a container's process.
message SecurityContext {
  // +k8s:optional
  Capabilities capabilities = 1;
}

// Capabilities adjusts a container's Linux capabilities relative to the default
// set. Names carry no "CAP_" prefix; drop applies before add.
message Capabilities {
  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=set
  // +k8s:customValidation # capability grammar; "ALL" not accepted
  repeated string add = 1;

  // +k8s:optional
  // +k8s:maxItems=64
  // +k8s:listType=set
  // +k8s:customValidation # capability grammar
  repeated string drop = 2;
}

// ResourceLimits are the cgroup limits for one container. Scalars rather than a
// map so each resource.Quantity is parsed exactly once, in ate-api-server.
message ResourceLimits {
  // memory_bytes is the memory limit in bytes. 0 means unset.
  //
  // +k8s:optional
  // +k8s:minimum=0
  int64 memory_bytes = 1;

  // cpu_millis is the CPU limit in milli-cores (1000 = one core). 0 means unset.
  //
  // +k8s:optional
  // +k8s:minimum=0
  // +k8s:maximum=999999 # the control plane caps cpu limits strictly below 1000 cores
  int64 cpu_millis = 2;
}

message EnvEntry {
  // name may be any printable ASCII character except '='.
  //
  // +k8s:required
  // +k8s:maxLength=256 # guardrail
  // +k8s:customValidation # printable ASCII except '='
  string name = 1;

  // +k8s:optional
  // +k8s:maxLength=32768 # guardrail
  string value = 2 [ debug_redact = true ];
}

// WakeupProbe describes how to check that a container is ready to serve.
// Only HTTP is supported today.
message WakeupProbe {
  // +k8s:required
  HTTPGetAction http_get = 1;

  // How long to keep polling before giving up and failing the actor start.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3600 # matches the template wakeup probe's bound
  int32 timeout_seconds = 2;
}

// HTTPGetAction performs an HTTP GET against the container.
message HTTPGetAction {
  // Path to access on the HTTP server.
  //
  // +k8s:required
  // +k8s:maxLength=1024 # matches the template probe path's bound
  // +k8s:customValidation # RFC 3986 path shape; no regex/pattern tag exists
  string path = 1;

  // TCP port to connect to (1..65535).
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=65535
  int32 port = 2;
}

message RunResponse {
}

message LocalCheckpointConfiguration {
  // Names a sub-directory on the local filesystem below which the checkpoint
  // data will be stored. atelet decides where that directory lives, from the
  // actor's UID, so this is a bare name and must not contain a path separator.
  // The structure of the checkpoint should generally be treated as opaque.
  string snapshot_name = 1;
}

message ExternalCheckpointConfiguration {
  // The object storage URI of the snapshot to write. Object names are appended
  // to it, so it addresses the snapshot as a whole rather than any one object.
  string snapshot_uri = 1;
}

enum CheckpointType {
  // Should never happen
  CHECKPOINT_TYPE_UNSPECIFIED = 0;
  // Save snapshot only in local filesystem
  CHECKPOINT_TYPE_LOCAL = 1;
  // Save snapshot to object storage
  CHECKPOINT_TYPE_EXTERNAL = 2;
}

enum SnapshotScope {
  // Not valid option; should never happen.
  SNAPSHOT_SCOPE_UNSPECIFIED = 0;
  // Capture process memory plus the full filesystem delta on top of the OCI
  // image (including any attached DurableDir volumes).
  SNAPSHOT_SCOPE_FULL = 1;
  // Capture only the contents of attached volumes that support snapshots
  // (currently DurableDir-typed volumes). Memory and the rest of rootfs are
  // excluded.
  SNAPSHOT_SCOPE_DATA = 2;
  // Restore-only: restore the ActorTemplate's golden snapshot's guest state
  // (memory + full filesystem delta) combined with the snapshot's durable
  // data. Never valid for Checkpoint — snapshots only ever capture FULL or
  // DATA; whether a snapshot restores from its own content or on the golden
  // is decided by the control plane from the template's onResume
  // configuration.
  SNAPSHOT_SCOPE_DATA_ON_GOLDEN = 3;
}

message CheckpointRequest {
  // +k8s:required
  string target_ateom_uid = 1;

  // +k8s:required
  string atespace = 2;

  // +k8s:required
  string actor_name = 3;

  // +k8s:required
  string actor_uid = 4;

  // The template identity is carried for metrics attribution and is not
  // validated today.
  //
  // +k8s:optional
  string actor_template_atespace = 5;

  // +k8s:optional
  string actor_template_name = 6;

  // Sandbox binary config is not sent on checkpoint: atelet uses the version the
  // actor is currently running (recorded with the actor's on-node state at
  // Run/Restore) and records it into the snapshot manifest.
  //
  // +k8s:optional
  // +k8s:opaqueType # the WorkloadSpec tree gets its tags in a follow-up
  WorkloadSpec spec = 7;

  // +k8s:required
  CheckpointType type = 8;

  // The checkpoint configuration, depending on the type.
  //
  // Declarative validation cannot express oneof members today (tags on them
  // never reach the generator), so the type/config consistency checks stay in
  // hand-written validation until they move to a message-level custom
  // validation.
  oneof config {
    LocalCheckpointConfiguration local_config = 9;
    ExternalCheckpointConfiguration external_config = 10;
  }

  // What should be included in the checkpoint.
  //
  // +k8s:required
  SnapshotScope scope = 11;
}

message CheckpointResponse {
}

message UploadPausedCheckpointRequest {
  // +k8s:required
  string atespace = 1;

  // +k8s:required
  string actor_name = 2;

  // +k8s:required
  string actor_uid = 3;

  // For metrics attribution, like on CheckpointRequest.
  //
  // +k8s:optional
  string actor_template_atespace = 4;

  // +k8s:optional
  string actor_template_name = 5;

  // The local checkpoint to upload: LocalSnapshot.snapshot_name recorded
  // at pause time.
  //
  // +k8s:required
  string local_snapshot_name = 6;

  // Destination object-storage URI (the actor's in-progress snapshot URI).
  //
  // +k8s:required
  string destination_snapshot_uri = 7;

  // Scope the uploaded snapshot must have (the commit scope; FULL or DATA).
  // The scope the pause checkpoint captured is not sent: atelet reads it from
  // the local snapshot's own manifest, which is authoritative. When they
  // differ, atelet converts where possible (micro-VM FULL capture to a DATA
  // upload by selecting the durable-dir tar) and rejects otherwise.
  //
  // +k8s:required
  SnapshotScope desired_scope = 8;
}

message UploadPausedCheckpointResponse {
}

message RestoreRequest {
  // +k8s:required
  string target_ateom_uid = 1;

  // +k8s:required
  string atespace = 2;

  // +k8s:required
  string actor_name = 3;

  // +k8s:required
  string actor_uid = 4;

  // The template identity is carried for metrics attribution and is not
  // validated today.
  //
  // +k8s:optional
  string actor_template_atespace = 5;

  // +k8s:optional
  string actor_template_name = 6;

  // Sandbox binary config is not sent on restore: the snapshot is
  // self-describing. atelet reads the snapshot manifest to recover the pinned
  // sandbox version that created it.
  //
  // +k8s:optional
  // +k8s:opaqueType # the WorkloadSpec tree gets its tags in a follow-up
  WorkloadSpec spec = 7;

  // +k8s:required
  CheckpointType type = 8;

  // The checkpoint configuration, depending on the type.
  //
  // Declarative validation cannot express oneof members today (tags on them
  // never reach the generator), so the type/config consistency checks stay in
  // hand-written validation until they move to a message-level custom
  // validation.
  oneof config {
    LocalCheckpointConfiguration local_config = 9;
    ExternalCheckpointConfiguration external_config = 10;
  }

  // What content to restore from the checkpoint.
  //
  // +k8s:required
  SnapshotScope scope = 11;

  // The object storage URI of the ActorTemplate's golden snapshot.
  // Set only when scope is SNAPSHOT_SCOPE_DATA_ON_GOLDEN: restore combines
  // the golden snapshot (memory + full fs delta) with the durable data in
  // the snapshot referenced by `config`. A top-level field rather than part
  // of the `config` oneof: the actor's snapshot may be local (a pause
  // checkpoint) while the golden snapshot is always external.
  //
  // +k8s:optional
  string golden_snapshot_uri = 12;

  // When absent the actor has no egress: its TCP is captured and refused.
  //
  // +k8s:optional
  // +k8s:opaqueType # tagged in a follow-up
  optional EgressGateway egress_gateway = 13;

  // The actor's declared size, from the ActorTemplate's resource limits. For
  // gVisor and micro-VM DATA-scope restores the sandbox is (re)sized to these;
  // for a FULL micro-VM restore the size baked into the snapshot wins. Zero
  // means "unset": keep the runtime default.
  //
  // +k8s:optional
  int64 cpu_milli = 14; // CPU limit in millicores (1000 = one core).

  // +k8s:optional
  int64 memory_bytes = 15; // Memory limit in bytes.
}

message RestoreResponse {
}
