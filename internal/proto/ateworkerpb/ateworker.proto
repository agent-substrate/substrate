syntax = "proto3";

package ateworker;

option go_package = "go.ate.dev/substrate/internal/proto/ateworkerpb";

// Worker is the interface to control a single gVisor (or, in the future microVM)
// guest inside a worker pod.
//
// Each worker has two main states, "available" and "executing".
//
// When the worker is "available", the substrate control plane is free to either
// boot a new workload (using RunWorkload), or restore an existing workload from
// a checkpoint (using RestoreWorkload).  These calls move the worker into
// "executing" state.
//
// When the worker is "executing", the substrate control plane can checkpoint the
// running workload (with CheckpointWorkload).  This moves the worker back to
// "free" state.
service Worker {
  // RunWorkload tells the worker to begin running a new workload (one or more
  // containers, potentially with shared filesystems).
  rpc RunWorkload(RunWorkloadRequest) returns (RunWorkloadResponse) {}

  // CheckpointWorkload tells the worker to save the current state of the running
  // workload to object storage, and then completely reset itself to a blank
  // state (back to "available" state.)
  rpc CheckpointWorkload(CheckpointWorkloadRequest) returns (CheckpointWorkloadResponse) {}

  // RestoreWorkload restores a workload from checkpoint that was previously
  // written by CheckpointWorkload.  The worker will handle downloading the correct
  // gVisor / runsc version to match the checkpoint.
  rpc RestoreWorkload(RestoreWorkloadRequest) returns (RestoreWorkloadResponse) {}

  // GetWorkloadStats returns a point-in-time resource-usage sample for the
  // workload this worker is currently executing.
  //
  // It is a pure read: unlike the three calls above it does not move the worker
  // between "available" and "executing", so it is safe to call on a timer for
  // the whole lifetime of a workload. It also does not wait on them. Those
  // three serialize on a mutex a worker holds for a whole boot, restore, or
  // checkpoint; this call reads its state from outside that mutex, so a poll
  // landing in the middle of one answers immediately instead of going quiet for
  // the duration -- which would silence the poller during exactly the phases
  // whose usage is most interesting.
  //
  // Two ways it declines to give a sample, and they ask different things of the
  // caller:
  //
  //   * NOT_FOUND -- this worker is not executing the actor in the request. It
  //     may be "available", or a recycled worker may have moved on to a
  //     different actor. Retrying on the same timer will not change the answer:
  //     the caller's worker-to-actor mapping is stale and wants re-resolving.
  //
  //   * FAILED_PRECONDITION -- this worker is executing the requested actor but
  //     has no sample to give yet. It accepts an actor before the sandbox it
  //     will measure exists, so a poll landing in the boot lands here. Read it
  //     as "no numbers right now", not as "the actor is gone": it is transient,
  //     and the caller should skip this sample and take the next one.
  //
  // The split is worth the two codes because the identity is retained from the
  // moment the worker accepts the actor, on both runtimes. That is what makes
  // "booting" distinguishable from "not here" at all, and it means a workload
  // that dies during boot is attributable rather than anonymous.
  rpc GetWorkloadStats(GetWorkloadStatsRequest) returns (GetWorkloadStatsResponse) {}

  // GetActiveWorkloadStats reports every actor this worker hosts, without
  // asserting an identity. It is the discovery read for a
  // scraper that enumerates workers and holds no worker-to-actor mapping;
  // GetWorkloadStats above is the verified read for a caller that must be
  // answered about a specific actor.
  //
  // It serves each actor's latest sample from the worker's own sampling timer,
  // so a poll reads no sandbox and has no error path: an "available" worker
  // answers an empty samples list, and a workload with nothing measured yet
  // (a boot, a restore, or a guest the last sweep did not reach) appears as a
  // sample carrying its attribution with source = STATS_SOURCE_UNSPECIFIED --
  // "not measured", per the sample's own contract -- so even a workload that
  // dies during boot is attributable, not anonymous. A sample is up to one
  // sampling interval old. This is deliberately unlike GetWorkloadStats, whose
  // caller asserts knowledge the codes then answer.
  //
  // Consumers MUST attribute each sample solely from the identity echoed
  // inside it, never from a mapping they hold: without an asserted uid, the
  // response is the only statement of who was measured. Like GetWorkloadStats
  // it is safe on a timer and does not touch the lifecycle mutex.
  rpc GetActiveWorkloadStats(GetActiveWorkloadStatsRequest) returns (GetActiveWorkloadStatsResponse) {}

  // TerminateWorkload stops and deletes container workloads and cleans up
  // network and bundle overlays on the worker.
  rpc TerminateWorkload(TerminateWorkloadRequest) returns (TerminateWorkloadResponse) {}
}

// ActorDirs is the set of per-actor directories atelet prepares on the volume
// it shares with the worker. The worker takes them from the RPC instead of deriving
// them from the actor UID.
// Every directory is under root_dir.
//
// +k8s:customValidation # each directory is an absolute, clean path
message ActorDirs {
  // The actor's own directory.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string root_dir = 1;
  // Holds one OCI bundle per container, named after the container.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string oci_bundle_dir = 2;
  // Where CheckpointWorkload writes the snapshot files.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string checkpoint_dir = 3;
  // Where the snapshot files RestoreWorkload reads have been downloaded to.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string restore_dir = 4;
  // Holds one subdirectory per durable-dir volume.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string durable_dir_volume_mounts_dir = 5;
  // Holds one subdirectory per system-info volume.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string system_info_volume_roots_dir = 6;
  // Holds one mount point per external volume.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string external_volume_mounts_dir = 7;
  // Holds the sandbox runtime assets staged for this actor (runsc, or the
  // micro-VM kernel, VMM and guest image), hard-linked from atelet's asset
  // cache. The only location a sandbox runtime may run a binary from; the
  // worker derives the same path from actor_uid and rejects a request
  // naming any other.
  //
  // +k8s:required
  // +k8s:maxLength=4096 # PATH_MAX
  string sandbox_assets_dir = 8;
}

message TerminateWorkloadRequest {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 1;
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 4;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 5;
  // Empty for runtimes that do not use runsc.
  //
  // +k8s:optional
  // +k8s:maxLength=4096 # PATH_MAX; a host path, not a contract
  string runsc_path = 6;
  // Names the containers to stop.
  //
  // +k8s:required
  WorkloadSpec spec = 7;
  // +k8s:required
  ActorDirs actor_dirs = 8;
}

message TerminateWorkloadResponse {
}

message RunWorkloadRequest {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 1;
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 4;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 5;

  // Empty for runtimes that do not use runsc.
  //
  // +k8s:optional
  // +k8s:maxLength=4096 # PATH_MAX; a host path, not a contract
  string runsc_path = 6;

  // +k8s:required
  // +k8s:subfield(containers)=+k8s:required # a container to start; only Terminate's fallback spec may have none
  WorkloadSpec spec = 7;

  // runtime_asset_paths maps a runtime asset name to the local on-disk path
  // atelet fetched it to (content-addressed, like runsc_path). The names are
  // the runtime's own: "gvisor" for gVisor, "cloud-hypervisor",
  // "virtiofsd", "kata-kernel", and "kata-image" for the micro-VM. Empty for
  // the gVisor runtime, which uses runsc_path.
  //
  // +k8s:optional
  // +k8s:maxProperties=16
  // +k8s:eachKey=+k8s:maxLength=64
  // +k8s:eachVal=+k8s:maxLength=4096 # PATH_MAX; a host path, not a contract
  map<string, string> runtime_asset_paths = 8;

  // When absent the actor has no egress: its TCP is captured and refused.
  //
  // +k8s:optional
  optional EgressGateway egress_gateway = 9;

  // The actor's declared size, from the ActorTemplate's resource limits. The worker
  // sizes the sandbox to these (cgroup caps via the OCI spec, and for the
  // micro-VM the VM's vCPU count and memory). Zero means "unset": keep the
  // runtime default (unlimited for gVisor, the worker's own default for the micro-VM).
  //
  // +k8s:optional
  // +k8s:minimum=1
  // +k8s:maximum=999999 # matches atelet.RunRequest.cpu_milli, the control plane caps cpu limits strictly below 1000 cores
  int64 cpu_milli = 10; // CPU limit in millicores (1000 = one core).
  // +k8s:optional
  // +k8s:minimum=1
  int64 memory_bytes = 11; // Memory limit in bytes.
  // +k8s:required
  ActorDirs actor_dirs = 12;
}

// EgressGateway configures tunneled egress for one actor activation.
message EgressGateway {
  // address is required and identifies the remote gateway as an IP address or
  // DNS name followed by its port.
  //
  // +k8s:required
  // +k8s:maxLength=261 # a bracketed or 253-character host, ':' and a 5-digit port
  // +k8s:customValidation # host:port shape
  string address = 1;
}

// WorkloadSpec parallels Pod, but with far fewer configurable fields.
message WorkloadSpec {
  // Empty on the fallback spec atelet's Terminate sends for an actor whose
  // template is gone, as on atelet's own WorkloadSpec.
  //
  // +k8s:optional
  // +k8s:maxItems=10 # matches ateapi.ActorTemplate.containers
  // +k8s:listType=map
  // +k8s:listMapKey=name
  repeated Container containers = 1;
}

// A container's mounts split into four typed lists. Each list's key keeps
// only that list's paths unique, so the rules that span the lists are a hook.
//
// +k8s:customValidation # mount paths are unique and do not nest across the four lists
message Container {
  // The sandbox's own container, ocispec.PauseContainer, is not a short
  // name, so the format keeps a workload container from taking its bundle.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;
  // +k8s:optional
  WakeupProbe wakeup_probe = 2;

  // durable_dir_volume_mounts are the durable-dir volumes this container
  // mounts, if any.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches ateapi.Container.volume_mounts
  // +k8s:listType=map
  // +k8s:listMapKey=mount_path
  repeated VolumeMount durable_dir_volume_mounts = 3;

  // external_volume_mounts are the external volumes this container mounts, if
  // any.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches ateapi.Container.volume_mounts
  // +k8s:listType=map
  // +k8s:listMapKey=mount_path
  repeated VolumeMount external_volume_mounts = 4;

  // system_info_volume_mounts are the system-info volumes this container
  // mounts, if any. Contents are generated by atelet on the host on every
  // Run/Restore and never captured into snapshots. The container sees them
  // read-only.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches ateapi.Container.volume_mounts
  // +k8s:listType=map
  // +k8s:listMapKey=mount_path
  repeated VolumeMount system_info_volume_mounts = 5;

  // image_volume_mounts are the image volumes this container mounts, if any.
  //
  // +k8s:optional
  // +k8s:maxItems=32 # matches ateapi.Container.volume_mounts
  // +k8s:listType=map
  // +k8s:listMapKey=mount_path
  repeated VolumeMount image_volume_mounts = 6;

  // container_spec is what the worker builds the container's OCI spec from,
  // besides its volume mounts. Unset on RPCs that start no process. atelet
  // derives it from template fields it validated (argv resolved against the
  // image's ENTRYPOINT and CMD, env merged with the image's ENV), so the
  // template's bounds do not apply to it and it is not validated here.
  //
  // +k8s:optional
  // +k8s:opaqueType # derived by atelet, see above
  ContainerSpec container_spec = 7;
}

// ContainerSpec is a container's process and limits, resolved by atelet.
message ContainerSpec {
  // args is the process argv, already resolved against the image's
  // ENTRYPOINT and CMD.
  repeated string args = 1;

  // env is the process environment as KEY=VALUE, already merged with the
  // image's ENV.
  repeated string env = 2 [ debug_redact = true ];

  // capabilities is the container's capability set, CAP_-prefixed.
  repeated string capabilities = 3;

  // resources are the container's own declared limits, if any.
  ResourceLimits resources = 4;
}

// ResourceLimits are a container's declared limits.
message ResourceLimits {
  // memory_bytes is the memory limit in bytes. 0 means unset.
  int64 memory_bytes = 1;
  // cpu_millis is the CPU limit in milli-cores (1000 = one core). 0 means unset.
  int64 cpu_millis = 2;
}

// VolumeMount is one volume mounted into a container.
message VolumeMount {
  // name is the name the ActorTemplate gave the volume. For durable-dir and
  // system-info volumes it selects the per-volume directory atelet prepared
  // for the actor on the host.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;
  // mount_path is where the container sees the volume.
  //
  // +k8s:required
  // +k8s:maxLength=4096
  // +k8s:customValidation # clean-absolute-path shape; no regex/pattern tag exists
  string mount_path = 2;
}

// WakeupProbe describes how to check that a container is ready to serve.
// Only HTTP is supported today.
message WakeupProbe {
  // +k8s:required
  HttpGetAction http_get = 1;

  // How long to keep polling before giving up and failing the actor start.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3600 # matches ateapi.WakeupProbe.timeout_seconds
  int32 timeout_seconds = 2;
}

// HttpGetAction performs an HTTP GET against the container.
message HttpGetAction {
  // Path to access on the HTTP server.
  //
  // +k8s:required
  // +k8s:maxLength=1024 # matches ateapi.HttpGetAction.path
  // +k8s:customValidation # RFC 3986 path shape; no regex/pattern tag exists
  string path = 1;

  // TCP port to connect to (1..65535).
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=65535
  int32 port = 2;
}

message RunWorkloadResponse {
}

// SnapshotFidelity mirrors the public ateapi enum: the state layers a
// snapshot holds, lowest to highest, each including the ones below it.
enum SnapshotFidelity {
  // Not valid option; should never happen.
  SNAPSHOT_FIDELITY_UNSPECIFIED = 0;
  // Capture only the contents of attached volumes that support snapshots
  // (currently DurableDir-typed volumes). Memory and the rest of rootfs are
  // excluded.
  SNAPSHOT_FIDELITY_VOLUMES = 1;
  // Volumes plus the root filesystem changes made since boot.
  SNAPSHOT_FIDELITY_ROOTFS = 2;
  // Capture process memory plus the full filesystem delta on top of the OCI
  // image (including any attached DurableDir volumes).
  SNAPSHOT_FIDELITY_MEMORY = 3;
  // Keep this in sync with the maximums on fields of this type.
}

message CheckpointWorkloadRequest {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 1;
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 4;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 5;

  // Empty for runtimes that do not use runsc.
  //
  // +k8s:optional
  // +k8s:maxLength=4096 # PATH_MAX; a host path, not a contract
  string runsc_path = 6;

  // +k8s:required
  WorkloadSpec spec = 7;

  // Fidelity the checkpoint captures.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3 # keep this in sync with the SnapshotFidelity enum
  SnapshotFidelity fidelity = 8;
  // +k8s:required
  ActorDirs actor_dirs = 9;
}

message CheckpointWorkloadResponse {
  // snapshot_files lists the files the worker wrote into the checkpoint directory
  // (relative names) for atelet to ship to object storage. Each runtime reports
  // its own set (gVisor's image files, cloud-hypervisor's snapshot set, ...).
  repeated string snapshot_files = 1;

  // data_snapshot_files is the subset of snapshot_files that restores the
  // actor at VOLUMES fidelity on its own. Empty when the capture holds no durable data.
  repeated string data_snapshot_files = 2;
}

message RestoreWorkloadRequest {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string atespace = 1;
  // +k8s:required
  // +k8s:format=k8s-short-name
  string actor_name = 2;
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 3;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_atespace = 4;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string actor_template_name = 5;

  // Empty for runtimes that do not use runsc.
  //
  // +k8s:optional
  // +k8s:maxLength=4096 # PATH_MAX; a host path, not a contract
  string runsc_path = 6;

  // +k8s:required
  // +k8s:subfield(containers)=+k8s:required # a container to start; only Terminate's fallback spec may have none
  WorkloadSpec spec = 7;

  // runtime_asset_paths maps a runtime asset name to the local on-disk path
  // atelet fetched it to (see RunWorkloadRequest). Empty for gVisor.
  //
  // +k8s:optional
  // +k8s:maxProperties=16
  // +k8s:eachKey=+k8s:maxLength=64
  // +k8s:eachVal=+k8s:maxLength=4096 # PATH_MAX; a host path, not a contract
  map<string, string> runtime_asset_paths = 8;

  // Fidelity to restore from the snapshot.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=3 # keep this in sync with the SnapshotFidelity enum
  SnapshotFidelity fidelity = 9;

  // When absent the actor has no egress: its TCP is captured and refused.
  //
  // +k8s:optional
  optional EgressGateway egress_gateway = 10;

  // The actor's declared size, from the ActorTemplate's resource limits. Used to
  // (re)size the sandbox on a VOLUMES restore (fresh guest container). On a
  // MEMORY micro-VM restore the size baked into the snapshot is authoritative and
  // these are ignored. Zero means "unset": keep the runtime default.
  //
  // +k8s:optional
  // +k8s:minimum=1
  // +k8s:maximum=999999 # matches atelet.RestoreRequest.cpu_milli, the control plane caps cpu limits strictly below 1000 cores
  int64 cpu_milli = 11; // CPU limit in millicores (1000 = one core).
  // +k8s:optional
  // +k8s:minimum=1
  int64 memory_bytes = 12; // Memory limit in bytes.
  // +k8s:required
  ActorDirs actor_dirs = 13;

  // actor_dirs.restore_dir is a preserved local snapshot, not a scratch copy:
  // the worker must not delete or modify files in it.
  //
  // +k8s:optional
  bool preserve_restore_dir = 14;
}

message RestoreWorkloadResponse {
}

message GetWorkloadStatsRequest {
  // The actor the caller believes is executing here. A worker can be recycled
  // between the caller's view of the world and this call, so the worker answers
  // NOT_FOUND on a mismatch rather than reporting a different actor's numbers
  // under the requested actor's identity.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string actor_uid = 1;
}

// StatsSource is how a sample's measurements were obtained. The two are not
// measured the same way and should not be compared against each other as though
// they were.
enum StatsSource {
  // No measurement was taken.
  STATS_SOURCE_UNSPECIFIED = 0;
  // Read from the sandbox's cgroup on the host.
  STATS_SOURCE_CGROUP = 1;
  // Read from inside the guest, over the guest agent's vsock connection. What
  // it counts is the workload's own containers, as the guest kernel accounts
  // for them: the guest kernel itself, the agent, and the VMM process on the
  // host are overhead this source cannot see. The cgroup source above is the
  // other way round -- the sandbox's host process is one process, so its
  // runtime's overhead is charged along with the workload's.
  STATS_SOURCE_GUEST_AGENT = 2;
}

// WorkloadStatsSample is one resource-usage sample for an executing workload,
// shared by both stats reads. The unit of measurement is the SANDBOX, which
// today equals the actor. Per-container attribution is not reported: the
// micro-VM source could give it, since the guest keeps a cgroup per container
// and the worker sums them, but the gVisor source cannot split one at all without
// the sentry's own accounting, and a field only one runtime could ever fill
// would be worse than none.
message WorkloadStatsSample {
  // Identity of the measured actor, retained by the worker from the
  // RunWorkloadRequest / RestoreWorkloadRequest that started it. Echoed back so
  // the caller can attribute the sample without holding its own mapping from
  // worker to actor.
  string atespace = 1;
  string actor_name = 2;
  string actor_uid = 3;
  string actor_template_atespace = 4;
  string actor_template_name = 5;

  // The sandbox runtime family that produced this sample, in the
  // ate.dev/v1alpha1 SandboxClass form: "gvisor" (cmd/ateworker-gvisor) or
  // "microvm" (cmd/ateworker-microvm). A worker binary only ever reports its own.
  string sandbox_class = 6;

  // How the measurements below were obtained.
  StatsSource source = 7;

  // Measurements. All four are zero when source is STATS_SOURCE_UNSPECIFIED,
  // which means "not measured" rather than "measured as zero".
  //
  // memory_current_bytes and memory_working_set_bytes are absolute.
  uint64 memory_current_bytes = 8;
  // High-water mark of memory_current_bytes, as the source reports it: the
  // cgroup source restarts it on a restore, the guest-agent source brings the
  // guest's own back with it. Also zero when the runtime cannot report a peak:
  // the cgroup source reads memory.peak, which only exists on Linux 5.19 and
  // later.
  uint64 memory_peak_bytes = 9;
  // memory_current_bytes less the reclaimable page cache, floored at zero. This
  // is the figure to compare against a memory limit; memory_current_bytes
  // drifts upward with cache the kernel would drop for free under pressure.
  uint64 memory_working_set_bytes = 10;
  // Cumulative CPU time since the activation began (epoch_unix_nano), for
  // every source, and never decreasing within it. The cgroup source restarts on
  // its own; the guest-agent source counts from its first read after a restore
  // that resumes the guest, since the guest's counters survive in guest RAM. A
  // lifetime figure is the sum over epochs of each epoch's highest value.
  uint64 cpu_usage_usec = 11;

  int64 observed_at_unix_nano = 12;

  // The activation this sample belongs to, as the unix-nano time it began. A
  // Run or Restore starts one.
  int64 epoch_unix_nano = 13;
}

message GetWorkloadStatsResponse {
  WorkloadStatsSample sample = 1;
}

message GetActiveWorkloadStatsRequest {
}

message GetActiveWorkloadStatsResponse {
  // One entry per workload this worker is executing; empty when it is
  // "available". Each sample is self-describing (see the attribution rule on
  // the rpc); an entry with source = STATS_SOURCE_UNSPECIFIED is a workload
  // with no numbers to give yet (boot, restore, teardown, or a lifecycle
  // transition underneath the read) -- skip its measurements and take the
  // next sample. A worker serves one actor at a time today, so the list holds
  // at most one entry until multi-actor workers land; consumers must not
  // assume that.
  repeated WorkloadStatsSample samples = 1;
}
