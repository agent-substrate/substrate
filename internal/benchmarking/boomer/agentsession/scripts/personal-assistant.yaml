# An always-on personal assistant (the OpenClaw / Hermes Agent shape): one
# gateway process per user that answers chat messages, runs a heartbeat
# turn every 30 minutes while the user is awake, fires scheduled jobs, and
# consolidates its memory at night. One lap is one day, 00:00 to 24:00, in
# real time: every think gap is the real idle gap before the event, so the
# script is meant to run with a fractional --agentsession-think-scale
# (0.02 plays a day in about 30 minutes). Steps are named by their time of
# day; heartbeats are skipped at the half hours where the user is active.
#
# What one step emulates comes from reading the OpenClaw and Hermes source
# and docs and from a strace/RSS profile of OpenClaw 2026.9.8 on Node 24
# driven through its gateway API by a scripted model (2026-10-05):
#
#   - The gateway sits at 1.2 GiB resident after start and 1.45 to 1.54 GiB
#     after one conversation (Hermes: 0.1 to 0.3 GiB); modeled as the
#     640Mi gateway_heap plus growth from the catalog refresh, the browser
#     (Chrome stays resident once launched) and the nightly sweep.
#   - A chat turn reads 5 to 7 MiB of its SQLite session store, ships a
#     50 to 110 KiB model request (the context; read_disk_data of
#     context_window so the bytes leave the sandbox through the router),
#     waits on the model, and appends 1 to 4 MiB of WAL. Under strace it
#     cost 0.6 to 1.0 CPU-seconds; strace inflates syscall-heavy code
#     1.5 to 3x, so the script burns 0.5 s. A tool-loop turn (memory
#     search with embeddings) read 36 MiB, wrote 9.6 MiB and made three
#     model calls. A heartbeat turn is a chat turn with no user.
#   - The model round trip itself is wall time with the actor resident and
#     idle: dwell. The profile used a zero-latency model, so the dwell
#     values are field numbers (3 to 15 s per call, longer for compaction
#     and the nightly sweep), not measured ones.
#   - Day shape: about 30 user messages in 7 clusters, 26 heartbeats, 15
#     hourly system-event crons folded into the on-the-hour heartbeats,
#     one morning briefing, four model-catalog refreshes, one context
#     compaction, one nightly memory sweep. Autonomous turns outnumber
#     user turns, as they do on a default OpenClaw install.
#
# Per lap: 61 wakes, about 65 CPU-seconds, about 440 s of resident idle,
# about 150 MiB written, 11 MiB ingested. Declared RAM 960Mi plus about
# 120Mi of files; min_actor_memory 1536Mi leaves the guest the headroom
# the coding script found necessary.
name: personal-assistant
min_actor_memory: 1536Mi
steps:
  - name: 0000_gateway_start
    agent: "Gateway starts: loads config, skills and the session store, settles its heap"
    think: 55m
    ops:
      - fill_ram: {key: gateway_heap, size: 640Mi}
      - write_disk: {key: bootstrap_files, size: 32Ki}
      - write_disk: {key: context_window, size: 96Ki}
      - write_disk: {key: session_db, size: 6Mi}
      - write_disk: {key: memory_notes, size: 8Ki}
      - write_disk: {key: memory_index, size: 4Mi}
      - burn_cpu: {millis: 3000, parallel: 1}
      - ping: {}
  - name: 0300_dreaming
    agent: "Nightly memory consolidation: rereads the day, rewrites MEMORY.md, reindexes"
    think: 3h
    ops:
      - read_disk_data: {key: memory_index}
      - read_disk_digest: {key: session_db}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - write_disk: {key: memory_notes, size: 32Ki}
      - write_disk: {key: memory_index, size: 4Mi}
      - fill_ram: {key: dream_retained, size: 96Mi}
  - name: 0505_catalog_refresh
    agent: Model catalog refresh, no model call
    think: 2h5m
    ops:
      - ingest: {key: model_catalog, size: 2Mi}
      - burn_cpu: {millis: 800, parallel: 1}
      - fill_ram: {key: catalog_cache, size: 32Mi}
  - name: 0730_morning_hello
    agent: First message of the day, quick reply
    think: 2h25m
