      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 500, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 5000}
      - write_disk: {key: session_wal, size: 1Mi}
      - churn_ram: {key: gateway_heap, size: 8Mi}
  - name: 0732_whats_today
    agent: Asks what is on today; agent reads memory
    think: 2m
