# personal-assistant with a small memory footprint: the same day, the same
# 61 wakes, the same ops, reads, writes, CPU and dwell per turn, with only
# the RAM arrays scaled down. personal-assistant models a gateway with a
# 1.2 to 1.5 GiB heap; this variant is for runs where the agent's own state
# is tens of MB: many actors per node, cheap pauses, fast restores.
#
# Declared bytes: 28Mi of RAM arrays (gateway_heap 20Mi, browser 4Mi,
# dream_retained 3Mi, catalog_cache 1Mi) and the same files as
# personal-assistant, about 21Mi resident.
#
# Memory image per pause. Under gVisor the image is the workload: about
# 40 MB after gateway start and 80 to 95 MB from mid-morning on, once the
# Go heap has grown to about twice the live arrays. Under micro-VM the
# image is the guest's populated pages: about 100 MB of kernel, agent and
# page cache before the script writes anything, reaching about 200 MB in
# an actor with a 512Mi memory limit and capped near 125 MB with a 256Mi
# limit, plus a rootfs tar of up to 22 MB.
#
# min_actor_memory is 256Mi: the script fits a 128 MiB micro-VM guest.
# Run it like personal-assistant, with a fractional
# --agentsession-think-scale.
name: personal-assistant-light
min_actor_memory: 256Mi
steps:
  - name: 0000_gateway_start
    agent: "Gateway starts: loads config, skills and the session store, settles its heap"
    think: 55m
    ops:
      - fill_ram: {key: gateway_heap, size: 20Mi}
      - write_disk: {key: bootstrap_files, size: 32Ki}
      - write_disk: {key: context_window, size: 96Ki}
      - write_disk: {key: session_db, size: 6Mi}
      - write_disk: {key: memory_notes, size: 8Ki}
      - write_disk: {key: memory_index, size: 4Mi}
      - burn_cpu: {millis: 3000, parallel: 1}
      - ping: {}
  - name: 0300_dreaming
    agent: "Nightly memory consolidation: rereads the day, rewrites MEMORY.md, reindexes"
    think: 3h
    ops:
      - read_disk_data: {key: memory_index}
      - read_disk_digest: {key: session_db}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - read_disk_digest: {key: bootstrap_files}
      - read_disk_digest: {key: session_db}
      - burn_cpu: {millis: 600, parallel: 1}
      - read_disk_data: {key: context_window}
      - dwell: {millis: 15000}
      - write_disk: {key: session_wal, size: 1Mi}
      - write_disk: {key: memory_notes, size: 32Ki}
      - write_disk: {key: memory_index, size: 4Mi}
      - fill_ram: {key: dream_retained, size: 3Mi}
  - name: 0505_catalog_refresh
    agent: Model catalog refresh, no model call
    think: 2h5m
    ops:
      - ingest: {key: model_catalog, size: 2Mi}
      - burn_cpu: {millis: 800, parallel: 1}
      - fill_ram: {key: catalog_cache, size: 1Mi}
  - name: 0730_morning_hello
