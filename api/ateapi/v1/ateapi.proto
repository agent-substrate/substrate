  // `actor.ate.dev` (`atespace`, `actorName`, `actorUID`).
  string actor_jwt = 1 [ debug_redact = true ];

  // Expiration timestamp matching the `exp` claim.
  google.protobuf.Timestamp expire_time = 2;
}

