syntax = "proto3";

package objectstore.v1;

option go_package = "github.com/agent-substrate/substrate/pkg/proto/objectstorepb/v1;objectstorev1";

// NodeProvider is the plugin API an object storage platform implements
// on every node. atelet calls it to move actor snapshots between the node and
// the platform's object storage. How the platform stores them (object names,
// compression) is private to the plugin. The only requirement is that
// FetchSnapshot returns the bytes UploadSnapshot was given. Substrate stores
// no checksums; verifying integrity is up to the plugin.
//
// Callers name every file they want moved. A snapshot's file list lives in
// its manifest, which the caller fetches first by name. The caller also owns
// commit ordering: it uploads the data files, and only after that call
// succeeds does it upload the manifest in a separate call, so a reader that
// finds the manifest can rely on every file it lists.
//
// Every RPC is idempotent: a retry overwrites whatever an earlier attempt
// stored or wrote.
service NodeProvider {
  // FetchSnapshot downloads the named files of a snapshot into write_path.
  // It returns NOT_FOUND if any requested file is absent from the snapshot.
  // A plugin that authorizes per actor returns PERMISSION_DENIED if actor_jwt
  // does not grant read access to snapshot_uri.
  rpc FetchSnapshot(FetchSnapshotRequest) returns (FetchSnapshotResponse) {}

  // UploadSnapshot uploads the named files from local_path into a snapshot.
  // It returns success only once every file is durably stored. On failure,
  // files already stored may remain, and the caller can remove them with
  // ControlProvider.CleanupSnapshot. A plugin that authorizes per actor returns
  // PERMISSION_DENIED if actor_jwt does not grant write access to snapshot_uri.
  rpc UploadSnapshot(UploadSnapshotRequest) returns (UploadSnapshotResponse) {}
}

// FetchSnapshotRequest asks the plugin to download snapshot files.
message FetchSnapshotRequest {
  // The snapshot to read, e.g. gs://<bucket>/<prefix>.
  string snapshot_uri = 1;

  // The JWT of the actor that owns the snapshot, for plugins that authorize
  // storage access per actor. Substrate does not set it yet, so it is
  // currently always empty.
  string actor_jwt = 2 [ debug_redact = true ];

  // Full local path of the directory the files are written into. It must
  // exist.
  string write_path = 3;

  // Base names of the files to download. Required.
  repeated string files = 4;
}

message FetchSnapshotResponse {}

// UploadSnapshotRequest asks the plugin to upload snapshot files.
message UploadSnapshotRequest {
  // The snapshot to write, e.g. gs://<bucket>/<prefix>.
  string snapshot_uri = 1;

  // The JWT of the actor that owns the snapshot, for plugins that authorize
  // storage access per actor. Substrate does not set it yet, so it is
  // currently always empty.
  string actor_jwt = 2 [ debug_redact = true ];

  // Full local path of the directory the files are read from.
  string local_path = 3;

  // Base names of the files to upload. Required.
  repeated string files = 4;
}

message UploadSnapshotResponse {}

// ControlProvider is the plugin API an object storage platform
// implements for the control plane. ate-api-server calls it to manage whole
// snapshots.
service ControlProvider {
  // CleanupSnapshot deletes every file of a snapshot, or of every snapshot
  // under an owner's prefix. Deleting an absent snapshot succeeds.
  rpc CleanupSnapshot(CleanupSnapshotRequest) returns (CleanupSnapshotResponse) {}

  // CopySnapshot copies every file of src_uri to dst_uri, overwriting files
  // already at dst_uri. src_uri and dst_uri may be in different buckets. It
  // returns FAILED_PRECONDITION if src_uri holds no files.
  rpc CopySnapshot(CopySnapshotRequest) returns (CopySnapshotResponse) {}
}

// CleanupSnapshotRequest names the snapshots to delete.
message CleanupSnapshotRequest {
  // A snapshot URI, or the prefix of a resource that owns several snapshots
  // (e.g. gs://<bucket>/<root>/atespaces/<atespace>/actors/<uid>). Every file
  // below it is deleted. A bare bucket is rejected with INVALID_ARGUMENT.
  string snapshot_uri = 1;
}

message CleanupSnapshotResponse {}

// CopySnapshotRequest names the source and destination snapshots.
message CopySnapshotRequest {
  // The URI to copy from, e.g. an actor's snapshot.
  string src_uri = 1;

  // The URI to copy to, e.g. a tag's prefix.
  string dst_uri = 2;
}

message CopySnapshotResponse {}

// AssetProvider is the plugin API an object storage platform implements on
// every node, next to NodeProvider, to serve sandbox runtime assets (the files
// a SandboxConfig names, such as a micro-VM kernel and guest image). atelet
// calls it for every asset it does not download anonymously.
//
// An asset is pinned by its sha256, so the plugin hands back an object only if
// the caller already knows its content. The plugin must also refuse to read
// anything stored under a snapshot location: an asset URI never names a
// snapshot, a snapshot's file, or a tag.
service AssetProvider {
  // FetchAsset writes the object at asset_uri to write_path if, and only if,
  // its content hashes to sha256. Nothing is written to write_path otherwise.
  // It returns PERMISSION_DENIED if asset_uri, or any prefix of it, is a
  // snapshot or tag URI, before reading anything; NOT_FOUND if the object does
  // not exist; and FAILED_PRECONDITION if the object is larger than max_bytes
  // or than the plugin can hold while verifying it, or its sha256 does not
  // match.
  rpc FetchAsset(FetchAssetRequest) returns (FetchAssetResponse) {}
}

// FetchAssetRequest asks the plugin to fetch one content-addressed asset.
message FetchAssetRequest {
  // The object to read, e.g. gs://<bucket>/kata-assets/vmlinux. Which schemes
  // a plugin serves is up to the plugin. At most 2048 bytes, the SandboxConfig
  // URL's limit. Masked in logged requests, like the SandboxConfig URL it
  // comes from.
  string asset_uri = 1 [ debug_redact = true ];

  // The expected SHA-256 of the object's content, as 64 lower-case hex
  // characters.
  string sha256 = 2;

  // Full local path of an existing regular file the asset is written to. The
  // plugin replaces the file, keeping its mode, only once the content has been
  // verified, never creates it, and leaves it unchanged on any error. The
  // caller opens it after the call: a descriptor opened before still reads
  // the old content.
  string write_path = 3;

  // The largest object, in bytes, the caller accepts. Must be positive.
  int64 max_bytes = 4;
}

message FetchAssetResponse {}
