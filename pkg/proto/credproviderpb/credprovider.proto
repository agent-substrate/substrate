syntax = "proto3";

package credprovider;

option go_package = "github.com/agent-substrate/substrate/pkg/proto/credproviderpb";

// CredentialProvider is the plugin API a secret backend implements so Substrate
// infrastructure (e.g. the egress gateway's credential injector) can fetch an
// external credential without Substrate storing it. A provider interprets the
// attested request context however is relevant to the store it fronts.
service CredentialProvider {
  // RequestSecret resolves a credential URI to its secret material, subject to
  // whatever authorization the provider applies to the request context.
  rpc RequestSecret(RequestSecretRequest) returns (RequestSecretResponse) {}
}

// HttpRequestContext is the attested context Substrate passes with a http request.
message HttpRequestContext {
  // The destination authority the matched egress policy rule authorized, i.e.
  // where the credential will be sent.
  string authority = 1;

  // The request header the credential will be injected into (e.g.
  // "authorization"), from the matched policy rule.
  string header = 2;
}

// RequestSecretRequest asks a provider to resolve one credential URI.
message RequestSecretRequest {
  // A substrate-secret:// URI:
  //   substrate-secret://<provider name>/<provider tail>
  string uri = 1;

  // The attested actor identity on whose behalf the secret is fetched. Today
  // this is the actor's SPIFFE URI as verified by the egress gateway.
  string actor_identity = 2;

  // The attested context for http request.
  HttpRequestContext context = 3;
}

// RequestSecretResponse carries the resolved credential.
message RequestSecretResponse {
  // The raw bytes contains the secret.
  optional bytes opaque_bytes = 1;
}
