syntax = "proto3";

package hostruntime;

option go_package = "github.com/agent-substrate/substrate/pkg/proto/hostruntimepb";

// HostRuntime manages Actors on a provider host. Requests are idempotent by
// actor_uid: retrying Activate returns the same running Actor, and retrying
// Terminate after cleanup succeeds.
service HostRuntime {
  rpc Activate(ActivateRequest) returns (ActivateResponse) {}
  rpc Pause(PauseRequest) returns (PauseResponse) {}
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse) {}
  rpc Discard(DiscardRequest) returns (DiscardResponse) {}
  rpc Terminate(TerminateRequest) returns (TerminateResponse) {}
}

message ActivateRequest {
  string actor_uid = 1;
  string image = 2;
  int64 cpu_milli = 3;
  int64 memory_bytes = 4;
  HTTPReadinessProbe readiness_probe = 5;
  optional string external_snapshot_uri = 6;
  optional string local_snapshot_name = 7;
  repeated DurableVolume durable_volumes = 8;
}

// DurableVolume is an externally provisioned filesystem that the host stages
// and exposes to the guest. The guest agent mounts the VirtioFS share at
// mount_path before reporting ready. Credentials remain with the host-side
// storage driver; volume_context contains only driver-returned mount metadata.
message DurableVolume {
  string name = 1;
  string mount_path = 2;
  string volume_id = 3;
  string driver = 4;
  map<string, string> volume_context = 5;
}

message PauseRequest {
  string actor_uid = 1;
  string local_snapshot_name = 2;
}

message PauseResponse {}

message CheckpointRequest {
  string actor_uid = 1;
  string external_snapshot_uri = 2;
}

message CheckpointResponse {}

message DiscardRequest {
  string actor_uid = 1;
}

message DiscardResponse {}

message HTTPReadinessProbe {
  int32 port = 1;
  string path = 2;
  int32 timeout_seconds = 3;
}

message ActivateResponse {
  ActorEndpoint endpoint = 1;
}

message ActorEndpoint {
  string host = 1;
  int32 port = 2;
}

message TerminateRequest {
  string actor_uid = 1;
}

message TerminateResponse {}
