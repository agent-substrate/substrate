syntax = "proto3";

package ateapi;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/agent-substrate/substrate/pkg/proto/ateapipb";

// Control is the primary RPC interface for Agentic Substrate.
service Control {
  // Get an Actor.
  rpc GetActor(GetActorRequest) returns (Actor) {}

  // Create a new Actor deriving from a given ActorTemplate.
  rpc CreateActor(CreateActorRequest) returns (Actor) {}

  // Update mutable fields on an existing Actor.
  rpc UpdateActor(UpdateActorRequest) returns (Actor) {}

  // Suspend a given actor to a new snapshot. A running actor is checkpointed
  // on its worker; a paused actor's node-local snapshot is uploaded, narrowed
  // to the template's commit scope where required (Full capture, Data commit).
  rpc SuspendActor(SuspendActorRequest) returns (SuspendActorResponse) {}

  // Pause a given actor and keep its snapshots on node VM.
  rpc PauseActor(PauseActorRequest) returns (PauseActorResponse) {}

  // Resume an actor from its latest snapshot.
  rpc ResumeActor(ResumeActorRequest) returns (ResumeActorResponse) {}

  // Delete an actor. Only suspended actors can be deleted.
  rpc DeleteActor(DeleteActorRequest) returns (Actor) {}

  // Get an ActorSnapshot.
  rpc GetActorSnapshot(GetActorSnapshotRequest) returns (ActorSnapshot) {}

  // Get an ActorSnapshot tag.
  rpc GetActorSnapshotTag(GetActorSnapshotTagRequest) returns (ActorSnapshotTag) {}

  // List ActorSnapshots.
  rpc ListActorSnapshots(ListActorSnapshotsRequest) returns (ListActorSnapshotsResponse) {}

  // Add an Atespace-owned, stable name for an ActorSnapshot.
  rpc CreateActorSnapshotTag(CreateActorSnapshotTagRequest) returns (ActorSnapshotTag) {}

  // Publish or unpublish an ActorSnapshot tag without changing its address.
  rpc UpdateActorSnapshotTag(UpdateActorSnapshotTagRequest) returns (ActorSnapshotTag) {}

  // Delete an ActorSnapshot tag. The snapshot becomes garbage-collectable when
  // its final tag is deleted.
  rpc DeleteActorSnapshotTag(DeleteActorSnapshotTagRequest) returns (ActorSnapshotTag) {}

  // List Workers.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {}

  // Get a Worker.
  rpc GetWorker(GetWorkerRequest) returns (Worker) {}

  // Register a Worker. Called once its Pod is Ready and has an IP.
  rpc CreateWorker(CreateWorkerRequest) returns (Worker) {}

  // Update observed pool state on a Worker.
  rpc UpdateWorker(UpdateWorkerRequest) returns (Worker) {}

  // Deregister a Worker. Does not cascade: the caller is responsible for
  // cleaning up related resources first.
  rpc DeleteWorker(DeleteWorkerRequest) returns (Worker) {}

  // Mark a Worker as terminating so the scheduler stops routing new Actors to
  // it. Idempotent; one-way. Deliberately leaves any bound Actor alone.
  // Returns ABORTED if another write lands on the Worker first; retry.
  rpc DrainWorker(DrainWorkerRequest) returns (Worker) {}

  // List Actors.
  rpc ListActors(ListActorsRequest) returns (ListActorsResponse) {}

  // Create a new Atespace. Substrate-native, stored in database.
  rpc CreateAtespace(CreateAtespaceRequest) returns (Atespace) {}

  // Get an Atespace by name.
  rpc GetAtespace(GetAtespaceRequest) returns (Atespace) {}

  // List Atespaces.
  rpc ListAtespaces(ListAtespacesRequest) returns (ListAtespacesResponse) {}

  // Delete an empty Atespace. Rejects (FailedPrecondition) if any Actors or
  // ActorSnapshotTags remain.
  rpc DeleteAtespace(DeleteAtespaceRequest) returns (Atespace) {}

  rpc CreateActorTemplate(CreateActorTemplateRequest) returns (ActorTemplate) {}

  rpc GetActorTemplate(GetActorTemplateRequest) returns (ActorTemplate) {}

  rpc ListActorTemplates(ListActorTemplatesRequest) returns (ListActorTemplatesResponse) {}

  // Delete an ActorTemplate together with its golden actor and golden
  // snapshot in the ActorTemplate's namespace.
  rpc DeleteActorTemplate(DeleteActorTemplateRequest) returns (ActorTemplate) {}
}

message LocalSnapshotInfo {
  // The name of the local checkpoint on each of the nodes below.
  string snapshot_name = 1;
  // Node VMs that have local snapshots for this actor, while it's PAUSED.
  repeated string node_vms_with_local_snapshots = 2;
  // Scope the pause checkpoint captured (the template's onPause at pause
  // time).
  SnapshotContentScope content_scope = 3;
}

enum SnapshotContentScope {
  // Defaults to FULL for compatibility with existing snapshot configuration.
  SNAPSHOT_CONTENT_SCOPE_UNSPECIFIED = 0;
  // Captures process memory, root filesystem changes, and durable data.
  SNAPSHOT_CONTENT_SCOPE_FULL = 1;
  // Captures durable data without process memory or root filesystem changes.
  SNAPSHOT_CONTENT_SCOPE_DATA = 2;
}

enum ActorSnapshotTagScope {
  // Not set and rejected wherever a client supplies a scope
  ACTOR_SNAPSHOT_TAG_SCOPE_UNSPECIFIED = 0;
  // May initialize Actors only in the tag's owning Atespace.
  ACTOR_SNAPSHOT_TAG_SCOPE_ATESPACE = 1;
  // Published for use by Actors in any Atespace. The tag remains addressed
  // through its owning Atespace.
  ACTOR_SNAPSHOT_TAG_SCOPE_PUBLISHED = 2;
}

// Selector matches worker pools by label.
// Only equality-based matching is supported.
message Selector {
  // match_labels selects by exact equality on a set of labels.
  //
  // +k8s:optional
  // +k8s:unionMember
  // +k8s:minProperties=1
  // +k8s:maxProperties=10
  // +k8s:eachKey=+k8s:format=k8s-label-key
  // +k8s:eachVal=+k8s:format=k8s-label-value
  map<string, string> match_labels = 1;
}

// ResourceMetadata holds the common fields carried by every Substrate resource.
message ResourceMetadata {
  // atespace is the namespace the resource belongs to. Empty for global-scoped
  // resources. Caller-specified at creation and immutable thereafter.
  //
  // Atespaced resources should add `+k8s:subfield(atespace)=+k8s:required`
  // Non-atespaced resources should add `+k8s:subfield(atespace)=+k8s:forbidden`
  // +k8s:optional
  // +k8s:format=k8s-short-name
  // +k8s:immutable
  string atespace = 1;

  // name is the resource's name, unique within its atespace (or globally, for
  // global-scoped resources). Caller-specified at creation and immutable thereafter.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  // +k8s:immutable
  string name = 2;

  // uid is a server-assigned, globally unique identifier for this resource.
  // Immutable throughout the lifecycle of the resource.
  //
  // This field is ignored during create operations and used as precondition
  // for update operations.
  //
  // +k8s:optional
  // +k8s:format=k8s-uuid
  // +k8s:immutable
  string uid = 3;

  // version is increased on every mutation.
  //
  // This field is ignored during create operations and used as precondition
  // for update operations.
  //
  // +k8s:optional
  // +k8s:alpha(since: "0.0")=+k8s:monotonic # TODO: get rid of alpha prefix
  // +k8s:minimum=1
  // +k8s:update=NoUnset
  int64 version = 4;

  // create_time is the time the resource was created.
  //
  // This field is ignored on input.
  //
  // +k8s:optional
  // +k8s:immutable
  // TODO: validate that this is a valid timestamp
  google.protobuf.Timestamp create_time = 5;

  // update_time is the time the resource was last updated.
  //
  // This field is ignored on input.
  //
  // +k8s:optional
  // +k8s:update=NoUnset
  // TODO: validate that this is a valid timestamp
  // TODO: validate that UpdateTime >= CreateTime
  google.protobuf.Timestamp update_time = 6;
}

message ExternalVolume {
  // Name of the volume specified in the actor template.
  string volume_name = 1;

  // The globally unique volume_id returned from the storage system.
  // This will be initially empty during volume creation
  string storage_volume_id = 2;

  // Internal volume plugin name or CSI driver name.
  string volume_type = 3;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Volume creation pending in the storage system.
    STATUS_PENDING = 1;
    // Volume successfully created in the storage system.
    STATUS_CREATED = 2;
    // Volume being deleted from the storage system.
    STATUS_DELETING = 3;
  }
  Status status = 4;
  // volume_context contains metadata returned by the CSI driver during volume
  // provisioning, needed by the node plugin for mounting (e.g. attachment info).
  map<string, string> volume_context = 5;
}

message Actor {
  // Common resource metadata: atespace, name, uid, version, timestamps.
  //
  // +k8s:required
  // +k8s:subfield(atespace)=+k8s:required
  ResourceMetadata metadata = 1;

  // TODO: delete both fields once we start using actor_template below.
  // +k8s:required
  // +k8s:format=k8s-short-name
  // +k8s:immutable
  string actor_template_namespace = 2;
  // +k8s:required
  // +k8s:format=k8s-long-name
  // +k8s:immutable
  string actor_template_name = 3;

  // TODO: replace with full actor_template spec if we decide to make each Actor self-contained.
  // +k8s:optional # TODO: this should be required?
  // +k8s:subfield(atespace)=+k8s:required
  // +k8s:immutable # TODO: is this mutable?
  ObjectRef actor_template = 4;

  // worker_selector is the per-actor placement constraint. The scheduler
  // evaluates the AND of this selector and the template's workerSelector to
  // find eligible pools.
  // Changes take effect on the next ResumeActor call.
  //
  // +k8s:optional
  Selector worker_selector = 5;

  // The tag specified by the caller at CreateActor to seed this Actor from an
  // ActorSnapshot. Unset if the Actor was not created from a snapshot. Set
  // once at creation and immutable afterward.
  //
  // +k8s:optional
  // +k8s:subfield(atespace)=+k8s:required
  // +k8s:immutable
  ObjectRef source_snapshot_tag = 6;

  // status is the system-managed state of the Actor. It is updated by the
  // server and ignored on input. It is always present in output.
  //
  // +k8s:optional
  ActorStatus status = 7;
}

enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_RESUMING = 1;
  ACTOR_STATE_RUNNING = 2;
  ACTOR_STATE_SUSPENDING = 3;
  ACTOR_STATE_SUSPENDED = 4;
  ACTOR_STATE_PAUSING = 5;
  ACTOR_STATE_PAUSED = 6;
  ACTOR_STATE_CRASHED = 7;
  ACTOR_STATE_DELETING = 8;
  // Keep this in sync with ActorStatus.state's maximum.
}

message ActorStatus {
  // state is the Actor's current lifecycle state.
  //
  // +k8s:required
  // +k8s:minimum=1
  // +k8s:maximum=8 # keep this in sync with the ActorState enum
  ActorState state = 1;

  // worker_assignment points at the worker currently hosting this Actor.
  // Unset whenever the Actor has no worker (SUSPENDED, PAUSED, CRASHED).
  //
  // +k8s:optional
  // +k8s:update=NoModify # can be set and cleared, but not changed in place
  WorkerAssignment worker_assignment = 2;

  // TODO: Add DV (optional, maxLength?)
  string in_progress_snapshot_name = 3;

  // The latest durable snapshot created for this Actor.
  // +k8s:opaqueType
  // TODO: Add DV (required?)
  ObjectRef latest_snapshot = 4;

  // Node-local state used only while the Actor is paused.
  // TODO: Add DV (optional, need to recurse into this type)
  LocalSnapshotInfo local_snapshot_info = 5;

  // Actor version captured when the current durable snapshot began.
  // TODO: Add DV (optional, minimum?)
  int64 in_progress_snapshot_source_actor_version = 6;

  // Volumes attached to the actor. These volumes only live as long as the actor.
  // They are deleted when the actor is deleted.
  // TODO: Add DV (optional, need to recurse into this type, immutable?)
  repeated ExternalVolume actor_volumes = 7;

  // TODO: Add DV (optional, maxLength?)
  string in_progress_local_snapshot_name = 8;

  // How this Actor was seeded from an ActorSnapshot at CreateActor. Unset if
  // the Actor was not created from a snapshot.
  // TODO: Add DV (optional, need to recurse into this type, immutable?)
  ActorSourceSnapshotStatus source_snapshot = 9;
}

// ActorSourceSnapshotStatus records what an Actor's source_snapshot_tag
// resolved to at CreateActor time. Set once, immutable afterward.
message ActorSourceSnapshotStatus {
  // The (atespace, name) of the snapshot the tag resolved to at
  // creation time.
  // +k8s:opaqueType
  ObjectRef snapshot = 1;

  // UID of the snapshot resolved at creation time.
  string snapshot_uid = 2;
}

// WorkerAssignment points at the Worker currently hosting an Actor.
//
// This is a denormalized snapshot, not merely a reference: atenet reads
// worker_pod_ip on the request-routing path and must not need a second lookup,
// and kubectl-ate displays the pod name. The copies stay valid for the life of
// the assignment because a Worker's identity fields are immutable.
//
// Pass `worker` to GetWorker; none of the denormalized fields identify the
// Worker to the API.
message WorkerAssignment {
  // worker references the assigned Worker. This is the field to look the Worker
  // up by; the worker_* fields below are a denormalized copy kept so that
  // readers on a hot path do not have to fetch the Worker at all.
  //
  // Workers are global-scoped, so this carries no atespace.
  //
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  // +k8s:required
  ObjectRef worker = 6;

  // worker_namespace is the Kubernetes namespace of the WorkerPool and worker Pod.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string worker_namespace = 1;

  // worker_pool is the name of the WorkerPool the worker belongs to.
  //
  // +k8s:required
  // +k8s:format=k8s-long-name
  string worker_pool = 2;

  // worker_pod is the name of the Kubernetes pod hosting the Actor.
  //
  // +k8s:required
  // +k8s:format=k8s-long-name
  string worker_pod = 3;

  // worker_pod_uid is the Kubernetes UID of worker_pod.
  //
  // +k8s:required
  // +k8s:format=k8s-uuid
  string worker_pod_uid = 4;

  // worker_pod_ip is the IP of worker_pod.
  //
  // +k8s:required
  // +k8s:customValidation # until `format=k8s-ip` is supported
  string worker_pod_ip = 5;
}

// ActorSnapshot is an independently addressable durable Actor snapshot. Its
// contents are immutable.
message ActorSnapshot {
  // +k8s:opaqueType
  ResourceMetadata metadata = 1;
  ActorSnapshotStatus status = 2;
}

message ActorSnapshotStatus {
  // +k8s:opaqueType
  ObjectRef source_actor = 1;
  string source_actor_uid = 2;
  int64 source_actor_version = 3;
  string actor_template_namespace = 4;
  string actor_template_name = 5;
  string actor_template_uid = 6;
  SnapshotContentScope content_scope = 7;
  string snapshot_uri = 8;
  // Immutable reference to the actor_template where the snapshot was created from.
  // +k8s:opaqueType
  ObjectRef actor_template = 9;
}

// ActorSnapshotTag is an immutable, Atespace-owned alias and retention pin.
// Its owning Atespace cannot be deleted until the tag is removed.
message ActorSnapshotTag {
  // Common resource metadata: name, uid, version, timestamps.
  // +k8s:opaqueType
  ResourceMetadata metadata = 1;
  // +k8s:opaqueType
  ObjectRef snapshot = 2;
  ActorSnapshotTagScope scope = 3;
}

// Atespace is the isolation boundary an Actor is created into. Global-scoped:
// metadata.atespace is always empty; the atespace's identity is metadata.name.
message Atespace {
  // Common resource metadata: name, uid, version, timestamps.
  //
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ResourceMetadata metadata = 1;
}

// ObjectRef references a Substrate resource by its (atespace, name) identity.
message ObjectRef {
  // The atespace of the referenced resource. This field should be empty if the
  // target resource is global-scoped, but references to objects in the same
  // atespace as the referrer must still populate this field.
  //
  // References to atespaced resources should add `+k8s:subfield(atespace)=+k8s:required`
  // References to non-atespaced resources should add `+k8s:subfield(atespace)=+k8s:forbidden`
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string atespace = 1;

  // The name of the referenced resource. This field is required.
  //
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 2;
}

// SandboxClass selects the sandbox runtime family. Snapshots are not portable
// across classes.
enum SandboxClass {
  SANDBOX_CLASS_UNSPECIFIED = 0;
  SANDBOX_CLASS_GVISOR = 1;
  SANDBOX_CLASS_MICROVM = 2;
}

message ActorTemplate {
  // Common resource metadata: atespace, name, uid, version, timestamps.
  // +k8s:opaqueType
  ResourceMetadata metadata = 1;

  // worker_selector restricts which worker pools actors from this template
  // may use.
  //
  // +k8s:opaqueType
  Selector worker_selector = 2;

  repeated Container containers = 3;

  // +k8s:optional
  repeated Volume volumes = 4;

  SnapshotsConfig snapshots_config = 5;

  // sandbox_config selects the sandbox runtime this version's actors run on.
  SandboxConfig sandbox_config = 6;

  // Resource usage configuration.
  Resources resources = 7;

  ActorTemplateStatus status = 8;
}

message Resources {
  repeated Limits limits = 1;
}

message Limits {
  string name = 1;
  string quantity = 2;
}

message GoldenSnapshotStatus {
  // golden_snapshot points at the ActorSnapshot, in the reserved ate-golden
  // system atespace, built for this version by ate-api. Set once state is
  // READY.
  // +k8s:opaqueType
  ObjectRef golden_snapshot = 1;

  // take_golden_snapshot_at is when the golden-actor warmup ends and the
  // golden snapshot may be taken. Mirrors the CRD's status.takeGoldenSnapshotAt
  // cmd/atecontroller/internal/controllers/actortemplate_controller.go
  google.protobuf.Timestamp take_golden_snapshot_at = 2;

  string error_message = 3;
}

message ActorTemplateStatus {
  GoldenSnapshotStatus golden_snapshot_status = 1;

  // sandbox_assets is the referenced SandboxConfig's content frozen at
  // creation time.
  SandboxAssets sandbox_assets = 2;
}

// SandboxConfig selects the sandbox runtime for an ActorTemplate.
message SandboxConfig {
  // sandbox_class selects the sandbox runtime family.
  // Required; must be specified..
  SandboxClass sandbox_class = 1;

  // config_name names the cluster-scoped SandboxConfig Kubernetes object
  // supplying the sandbox binaries. Required; must match sandbox_class.
  string config_name = 2;
}

message SnapshotsConfig {
  // on_pause selects what is captured during pause actor.
  SnapshotContentScope on_pause = 1;

  // on_commit selects what captures.
  // Must be a subset of on_pause: FULL allows FULL or DATA, DATA allows DATA.
  SnapshotContentScope on_commit = 2;

  // on_resume selects, per snapshot situation, what supplies the guest state
  // at resume. Unset means the defaults documented on OnResumeConfig.
  OnResumeConfig on_resume = 3;

  // storage_location is the base object-storage URI snapshots of actors on
  // this version are stored under. Required.
  string storage_location = 4;
}

// ResumeSource selects what supplies the guest state when an actor is resumed
// from one of the snapshot situations named by OnResumeConfig's fields.
enum ResumeSource {
  RESUME_SOURCE_UNSPECIFIED = 0;
  // Starts the actor's containers afresh from the OCI image, with the
  // durable-dir volumes pre-populated from the snapshot.
  RESUME_SOURCE_COLD_BOOT = 1;
  // Restores with the version's golden snapshot and the actor's own
  // durable data.
  RESUME_SOURCE_GOLDEN = 2;
}

// OnResumeConfig selects, per snapshot situation, what supplies the guest
// state at resume. Each field names what is being resumed FROM; the value
// names the boot source. Full snapshots that are still valid always restore
// from their own content and are not configurable here.
message OnResumeConfig {
  // from_data applies when the resume uses a DATA-scope snapshot (from
  // on_pause or on_commit).
  ResumeSource from_data = 1;
}

// Container is a single application container of an ActorTemplate.
message Container {
  string name = 1;

  string image = 2;

  // Entrypoint array; when set, the image's ENTRYPOINT and CMD are both
  // ignored and the process argv is command + args. Unlike Kubernetes,
  // $(VAR_NAME) references are NOT expanded.
  repeated string command = 3;

  // Arguments to the entrypoint; the image's CMD is used if unset (unless
  // command is set, which discards the image's CMD).
  repeated string args = 4;

  repeated EnvVar env = 5;

  // readyz is an optional HTTP readiness probe; when set the actor is not
  // ready until the endpoint returns 200.
  ContainerReadyz readyz = 6;

  repeated VolumeMount volume_mounts = 7;
}

// EnvVar supplies one environment variable to a container. Values are not
// expanded with Kubernetes-style $(VAR) references.
message EnvVar {
  // name may be any printable ASCII character except '='.
  string name = 1;

  // value is the literal value.
  string value = 2;
}

// ContainerReadyz configures the readiness signal for a container.
message ContainerReadyz {
  // http_get specifies the HTTP request to perform. Required.
  HTTPGetAction http_get = 1;

  // timeout_seconds bounds how long to poll http_get before failing the
  // actor start. 0 means the server-applied default (30s).
  int32 timeout_seconds = 2;
}

// HTTPGetAction describes an HTTP GET against the container's interior IP.
message HTTPGetAction {
  // path defaults to "/readyz".
  string path = 1;

  int32 port = 2;
}

message Volume {
  // name of the volume. Must be a DNS label.
  string name = 1;

  // Exactly one of durable_dir / external_volume_template / system_info
  // must be set.
  DurableDirVolumeSource durable_dir = 2;
  ExternalVolumeTemplate external_volume_template = 3;

  // +k8s:optional
  SystemInfoVolumeSource system_info = 5;

  // type discriminates the source union: "DurableDir",
  // "ExternalVolumeTemplate" or "SystemInfo".
  string type = 4;
}

// DurableDirVolumeSource is a durable directory on rootfs that persists
// across resumes and participates in snapshots.
message DurableDirVolumeSource {}

// ExternalVolumeTemplate provisions an external volume per actor; the volume
// lives only as long as the actor. Not supported with SANDBOX_CLASS_MICROVM.
message ExternalVolumeTemplate {
  // capacity of the volume to create, in Kubernetes resource.Quantity string
  // form (e.g. "10Gi"). Required.
  string capacity = 1;

  // storage_class_name names the cluster-scoped Kubernetes StorageClass to
  // create the volume from. Required.
  string storage_class_name = 2;
}

// SystemInfoVolumeSource is a read-only volume of substrate-generated
// per-actor files (identity fields, projected trust bundles), regenerated by
// atelet on every Run/Restore. Mirrors the CRD's systemInfo volume source.
message SystemInfoVolumeSource {
  // data_sources lists the projections to place within the volume. At most
  // one actor_metadata entry may appear, and file paths must be unique
  // across all entries.
  //
  // +k8s:optional
  // +k8s:maxItems=8
  repeated SystemInfoDataSource data_sources = 1;
}

message SystemInfoDataSource {
  // Exactly one of actor_metadata / trust_bundle must be set.
  //
  // +k8s:optional
  // +k8s:unionMember
  ActorMetadataDataSource actor_metadata = 1;

  // +k8s:optional
  // +k8s:unionMember
  TrustBundleDataSource trust_bundle = 2;
}

// ActorMetadataDataSource projects the actor's identity fields to files, one
// per item.
message ActorMetadataDataSource {
  // items must not project the same field twice, and item paths must be
  // unique.
  //
  // +k8s:required
  // +k8s:minItems=1
  // +k8s:maxItems=8
  // +k8s:listType=atomic
  // +k8s:unique=map
  // +k8s:listMapKey=field
  repeated ActorMetadataItem items = 1;
}

// ActorMetadataItem projects one actor identity field to a file at path,
// a clean relative Unix path from the root of the volume.
message ActorMetadataItem {
  // +k8s:required
  ActorMetadataField field = 1;

  // +k8s:required
  // +k8s:minLength=1
  // +k8s:maxLength=255
  string path = 2;
}

// ActorMetadataField selects one identity field of the actor.
enum ActorMetadataField {
  ACTOR_METADATA_FIELD_UNSPECIFIED = 0;
  ACTOR_METADATA_FIELD_NAME = 1;
  ACTOR_METADATA_FIELD_ATESPACE = 2;
  ACTOR_METADATA_FIELD_UID = 3;
}

// TrustBundleDataSource projects the trust anchors of the named trust bundle
// to a PEM file at path. Supported names are allowlisted in atelet.
message TrustBundleDataSource {
  // +k8s:required
  // +k8s:minLength=1
  // +k8s:maxLength=253
  string name = 1;

  // +k8s:required
  // +k8s:minLength=1
  // +k8s:maxLength=255
  string path = 2;
}

// VolumeMount mounts a named Volume into a container.
message VolumeMount {
  // name must match the name of a Volume.
  string name = 1;

  // mount_path within the container. Must be a clean absolute Unix path.
  string mount_path = 2;
}

// SandboxAssets is the frozen description of the sandbox binaries an actor
// boots with: a class plus content-addressed files keyed first by
// architecture and then by asset name, mirroring the SandboxConfig
// CRD schema.
message SandboxAssets {
  SandboxClass sandbox_class = 1;
  // assets maps architecture (GOARCH, e.g. "amd64") to that arch's files.
  map<string, ArchAssets> assets = 2;

  // pause_image is the container to use as the root sandbox container.
  string pause_image = 3;
}

message ArchAssets {
  // files maps asset name (e.g. "gvisor", "kata-kernel") to its file.
  map<string, AssetFile> files = 1;
}

// AssetFile is one content-addressed file atelet fetches for a sandbox
// runtime.
message AssetFile {
  // URL to download the asset from (e.g. a gs:// URL).
  string url = 1;

  // Lower-case hex SHA256 naming the cached file and verifying the download.
  string sha256 = 2;
}

message CreateAtespaceRequest {
  // The atespace to create.
  //
  // +k8s:required
  Atespace atespace = 1;
}

message GetAtespaceRequest {
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef atespace = 1;
}

message ListAtespacesRequest {
  // Requested page size; the server may return fewer, or occasionally
  // slightly more. If unspecified, defaults to a server-chosen value;
  // values above 1000 are coerced to 1000.
  //
  // +k8s:optional
  // +k8s:minimum=1
  int32 page_size = 1;

  // Pagination token from a previous ListAtespaces response.
  // Omit or leave empty for the first request.
  //
  // +k8s:optional
  // +k8s:maxLength=256
  string page_token = 2;
}

message ListAtespacesResponse {
  // The page of atespaces. This list may be empty even if there are more results.
  repeated Atespace atespaces = 1;

  // Pagination token for the next page. Empty if this is the last page.
  string next_page_token = 2;
}

message DeleteAtespaceRequest {
  // +k8s:required
  // +k8s:beta(since: "0.0")=+k8s:subfield(atespace)=+k8s:forbidden # TODO: get rid of beta prefix
  ObjectRef atespace = 1;
}

message CreateActorTemplateRequest {
  // The actor template version to create. Server-assigned metadata (uid,
  // version, timestamps) is ignored, as are the status fields.
  //
  // +k8s:required
  ActorTemplate actor_template = 1;
}

message GetActorTemplateRequest {
  // +k8s:opaqueType
  ObjectRef actor_template = 1;
}

message ListActorTemplatesRequest {
  // The atespace to list actor templates from. Empty lists across all
  // atespaces.
  string atespace = 1;

  // Requested page size; the server may return fewer, or occasionally
  // slightly more. If unspecified, defaults to a server-chosen value;
  // values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // Pagination token from a previous ListActorTemplates response.
  // Omit or leave empty for the first request.
  string page_token = 3;
}

message ListActorTemplatesResponse {
  // The page of actor template versions. This list may be empty even if
  // there are more results.
  repeated ActorTemplate actor_templates = 1;

  // Pagination token for the next page. Empty if this is the last page.
  string next_page_token = 2;
}

message DeleteActorTemplateRequest {
  // +k8s:opaqueType
  ObjectRef actor_template = 1;
}

message GetActorRequest {
  // +k8s:opaqueType
  ObjectRef actor = 1;
}

// Request to create a new Actor.
message CreateActorRequest {
  // The actor to create.
  //
  // +k8s:required
  Actor actor = 1;
}

// Request to update mutable fields on an existing Actor.
// May be called regardless of the actor's current state.
// Changes take effect on the next ResumeActor call.
message UpdateActorRequest {
  // The actor to update.
  // actor.metadata.atespace and actor.metadata.name identify which resource to
  // update.
  // actor.metadata.version and actor.metadata.uid are required preconditions.
  //
  // +k8s:required
  // +k8s:opaqueType # updates are handled in 2 steps, do not descend
  // +k8s:subfield(metadata)=+k8s:required
  // +k8s:customValidation # TODO: when we get nested subfields, require metadata.atespace
  Actor actor = 1;
}

message SuspendActorRequest {
  // +k8s:opaqueType
  ObjectRef actor = 1;
}

message SuspendActorResponse {
  Actor actor = 1;
}

message PauseActorRequest {
  // +k8s:opaqueType
  ObjectRef actor = 1;
}

message PauseActorResponse {
  Actor actor = 1;
}

message ResumeActorRequest {
  // +k8s:opaqueType
  ObjectRef actor = 1;

  // If true, skip golden snapshot and boot the workload from scratch.
  bool boot = 2;
}

message ResumeActorResponse {
  Actor actor = 1;

  // True if a resume workflow was executed to activate the actor.
  // False if the actor was already RUNNING.
  bool resumed = 2;
}

message DeleteActorRequest {
  // +k8s:opaqueType
  ObjectRef actor = 1;
  bool any_state = 2;
}

message GetActorSnapshotRequest {
  // +k8s:opaqueType
  ObjectRef actor_snapshot = 1;
}

message GetActorSnapshotTagRequest {
  // +k8s:opaqueType
  ObjectRef actor_snapshot_tag = 1;
}

message ListActorSnapshotsRequest {
  string atespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListActorSnapshotsResponse {
  repeated ActorSnapshot actor_snapshots = 1;
  string next_page_token = 2;
}

message CreateActorSnapshotTagRequest {
  // The tag to create.
  ActorSnapshotTag actor_snapshot_tag = 1;
}

// Request to update mutable fields on an existing ActorSnapshotTag.
// The tag keeps its address: the snapshot it points at cannot be changed.
message UpdateActorSnapshotTagRequest {
  // The tag to update.
  // actor_snapshot_tag.metadata.atespace and actor_snapshot_tag.metadata.name
  // identify which resource to update.
  // actor_snapshot_tag.metadata.version and actor_snapshot_tag.metadata.uid
  // are required preconditions
  ActorSnapshotTag actor_snapshot_tag = 1;
}

message DeleteActorSnapshotTagRequest {
  // +k8s:opaqueType
  ObjectRef actor_snapshot_tag = 1;
}

// DeleteOptions carries per-delete controls. Today it holds optional
// preconditions that guard against acting on a resource that is not in the
// state the caller expects. Future delete-specific controls (e.g. dry-run)
// should be added here.
//
// Intended to be reused across every Delete<Type>Request; only
// DeleteWorkerRequest carries it so far.
message DeleteOptions {
  // If non-zero, delete only if the server's current version matches.
  int64 version = 1;

  // If non-empty, delete only if the server's current uid matches. Guards
  // against name reuse across lifecycles.
  string uid = 2;
}

message ListWorkersRequest {
  // Requested page size; the server may return fewer, or occasionally
  // slightly more. If unspecified, defaults to a server-chosen value;
  // values above 1000 are coerced to 1000.
  int32 page_size = 1;

  // Pagination token from a previous ListWorkers response.
  // Omit or leave empty for the first request.
  string page_token = 2;
}

message ListWorkersResponse {
  // The page of workers. This list may be empty even if there are more results.
  repeated Worker workers = 1;

  // Pagination token for the next page. Empty if this is the last page.
  string next_page_token = 2;
}

// TODO: Workers are still created, updated, and deleted by writing directly to
// the store from the WorkerPoolSyncer and the actor workflows; migrating those
// callers onto the RPCs below lands in a follow-up change.

message GetWorkerRequest {
  // The Worker to fetch. atespace is always empty; Workers are global-scoped.
  // +k8s:opaqueType
  ObjectRef worker = 1;
}

message CreateWorkerRequest {
  // The Worker to register.
  Worker worker = 1;
}

message UpdateWorkerRequest {
  // The Worker to update.
  // worker.metadata.name identifies which resource to update. atespace is
  // always empty; Workers are global-scoped.
  // worker.metadata.version and worker.metadata.uid are required preconditions.
  //
  // sandbox_class and labels are the only fields an update may change. Every
  // other field is replaced with what the request carries, and a field left
  // unset is cleared — so read the Worker, change what you mean to change, and
  // send the whole thing back. A request that alters an immutable field, by
  // changing it or by omitting it, returns INVALID_ARGUMENT naming the field.
  // status is output-only and whatever it carries is ignored.
  Worker worker = 1;
}

message DeleteWorkerRequest {
  // The Worker to deregister.
  // +k8s:opaqueType
  ObjectRef worker = 1;

  // Optional per-delete preconditions.
  DeleteOptions options = 2;
}

message DrainWorkerRequest {
  // The Worker to mark as terminating.
  // +k8s:opaqueType
  ObjectRef worker = 1;
}

// List actors with pagination. Provides "soft" guarantees: actors may be
// missed or duplicated if the system state changes during pagination.
message ListActorsRequest {
  // The atespace to list actors from. Empty lists across all atespaces.
  string atespace = 1;

  // Requested page size; the server may return fewer, or occasionally
  // slightly more. If unspecified, defaults to a server-chosen value;
  // values above 1000 are coerced to 1000.
  int32 page_size = 2;

  // Pagination token from a previous ListActors response.
  // Omit or leave empty for the first request.
  string page_token = 3;
}

message ListActorsResponse {
  // The page of actors. This list may be empty even if there are more results.
  repeated Actor actors = 1;

  // Pagination token for the next page. Empty if this is the last page.
  string next_page_token = 2;
}

// Worker is a schedulable worker pod.
//
// Global-scoped: metadata.atespace is always empty. metadata.name is assigned
// by the control plane and is opaque to clients — never parse it or derive it
// from anything else; read pod identity from the named fields below.
//
// sandbox_class and labels are the only mutable fields; every other field is
// either immutable after creation or output-only. UpdateWorker replaces the
// whole resource, so an immutable field that a request changes — including by
// omitting it, which would clear it — is rejected with INVALID_ARGUMENT.
message Worker {
  // Output-only: name, uid, version and timestamps are all server-assigned.
  // uid and version are echoed back on UpdateWorker as preconditions.
  // +k8s:opaqueType
  ResourceMetadata metadata = 1;

  // Kubernetes coordinates. Immutable, set at creation.
  string worker_namespace = 2;
  string worker_pool = 3;
  string worker_pod = 4;
  string worker_pod_uid = 5;
  string node_name = 6;
  string ip = 7;

  // Mutable.
  string sandbox_class = 8;
  map<string, string> labels = 9;

  // The compute capacity this worker can give an actor sandbox. Immutable, set
  // at creation: a worker pod's limits are fixed for its lifetime.
  WorkerCapacity capacity = 10;

  // Output-only server-managed state. Absent from Create/Update request
  // payloads; whatever a request carries here is ignored. DrainWorker is the
  // only way a client moves state, and assignment is the scheduler's.
  WorkerStatus status = 11;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  // Ready; schedulable.
  WORKER_STATE_ACTIVE = 1;
  // Pod terminating. Not schedulable.
  WORKER_STATE_DRAINING = 2;
}

message WorkerStatus {
  WorkerState state = 1;

  // The Actor currently bound to this Worker, if any.
  ActorAssignment assignment = 2;
}

// WorkerCapacity is the worker pod's compute capacity available to host an
// actor sandbox, taken from the ateom container's resource limits. The
// scheduler only places an actor on a worker whose capacity is >= the actor's
// declared resource limits. An unset message, or a zero field within it, means
// "unknown/unset" for that dimension: treated as unconstrained so placement is
// not blocked (matching the pre-capacity behavior).
message WorkerCapacity {
  int64 cpu_milli = 1;    // CPU capacity in millicores (1000 = one core).
  int64 memory_bytes = 2; // Memory capacity in bytes.
}

// ActorAssignment names the Actor currently bound to a Worker — the inverse of
// WorkerAssignment.
message ActorAssignment {
  // ActorTemplates are Kubernetes CRDs rather than Substrate API resources, so
  // this stays a kube reference.
  KubeNamespacedObjectRef actor_template = 1;
  // +k8s:opaqueType
  ObjectRef actor = 2;
  string actor_uid = 3;
}

message KubeNamespacedObjectRef {
  string namespace = 1;
  string name = 2;
}

// Debug is the RPC interface for administrative and debugging operations
// (such as wiping state during development).
service Debug {
  // Debugging: drop all data from the ate database.
  rpc DebugClear(DebugClearRequest) returns (DebugClearResponse) {}
}

message DebugClearRequest {}

message DebugClearResponse {}

// ActorIdentity allows substrate workloads to exchange their
// infrastructure-level credentials (k8s service account token, etc.) for a
// substrate actor-level credential. A given substrate actor might migrate
// between many different physical workers over the course of its lifecycle,
// whereas the actor credential's identity will be stable for the life of the
// actor.
service ActorIdentity {
  // Request an Actor Identity JWT.
  //
  // To call this RPC, you must be authenticated as the Kubernetes Pod that is
  // currently running the requested actor.
  rpc MintJWT(MintJWTRequest) returns (MintJWTResponse);

  // Request an Actor Identity Certificate for an actor.
  //
  // Actors do not call this RPC themselves. The atelet hosting the actor calls
  // it on the actor's behalf, authenticating with its own client certificate
  // rather than a bearer token.
  //
  // Authorization is decided on that client certificate and the worker
  // identity attested by atelet. Ateapi verifies that the worker is assigned to
  // the actor and that the actor points back to that exact worker before signing.
  //
  // The certificate in the response is the actor's identity, not the atelet's.
  rpc MintCert(MintCertRequest) returns (MintCertResponse);
}

message MintJWTRequest {
  repeated string audience = 1;

  string atespace = 2;
  string actor_name = 3;
  string actor_uid = 4;
}

// TODO: check why k8s do ":" and not "/" as a seprator for the Subject format
// TODO: whats the right format for the subject? kubernetes follow "system:serviceaccount:<namespace>:<name>".
message MintJWTResponse {
  // Actor JWT.  An OIDC Discovery-compatible JWT
  //
  // Claims:
  //
  // * iss: Issuer - a valid URL where a relying party can fetch the OIDC
  //   discovery documents.
  // * sub: Subject - a string expressing the identity carried in the
  // credential. Format
  //   `atespaces:${atespace}:actors:${actorname}`.
  // * aud: Audience - a string identifying the service this token will be used
  //   to authenticate to.
  // * nbf: Not Before - a numeric unix timestamp
  // * exp: Expiration - a numeric unix timestamp
  // * iat: Issued At - a numeric unix timestamp
  // * `ate.dev`: Ate/Substrate Extension - JSON object
  //   * atespace: (string) The atespace the actor belongs to
  //   * actorName: (string) The actor's name, unique within its atespace
  string actor_jwt = 1;
}

message MintCertRequest {
  // The Worker the certificate is minted for, as authenticated by the
  // node-local atelet. Workers are global-scoped, so this carries no atespace.
  // Ateapi resolves the worker's current actor assignment rather than trusting
  // actor metadata from the caller.
  //
  // This is the one caller that recovers a Worker name from a pod certificate:
  // the atelet has only the worker Pod's identity to go on. Everywhere else the
  // name is opaque and must be carried, not reconstructed.
  // +k8s:opaqueType
  ObjectRef worker = 1;

  // Request contains DER encoded bytes of a x509 certificate signing request.
  // The signer will ignore the contents of the CSR except to extract the
  // subject public key.
  bytes certificate_signing_request = 2;

  // Actor incarnation expected by the activation. This is only a stale-request
  // guard: ateapi derives the actor and its identity from the worker assignment.
  string expected_actor_uid = 3;

  ActorCertificatePurpose purpose = 4;
}

enum ActorCertificatePurpose {
  ACTOR_CERTIFICATE_PURPOSE_UNSPECIFIED = 0;
  ACTOR_CERTIFICATE_PURPOSE_ATUNNEL = 1;
}

message MintCertResponse {
  // Response contains a list of DER encoded certificates. The first entry is the
  // leaf certificate, and any remaining entries are intermediates in
  // leaf-to-root order.
  repeated bytes actor_certificates = 1;
}
