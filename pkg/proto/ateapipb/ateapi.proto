// DESIGN DRAFT (issue #368) — expected final shape of the ateapi surface
// after decoupling substrate-plane resources from Kubernetes CRDs.
// For review only: generated code and server implementation intentionally
// lag this file until the shape is agreed.
//
// The API follows docs/api-style-guide.md (PR #351); deliberate
// divergences are listed in docs/design/ateapi-resource-api.md
// ("Style-guide conformance").
//
// Because the package renames from `ateapi` to `ateapi.v1alpha1`, every
// message here is a new proto type: field numbers are assigned fresh and
// carry no wire-compatibility obligation to the previous proto. Migration
// is a coordinated client cutover, not in-place field evolution.
//
// Error model (canonical gRPC codes):
//   - INVALID_ARGUMENT:    malformed names, missing required fields,
//                          empty/absent update_mask, unknown mask paths,
//                          negative page_size, scope violations
//                          (e.g. atespace set on a global resource).
//   - NOT_FOUND:           resource does not exist.
//   - ALREADY_EXISTS:      Create with an existing (atespace, name).
//   - ABORTED:             version guard mismatch (client echoed a non-zero
//                          meta.version / request version that is stale).
//   - FAILED_PRECONDITION: referential-integrity or state-machine
//                          violations (delete a referenced template/worker,
//                          delete a non-empty atespace, resume a
//                          non-suspended actor, ...).

syntax = "proto3";

package ateapi.v1alpha1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Go package layout (ateapipb vs ateapipb/v1alpha1) is decided at
// implementation time; out of scope for this design.
option go_package = "github.com/agent-substrate/substrate/pkg/proto/ateapipb";

// ---------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------

// Control is the user-plane API: everything a tenant needs to define
// templates and run actors inside an atespace.
service Control {
  // --- Atespace (global-scoped, immutable: no Update) ---

  // Create an Atespace.
  rpc CreateAtespace(CreateAtespaceRequest) returns (Atespace) {}

  // Get an Atespace.
  rpc GetAtespace(GetAtespaceRequest) returns (Atespace) {}

  // List Atespaces.
  rpc ListAtespaces(ListAtespacesRequest) returns (ListAtespacesResponse) {}

  // Delete an empty Atespace.
  // Returns FAILED_PRECONDITION if any actors remain.
  rpc DeleteAtespace(DeleteAtespaceRequest) returns (Atespace) {}

  // --- ActorTemplate (global-scoped, immutable spec: no Update) ---

  // Create an ActorTemplate. The spec is immutable after creation: to change
  // a template, create a new one and migrate actors.
  rpc CreateActorTemplate(CreateActorTemplateRequest) returns (ActorTemplate) {}

  // Get an ActorTemplate.
  rpc GetActorTemplate(GetActorTemplateRequest) returns (ActorTemplate) {}

  // List ActorTemplates.
  rpc ListActorTemplates(ListActorTemplatesRequest) returns (ListActorTemplatesResponse) {}

  // Delete an ActorTemplate.
  // Returns FAILED_PRECONDITION while any actor references it.
  rpc DeleteActorTemplate(DeleteActorTemplateRequest) returns (ActorTemplate) {}

  // Watch ActorTemplate changes after an initial snapshot of current state.
  // Delivery is at-least-once; events carry full resource state. A SYNCED
  // event marks the end of the initial snapshot.
  rpc WatchActorTemplates(WatchActorTemplatesRequest) returns (stream WatchActorTemplatesResponse) {}

  // --- Actor (atespace-scoped) ---

  // Create a new Actor deriving from an ActorTemplate.
  rpc CreateActor(CreateActorRequest) returns (Actor) {}

  // Get an Actor.
  rpc GetActor(GetActorRequest) returns (Actor) {}

  // List Actors.
  rpc ListActors(ListActorsRequest) returns (ListActorsResponse) {}

  // Update mutable Actor fields (currently only worker_selector).
  // Changes take effect on the next ResumeActor call.
  rpc UpdateActor(UpdateActorRequest) returns (Actor) {}

  // Delete an Actor. Returns FAILED_PRECONDITION unless the actor is
  // suspended.
  rpc DeleteActor(DeleteActorRequest) returns (Actor) {}

  // Suspend an actor to a new snapshot.
  rpc SuspendActor(SuspendActorRequest) returns (Actor) {}

  // Pause an actor, keeping its snapshots on the node VM.
  rpc PauseActor(PauseActorRequest) returns (Actor) {}

  // Resume an actor from its latest snapshot.
  rpc ResumeActor(ResumeActorRequest) returns (Actor) {}
}

// Admin is the platform-plane API: worker capacity and debug surfaces.
// Intended for platform operators and worker providers, not tenants.
service Admin {
  // --- Worker (global-scoped) ---

  // Create a Worker. Worker providers call this when capacity becomes
  // available to substrate.
  rpc CreateWorker(CreateWorkerRequest) returns (Worker) {}

  // Get a Worker.
  rpc GetWorker(GetWorkerRequest) returns (Worker) {}

  // List Workers.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {}

  // Update mutable Worker fields. Worker providers may use this for
  // heartbeat-style status updates.
  rpc UpdateWorker(UpdateWorkerRequest) returns (Worker) {}

  // Delete a Worker. Returns FAILED_PRECONDITION while any actor is assigned
  // to it.
  rpc DeleteWorker(DeleteWorkerRequest) returns (Worker) {}

  // Watch Worker changes after an initial snapshot of current state.
  // Same delivery semantics as WatchActorTemplates.
  rpc WatchWorkers(WatchWorkersRequest) returns (stream WatchWorkersResponse) {}

  // Debugging: drop all data from the ate database.
  rpc DebugClear(DebugClearRequest) returns (DebugClearResponse) {}
}

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// ResourceMetadata holds the standard fields common to all managed
// resources. Always field 1 of the resource message, named `meta`.
// See docs/api-style-guide.md section 6.
message ResourceMetadata {
  // The atespace this resource belongs to. Must be empty for global-scoped
  // resource types (Atespace, ActorTemplate, Worker) and set for
  // atespace-scoped types (Actor).
  string atespace = 1;

  // The name of this resource, unique within its scope. Must be a valid
  // RFC-1123 DNS label. Caller-specified on Create.
  string name = 2;

  // Server-assigned UUID4, immutable for the life of the resource.
  string uid = 3;

  // Monotonically increasing version: starts at 1 on creation and
  // increments by 1 on every mutation, including system-internal ones.
  // Output-only; echo a non-zero value back on Update/Delete to guard
  // against concurrent modification (mismatch returns ABORTED).
  int64 version = 4;

  // When the resource was created. Output-only.
  google.protobuf.Timestamp create_time = 5;

  // When the resource was last updated. Output-only.
  google.protobuf.Timestamp update_time = 6;

  // labels are user-defined key/value pairs used for organization and
  // selection. Worker labels are matched by template and actor
  // worker_selectors at scheduling time. Mutable on resources that support
  // Update. (Not yet in the draft style guide's ResourceMetadata.)
  map<string, string> labels = 7;
}

// ObjectRef is a pointer to a resource: request identity and
// cross-resource references. For references to global-scoped resources,
// atespace must be empty.
message ObjectRef {
  string atespace = 1;
  string name     = 2;
}

// Selector matches workers by their meta.labels.
// Only equality-based matching is supported (all pairs must match).
// An empty selector matches every worker.
message Selector {
  map<string, string> match_labels = 1;
}

// ResourceEventType classifies watch stream events.
enum ResourceEventType {
  RESOURCE_EVENT_TYPE_UNSPECIFIED = 0;
  RESOURCE_EVENT_TYPE_CREATED     = 1;
  RESOURCE_EVENT_TYPE_UPDATED     = 2;
  RESOURCE_EVENT_TYPE_DELETED     = 3;
  // SYNCED is sent exactly once, after the initial snapshot has been fully
  // delivered. It carries no resource. Consumers can use it to know their
  // local cache is complete before acting.
  RESOURCE_EVENT_TYPE_SYNCED      = 4;
}

// ---------------------------------------------------------------------------
// Atespace
// ---------------------------------------------------------------------------

// Atespace is the isolation boundary actors are created into.
// Global-scoped; immutable (no Update method).
message Atespace {
  ResourceMetadata meta = 1;
}

message CreateAtespaceRequest {
  // atespace.meta.name is required; atespace.meta.atespace must be empty.
  Atespace atespace = 1;
}

message GetAtespaceRequest {
  ObjectRef atespace = 1;
}

message ListAtespacesRequest {
  // Maximum number of results to return; see style guide 3.2 for paging
  // semantics (applies to all List methods in this file).
  int32 page_size = 1;
  string page_token = 2;
}
message ListAtespacesResponse {
  repeated Atespace atespaces = 1;
  string next_page_token = 2;
}

message DeleteAtespaceRequest {
  ObjectRef atespace = 1;
  // Optional freshness guard; 0 = skip check.
  int64 version = 2;
}

// ---------------------------------------------------------------------------
// Actor
// ---------------------------------------------------------------------------

enum SnapshotType {
  SNAPSHOT_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_TYPE_LOCAL       = 1;
  SNAPSHOT_TYPE_EXTERNAL    = 2;
}

message ExternalSnapshotInfo {
  string snapshot_uri_prefix = 1;
}

message LocalSnapshotInfo {
  string snapshot_prefix = 1;
  // Node VMs that have local snapshots for this actor while it is PAUSED.
  repeated string node_vms_with_local_snapshots = 2;
}

message SnapshotInfo {
  SnapshotType type = 1;
  oneof data {
    ExternalSnapshotInfo external = 2;
    LocalSnapshotInfo    local    = 3;
  }
}

// Actor is a running (or suspended) instance of an ActorTemplate.
// Atespace-scoped.
message Actor {
  ResourceMetadata meta = 1;

  // The ActorTemplate this actor derives from. Set at creation; immutable.
  // ActorTemplates are global resources, so actor_template.atespace must be
  // empty.
  ObjectRef actor_template = 2;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RESUMING    = 1;
    STATUS_RUNNING     = 2;
    STATUS_SUSPENDING  = 3;
    STATUS_SUSPENDED   = 4;
    STATUS_PAUSING     = 5;
    STATUS_PAUSED      = 6;
  }
  // Output-only lifecycle state.
  Status status = 3;

  // worker_selector is the per-actor placement constraint. The scheduler
  // evaluates the AND of this selector and the template's worker_selector
  // to find eligible workers. Set at CreateActor; mutable via UpdateActor.
  // Changes take effect on the next ResumeActor call.
  Selector worker_selector = 4;

  // The currently assigned Worker. Output-only: set by the scheduler at
  // assignment time, cleared when the worker is freed on suspend/pause.
  ObjectRef worker = 5;

  // Output-only snapshot bookkeeping.
  string in_progress_snapshot = 6;
  SnapshotInfo latest_snapshot_info = 7;
}

message CreateActorRequest {
  // The actor to create. Caller sets meta.atespace, meta.name (a valid
  // DNS-1123 label), actor_template, and optionally worker_selector.
  // All other fields are output-only and must be unset.
  Actor actor = 1;
}

message GetActorRequest {
  ObjectRef actor = 1;
}

// List actors with pagination. This operation provides "soft" guarantees:
// actors may be missed or duplicated if the system state changes during
// pagination.
message ListActorsRequest {
  // The atespace to list actors from. Empty lists across all atespaces.
  string atespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListActorsResponse {
  repeated Actor actors = 1;
  string next_page_token = 2;
}

message UpdateActorRequest {
  // actor.meta.atespace and actor.meta.name identify the resource.
  // A non-zero actor.meta.version acts as a freshness guard.
  Actor actor = 1;

  // Required. The only updatable path today is "worker_selector"; any
  // other path returns INVALID_ARGUMENT.
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteActorRequest {
  ObjectRef actor = 1;
  // Optional freshness guard; 0 = skip check.
  int64 version = 2;
}

message SuspendActorRequest {
  ObjectRef actor = 1;
}

message PauseActorRequest {
  ObjectRef actor = 1;
}

message ResumeActorRequest {
  ObjectRef actor = 1;

  // If true, boot the workload from scratch. Process snapshots, including
  // golden snapshots, are deferred from the P0 API.
  bool boot = 2;
}

// ---------------------------------------------------------------------------
// ActorTemplate
// ---------------------------------------------------------------------------

// ActorTemplate defines the workload actors are stamped from.
// Atespace-scoped. The spec is immutable after creation, so there is no
// UpdateActorTemplate method: create a new template instead.
message ActorTemplate {
  ResourceMetadata meta = 1;
  ActorTemplateSpec spec = 2;
  // Output-only.
  ActorTemplateStatus status = 3;
}

message ActorTemplateSpec {
  // Image used to hold the sandbox while no actor is resumed into it.
  string pause_image = 1;

  // The workload containers. Images must be pinned by digest.
  repeated Container containers = 2;

  SnapshotsConfig snapshots_config = 3;

  // The sandbox class this workload requires. Matched against
  // WorkerSpec.sandbox_class at scheduling time. Open string: providers are
  // responsible for creating workers that advertise accurate classes.
  string sandbox_class = 4;

  // Restricts which workers actors from this template may be placed on. ANDed
  // with the per-actor worker_selector.
  Selector worker_selector = 5;

  repeated Volume volumes = 6;
}

message ActorTemplateStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Waiting for validation or required provider state.
    STATE_PENDING     = 1;
    // Actors can be created from this template.
    STATE_READY       = 2;
    // Template validation failed; see error_message.
    STATE_FAILED      = 3;
  }
  State state = 1;

  // Human-readable failure detail when state is FAILED.
  string error_message = 2;
}

message Container {
  string name = 1;
  // Must be pinned by digest (image@sha256:...) so actor starts are
  // reproducible.
  string image = 2;
  repeated string command = 3;
  repeated EnvVar env = 4;
  ContainerReadyz readyz = 5;
  repeated VolumeMount volume_mounts = 6;
}

message ContainerReadyz {
  HTTPGetAction http_get = 1;
}

message HTTPGetAction {
  string path = 1;
  int32 port = 2;
}

message EnvVar {
  string name = 1;
  oneof source {
    // Literal value.
    string value = 2;
    // Value read from a named secret at actor start.
    SecretRef secret = 3;
  }
}

// SecretRef names a secret managed by the platform the workers run on
// (a Kubernetes Secret today). Deliberately plane-neutral: no k8s types.
message SecretRef {
  // Name of the secret, resolved in the worker's environment.
  string name = 1;
  // Key within the secret.
  string key = 2;
  // If true, a missing secret or key is skipped instead of failing the
  // actor start.
  bool optional = 3;
}

message Volume {
  string name = 1;
  VolumeSource volume_source = 2;
}

// VolumeSource is an extension point; DurableDir is the only source today.
message VolumeSource {
  DurableDirVolumeSource durable_dir = 1;
}

message DurableDirVolumeSource {}

message VolumeMount {
  string name = 1;
  string mount_path = 2;
}

message SnapshotsConfig {
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // Deprecated for P0: process snapshots imply runtime/version/hardware
    // compatibility constraints that are intentionally deferred.
    SCOPE_FULL        = 1 [deprecated = true];
    // Snapshot durable data only.
    SCOPE_DATA        = 2;
  }

  // URI prefix under which snapshots are stored.
  string location = 1;

  // Scope taken on PauseActor / SuspendActor.
  Scope on_pause = 2;

  // Scope taken on commit. Must be a subset of on_pause
  // (INVALID_ARGUMENT otherwise).
  Scope on_commit = 3;
}

message CreateActorTemplateRequest {
  ActorTemplate actor_template = 1;
}

message GetActorTemplateRequest {
  ObjectRef actor_template = 1;
}

message ListActorTemplatesRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListActorTemplatesResponse {
  repeated ActorTemplate actor_templates = 1;
  string next_page_token = 2;
}

message DeleteActorTemplateRequest {
  ObjectRef actor_template = 1;
  // Optional freshness guard; 0 = skip check.
  int64 version = 2;
}

message WatchActorTemplatesRequest {}
message WatchActorTemplatesResponse {
  ResourceEventType type = 1;
  // Unset when type is SYNCED.
  ActorTemplate actor_template = 2;
}

// ---------------------------------------------------------------------------
// Worker
// ---------------------------------------------------------------------------

// Worker is the substrate scheduling primitive. Worker providers create and
// maintain Workers; substrate schedules Actors onto Workers by matching
// Actor/ActorTemplate requirements against Worker labels, sandbox_class, and
// readiness/capacity.
message Worker {
  ResourceMetadata meta = 1;
  WorkerSpec spec = 2;
  // Output/status from the worker provider.
  WorkerStatus status = 3;
}

message WorkerSpec {
  // Provider that owns this Worker, e.g. "kubernetes", "vm", or "local".
  string provider = 1;

  // Provider-local identity for debug/correlation. For Kubernetes this may be
  // a Pod UID or namespace/name. Not part of the substrate resource key.
  string provider_id = 2;

  // Routable ateom endpoint for this Worker.
  string address = 3;

  // Runtime compatibility class this Worker provides. Matched against
  // ActorTemplateSpec.sandbox_class at scheduling time. This is scalar for P0;
  // it can be extended to repeated sandbox classes if workers need to
  // advertise multiple compatible runtimes.
  string sandbox_class = 4;
}

message WorkerStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Worker can accept actor assignments.
    STATE_READY       = 1;
    // Worker exists but should not receive new assignments.
    STATE_NOT_READY   = 2;
    // Worker is intentionally draining and should not receive new assignments.
    STATE_DRAINING    = 3;
  }

  State state = 1;

  // Capacity reported by the worker provider.
  int32 slots_total = 2;
  int32 slots_available = 3;

  // Human-readable status detail.
  string message = 4;

  // Last successful provider heartbeat/update time. Output-only.
  google.protobuf.Timestamp last_heartbeat_time = 5;
}

message CreateWorkerRequest {
  // worker.meta.name is required; worker.meta.atespace must be empty.
  Worker worker = 1;
}

message GetWorkerRequest {
  ObjectRef worker = 1;
}

message ListWorkersRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListWorkersResponse {
  repeated Worker workers = 1;
  string next_page_token = 2;
}

message UpdateWorkerRequest {
  // worker.meta.name identifies the resource; a non-zero
  // worker.meta.version acts as a freshness guard.
  Worker worker = 1;

  // Required. Top-level field paths only (e.g. "spec.address",
  // "status", "meta.labels"); naming a message or map field replaces it
  // wholesale. Unknown or immutable paths return INVALID_ARGUMENT.
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteWorkerRequest {
  ObjectRef worker = 1;
  // Optional freshness guard; 0 = skip check.
  int64 version = 2;
}

message WatchWorkersRequest {}
message WatchWorkersResponse {
  ResourceEventType type = 1;
  // Unset when type is SYNCED.
  Worker worker = 2;
}

message DebugClearRequest {}
message DebugClearResponse {}

// ---------------------------------------------------------------------------
// SessionIdentity
// ---------------------------------------------------------------------------

// SessionIdentity allows substrate workloads to exchange their
// infrastructure-level credentials (k8s service account token, etc.) for a
// substrate session-level credential.  A given substrate session might migrate
// between many different physical workers over the course of its lifecycle,
// whereas the session credential's identity will be stable for the life of the
// session.
//
// This service requires authentication. You can authenticate with a Kubernetes
// service account token in an `Authorization: Bearer` header, or you can
// authenticate with a Kubernetes service account certificate as an mTLS
// certificate. (Kubernetes service account certificates do not currently exist
// upstream, but we will provide a polyfill based on Pod Certificates).
//
// The broker will check that the service credentials you authenticated with
// belong to a Pod that is currently mapped to the requested session in the
// session database.
service SessionIdentity {
  // Request a Session Identity JWT.
  //
  // To call this RPC, you must be authenticated as the Kubernetes Pod that is
  // currently running the requested session.
  rpc MintJWT(MintJWTRequest) returns (MintJWTResponse);

  // Request a Session Identity Certificate. To call this RPC, you must have
  // authenticated with a client certificate, not a bearer token.
  rpc MintCert(MintCertRequest) returns (MintCertResponse);
}

message MintJWTRequest {
  repeated string audience = 1;

  string app_id     = 2;
  string user_id    = 3;
  string session_id = 4;
}

message MintJWTResponse {
  // Session JWT.  An OIDC Discovery-compatible JWT
  //
  // Claims:
  //
  // * iss: Issuer - a valid URL where a relying party can fetch the OIDC
  //   discovery documents.
  // * sub: Subject - a string expressing the identity carried in the
  // credential. Format
  //   `app/${appid}/user/${userid}/session/${sessionid}`.
  // * aud: Audience - a string identifying the service this token will be used
  //   to authenticate to.
  // * nbf: Not Before - a numeric unix timestamp
  // * exp: Expiration - a numeric unix timestamp
  // * iat: Issued At - a numeric unix timestamp
  // * `ate.dev`: Ate/Substrate Extension - JSON object
  //   * appID: (string) The Substrate App ID
  //   * userID: (string) The Substrate User ID
  //   * sessionID: (string) The Substrate Session ID
  string session_jwt = 1;
}

message MintCertRequest {
  string app_id     = 1;
  string user_id    = 2;
  string session_id = 3;

  // Request contains DER encoded bytes of a x509 certificate signing request.
  // The signer will ignore the contents of the CSR except to extract the
  // subject public key.
  bytes certificate_signing_request = 4;
}

message MintCertResponse {
  // Response contains a list of DER encoded certificates. The first entry is the
  // leaf certificate, and any remaining entries are intermediates in
  // leaf-to-root order.
  repeated bytes session_certificates = 1;
}
