# Local Envoy proxy configuration that listens for plaintext HTTP/1.1 and
# HTTP/2 (h2c/gRPC) on port 19980, injects `ate-target-actor: nighthawk/tester`
# on every request, and forwards upstream to 127.0.0.1:9901.
static_resources:
  listeners:
  - name: listener_http_19980
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 19980
    listener_filters:
    - name: envoy.filters.listener.http_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http_19980
          codec_type: AUTO
          route_config:
            name: local_route
            request_headers_to_add:
            - header:
                key: ate-target-actor
                value: nighthawk/tester
              append_action: OVERWRITE_IF_EXISTS_OR_ADD
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: localhost_9901
                  timeout: 0s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: localhost_9901
    type: STATIC
    connect_timeout: 5s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        use_downstream_protocol_config:
          http_protocol_options: {}
          http2_protocol_options: {}
    load_assignment:
      cluster_name: localhost_9901
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901
