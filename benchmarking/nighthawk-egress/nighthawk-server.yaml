# In-cluster Envoy Nighthawk test server used as the origin target for egress
# benchmarks. Exposes plaintext HTTP on :80 and :8080 and TLS-terminated HTTPS
# on :443 and :8443 using a serving certificate issued by the cluster's
# servicedns pod-certificate signer (SAN: nighthawk-server.ate-system.svc).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nighthawk-server
  namespace: ate-system
data:
  nighthawk.yaml: |
    # SDS requires a node id and cluster.
    node:
      id: nighthawk-server
      cluster: nighthawk-server

    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 10001 }

    static_resources:
      listeners:
      - name: http_80
        address:
          socket_address: { address: "::", ipv4_compat: true, port_value: 80 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              generate_request_id: false
              codec_type: AUTO
              stat_prefix: ingress_http_80
              route_config:
                name: local_route
                virtual_hosts:
                - name: service
                  domains: ["*"]
              http_filters:
              - name: time-tracking
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.TimeTrackingConfiguration
                  emit_previous_request_delta_in_response_header: x-origin-request-receipt-delta
              - name: dynamic-delay
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.DynamicDelayConfiguration
                  static_delay: 0s
              - name: test-server
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.ResponseOptions
                  response_body_size: 10
                  v3_response_headers:
                  - { header: { key: "x-nh", value: "1" } }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                  dynamic_stats: false

      - name: http_8080
        address:
          socket_address: { address: "::", ipv4_compat: true, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              generate_request_id: false
              codec_type: AUTO
              stat_prefix: ingress_http_8080
              route_config:
                name: local_route
                virtual_hosts:
                - name: service
                  domains: ["*"]
              http_filters:
              - name: time-tracking
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.TimeTrackingConfiguration
                  emit_previous_request_delta_in_response_header: x-origin-request-receipt-delta
              - name: dynamic-delay
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.DynamicDelayConfiguration
                  static_delay: 0s
              - name: test-server
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.ResponseOptions
                  response_body_size: 10
                  v3_response_headers:
                  - { header: { key: "x-nh", value: "1" } }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                  dynamic_stats: false

      - name: https_443
        address:
          socket_address: { address: "::", ipv4_compat: true, port_value: 443 }
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificate_sds_secret_configs:
                - name: servicedns_serving_cert
                  sds_config:
                    resource_api_version: V3
                    path_config_source:
                      path: /etc/nighthawk/sds-servicedns-cert.yaml
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              generate_request_id: false
              codec_type: AUTO
              stat_prefix: ingress_https_443
              route_config:
                name: local_route
                virtual_hosts:
                - name: service
                  domains: ["*"]
              http_filters:
              - name: time-tracking
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.TimeTrackingConfiguration
                  emit_previous_request_delta_in_response_header: x-origin-request-receipt-delta
              - name: dynamic-delay
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.DynamicDelayConfiguration
                  static_delay: 0s
              - name: test-server
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.ResponseOptions
                  response_body_size: 10
                  v3_response_headers:
                  - { header: { key: "x-nh", value: "1" } }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                  dynamic_stats: false

      - name: https_8443
        address:
          socket_address: { address: "::", ipv4_compat: true, port_value: 8443 }
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificate_sds_secret_configs:
                - name: servicedns_serving_cert
                  sds_config:
                    resource_api_version: V3
                    path_config_source:
                      path: /etc/nighthawk/sds-servicedns-cert.yaml
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              generate_request_id: false
              codec_type: AUTO
              stat_prefix: ingress_https_8443
              route_config:
                name: local_route
                virtual_hosts:
                - name: service
                  domains: ["*"]
              http_filters:
              - name: time-tracking
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.TimeTrackingConfiguration
                  emit_previous_request_delta_in_response_header: x-origin-request-receipt-delta
              - name: dynamic-delay
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.DynamicDelayConfiguration
                  static_delay: 0s
              - name: test-server
                typed_config:
                  "@type": type.googleapis.com/nighthawk.server.ResponseOptions
                  response_body_size: 10
                  v3_response_headers:
                  - { header: { key: "x-nh", value: "1" } }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                  dynamic_stats: false

  # SDS resource for the Nighthawk server's TLS serving cert. Kubelet rotates
  # the projected volume by swapping its ..data symlink, triggering the
  # watched_directory reload on the combined leaf-cert + private-key bundle.
  sds-servicedns-cert.yaml: |
    resources:
    - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: servicedns_serving_cert
      tls_certificate:
        certificate_chain: { filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem }
        private_key: { filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem }
        watched_directory: { path: /run/servicedns.podcert.ate.dev }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nighthawk-server
  namespace: ate-system
  labels:
    app: nighthawk-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nighthawk-server
  template:
    metadata:
      labels:
        app: nighthawk-server
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: nighthawk-server
        # Same envoyproxy/nighthawk-dev digest as benchmarking/nighthawk-ingress/Dockerfile.
        image: envoyproxy/nighthawk-dev@sha256:7729902afea9d83f593b240690ba7d6e8fff04f6215ada538cfb4c1452b2553e
        command:
        - /usr/local/bin/nighthawk_test_server
        args:
        - -c
        - /etc/nighthawk/nighthawk.yaml
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: http-alt
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: https-alt
          containerPort: 8443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http-alt
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/nighthawk
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: nighthawk-server
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
# Selecting Service in ate-system required by servicedns.podcert.ate.dev/identity
# to mint a serving certificate with SAN nighthawk-server.ate-system.svc.
apiVersion: v1
kind: Service
metadata:
  name: nighthawk-server
  namespace: ate-system
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: nighthawk-server
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: http-alt
    port: 8080
    targetPort: http-alt
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
  - name: https-alt
    port: 8443
    targetPort: https-alt
    protocol: TCP
