# In-cluster Envoy proxy that listens for plaintext HTTP/1.1 and HTTP/2
# (h2c/gRPC) on :19980, injects `ate-target-actor: nighthawk/tester` on every
# request, and forwards upstream to atenet-router.ate-system.svc.cluster.local:80.
#
# TODO(yanavlasov): this is a temporary workaround for nighthawk's cli's inability
# to add headers when invoking traffic driver gRPC service. So this Envoy adds the
# `ate-target-actor: nighthawk/tester` header so that cli can reach the traffic driver.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-driver-invoker
  namespace: nighthawk
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_http_19980
        address:
          socket_address:
            address: "::"
            ipv4_compat: true
            port_value: 19980
        listener_filters:
        - name: envoy.filters.listener.http_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http_19980
              codec_type: AUTO
              route_config:
                name: local_route
                request_headers_to_add:
                - header:
                    key: ate-target-actor
                    value: nighthawk/tester
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: atenet_router
                      timeout: 0s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: atenet_router
        type: STRICT_DNS
        connect_timeout: 5s
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            use_downstream_protocol_config:
              http_protocol_options: {}
              http2_protocol_options: {}
        load_assignment:
          cluster_name: atenet_router
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: atenet-router.ate-system.svc.cluster.local
                    port_value: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-driver-invoker
  namespace: nighthawk
  labels:
    app: traffic-driver-invoker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-driver-invoker
  template:
    metadata:
      labels:
        app: traffic-driver-invoker
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: envoy
        # Same envoyproxy/envoy digest as cmd/dataplane/envoy/Dockerfile.
        image: envoyproxy/envoy:v1.39.4@sha256:74bd4eb5629708d3fadca1a5e6b85d208f338d7bb54e06b69565905c5294cc01
        command:
        - /usr/local/bin/envoy
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --concurrency
        - "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 19980
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: traffic-driver-invoker
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-driver-invoker
  namespace: nighthawk
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: traffic-driver-invoker
  ports:
  - name: http
    port: 19980
    targetPort: http
    protocol: TCP
