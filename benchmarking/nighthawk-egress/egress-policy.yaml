# Substrate EgressPolicy resource (protojson-shaped ateapi.EgressPolicy,
# NOT a Kubernetes CRD) for Nighthawk traffic-driver actors in the `nighthawk`
# atespace. Applied to an actor with:
#   kubectl-ate create egress-policy <actor-name> -a nighthawk -f egress-policy.yaml
metadata:
  atespace: nighthawk
  name: default
rules:
- http:
    hostnames:
    - "*"
    ports:
      numbers:
      - 80
- https:
    hostnames:
    - "*"
    ports:
      numbers:
      - 443
- tlsPassthrough:
    hostnames:
    - "*"
    ports:
      numbers:
      - 8443
