apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ${STORAGE_CLASS}
provisioner: filestore.csi.storage.gke.io
parameters:
  volume-pool: projects/${PROJECT_ID}/locations/${REGION}/volumePools/${POOL}
  # Substrate passes only parameters to the driver and ignores mountOptions,
  # so mount options go here. Pinning NFSv3 over TCP skips version negotiation.
  mount-options: "vers=3,proto=tcp,mountproto=tcp,nolock"
reclaimPolicy: Delete
volumeBindingMode: Immediate
