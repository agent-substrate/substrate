apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nfs-readahead-tuner
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: nfs-readahead-tuner
  template:
    metadata:
      labels:
        app: nfs-readahead-tuner
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: bench-role
                operator: NotIn
                values: ["infra"]
      tolerations:
      - operator: Exists
      containers:
      - name: tuner
        image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command: ["/bin/sh", "/scripts/tune_readahead.sh"]
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: sys
          mountPath: /sys
      volumes:
      - name: scripts
        configMap:
          name: nfs-readahead-tuner
          defaultMode: 0555
      - name: sys
        hostPath:
          path: /sys
