# ActorTemplate for the coding scenarios. Fill it in with envsubst:
#   TEMPLATE_NAME, CODING_IMAGE, CODING_STORAGE_CLASS,
#   ACTOR_CPU_MILLICORES, ACTOR_MEMORY_BYTES.
# A Filestore volume pool gives every volume the pool's size, whatever
# capacityBytes says.
metadata:
  atespace: benchmark-workloads
  name: ${TEMPLATE_NAME}
workerSelector:
  matchLabels:
    workload: benchmark-worker
volumes:
- name: data
  external:
    template:
      capacityBytes: 10737418240 # 10Gi
      storageClassName: ${CODING_STORAGE_CLASS}
containers:
- name: coding
  image: ${CODING_IMAGE}
  volumeMounts:
  - name: data
    mountPath: /data
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
resources:
  limits:
    cpuMillicores: "${ACTOR_CPU_MILLICORES}"
    memoryBytes: "${ACTOR_MEMORY_BYTES}"
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
