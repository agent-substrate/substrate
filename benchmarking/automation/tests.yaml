      - "2Gi"
      - "--mem-churn"
      - "64Mi"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_5_users
    type: locust
    description: "Glutton baseline: 5 concurrent users for 1 minute"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 5
    workerCount: 5
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_baseline_10_users
    type: locust
    description: "Glutton baseline: 10 concurrent users for 1 minute (doubles the number of workers/node)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 1m
    users: 10
    workerCount: 10
    flags:
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: glutton_oversubscribe_15_users
    type: locust
    description: "Glutton baseline: 15 concurrent users for 2 minutes (50% oversubscribed)"
    targetCluster: dev
    file: /app/tests/glutton.py
    duration: 2m
    users: 15
    workerCount: 10
    flags:
      - "--min-wait-time"
      - "0.5"
      - "--max-wait-time"
      - "1.0"
  # The observability ladder of benchmarking/observability.md. Each entry
  # runs on glutton, and thus on boomer: Python and gRPC hold each other at
  # a high number of users, which would make the latency of the load
  # generator part of the measurement.
  - name: observability_s0_idle_floor
    type: locust
    description: "Observability S0: the telemetry of an idle control plane, 5 minutes"
    targetCluster: dev
    file: /app/tests/glutton.py,/app/shapes/ladder_shape.py
    duration: 5m
    users: 0
    workerCount: 10
    flags:
      # The floor sends no request, thus locust writes no measurement row and
      # the result of the run is in the telemetry counts only.
      - "--allow-empty-stats"
      - "--ladder"
      - "0:5m"
      - "--trace-probability"
      - "0.1"
  - name: observability_s1_user_sweep
    type: locust
    description: "Observability S1: user sweep 5 -> 10 -> 15, 3 minutes for each step"
    targetCluster: dev
    file: /app/tests/glutton.py,/app/shapes/ladder_shape.py
    duration: 9m
    users: 5
    workerCount: 10
    flags:
      - "--ladder"
      - "5:3m,10:3m,15:3m"
      - "--trace-probability"
      - "0.1"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: observability_s2_sample_rate_sweep
    type: locust
    description: "Observability S2: sample rate 0 -> 0.1 -> 1.0 at 10 users, 3 minutes for each step"
    targetCluster: dev
    file: /app/tests/glutton.py,/app/shapes/ladder_shape.py
    duration: 9m
    users: 10
    workerCount: 10
    flags:
      - "--ladder"
      - "10:3m:0,10:3m:0.1,10:3m:1.0"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: observability_s3_soak
    type: locust
    description: "Observability S3: 12 users for 10 minutes, 80% of the S1 maximum"
    targetCluster: dev
    file: /app/tests/glutton.py,/app/shapes/ladder_shape.py
    duration: 10m
    users: 12
    workerCount: 10
    flags:
      - "--ladder"
      - "12:10m"
      - "--trace-probability"
      - "0.1"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: durdir_data_baseline
    type: locust
    description: "DurDir data baseline: 1 concurrent user, 8 MiB file, explicit resume"
    targetCluster: dev
    file: /app/tests/durdir.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--durdir-template"
      - "glutton-durdir-data"
      - "--resume-mode"
      - "explicit"
      - "--durdir-file-size-bytes"
      - "8388608"
