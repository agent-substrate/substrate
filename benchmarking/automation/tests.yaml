      - "glutton-durdir-data"
      - "--resume-mode"
      - "explicit"
      - "--durdir-read-mode"
      - "digest"
      - "--durdir-file-size-bytes"
      - "10485760"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: durdir_size_64mb
    description: "DurDir file size sweep (64 MiB): 1 concurrent user, digest read mode"
