      - "glutton-durdir-full"
      - "--resume-mode"
      - "explicit"
      - "--durdir-file-size-bytes"
      - "8388608"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: durdir_implicit_resume
