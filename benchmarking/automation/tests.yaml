    flags:
      - "--durdir-template"
      - "glutton-durdir-data"
      - "--resume-mode"
      - "explicit"
      - "--durdir-read-mode"
      - "digest"
      - "--durdir-file-size-bytes"
      - "5242880"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: durdir_size_10mb
    type: locust
    description: "DurDir file size sweep (10 MiB): 1 concurrent user, digest read mode"
    targetCluster: dev
    file: /app/tests/durdir.py
    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--durdir-template"
      - "glutton-durdir-data"
      - "--resume-mode"
      - "explicit"
      - "--durdir-read-mode"
      - "digest"
      - "--durdir-file-size-bytes"
      - "10485760"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: durdir_size_64mb
    type: locust
    description: "DurDir file size sweep (64 MiB): 1 concurrent user, digest read mode"
    targetCluster: dev
    file: /app/tests/durdir.py
    duration: 1m
    users: 1
