    duration: 1m
    users: 1
    workerCount: 1
    flags:
      - "--durdir-template"
      - "glutton-durdir-data"
      - "--resume-mode"
      - "implicit"
      - "--durdir-file-size-bytes"
      - "8388608"
      - "--min-wait-time"
      - "1.0"
      - "--max-wait-time"
      - "1.0"
  - name: durdir_size_5mb
    type: locust
